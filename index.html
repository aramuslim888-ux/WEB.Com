<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>ARO B Slemany — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090a0f;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:pointer;
  transition:all .25s cubic-bezier(.175,.885,.32,1.275);
}

/* HUD */

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 14px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  z-index:50;
  pointer-events:none;
  animation:fadeInDown .8s ease-out;
}

.pill{
  background:rgba(20,24,36,.75);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  letter-spacing:.5px;
}

#tier{
  font-size:11px;
  opacity:.8;
  margin-left:6px;
  color:#a78bfa;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,rgba(139,92,246,.35) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(236,72,153,.3) 0%,transparent 40%),
    linear-gradient(135deg,#0f172a 0%,#090a0f 100%);
}

.introCard{
  width:min(92vw,460px);
  padding:36px 24px;
  animation:scaleUp .9s cubic-bezier(.175,.885,.32,1.275) forwards;
}

@keyframes scaleUp{
  0%{transform:scale(.85);opacity:0}
  100%{transform:scale(1);opacity:1}
}

@keyframes fadeInDown{
  0%{transform:translateY(-20px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}

.introTitle{
  margin:0;
  font-size:clamp(44px,13vw,76px);
  line-height:.9;
  font-weight:1000;
  background:linear-gradient(135deg,#fff 30%,#a78bfa 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 10px 30px rgba(139,92,246,.4);
}

.introName{
  margin:22px 0 8px;
  font-size:18px;
  font-weight:800;
  color:#cbd5e1;
}

.creator{
  margin:0 0 28px;
  opacity:.7;
  font-size:13px;
  letter-spacing:1px;
}

#start{
  border:0;
  padding:18px 36px;
  border-radius:999px;
  background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 10px 25px rgba(124,58,237,.5);
}

#start:active{
  transform:scale(.95);
  box-shadow:0 5px 15px rgba(124,58,237,.3);
}

/* CONTROLS */

#controls{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

/* JOYSTICK */

#joystick{
  position:absolute;
  left:max(20px,env(safe-area-inset-left) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.1),
    rgba(255,255,255,.02)
  );
  border:2px solid rgba(255,255,255,.25);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.05),
    0 10px 35px rgba(0,0,0,.3);
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(8px);
}

#stick{
  position:absolute;
  width:64px;
  height:64px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:white;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
  transition:transform .04s linear;
}

/* ACTIONS */

#actionArea{
  position:absolute;
  right:max(20px,env(safe-area-inset-right) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  display:grid;
  grid-template-columns:78px 78px;
  gap:12px;
  pointer-events:none;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(20,24,36,.65);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.action:active{
  transform:scale(.92);
  background:rgba(124,58,237,.85);
  border-color:rgba(255,255,255,.6);
}

/* IDEA */

#levelIdea{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 176px);
  transform:translateX(-50%);
  width:min(92vw,580px);
  padding:10px 16px;
  text-align:center;
  border-radius:16px;
  background:rgba(15,23,42,.75);
  color:#e2e8f0;
  font-size:13px;
  font-weight:800;
  z-index:40;
  pointer-events:none;
  opacity:.95;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* WIN */

#win{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,7,12,.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  text-align:center;
}

.winCard{
  width:min(92vw,440px);
  background:rgba(20,24,36,.9);
  color:white;
  border-radius:32px;
  padding:32px 24px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.12);
  animation:scaleUp .5s cubic-bezier(.175,.885,.32,1.275) forwards;
}

.winCard h1{
  margin:0 0 10px;
  font-size:24px;
  font-weight:1000;
  color:#f8fafc;
}

.winCard p{
  line-height:1.6;
  color:#cbd5e1;
  font-size:15px;
}

.winButtons{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:22px;
}

.winButtons button{
  border:0;
  border-radius:16px;
  padding:14px 20px;
  font-size:14px;
  font-weight:900;
}

#nextBtn{
  background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);
  color:#fff;
  box-shadow:0 8px 20px rgba(124,58,237,.4);
}

#retryBtn{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
}

/* FINISH */

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:140;
  color:#fff;
  background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);
  padding:20px 28px;
  border-radius:22px;
  font-size:22px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  box-shadow:0 15px 40px rgba(124,58,237,.5);
}

#finishBanner.show{
  animation:finishPop .8s cubic-bezier(.175,.885,.32,1.275) forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
  }
  40%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* SMALL STATUS */

#danger{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 70px);
  transform:translateX(-50%);
  z-index:60;
  color:white;
  background:rgba(239,68,68,.85);
  padding:8px 16px;
  border-radius:999px;
  font-size:11px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(239,68,68,.3);
}

#danger.show{
  opacity:1;
}

/* AFTER LEVEL 15: NO GUIDE TEXT */

body.hardMode #levelIdea{
  display:none;
}

body.hardMode #tier{
  display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">
  <div class="introCard">

    <h1 class="introTitle">
      ARO<br>
      B SLEMANY
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 smooth challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>
</div>

<div id="hud">

  <div class="pill">
    ARO B Slemany
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
    <span id="tier"></span>
  </div>

</div>

<div id="danger">
  ⚠️ مەترسیی زۆر بەرزە
</div>

<div id="levelIdea">
  💡 ئامادە بە...
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick">↔</div>
  </div>

  <div id="actionArea">

    <button class="action" id="jumpBtn">
      JUMP
    </button>

    <button class="action" id="dashBtn">
      DASH
    </button>

    <button class="action" id="resetBtn">
      RESET
    </button>

    <button class="action" id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە 😎 ئامادەی بۆ قۆناغی داهاتوو
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>

<script>
"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const intro=document.getElementById("intro");
const startBtn=document.getElementById("start");

const levelEl=document.getElementById("level");
const tierEl=document.getElementById("tier");
const levelIdea=document.getElementById("levelIdea");

const win=document.getElementById("win");
const winText=document.getElementById("winText");
const finishBanner=document.getElementById("finishBanner");
const dangerEl=document.getElementById("danger");

let W=innerWidth;
let H=innerHeight;

let DPR=Math.min(
  window.devicePixelRatio||1,
  2
);

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY="san_b_ahamd_5000_v12_smooth";
const TOTAL_LEVELS=5000;

let level=parseInt(
  localStorage.getItem(SAVE_KEY)||"1",
  10
);

if(
  !Number.isFinite(level)||
  level<1||
  level>TOTAL_LEVELS
){
  level=1;
}

/* =========================================================
   STATE
========================================================= */

let playing=false;
let paused=false;

let cameraX=0;
let lastTime=0;

let levelData=null;
let levelWon=false;

let stormFlash=0;
let screenShake=0;

let particles=[];

/* =========================================================
   PLAYER
========================================================= */

const player={
  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:255,
  jumpPower:650,

  grounded:false,
  coyote:0,

  dashCooldown:0,
  dashTime:0,

  gravityScale:1,

  slowTimer:0,
  reverseTimer:0,

  invincible:0
};

/* =========================================================
   INPUT
========================================================= */

const input={
  x:0
};

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickPointer=null;

function setJoystick(e){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;

  let dx=e.clientX-cx;

  const max=42;

  dx=Math.max(
    -max,
    Math.min(max,dx)
  );

  input.x=dx/max;

  stick.style.transform=
    `translateX(${dx}px)`;
}

function resetJoystick(){

  joystickPointer=null;

  input.x=0;

  stick.style.transform=
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    joystickPointer=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(e.pointerId===joystickPointer){
      e.preventDefault();
      setJoystick(e);
    }
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{
    if(e.pointerId===joystickPointer){
      resetJoystick();
    }
  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn=document.getElementById("jumpBtn");
const dashBtn=document.getElementById("dashBtn");
const resetBtn=document.getElementById("resetBtn");
const nextQuickBtn=document.getElementById("nextQuickBtn");

function jump(){

  if(
    player.grounded||
    player.coyote>0
  ){

    player.vy=-player.jumpPower;
    player.grounded=false;
    player.coyote=0;
  }
}

function dash(){

  if(
    player.dashCooldown>0||
    !levelData
  ){
    return;
  }

  let dir=
    Math.abs(input.x)>.1
    ?input.x
    :1;

  player.vx=dir*760;

  player.dashTime=.17;

  player.dashCooldown=
    Math.max(
      .32,
      .82-levelData.tier.d*.22
    );

  player.invincible=.16;

  screenShake=5;
}

jumpBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

dashBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    dash();
  }
);

resetBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    resetLevel();
  }
);

nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    if(levelWon){
      nextLevel();
    }
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key.toLowerCase()==="a"
    ){
      input.x=-1;
    }

    if(
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="d"
    ){
      input.x=1;
    }

    if(
      e.key===" "||
      e.key==="ArrowUp"
    ){
      e.preventDefault();
      jump();
    }

    if(
      e.key.toLowerCase()==="shift"
    ){
      dash();
    }

    if(
      e.key.toLowerCase()==="r"
    ){
      resetLevel();
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){
      input.x=0;
    }
  }
);

/* =========================================================
   IPHONE LOCK
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x=
    Math.sin(n*12.9898)*
    43758.5453123;

  return x-Math.floor(x);
}

/* =========================================================
   HELPERS
========================================================= */

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );
}

function lerp(a,b,t){

  return a+(b-a)*t;
}

function chance(seed,p){

  return random(seed)<p;
}

function rectHit(a,b){

  return(
    a.x<b.x+b.w&&
    a.x+a.w>b.x&&
    a.y<b.y+b.h&&
    a.y+a.h>b.y
  );
}

function circleHit(
  px,
  py,
  pr,
  box
){

  const cx=clamp(
    px,
    box.x,
    box.x+box.w
  );

  const cy=clamp(
    py,
    box.y,
    box.y+box.h
  );

  return(
    Math.hypot(
      px-cx,
      py-cy
    )<pr
  );
}

/* =========================================================
   DIFFICULTY
   LEVEL 1-15 = TUTORIAL
   LEVEL 16-5000 = VERY GRADUAL
========================================================= */

function difficulty(n){

  if(n<=15){

    const p=(n-1)/14;

    return{

      p,
      d:0,

      stage:1,

      name:
        `فێرکاری ${n}`,

      gap:
        145-p*28,

      width:
        185-p*25,

      rise:
        5+p*18,

      spikes:
        n>=8?p*.18:0,

      balls:
        n>=10?p*.15:0,

      cracks:
        n>=12?p*.12:0,

      moving:0,
      disappearing:0,
      saws:0,
      lasers:0,
      bombs:0,
      wind:0,
      ice:0,
      fake:0,
      walls:0,
      springs:n>=5?p*.12:0,
      portals:0,
      gravity:0,
      reverse:0,
      fallers:0,
      storms:0,

      ballSpeed:
        120+p*30,

      speed:245,
      jump:665,

      groups:
        4+Math.floor(p*3)
    };
  }

  /*
    NEW ULTRA-GENTLE CURVE

    Level 16:
      d ≈ 0.02

    Level 100:
      still very easy

    Level 500:
      still comfortable

    Level 1000:
      begins to become noticeable

    Level 2500:
      medium difficulty

    Level 4000:
      hard

    Level 5000:
      very hard

    The power curve is intentionally slow at first.
  */

  const progress=
    (n-16)/(5000-16);

  const d=
    .02+
    Math.pow(progress,2.6)*.93;

  const safeD=
    clamp(
      d,
      .02,
      .95
    );

  const stage=
    Math.min(
      20,
      1+
      Math.floor(
        safeD*20
      )
    );

  return{

    p:progress,
    d:safeD,

    stage,

    name:
      `ئاستی پلەبەرز ${stage}`,

    /*
      Bigger gaps at the beginning.
      They shrink only slowly.
    */

    gap:
      lerp(
        145,
        75,
        safeD
      ),

    width:
      lerp(
        175,
        75,
        safeD
      ),

    rise:
      lerp(
        7,
        55,
        safeD
      ),

    spikes:
      lerp(
        .02,
        .45,
        safeD
      ),

    balls:
      lerp(
        .015,
        .40,
        safeD
      ),

    cracks:
      lerp(
        .01,
        .35,
        safeD
      ),

    moving:
      lerp(
        .01,
        .35,
        safeD
      ),

    disappearing:
      lerp(
        .005,
        .25,
        safeD
      ),

    saws:
      lerp(
        .002,
        .30,
        safeD
      ),

    lasers:
      lerp(
        .001,
        .25,
        safeD
      ),

    bombs:
      lerp(
        .001,
        .22,
        safeD
      ),

    wind:
      lerp(
        .005,
        .25,
        safeD
      ),

    ice:
      lerp(
        .005,
        .25,
        safeD
      ),

    fake:
      lerp(
        .001,
        .18,
        safeD
      ),

    walls:
      lerp(
        .001,
        .20,
        safeD
      ),

    springs:
      lerp(
        .06,
        .35,
        safeD
      ),

    portals:
      lerp(
        .001,
        .15,
        safeD
      ),

    gravity:
      lerp(
        .001,
        .18,
        safeD
      ),

    reverse:
      lerp(
        .001,
        .15,
        safeD
      ),

    fallers:
      lerp(
        .002,
        .30,
        safeD
      ),

    storms:
      lerp(
        .005,
        .35,
        safeD
      ),

    ballSpeed:
      lerp(
        120,
        260,
        safeD
      ),

    speed:
      lerp(
        245,
        280,
        safeD
      ),

    jump:
      lerp(
        665,
        615,
        safeD
      ),

    /*
      Keep level length comfortable early.
      Only becomes longer later.
    */

    groups:
      Math.round(
        lerp(
          5,
          20,
          safeD
        )
      )
  };
}

/* =========================================================
   LEVEL GENERATOR
========================================================= */

function makeLevel(n){

  const D=difficulty(n);

  const groundY=
    H-
    Math.max(
      125,
      Math.min(
        165,
        H*.18
      )
    );

  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];
  const cracks=[];
  const lightnings=[];
  const fallers=[];

  const movingPlatforms=[];
  const disappearingPlatforms=[];
  const saws=[];
  const lasers=[];
  const bombs=[];
  const windZones=[];
  const iceZones=[];
  const fakePlatforms=[];
  const walls=[];
  const springs=[];
  const portals=[];
  const gravityZones=[];
  const reverseZones=[];
  const finishGates=[];

  const fairObstacles=[];

  platforms.push({
    x:-300,
    y:groundY,
    w:520,
    h:80,
    safe:true
  });

  let x=230;

  const count=D.groups;

  for(
    let i=0;
    i<count;
    i++
  ){

    const base=
      n*100000+
      i*997;

    const gap=
      Math.max(
        35,
        D.gap+
        random(base+1)*25
      );

    x+=gap;

    let width=
      Math.max(
        55,
        D.width+
        random(base+2)*25
      );

    let py=
      groundY-
      random(base+3)*D.rise;

    const platform={
      x,
      y:py,
      w:width,
      h:18,
      safe:true
    };

    platforms.push(platform);

    if(
      i%2===0||
      random(base+4)>.45
    ){

      stars.push({
        x:x+width*.5,
        y:py-38,
        r:9,
        taken:false
      });

    }

    if(
      chance(base+10,D.moving)
    ){

      movingPlatforms.push({

        x:x+width*.5,
        y:py,

        baseX:x+width*.5,
        baseY:py,

        w:Math.max(
          50,
          width*.75
        ),

        h:18,

        range:
          25+
          random(base+11)*
          (40+D.d*30),

        speed:
          .45+
          random(base+12)*
          (.8+D.d*.6),

        phase:
          random(base+13)*
          Math.PI*2,

        axis:
          random(base+14)>.5
          ?"x"
          :"y",

        safe:true
      });
    }

    if(
      chance(base+20,D.disappearing)
    ){

      disappearingPlatforms.push({

        x:x,
        y:py,
        w:width,
        h:18,

        timer:
          1.35+
          random(base+21)*1.2,

        active:true,

        respawn:
          1.8+
          random(base+22)*1.2
      });
    }

    if(
      chance(base+30,D.fake)
    ){

      fakePlatforms.push({

        x:
          x+
          random(base+31)*
          Math.max(
            10,
            width-30
          ),

        y:
          py-
          45-
          random(base+32)*35,

        w:
          Math.max(
            40,
            width*.55
          ),

        h:14,

        fake:true
      });
    }

    if(
      chance(base+40,D.spikes)
    ){

      const amount=
        n<16
        ?1
        :Math.min(
          3,
          1+
          Math.floor(
            D.d*2+
            random(base+41)
          )
        );

      for(
        let s=0;
        s<amount;
        s++
      ){

        hazards.push({

          x:
            x+
            10+
            random(base+50+s)*
            Math.max(
              12,
              width-28
            ),

          y:py-22,

          w:22,
          h:22
        });
      }
    }

    if(
      chance(base+60,D.balls)
    ){

      const amount=
        n<16
        ?1
        :Math.min(
          2,
          1+
          Math.floor(
            D.d+
            random(base+61)
          )
        );

      for(
        let b=0;
        b<amount;
        b++
      ){

        balls.push({

          x:
            x+
            width+
            55+
            random(base+70+b)*80,

          y:
            py-
            28-
            b*18,

          r:
            14+
            D.d*3,

          speed:
            D.ballSpeed*
            (1+b*.08),

          minX:x-40,

          maxX:
            x+
            width+
            180+
            D.d*60,

          dir:
            random(base+80+b)>.5
            ?1
            :-1,

          targetTimer:
            1.0+
            random(base+90+b)*1.0
        });
      }
    }

    if(
      chance(base+100,D.saws)
    ){

      saws.push({

        x:
          x+
          width+
          55+
          random(base+101)*60,

        y:
          py-
          40-
          random(base+102)*35,

        r:
          15+
          D.d*5,

        baseY:
          py-40,

        amp:
          10+
          D.d*30,

        speed:
          .6+
          D.d*1.5,

        phase:
          random(base+103)*6.28
      });
    }

    if(
      chance(base+110,D.lasers)
    ){

      lasers.push({

        x:
          x+
          width+
          40+
          random(base+111)*60,

        y:
          py-
          20-
          random(base+112)*40,

        w:
          60+
          random(base+113)*70,

        h:8,

        period:
          1.6+
          random(base+114)*1.0,

        phase:
          random(base+115)*2,

        warning:
          .5+
          random(base+116)*.2
      });
    }

    if(
      chance(base+120,D.bombs)
    ){

      bombs.push({

        x:
          x+
          width+
          65+
          random(base+121)*80,

        y:
          py-
          55-
          random(base+122)*50,

        r:
          12+
          D.d*3,

        timer:
          2.0+
          random(base+123)*1.5,

        pulse:0
      });
    }

    if(
      random(base+130)<
      .08+D.d*.3
    ){

      const sx=x+width+15;

      const sw=
        90+
        random(base+131)*
        Math.max(
          50,
          120-D.d*30
        );

      const rise=
        8+
        random(base+132)*
        (15+D.rise*.4);

      slopes.push({
        x:sx,
        y:groundY,
        w:sw,
        rise
      });

      x=sx+sw;

    }else{

      x+=width;
    }

    if(
      chance(base+140,D.cracks)
    ){

      const amount=
        Math.min(
          2,
          1+Math.floor(D.d)
        );

      for(
        let c=0;
        c<amount;
        c++
      ){

        cracks.push({

          x:
            x-
            65+
            c*24,

          y:
            groundY-3,

          w:48,
          h:10,

          timer:0,
          active:false,
          broken:false
        });
      }
    }

    if(
      chance(base+150,D.wind)
    ){

      windZones.push({

        x:x+20,

        y:
          groundY-
          130-
          random(base+151)*50,

        w:
          80+
          random(base+152)*80,

        h:
          110+
          random(base+153)*50,

        force:
          (
            random(base+154)>.5
            ?1
            :-1
          )*
          (
            50+
            D.d*150
          )
      });
    }

    if(
      chance(base+160,D.ice)
    ){

      iceZones.push({

        x:x-20,

        y:
          groundY-25,

        w:
          70+
          random(base+161)*100,

        h:30
      });
    }

    if(
      chance(base+170,D.springs)
    ){

      springs.push({

        x:
          x+
          random(base+171)*
          Math.max(
            10,
            width-25
          ),

        y:py-12,

        w:22,
        h:12,

        power:
          680+
          D.d*250
      });
    }

    if(
      chance(base+180,D.portals)
    ){

      portals.push({

        x:
          x+
          width+
          30+
          random(base+181)*60,

        y:
          py-
          60-
          random(base+182)*60,

        r:20,

        targetOffset:
          200+
          random(base+183)*300,

        used:false
      });
    }

    if(
      chance(base+190,D.gravity)
    ){

      gravityZones.push({

        x:x+10,

        y:
          py-
          120,

        w:
          80+
          random(base+191)*80,

        h:150,

        scale:
          random(base+192)>.5
          ?.7
          :1.3
      });
    }

    if(
      chance(base+200,D.reverse)
    ){

      reverseZones.push({

        x:x+10,

        y:
          py-
          135,

        w:
          80+
          random(base+201)*80,

        h:150,

        time:
          .8+
          random(base+202)*1.0
      });
    }

    if(
      chance(base+210,D.fallers)
    ){

      fallers.push({

        x:
          x+
          random(base+220)*90,

        y:
          -120-
          random(base+230)*200,

        w:
          20+
          D.d*6,

        h:
          20+
          D.d*6,

        vy:
          80+
          random(base+240)*100+
          D.d*100,

        resetY:
          -220-
          random(base+250)*100
      });
    }

    if(
      chance(base+260,D.walls)
    ){

      walls.push({

        x:
          x+
          width+
          60+
          random(base+261)*70,

        y:
          py-80,

        w:
          18+
          D.d*6,

        h:
          80+
          D.d*70,

        range:
          15+
          D.d*45,

        speed:
          .5+
          D.d*1.0,

        phase:
          random(base+262)*6.28
      });
    }
  }

  const finalStart=x+60;

  platforms.push({

    x:finalStart,
    y:groundY,
    w:500,
    h:80,
    safe:true
  });

  /* =======================================================
     FAIR OBSTACLES
     ALSO MADE MUCH GENTLER AT EARLY LEVELS
  ======================================================= */

  if(n>=16){

    /*
      Before:
        always 8 obstacles.

      Now:
        Level 16 starts with only 2.
        They slowly increase toward 8.
    */

    const obstacleTypes=[
      "ball",
      "spike",
      "fall",
      "saw",
      "laser",
      "bomb",
      "moving",
      "crack",
      "wind",
      "lightning"
    ];

    const routeLength=
      Math.max(
        1200,
        x-250
      );

    const obstacleCount=
      Math.min(
        8,
        2+
        Math.floor(
          D.d*7
        )
      );

    /*
      Early levels use only the easier obstacle types.
      Harder mechanics are unlocked gradually.
    */

    const availableTypes=
      D.d<.08
      ?["ball","spike"]
      :D.d<.18
      ?["ball","spike","moving","crack"]
      :D.d<.32
      ?["ball","spike","moving","crack","fall","wind"]
      :D.d<.50
      ?["ball","spike","moving","crack","fall","wind","saw","laser"]
      :obstacleTypes;

    for(
      let i=0;
      i<obstacleCount;
      i++
    ){

      const seed=
        n*70000+
        i*811;

      const type=
        availableTypes[
          Math.floor(
            random(seed)*
            availableTypes.length
          )
        ];

      const progress=
        i/
        Math.max(
          1,
          obstacleCount-1
        );

      const ox=
        430+
        progress*
        Math.max(
          500,
          routeLength-600
        )+
        (
          random(seed)-.5
        )*55;

      const oy=
        groundY-
        55-
        random(seed+1)*
        Math.min(
          70,
          D.rise*.4
        );

      fairObstacles.push({

        type,

        x:ox,

        y:oy,

        w:
          30+
          D.d*12,

        h:
          24+
          D.d*10,

        speed:
          35+
          D.d*70,

        phase:
          random(seed+2)*6.28,

        active:true,

        warning:
          Math.max(
            1.0,
            1.5-
            D.d*.25
          ),

        safeGap:
          Math.max(
            55,
            80-
            D.d*15
          )
      });
    }
  }

  const gateCount=
    n<16
    ?0
    :Math.min(
      2,
      Math.floor(
        Math.max(
          0,
          D.d-.7
        )*6
      )
    );

  for(
    let g=0;
    g<gateCount;
    g++
  ){

    finishGates.push({

      x:
        finalStart+
        80+
        g*75,

      y:
        groundY-130,

      w:12,
      h:130,

      phase:
        random(
          n*6000+g
        )*6.28,

      period:
        1.2+
        random(
          n*6001+g
        )*1.0
    });
  }

  const finishX=
    finalStart+430;

  const stormCount=
    n<16
    ?0
    :Math.min(
      6,
      1+
      Math.floor(D.d*5)
    );

  for(
    let i=0;
    i<stormCount;
    i++
  ){

    const seed=
      n*8000+i*31;

    lightnings.push({

      x:
        500+
        random(seed)*
        Math.max(
          300,
          x-500
        ),

      y:
        groundY-
        230-
        random(seed+1)*100,

      timer:
        random(seed+2)*1.5,

      cool:
        Math.max(
          0.8,
          1.6-
          D.d*.3-
          random(seed+3)*.2
        ),

      warning:
        Math.max(
          .35,
          .8-
          D.d*.2
        )
    });
  }

  const chaos=[];

  /*
    Chaos is also reduced early.
  */

  const chaosCount=
    n<16
    ?0
    :Math.floor(
      1+
      D.d*10
    );

  for(
    let i=0;
    i<chaosCount;
    i++
  ){

    const seed=
      n*90000+
      i*719;

    chaos.push({

      x:
        350+
        random(seed)*
        Math.max(
          300,
          x-300
        ),

      y:
        80+
        random(seed+1)*
        Math.max(
          100,
          groundY-160
        ),

      type:
        Math.floor(
          random(seed+2)*14
        ),

      size:
        8+
        random(seed+3)*
        (8+D.d*15),

      speed:
        30+
        random(seed+4)*
        (80+D.d*120),

      phase:
        random(seed+5)*6.28
    });
  }

  let ideaIndex;

  if(n<=15){

    ideaIndex=n-1;

  }else{

    ideaIndex=
      15+
      Math.floor(
        D.d*
        (ideas.length-16)
      );

    ideaIndex=
      Math.min(
        ideas.length-1,
        ideaIndex
      );
  }

  return{

    groundY,

    platforms,
    hazards,
    stars,
    balls,
    slopes,
    cracks,
    lightnings,
    fallers,

    movingPlatforms,
    disappearingPlatforms,
    saws,
    lasers,
    bombs,
    windZones,
    iceZones,
    fakePlatforms,
    walls,
    springs,
    portals,
    gravityZones,
    reverseZones,
    finishGates,

    fairObstacles,

    chaos,

    finishX,

    idea:
      ideas[ideaIndex],

    tier:D
  };
}

/* =========================================================
   SAVE
========================================================= */

function saveLevel(){

  localStorage.setItem(
    SAVE_KEY,
    String(level)
  );
}

/* =========================================================
   RESET
========================================================= */

function resetLevel(){

  levelWon=false;
  paused=false;

  levelData=
    makeLevel(level);

  player.x=70;

  player.y=
    levelData.groundY-
    player.h;

  player.vx=0;
  player.vy=0;

  player.grounded=true;
  player.coyote=0;

  player.dashCooldown=0;
  player.dashTime=0;

  player.gravityScale=1;

  player.slowTimer=0;
  player.reverseTimer=0;

  player.invincible=0;

  cameraX=0;

  stormFlash=0;
  screenShake=0;

  levelEl.textContent=level;

  if(level>=16){

    document.body.classList.add(
      "hardMode"
    );

    levelIdea.textContent="";

  }else{

    document.body.classList.remove(
      "hardMode"
    );

    tierEl.textContent=
      "• "+
      levelData.tier.name;

    levelIdea.textContent=
      `LEVEL ${level}: ${levelData.idea}`;
  }

  player.speed=
    levelData.tier.speed;

  player.jumpPower=
    levelData.tier.jump;

  win.style.display="none";

  saveLevel();
}

/* =========================================================
   START
========================================================= */

startBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    intro.style.display="none";

    playing=true;

    resetLevel();

    lastTime=
      performance.now();

    requestAnimationFrame(loop);
  }
);

/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)
    return;

  levelWon=true;
  paused=true;

  saveLevel();

  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );

  winText.textContent=
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display="flex";
}

/* =========================================================
   NEXT
========================================================= */

function nextLevel(){

  if(level>=TOTAL_LEVELS){

    level=TOTAL_LEVELS;

  }else{

    level++;
  }

  saveLevel();

  resetLevel();
}

document
  .getElementById("retryBtn")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      resetLevel();
    }
  );

document
  .getElementById("nextBtn")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      nextLevel();
    }
  );

/* =========================================================
   SLOPE
========================================================= */

function slopeSurfaceY(s,x){

  const t=
    clamp(
      (x-s.x)/s.w,
      0,
      1
    );

  return(
    s.y-
    s.rise*t
  );
}

/* =========================================================
   PARTICLES
========================================================= */

function particleBurst(
  x,
  y,
  type="normal"
){

  const count=
    type==="danger"
    ?15
    :8;

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (
          random(
            performance.now()+i*31
          )-.5
        )*180,

      vy:
        (
          random(
            performance.now()+i*53
          )-.5
        )*180,

      life:
        .4+
        random(
          performance.now()+i*71
        )*.5,

      size:
        2+
        random(
          performance.now()+i*91
        )*4
    });
  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vy+=250*dt;

    p.life-=dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

/* =========================================================
   FAIR OBSTACLES
========================================================= */

function updateFairObstacles(dt){

  if(
    !levelData||
    level<16
  ){
    return;
  }

  const now=
    performance.now()/1000;

  for(
    const o
    of levelData.fairObstacles
  ){

    const t=
      now+
      o.phase;

    let hit=false;

    if(o.type==="ball"){

      const bx=
        o.x+
        Math.sin(t*1.2)*
        (
          35+
          levelData.tier.d*25
        );

      const by=
        o.y+
        Math.cos(t*1.6)*15;

      hit=
        circleHit(
          bx,
          by,
          o.w*.5,
          player
        );
    }

    else if(o.type==="spike"){

      hit=
        rectHit(
          player,
          {
            x:o.x,
            y:
              o.y+
              Math.sin(t)*3,
            w:o.w,
            h:o.h
          }
        );
    }

    else if(o.type==="fall"){

      const cycle=3;

      const phase=
        (t+o.phase)%cycle;

      const fy=
        phase<.7
        ?o.y+
         phase*
         (
           200+
           levelData.tier.d*100
         )
        :o.y;

      hit=
        rectHit(
          player,
          {
            x:o.x,
            y:fy,
            w:o.w,
            h:o.h
          }
        );
    }

    else if(o.type==="saw"){

      const sx=
        o.x+
        Math.sin(t*1.5)*
        (
          30+
          levelData.tier.d*25
        );

      const sy=
        o.y+
        Math.cos(t)*20;

      hit=
        circleHit(
          sx,
          sy,
          o.w*.55,
          player
        );
    }

    else if(o.type==="laser"){

      const period=
        1.8+
        levelData.tier.d*.5;

      const phase=
        (t+o.phase)%period;

      const active=
        phase>o.warning;

      if(active){

        hit=
          rectHit(
            player,
            {
              x:o.x-25,
              y:o.y,
              w:o.w+50,
              h:7
            }
          );
      }
    }

    else if(o.type==="bomb"){

      const pulse=Math.sin(t*4);

      const radius=
        o.w*
        (
          1+
          Math.max(
            0,
            pulse
          )*.3
        );

      hit=
        circleHit(
          o.x,
          o.y,
          radius,
          player
        );
    }

    else if(o.type==="moving"){

      const mx=
        o.x+
        Math.sin(t)*
        (
          45+
          levelData.tier.d*25
        );

      hit=
        rectHit(
          player,
          {
            x:mx,
            y:o.y,
            w:o.w,
            h:o.h
          }
        );
    }

    else if(o.type==="crack"){

      const active=
        (
          t%
          (
            3.2-
            levelData.tier.d*.4
          )
        )>1;

      if(active){

        hit=
          rectHit(
            player,
            {
              x:o.x,
              y:o.y+10,
              w:o.w,
              h:18
            }
          );
      }
    }

    else if(o.type==="wind"){

      if(
        player.x+player.w>
          o.x-o.safeGap&&
        player.x<
          o.x+o.w+o.safeGap&&
        player.y+player.h>
          o.y-o.safeGap&&
        player.y<
          o.y+o.h+o.safeGap
      ){

        player.vx+=
          Math.sin(t*1.2)*
          (
            30+
            levelData.tier.d*60
          )*
          dt;
      }
    }

    else if(o.type==="lightning"){

      const period=
        2+
        levelData.tier.d*.4;

      const phase=
        (t+o.phase)%period;

      const warning=
        1.2-
        levelData.tier.d*.2;

      if(
        phase>warning&&
        phase<warning+.16
      ){

        hit=
          Math.abs(
            player.x+
            player.w/2-
            o.x
          )<
          22+
          o.w*.22;
      }
    }

    if(
      hit&&
      player.invincible<=0
    ){

      resetLevel();
      return;
    }
  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    paused||
    !levelData
  ){
    return;
  }

  updateParticles(dt);

  player.dashCooldown=
    Math.max(
      0,
      player.dashCooldown-dt
    );

  player.dashTime=
    Math.max(
      0,
      player.dashTime-dt
    );

  player.slowTimer=
    Math.max(
      0,
      player.slowTimer-dt
    );

  player.reverseTimer=
    Math.max(
      0,
      player.reverseTimer-dt
    );

  player.invincible=
    Math.max(
      0,
      player.invincible-dt
    );

  const oldY=player.y;
  const oldBottom=oldY+player.h;

  let gravityScale=1;

  let speedMultiplier=
    player.slowTimer>0
    ?.58
    :1;

  if(player.reverseTimer>0){
    speedMultiplier*=.9;
  }

  for(
    const g
    of levelData.gravityZones
  ){

    if(
      player.x+player.w>g.x&&
      player.x<g.x+g.w&&
      player.y+player.h>g.y&&
      player.y<g.y+g.h
    ){
      gravityScale=g.scale;
    }
  }

  let windForce=0;

  for(
    const w
    of levelData.windZones
  ){

    if(
      player.x+player.w>w.x&&
      player.x<w.x+w.w&&
      player.y+player.h>w.y&&
      player.y<w.y+w.h
    ){
      windForce+=w.force;
    }
  }

  let controlX=input.x;

  if(player.reverseTimer>0){
    controlX=-controlX;
  }

  const targetVX=
    controlX*
    player.speed*
    speedMultiplier;

  const accel=
    player.slowTimer>0
    ?6
    :14;

  player.vx+=
    (
      targetVX-
      player.vx
    )*
    Math.min(
      1,
      dt*accel
    );

  player.vx+=windForce*dt;

  if(player.dashTime>0){
    player.vx*=1.015;
  }

  player.vy+=
    1550*
    gravityScale*
    dt;

  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  player.grounded=false;

  const now=
    performance.now()/1000;

  for(
    const m
    of levelData.movingPlatforms
  ){

    if(m.axis==="x"){

      m.x=
        m.baseX+
        Math.sin(
          now*m.speed+
          m.phase
        )*
        m.range;

    }else{

      m.y=
        m.baseY+
        Math.sin(
          now*m.speed+
          m.phase
        )*
        m.range;
    }

    const p=m;

    const horizontal=
      player.x+player.w>
        p.x-p.w/2&&
      player.x<
        p.x+p.w/2;

    const top=p.y;

    const newBottom=
      player.y+
      player.h;

    if(
      horizontal&&
      player.vy>=0&&
      oldBottom<=top+10&&
      newBottom>=top
    ){

      player.y=
        top-player.h;

      player.vy=0;
      player.grounded=true;
    }
  }

  for(
    const p
    of levelData.platforms
  ){

    const horizontal=
      player.x+player.w>p.x&&
      player.x<p.x+p.w;

    const newBottom=
      player.y+
      player.h;

    if(
      horizontal&&
      player.vy>=0&&
      oldBottom<=p.y+10&&
      newBottom>=p.y
    ){

      player.y=
        p.y-player.h;

      player.vy=0;
      player.grounded=true;
    }
  }

  for(
    const p
    of levelData.disappearingPlatforms
  ){

    if(p.active){

      p.timer-=dt;

      if(p.timer<=0){

        p.active=false;
        p.timer=p.respawn;
      }

    }else{

      p.timer-=dt;

      if(p.timer<=0){

        p.active=true;

        p.timer=
          1+
          levelData.tier.d*.4;
      }
    }

    if(!p.active)continue;

    const horizontal=
      player.x+player.w>p.x&&
      player.x<p.x+p.w;

    const newBottom=
      player.y+
      player.h;

    if(
      horizontal&&
      player.vy>=0&&
      oldBottom<=p.y+10&&
      newBottom>=p.y
    ){

      player.y=
        p.y-player.h;

      player.vy=0;
      player.grounded=true;
    }
  }

  for(
    const s
    of levelData.slopes
  ){

    if(
      player.x+player.w>s.x&&
      player.x<s.x+s.w
    ){

      const surface=
        slopeSurfaceY(
          s,
          player.x+
          player.w*.5
        );

      const bottom=
        player.y+
        player.h;

      if(
        player.vy>=0&&
        bottom>=surface&&
        oldBottom<=surface+15
      ){

        player.y=
          surface-player.h;

        player.vy=0;
        player.grounded=true;
      }
    }
  }

  if(player.grounded){

    player.coyote=.12;

  }else{

    player.coyote=
      Math.max(
        0,
        player.coyote-dt
      );
  }

  for(
    const ice
    of levelData.iceZones
  ){

    if(
      player.x+player.w>ice.x&&
      player.x<ice.x+ice.w&&
      player.y+player.h>ice.y&&
      player.y<ice.y+ice.h
    ){

      player.slowTimer=.25;
      player.vx*=.985;
    }
  }

  for(
    const s
    of levelData.springs
  ){

    if(
      rectHit(player,s)&&
      player.vy>=0
    ){

      player.vy=-s.power;
      player.grounded=false;

      particleBurst(
        s.x,
        s.y,
        "normal"
      );
    }
  }

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)continue;

    const dx=
      player.x+
      player.w/2-
      s.x;

    const dy=
      player.y+
      player.h/2-
      s.y;

    if(
      Math.hypot(dx,dy)<30
    ){

      s.taken=true;

      particleBurst(
        s.x,
        s.y
      );
    }
  }

  for(
    const c
    of levelData.cracks
  ){

    const hit=
      player.x+player.w>c.x&&
      player.x<c.x+c.w&&
      player.y+player.h>=c.y-12&&
      player.y+player.h<=c.y+25;

    if(
      hit&&!c.active
    ){

      c.active=true;

      c.timer=
        Math.max(
          .5,
          1.2-
          levelData.tier.d*.3
        );
    }

    if(
      c.active&&!c.broken
    ){

      c.timer-=dt;

      if(c.timer<=0){

        c.broken=true;

        particleBurst(
          c.x+c.w/2,
          c.y,
          "danger"
        );
      }
    }
  }

  for(
    const b
    of levelData.balls
  ){

    b.targetTimer-=dt;

    if(b.targetTimer<=0){

      b.dir=
        player.x>b.x
        ?1
        :-1;

      b.targetTimer=
        Math.max(
          .5,
          1+
          random(
            level*77+
            Math.floor(
              performance.now()/700
            )
          )*.8-
          levelData.tier.d*.15
        );
    }

    b.x+=
      b.dir*
      b.speed*
      dt;

    if(b.x<=b.minX){

      b.x=b.minX;
      b.dir=1;
    }

    if(b.x>=b.maxX){

      b.x=b.maxX;
      b.dir=-1;
    }

    if(
      circleHit(
        b.x,
        b.y,
        b.r,
        player
      )
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const s
    of levelData.saws
  ){

    s.y=
      s.baseY+
      Math.sin(
        now*s.speed+
        s.phase
      )*
      s.amp;

    if(
      circleHit(
        s.x,
        s.y,
        s.r,
        player
      )
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const l
    of levelData.lasers
  ){

    const phase=
      (
        now+
        l.phase
      )%
      l.period;

    const active=
      phase>l.warning;

    if(
      active&&
      rectHit(
        player,
        {
          x:l.x,
          y:l.y,
          w:l.w,
          h:l.h
        }
      )
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const b
    of levelData.bombs
  ){

    b.timer-=dt;
    b.pulse+=dt;

    if(b.timer<=0){

      const dx=
        player.x+
        player.w/2-
        b.x;

      const dy=
        player.y+
        player.h/2-
        b.y;

      const distance=
        Math.hypot(dx,dy);

      if(
        distance<
        70+
        levelData.tier.d*25
      ){

        if(player.invincible<=0){

          resetLevel();
          return;
        }
      }

      b.timer=
        1.3+
        random(performance.now())*
        1.2;
    }
  }

  for(
    const f
    of levelData.fallers
  ){

    f.y+=f.vy*dt;

    if(
      f.y>
      levelData.groundY+40
    ){
      f.y=f.resetY;
    }

    const box={
      x:f.x-8,
      y:f.y-8,
      w:f.w+16,
      h:f.h+16
    };

    if(
      rectHit(player,box)
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const w
    of levelData.walls
  ){

    w.x+=
      Math.sin(
        now*w.speed+
        w.phase
      )*
      w.range*
      dt;

    if(
      rectHit(player,w)
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const p
    of levelData.portals
  ){

    if(p.used)continue;

    if(
      Math.hypot(
        player.x+
        player.w/2-
        p.x,

        player.y+
        player.h/2-
        p.y
      )<
      p.r+15
    ){

      p.used=true;

      player.x+=
        Math.min(
          p.targetOffset,
          400
        );

      particleBurst(
        p.x,
        p.y
      );

      screenShake=8;
    }
  }

  for(
    const r
    of levelData.reverseZones
  ){

    if(
      player.x+player.w>r.x&&
      player.x<r.x+r.w&&
      player.y+player.h>r.y&&
      player.y<r.y+r.h
    ){

      player.reverseTimer=r.time;
    }
  }

  for(
    const h
    of levelData.hazards
  ){

    if(
      rectHit(player,h)
    ){

      if(player.invincible<=0){

        resetLevel();
        return;
      }
    }
  }

  for(
    const l
    of levelData.lightnings
  ){

    l.timer+=dt;

    if(l.timer>l.cool){
      l.timer=0;
    }

    const phase=
      l.timer/l.cool;

    const strikeStart=
      l.warning/l.cool;

    if(
      phase>=strikeStart&&
      phase<strikeStart+.12
    ){

      stormFlash=1;

      if(
        Math.abs(
          player.x+
          player.w/2-
          l.x
        )<35&&
        player.y>
        l.y-15
      ){

        if(player.invincible<=0){

          resetLevel();
          return;
        }
      }
    }
  }

  updateFairObstacles(dt);

  /*
    Danger warning now appears much later.
  */

  if(
    level>=16&&
    levelData.tier.d>.65
  ){

    dangerEl.classList.add("show");

  }else{

    dangerEl.classList.remove("show");
  }

  stormFlash=
    Math.max(
      0,
      stormFlash-dt*5
    );

  screenShake=
    Math.max(
      0,
      screenShake-dt*18
    );

  if(
    player.y>
    H+180
  ){

    resetLevel();
    return;
  }

  let gateBlocked=false;

  for(
    const g
    of levelData.finishGates
  ){

    const phase=
      (
        now+
        g.phase
      )%
      g.period;

    const active=
      phase<
      g.period*.55;

    if(
      active&&
      rectHit(
        player,
        {
          x:g.x,
          y:g.y,
          w:g.w,
          h:g.h
        }
      )
    ){

      gateBlocked=true;
    }
  }

  if(
    !gateBlocked&&
    player.x+
    player.w>=
    levelData.finishX
  ){

    winLevel();
    return;
  }

  const targetCamera=
    Math.max(
      0,
      player.x-
      W*.32
    );

  cameraX+=
    (
      targetCamera-
      cameraX
    )*
    Math.min(
      1,
      dt*7
    );
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const d=
    levelData
    ?levelData.tier.d
    :0;

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    d>.5
    ?" #090d16".trim()
    :"#0f172a"
  );

  sky.addColorStop(
    .5,
    d>.5
    ?" #131c31".trim()
    :"#1e1b4b"
  );

  sky.addColorStop(
    1,
    d>.5
    ?" #1e1b4b".trim()
    :"#311042"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  ctx.translate(
    -cameraX*.08,
    0
  );

  for(
    let i=0;
    i<25;
    i++
  ){

    const x=
      i*350+
      (i*73)%200;

    const y=
      60+
      (i*41)%180;

    const glow=
      ctx.createRadialGradient(
        x,y,0,
        x,y,70
      );

    glow.addColorStop(
      0,
      "rgba(139,92,246,.12)"
    );

    glow.addColorStop(
      1,
      "transparent"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      70,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();

  if(stormFlash>0){

    ctx.fillStyle=
      `rgba(
        255,
        255,
        255,
        ${Math.min(
          .4,
          stormFlash*.4
        )}
      )`;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }
}

/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.save();

  let sx=0;
  let sy=0;

  if(screenShake>0){

    sx=
      (Math.random()-.5)*
      screenShake;

    sy=
      (Math.random()-.5)*
      screenShake;
  }

  ctx.translate(
    -cameraX+sx,
    sy
  );

  for(
    const p
    of levelData.platforms
  ){

    ctx.fillStyle="#1e293b";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );

    ctx.fillStyle="#8b5cf6";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      6
    );

    ctx.fillStyle=
      "rgba(255,255,255,.08)";

    for(
      let xx=p.x+18;
      xx<p.x+p.w;
      xx+=48
    ){

      ctx.fillRect(
        xx,
        p.y+22,
        12,
        4
      );
    }
  }

  for(
    const p
    of levelData.movingPlatforms
  ){

    ctx.fillStyle="#334155";

    ctx.fillRect(
      p.x-p.w/2,
      p.y,
      p.w,
      p.h
    );

    ctx.fillStyle="#a78bfa";

    ctx.fillRect(
      p.x-p.w/2,
      p.y,
      p.w,
      6
    );
  }

  for(
    const p
    of levelData.disappearingPlatforms
  ){

    if(!p.active)continue;

    ctx.globalAlpha=
      .4+
      .6*
      Math.min(
        1,
        p.timer
      );

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );

    ctx.globalAlpha=1;
  }

  for(
    const p
    of levelData.fakePlatforms
  ){

    ctx.fillStyle=
      "rgba(255,255,255,.25)";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );
  }

  for(
    const s
    of levelData.slopes
  ){

    ctx.fillStyle="#1e293b";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.lineTo(
      s.x+s.w,
      s.y+55-s.rise
    );

    ctx.lineTo(
      s.x,
      s.y+55
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle="#8b5cf6";

    ctx.lineWidth=6;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.stroke();
  }

  for(
    const ice
    of levelData.iceZones
  ){

    ctx.fillStyle=
      "rgba(147,197,255,.35)";

    ctx.fillRect(
      ice.x,
      ice.y,
      ice.w,
      ice.h
    );
  }

  for(
    const c
    of levelData.cracks
  ){

    if(c.broken){

      ctx.fillStyle="#090a0f";

      ctx.fillRect(
        c.x-4,
        c.y-4,
        c.w+8,
        24
      );

      continue;
    }

    ctx.fillStyle=
      c.active
      ?"#f43f5e"
      :"#475569";

    ctx.fillRect(
      c.x,
      c.y,
      c.w,
      8
    );
  }

  for(
    const h
    of levelData.hazards
  ){

    ctx.fillStyle="#f43f5e";

    ctx.beginPath();

    ctx.moveTo(
      h.x,
      h.y+h.h
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-8
    );

    ctx.lineTo(
      h.x+h.w,
      h.y+h.h
    );

    ctx.closePath();

    ctx.fill();
  }

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)continue;

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/700
    );

    ctx.fillStyle="#fbbf24";

    ctx.beginPath();

    for(
      let i=0;
      i<10;
      i++
    ){

      const a=i*Math.PI/5;

      const r=
        i%2===0
        ?10
        :5;

      const xx=Math.cos(a)*r;
      const yy=Math.sin(a)*r;

      if(i===0)
        ctx.moveTo(xx,yy);
      else
        ctx.lineTo(xx,yy);
    }

    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  for(
    const b
    of levelData.balls
  ){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );

    ctx.fillStyle="#fb923c";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();
  }

  for(
    const s
    of levelData.saws
  ){

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/120
    );

    ctx.fillStyle="#cbd5e1";

    ctx.beginPath();

    for(
      let i=0;
      i<14;
      i++
    ){

      const a=i*Math.PI/7;

      const r=
        i%2===0
        ?s.r
        :s.r*.6;

      const xx=Math.cos(a)*r;
      const yy=Math.sin(a)*r;

      if(i===0)
        ctx.moveTo(xx,yy);
      else
        ctx.lineTo(xx,yy);
    }

    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  for(
    const l
    of levelData.lasers
  ){

    const now=
      performance.now()/1000;

    const phase=
      (
        now+
        l.phase
      )%
      l.period;

    const active=
      phase>l.warning;

    ctx.fillStyle=
      active
      ?"rgba(244,63,94,.9)"
      :"rgba(251,191,36,.4)";

    ctx.fillRect(
      l.x,
      l.y,
      l.w,
      active
      ?l.h*2
      :l.h
    );
  }

  for(
    const b
    of levelData.bombs
  ){

    ctx.fillStyle="#1e293b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#f43f5e";

    ctx.beginPath();

    ctx.arc(
      b.x-3,
      b.y-3,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  for(
    const f
    of levelData.fallers
  ){

    ctx.fillStyle="#8b5cf6";

    ctx.fillRect(
      f.x,
      f.y,
      f.w,
      f.h
    );
  }

  for(
    const w
    of levelData.windZones
  ){

    ctx.fillStyle=
      "rgba(139,92,246,.04)";

    ctx.fillRect(
      w.x,
      w.y,
      w.w,
      w.h
    );
  }

  for(
    const s
    of levelData.springs
  ){

    ctx.fillStyle="#fbbf24";

    ctx.fillRect(
      s.x,
      s.y,
      s.w,
      s.h
    );
  }

  for(
    const p
    of levelData.portals
  ){

    ctx.save();

    ctx.translate(
      p.x,
      p.y
    );

    ctx.rotate(
      performance.now()/500
    );

    ctx.strokeStyle=
      p.used
      ?"rgba(100,100,100,.3)"
      :"#38bdf8";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      p.r,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
  }

  for(
    const g
    of levelData.gravityZones
  ){

    ctx.fillStyle=
      "rgba(139,92,246,.05)";

    ctx.fillRect(
      g.x,
      g.y,
      g.w,
      g.h
    );
  }

  for(
    const r
    of levelData.reverseZones
  ){

    ctx.fillStyle=
      "rgba(244,63,94,.04)";

    ctx.fillRect(
      r.x,
      r.y,
      r.w,
      r.h
    );
  }

  for(
    const w
    of levelData.walls
  ){

    ctx.fillStyle="#7c3aed";

    ctx.fillRect(
      w.x,
      w.y,
      w.w,
      w.h
    );
  }

  for(
    const g
    of levelData.finishGates
  ){

    const now=
      performance.now()/1000;

    const phase=
      (
        now+
        g.phase
      )%
      g.period;

    const active=
      phase<
      g.period*.55;

    ctx.fillStyle=
      active
      ?"rgba(244,63,94,.9)"
      :"rgba(74,222,128,.4)";

    ctx.fillRect(
      g.x,
      g.y,
      g.w,
      g.h
    );
  }

  if(level>=16){

    const now=
      performance.now()/1000;

    for(
      const o
      of levelData.fairObstacles
    ){

      const t=
        now+
        o.phase;

      ctx.save();

      if(o.type==="ball"){

        const bx=
          o.x+
          Math.sin(t*1.2)*
          (
            35+
            levelData.tier.d*25
          );

        const by=
          o.y+
          Math.cos(t*1.6)*15;

        ctx.fillStyle="#fb923c";

        ctx.beginPath();

        ctx.arc(
          bx,
          by,
          o.w*.5,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

      else if(o.type==="spike"){

        ctx.fillStyle="#f43f5e";

        ctx.beginPath();

        ctx.moveTo(
          o.x,
          o.y+o.h
        );

        ctx.lineTo(
          o.x+o.w/2,
          o.y-o.h*.4
        );

        ctx.lineTo(
          o.x+o.w,
          o.y+o.h
        );

        ctx.closePath();

        ctx.fill();

      }

      else if(o.type==="fall"){

        const cycle=3;

        const phase=
          (t+o.phase)%cycle;

        const fy=
          phase<.7
          ?o.y+
           phase*
           (
             200+
             levelData.tier.d*100
           )
          :o.y;

        ctx.fillStyle="#8b5cf6";

        ctx.fillRect(
          o.x,
          fy,
          o.w,
          o.h
        );

      }

      else if(o.type==="saw"){

        const sx=
          o.x+
          Math.sin(t*1.5)*
          (
            30+
            levelData.tier.d*25
          );

        const sy=
          o.y+
          Math.cos(t)*20;

        ctx.translate(
          sx,
          sy
        );

        ctx.rotate(
          performance.now()/100
        );

        ctx.fillStyle="#cbd5e1";

        ctx.beginPath();

        for(
          let i=0;
          i<14;
          i++
        ){

          const a=i*Math.PI/7;

          const r=
            i%2===0
            ?o.w*.55
            :o.w*.3;

          const xx=Math.cos(a)*r;
          const yy=Math.sin(a)*r;

          if(i===0)
            ctx.moveTo(xx,yy);
          else
            ctx.lineTo(xx,yy);
        }

        ctx.closePath();
        ctx.fill();

      }

      else if(o.type==="laser"){

        const period=
          1.8+
          levelData.tier.d*.5;

        const phase=
          (t+o.phase)%period;

        const active=
          phase>o.warning;

        ctx.fillStyle=
          active
          ?"rgba(244,63,94,.9)"
          :"rgba(251,191,36,.6)";

        ctx.fillRect(
          o.x-25,
          o.y,
          o.w+50,
          active?8:4
        );

      }

      else if(o.type==="bomb"){

        ctx.fillStyle="#1e293b";

        ctx.beginPath();

        ctx.arc(
          o.x,
          o.y,
          o.w*.5,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

      else if(o.type==="moving"){

        const mx=
          o.x+
          Math.sin(t)*
          (
            45+
            levelData.tier.d*25
          );

        ctx.fillStyle="#8b5cf6";

        ctx.fillRect(
          mx,
          o.y,
          o.w,
          o.h
        );

      }

      else if(o.type==="crack"){

        ctx.fillStyle="#475569";

        ctx.fillRect(
          o.x,
          o.y,
          o.w,
          8
        );

      }

      else if(o.type==="wind"){

        ctx.strokeStyle=
          "rgba(139,92,246,.25)";

        ctx.lineWidth=2;

        for(
          let a=0;
          a<2;
          a++
        ){

          ctx.beginPath();

          ctx.moveTo(
            o.x-15,
            o.y+a*22
          );

          ctx.lineTo(
            o.x+o.w+15,
            o.y+a*22
          );

          ctx.stroke();
        }

      }

      else if(o.type==="lightning"){

        const period=
          2+
          levelData.tier.d*.4;

        const phase=
          (t+o.phase)%period;

        const warning=
          1.2-
          levelData.tier.d*.2;

        if(phase<warning){

          ctx.fillStyle=
            "rgba(251,191,36,.7)";

          ctx.beginPath();

          ctx.arc(
            o.x,
            o.y,
            8,
            0,
            Math.PI*2
          );

          ctx.fill();
        }
      }

      ctx.restore();
    }
  }

  const fx=
    levelData.finishX;

  ctx.fillStyle="#1e293b";

  ctx.fillRect(
    fx,
    levelData.groundY-120,
    6,
    120
  );

  ctx.fillStyle="#f43f5e";

  ctx.beginPath();

  ctx.moveTo(
    fx+6,
    levelData.groundY-120
  );

  ctx.lineTo(
    fx+65,
    levelData.groundY-96
  );

  ctx.lineTo(
    fx+6,
    levelData.groundY-72
  );

  ctx.closePath();

  ctx.fill();

  /* PLAYER */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.fillStyle="#7c3aed";

  ctx.beginPath();

  ctx.roundRect(
    0,
    0,
    player.w,
    player.h,
    10
  );

  ctx.fill();

  if(player.dashTime>0){

    ctx.fillStyle=
      "rgba(124,58,237,.35)";

    ctx.fillRect(
      -22,
      6,
      18,
      30
    );
  }

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    10,
    12,
    4.5,
    0,
    Math.PI*2
  );

  ctx.arc(
    23,
    12,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#090a0f";

  ctx.beginPath();

  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle="#090a0f";

  ctx.lineWidth=2.5;

  ctx.beginPath();

  ctx.arc(
    17,
    17,
    7,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();

  for(
    const p
    of particles
  ){

    ctx.globalAlpha=
      clamp(
        p.life,
        0,
        1
      );

    ctx.fillStyle="#fbbf24";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;

  if(level<=15){

    ctx.fillStyle=
      "rgba(255,255,255,.5)";

    ctx.font=
      "900 14px system-ui";

    ctx.fillText(
      "هەموو شتێک نەرم و ئارامە 😎",
      player.x+90,
      player.y-30
    );
  }

  ctx.restore();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  if(levelData){
    drawWorld();
  }
}

/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!playing)
    return;

  const dt=
    Math.min(
      .033,
      Math.max(
        .001,
        (time-lastTime)/1000
      )
    );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* =========================================================
   INITIAL
========================================================= */

levelData=
  makeLevel(level);

levelEl.textContent=
  level;

if(level>=16){

  document.body.classList.add(
    "hardMode"
  );

}else{

  tierEl.textContent=
    "• "+
    levelData.tier.name;

  levelIdea.textContent=
    `LEVEL ${level}: ${levelData.idea}`;
}

draw();

</script>

</body>
</html>
