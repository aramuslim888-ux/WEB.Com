<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San: Grand Theft Auto Style 🎮</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #050508;
            color: #fff;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: linear-gradient(to bottom, #111827, #1f2937);
            border: 3px solid #facc15;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body>

    <div class="text-center mb-2">
        <h1 class="text-xl font-black text-yellow-400 tracking-wider">GTA: San Street 🚗💨</h1>
        <p class="text-xs text-gray-400" id="levelInfo">مەرحەلەی ١: شەقامی ئازاد</p>
    </div>

    <canvas id="gameCanvas" width="400" height="250"></canvas>

    <div class="mt-3 flex gap-3">
        <button onclick="jump()" class="px-5 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-black font-black rounded-xl shadow-lg text-xs transition active:scale-95">
            بازدان ⬆️ (Jump)
        </button>
        <button onclick="toggleCar()" id="carBtn" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl shadow-lg text-xs transition active:scale-95">
            سواری سەیارە 🏎️
        </button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let level = 1;
        let isGameOver = false;

        const sanImg = new Image();
        sanImg.src = 'san.PNG';

        let player = {
            x: 40,
            y: 150,
            size: 45,
            dy: 0,
            jumpPower: -10,
            gravity: 0.5,
            grounded: true,
            inCar: false
        };

        let obstacles = [];
        let obstacleTimer = 0;

        function jump() {
            if (player.grounded && !isGameOver) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
            if (isGameOver) {
                resetGame();
            }
        }

        function toggleCar() {
            if (!isGameOver) {
                player.inCar = !player.inCar;
                const btn = document.getElementById('carBtn');
                if (player.inCar) {
                    btn.innerText = "دابەزین لە سەیارە 🏃‍♂️";
                    btn.className = "px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl shadow-lg text-xs transition active:scale-95";
                    document.getElementById('levelInfo').innerText = "مەرحەلەی خێرایی سەیارە 🔥";
                } else {
                    btn.innerText = "سواری سەیارە 🏎️";
                    btn.className = "px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl shadow-lg text-xs transition active:scale-95";
                    document.getElementById('levelInfo').innerText = "پیاسەکردن لە شەقامدا 🚶‍♂️";
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            } else if (e.code === 'KeyC') {
                toggleCar();
            }
        });

        function update() {
            if (isGameOver) return;

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 150) {
                player.y = 150;
                player.dy = 0;
                player.grounded = true;
            }

            obstacleTimer++;
            let spawnInterval = level === 1 ? 100 : level === 2 ? 75 : 55;
            
            if (obstacleTimer > spawnInterval) {
                obstacles.push({
                    x: canvas.width,
                    y: 160,
                    width: player.inCar ? 30 : 20,
                    height: player.inCar ? 35 : 40,
                    speed: (level === 1 ? 4 : level === 2 ? 5.5 : 7) * (player.inCar ? 1.4 : 1)
                });
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                let pWidth = player.inCar ? 65 : player.size;
                let pHeight = player.inCar ? 35 : player.size;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + pWidth > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + pHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += player.inCar ? 25 : 10;

                    if (score >= 50 && score < 100) {
                        level = 2;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٢: پۆلیس لە دواوەیە! 🚨";
                    } else if (score >= 100) {
                        level = 3;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٣: ستایلی گەورەی GTA 🌟";
                    }
                }
            }
        }

        function draw() {
            // شاشەی سەرەکی و شەقامەکە
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // کێشانی هێڵی شەقام (شێوازی GTA)
            ctx.fillStyle = "#1f2937";
            ctx.fillRect(0, 195, canvas.width, 55);
            ctx.strokeStyle = "#facc15";
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 222);
            ctx.lineTo(canvas.width, 222);
            ctx.stroke();
            ctx.setLineDash([]); // گەڕاندنەوەی هێڵ بۆ باری ئاسایی

            if (player.inCar) {
                // سەیارەی وەک GTA
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(player.x, player.y + 12, 65, 30);
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(player.x + 15, player.y + 42, 8, 0, Math.PI * 2);
                ctx.arc(player.x + 50, player.y + 42, 8, 0, Math.PI * 2);
                ctx.fill();

                // ڕوخساری San لەسەر سەیارەکە
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x + 32, player.y + 10, 15, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                if (sanImg.complete && sanImg.naturalWidth !== 0) {
                    ctx.drawImage(sanImg, player.x + 17, player.y - 5, 30, 30);
                }
                ctx.restore();
            } else {
                // کەسایەتی بە پێ بە دەموچاوی San
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x + player.size / 2, player.y + player.size / 2, player.size / 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (sanImg.complete && sanImg.naturalWidth !== 0) {
                    ctx.drawImage(sanImg, player.x, player.y, player.size, player.size);
                } else {
                    ctx.fillStyle = "#3b82f6";
                    ctx.fillRect(player.x, player.y, player.size, player.size);
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(player.x + player.size / 2, player.y + player.size / 2, player.size / 2, 0, Math.PI * 2);
                ctx.strokeStyle = "#facc15";
                ctx.lineWidth = 2;
                ctx.stroke();

                // نوسینی ناوی San لەسەری
                ctx.fillStyle = "#facc15";
                ctx.font = "bold 11px Vazirmatn";
                ctx.fillText("San", player.x + 12, player.y - 6);
            }

            // ئاستەنگەکان (ماشینی تر یان بەربەست)
            ctx.fillStyle = "#38bdf8";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // نیشاندانی خاڵ و ستایلی مینیماپی GTA
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Vazirmatn";
            ctx.fillText(`خاڵ (Score): ${score}`, 15, 25);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 20px Vazirmatn";
                ctx.textAlign = "center";
                ctx.fillText("WASTED 💀", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#facc15";
                ctx.font = "12px Vazirmatn";
                ctx.fillText("بۆ دوبارە دەستپێکردنەوە کلیک بکە", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }
        }

        function resetGame() {
            score = 0;
            level = 1;
            obstacles = [];
            isGameOver = false;
            player.inCar = false;
            document.getElementById('carBtn').innerText = "سواری سەیارە 🏎️";
            document.getElementById('carBtn').className = "px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl shadow-lg text-xs transition active:scale-95";
            document.getElementById('levelInfo').innerText = "مەرحەلەی ١: شەقامی ئازاد";
            player.y = 150;
            player.dy = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
