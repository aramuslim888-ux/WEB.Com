<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>ARO B Slemany — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090a0f;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:pointer;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* HUD */

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 14px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  z-index:50;
  pointer-events:none;
  animation: fadeInDown 0.8s ease-out;
}

.pill{
  background:rgba(20,24,36,.75);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  letter-spacing: 0.5px;
}

#tier{
  font-size:11px;
  opacity:.8;
  margin-left:6px;
  color:#a78bfa;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,rgba(139,92,246,.35) 0%,transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(236,72,153,.3) 0%,transparent 40%),
    linear-gradient(135deg, #0f172a 0%, #090a0f 100%);
}

.introCard{
  width:min(92vw,460px);
  padding:36px 24px;
  animation: scaleUp 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes scaleUp {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeInDown {
  0% { transform: translateY(-20px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

.introTitle{
  margin:0;
  font-size:clamp(44px,13vw,76px);
  line-height:.9;
  font-weight:1000;
  background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 10px 30px rgba(139,92,246,0.4);
}

.introName{
  margin:22px 0 8px;
  font-size:18px;
  font-weight:800;
  color:#cbd5e1;
}

.creator{
  margin:0 0 28px;
  opacity:.7;
  font-size:13px;
  letter-spacing: 1px;
}

#start{
  border:0;
  padding:18px 36px;
  border-radius:999px;
  background:linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 10px 25px rgba(124,58,237,.5);
}

#start:active{
  transform:scale(0.95);
  box-shadow:0 5px 15px rgba(124,58,237,.3);
}

/* CONTROLS */

#controls{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

/* JOYSTICK */

#joystick{
  position:absolute;
  left:max(20px,env(safe-area-inset-left) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.1),
    rgba(255,255,255,.02)
  );
  border:2px solid rgba(255,255,255,.25);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.05),
    0 10px 35px rgba(0,0,0,.3);
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(8px);
}

#stick{
  position:absolute;
  width:64px;
  height:64px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:white;
  box-shadow: 0 4px 15px rgba(0,0,0,.2);
  transition:transform .04s linear;
}

/* ACTIONS */

#actionArea{
  position:absolute;
  right:max(20px,env(safe-area-inset-right) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  display:grid;
  grid-template-columns:78px 78px;
  gap:12px;
  pointer-events:none;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(20,24,36,.65);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.action:active{
  transform:scale(.92);
  background:rgba(124,58,237,.85);
  border-color:rgba(255,255,255,.6);
}

/* IDEA */

#levelIdea{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 176px);
  transform:translateX(-50%);
  width:min(92vw,580px);
  padding:10px 16px;
  text-align:center;
  border-radius:16px;
  background:rgba(15,23,42,.75);
  color:#e2e8f0;
  font-size:13px;
  font-weight:800;
  z-index:40;
  pointer-events:none;
  opacity:.95;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* WIN */

#win{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,7,12,.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  text-align:center;
}

.winCard{
  width:min(92vw,440px);
  background:rgba(20,24,36,.9);
  color:white;
  border-radius:32px;
  padding:32px 24px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.12);
  animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

.winCard h1{
  margin:0 0 10px;
  font-size:24px;
  font-weight: 1000;
  color:#f8fafc;
}

.winCard p{
  line-height:1.6;
  color:#cbd5e1;
  font-size: 15px;
}

.winButtons{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:22px;
}

.winButtons button{
  border:0;
  border-radius:16px;
  padding:14px 20px;
  font-size:14px;
  font-weight:900;
}

#nextBtn{
  background:linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
  color:#fff;
  box-shadow:0 8px 20px rgba(124,58,237,.4);
}

#retryBtn{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
}

/* FINISH */

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:140;
  color:#fff;
  background:linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
  padding:20px 28px;
  border-radius:22px;
  font-size:22px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  box-shadow:0 15px 40px rgba(124,58,237,.5);
}

#finishBanner.show{
  animation:finishPop .8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
  }
  40%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* SMALL STATUS */

#danger{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 70px);
  transform:translateX(-50%);
  z-index:60;
  color:white;
  background:rgba(239,68,68,.85);
  padding:8px 16px;
  border-radius:999px;
  font-size:11px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
  backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(239,68,68,.3);
}

#danger.show{
  opacity:1;
}

body.hardMode #levelIdea{
  display:none;
}

body.hardMode #tier{
  display:none;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">
  <div class="introCard">

    <h1 class="introTitle">
      ARO<br>
      B SLEMANY
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 smooth challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>
</div>

<div id="hud">

  <div class="pill">
    ARO B Slemany
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
    <span id="tier"></span>
  </div>

</div>

<div id="danger">
  ⚠️ مەترسیی زۆر بەرزە
</div>

<div id="levelIdea">
  💡 ئامادە بە...
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick">↔</div>
  </div>

  <div id="actionArea">

    <button class="action" id="jumpBtn">
      JUMP
    </button>

    <button class="action" id="dashBtn">
      DASH
    </button>

    <button class="action" id="resetBtn">
      RESET
    </button>

    <button class="action" id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە 😎 ئامادەی بۆ قۆناغی داهاتوو
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");

const levelEl = document.getElementById("level");
const tierEl = document.getElementById("tier");
const levelIdea = document.getElementById("levelIdea");

const win = document.getElementById("win");
const winText = document.getElementById("winText");
const finishBanner = document.getElementById("finishBanner");
const dangerEl = document.getElementById("danger");

let W = innerWidth;
let H = innerHeight;

let DPR = Math.min(
  window.devicePixelRatio || 1,
  2
);

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width =
    Math.floor(W * DPR);

  canvas.height =
    Math.floor(H * DPR);

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();

const SAVE_KEY =
  "san_b_ahamd_5000_v12_smooth";

const TOTAL_LEVELS = 5000;

let level =
  parseInt(
    localStorage.getItem(SAVE_KEY) || "1",
    10
  );

if(
  !Number.isFinite(level) ||
  level < 1 ||
  level > TOTAL_LEVELS
){
  level = 1;
}

let playing = false;
let paused = false;

let cameraX = 0;
let lastTime = 0;

let levelData = null;
let levelWon = false;

let stormFlash = 0;
let screenShake = 0;

let particles = [];

const player = {

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:280,
  jumpPower:680,

  grounded:false,
  coyote:0,

  dashCooldown:0,
  dashTime:0,

  gravityScale:1,

  slowTimer:0,
  reverseTimer:0,

  invincible:0

};

const input = {
  x:0
};

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickPointer = null;

function setJoystick(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left +
    r.width / 2;

  let dx =
    e.clientX - cx;

  const max = 42;

  dx =
    Math.max(
      -max,
      Math.min(max,dx)
    );

  input.x =
    dx / max;

  stick.style.transform =
    `translateX(${dx}px)`;
}

function resetJoystick(){

  joystickPointer = null;

  input.x = 0;

  stick.style.transform =
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    joystickPointer =
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      e.preventDefault();
      setJoystick(e);
    }
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      resetJoystick();
    }
  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

const jumpBtn =
  document.getElementById("jumpBtn");

const dashBtn =
  document.getElementById("dashBtn");

const resetBtn =
  document.getElementById("resetBtn");

const nextQuickBtn =
  document.getElementById("nextQuickBtn");

function jump(){

  if(
    player.grounded ||
    player.coyote > 0
  ){

    player.vy =
      -player.jumpPower;

    player.grounded = false;

    player.coyote = 0;
  }
}

function dash(){

  if(
    player.dashCooldown > 0 ||
    !levelData
  ){
    return;
  }

  let dir =
    Math.abs(input.x) > .1
    ? input.x
    : 1;

  player.vx =
    dir * 760;

  player.dashTime = .17;

  player.dashCooldown = 0.2;
  player.invincible = .3;

  screenShake = 3;
}

jumpBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

dashBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    dash();
  }
);

resetBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    resetLevel();
  }
);

nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    if(levelWon){
      nextLevel();
    }
  }
);

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){
      input.x = -1;
    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){
      input.x = 1;
    }

    if(
      e.key === " " ||
      e.key === "ArrowUp"
    ){
      e.preventDefault();
      jump();
    }

    if(
      e.key.toLowerCase() === "shift"
    ){
      dash();
    }

    if(
      e.key.toLowerCase() === "r"
    ){
      resetLevel();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){

      input.x = 0;

    }

  }
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);
document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

function random(n){
  const x = Math.sin(n * 12.9898) * 43758.5453123;
  return x - Math.floor(x);
}

function clamp(value, min, max){
  return Math.max(min, Math.min(max, value));
}

function lerp(a, b, t){
  return a + (b - a) * t;
}

function chance(seed, p){
  return random(seed) < p;
}

function rectHit(a, b){
  return(
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function circleHit(px, py, pr, box){
  const cx = clamp(px, box.x, box.x + box.w);
  const cy = clamp(py, box.y, box.y + box.h);
  return Math.hypot(px - cx, py - cy) < pr;
}

/* =========================================================
   DIFFICULTY (ZOR ASAN KRAA BO 16 TA 5000)
========================================================= */

function difficulty(n){

  if(n <= 15){
    const p = (n - 1) / 14;
    return{
      p, d: 0, stage: 1, name: `فێرکاری ${n}`,
      gap: 145 - p * 28, width: 185 - p * 25, rise: 5 + p * 18,
      spikes: 0, balls: 0, cracks: 0, moving: 0, disappearing: 0,
      saws: 0, lasers: 0, bombs: 0, wind: 0, ice: 0, fake: 0,
      walls: 0, springs: 0, portals: 0, gravity: 0, reverse: 0,
      fallers: 0, storms: 0, ballSpeed: 100, speed: 280, jump: 680, groups: 4
    };
  }

  // ئاستەکان زۆر هێمن و ئاسان کراون بۆ ئەوەی بێ کێشە بڕێن
  const progress = (n - 16) / (5000 - 16);
  const d = Math.min(0.25, progress * 0.2); // ڕێژەی سەختی زۆر کەمکراوەتەوە

  return{
    p: progress,
    d: d,
    stage: 1,
    name: `ئاستی ئاسان ${n}`,
    gap: 110,
    width: 170,
    rise: 15,
    spikes: 0.02,
    balls: 0.02,
    cracks: 0.01,
    moving: 0.02,
    disappearing: 0.01,
    saws: 0.01,
    lasers: 0.01,
    bombs: 0.01,
    wind: 0.01,
    ice: 0.01,
    fake: 0,
    walls: 0.01,
    springs: 0.1,
    portals: 0.01,
    gravity: 0,
    reverse: 0,
    fallers: 0.01,
    storms: 0,
    ballSpeed: 100,
    speed: 280,
    jump: 680,
    groups: 5
  };
}

const ideas = [
"💡 بە joystick بڕۆ بۆ ڕاست.",
"💡 JUMP بۆ بازدان بەکاربهێنە.",
"💡 یارییەکە زۆر ئاسان کراوە بۆ ئەوەی بەخێرایی بڕۆی.",
"💡 سەرکەوتوو دەبیت!"
];

function makeLevel(n){

  const D = difficulty(n);
  const groundY = H - Math.max(125, Math.min(165, H*.18));

  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];
  const cracks=[];
  const lightnings=[];
  const fallers=[];

  const movingPlatforms=[];
  const disappearingPlatforms=[];
  const saws=[];
  const lasers=[];
  const bombs=[];
  const windZones=[];
  const iceZones=[];
  const fakePlatforms=[];
  const walls=[];
  const springs=[];
  const portals=[];
  const gravityZones=[];
  const reverseZones=[];
  const finishGates=[];
  const fairObstacles=[];

  platforms.push({
    x:-300, y:groundY, w:520, h:80, safe:true
  });

  let x = 230;
  const count = D.groups;

  for(let i = 0; i < count; i++){
    const base = n * 1000 + i;
    const gap = 120;
    x += gap;

    let width = 160;
    let py = groundY - random(base)*10;

    platforms.push({
      x, y: py, w: width, h: 18, safe: true
    });

    stars.push({
      x: x + width * .5, y: py - 38, r: 9, taken: false
    });

    x += width;
  }

  const finalStart = x + 60;
  platforms.push({
    x: finalStart, y: groundY, w: 500, h: 80, safe: true
  });

  const finishX = finalStart + 300;

  return{
    groundY,
    platforms, hazards, stars, balls, slopes, cracks, lightnings, fallers,
    movingPlatforms, disappearingPlatforms, saws, lasers, bombs, windZones,
    iceZones, fakePlatforms, walls, springs, portals, gravityZones, reverseZones,
    finishGates, fairObstacles, chaos: [], finishX,
    idea: "ئەم قۆناغە زۆر ئاسانە، چێژ وەربگرە!",
    tier: D
  };
}

function saveLevel(){
  localStorage.setItem(SAVE_KEY, String(level));
}

function resetLevel(){
  levelWon = false;
  paused = false;
  levelData = makeLevel(level);

  player.x = 70;
  player.y = levelData.groundY - player.h;
  player.vx = 0;
  player.vy = 0;
  player.grounded = true;
  player.coyote = 0;
  player.dashCooldown = 0;
  player.dashTime = 0;
  player.gravityScale = 1;
  player.slowTimer = 0;
  player.reverseTimer = 0;
  player.invincible = 0;
  cameraX = 0;
  stormFlash = 0;
  screenShake = 0;

  levelEl.textContent = level;
  document.body.classList.remove("hardMode");
  tierEl.textContent = "• " + levelData.tier.name;
  levelIdea.textContent = `LEVEL ${level}: ئاسان کراوە بۆ سەرکەوتن!`;

  player.speed = levelData.tier.speed;
  player.jumpPower = levelData.tier.jump;
  win.style.display = "none";
  saveLevel();
}

startBtn.addEventListener("pointerdown", e=>{
  e.preventDefault();
  intro.style.display = "none";
  playing = true;
  resetLevel();
  lastTime = performance.now();
  requestAnimationFrame(loop);
});

function winLevel(){
  if(levelWon) return;
  levelWon = true;
  paused = true;
  saveLevel();

  finishBanner.classList.remove("show");
  void finishBanner.offsetWidth;
  finishBanner.classList.add("show");

  winText.textContent = `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی تێپەڕاند!`;
  win.style.display = "flex";
}

function nextLevel(){
  if(level >= TOTAL_LEVELS){
    level = TOTAL_LEVELS;
  }else{
    level++;
  }
  saveLevel();
  resetLevel();
}

document.getElementById("retryBtn").addEventListener("pointerdown", e=>{
  e.preventDefault();
  resetLevel();
});

document.getElementById("nextBtn").addEventListener("pointerdown", e=>{
  e.preventDefault();
  nextLevel();
});

function updateParticles(dt){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 250 * dt;
    p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

function update(dt){
  if(paused || !levelData) return;
  updateParticles(dt);

  player.dashCooldown = Math.max(0, player.dashCooldown - dt);
  player.dashTime = Math.max(0, player.dashTime - dt);
  player.invincible = Math.max(0, player.invincible - dt);

  const oldY = player.y;
  const oldBottom = oldY + player.h;

  let controlX = input.x;
  const targetVX = controlX * player.speed;

  player.vx += (targetVX - player.vx) * Math.min(1, dt * 14);
  player.vy += 1550 * dt;

  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.grounded = false;

  for(const p of levelData.platforms){
    const horizontal = player.x + player.w > p.x && player.x < p.x + p.w;
    const newBottom = player.y + player.h;
    if(horizontal && player.vy >= 0 && oldBottom <= p.y + 10 && newBottom >= p.y){
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  for(const s of levelData.stars){
    if(s.taken) continue;
    if(Math.hypot(player.x + player.w/2 - s.x, player.y + player.h/2 - s.y) < 35){
      s.taken = true;
    }
  }

  if(player.y > H + 180){
    resetLevel();
    return;
  }

  if(player.x + player.w >= levelData.finishX){
    winLevel();
    return;
  }

  const targetCamera = Math.max(0, player.x - W * .32);
  cameraX += (targetCamera - cameraX) * Math.min(1, dt * 7);
}

function drawBackground(){
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0f172a");
  sky.addColorStop(1, "#311042");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
}

function drawWorld(){
  ctx.save();
  ctx.translate(-cameraX, 0);

  for(const p of levelData.platforms){
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#8b5cf6";
    ctx.fillRect(p.x, p.y, p.w, 6);
  }

  for(const s of levelData.stars){
    if(s.taken) continue;
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(s.x, s.y, 9, 0, Math.PI * 2);
    ctx.fill();
  }

  const fx = levelData.finishX;
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(fx, levelData.groundY - 120, 6, 120);
  ctx.fillStyle = "#f43f5e";
  ctx.beginPath();
  ctx.moveTo(fx + 6, levelData.groundY - 120);
  ctx.lineTo(fx + 65, levelData.groundY - 96);
  ctx.lineTo(fx + 6, levelData.groundY - 72);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = "#7c3aed";
  ctx.beginPath();
  ctx.roundRect(0, 0, player.w, player.h, 10);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

function draw(){
  drawBackground();
  if(levelData) drawWorld();
}

function loop(time){
  if(!playing) return;
  const dt = Math.min(.033, Math.max(.001, (time - lastTime) / 1000));
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

levelData = makeLevel(level);
levelEl.textContent = level;
tierEl.textContent = "• " + levelData.tier.name;
levelIdea.textContent = `LEVEL ${level}: ${levelData.idea}`;
draw();

</script>

</body>
</html>
