<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یارییە سەرنجڕاکێشەکە - ٥٠٠٠ قۆناغ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ffcc00;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        canvas {
            background: #111;
            border-radius: 10px;
            display: block;
            margin: 0 auto 15px auto;
            border: 2px solid #444;
        }

        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #e64a19;
            transform: scale(1.05);
        }

        .message {
            margin-top: 10px;
            font-size: 14px;
            color: #00e676;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>یارییە خنجیلانەکە (٥٠٠٠ قۆناغ)</h1>
        
        <div class="stats">
            <div>قۆناغ: <span id="levelText">١</span></div>
            <div>ئەگەری بڕین: <span id="dangerText">٠٪ (فێرکاری)</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="300"></canvas>

        <button id="actionBtn" class="btn" onclick="startGame()">دەستپێکردن</button>
        <div id="msg" class="message">کاکە لە ١ تا ١٥ فێرکارییە، پاشان وردە وردە قورس دەبێت!</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let level = 1;
        let isPlaying = false;
        let score = 0;
        
        // یاریزان
        let player = {
            x: 180,
            y: 250,
            width: 40,
            height: 20,
            speed: 4,
            dx: 0
        };

        // ئاستەنگ یان شتە بێتامەکان
        let obstacles = [];

        // کۆنتڕۆڵی تەختەکلیل
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") player.dx = player.speed;
            if (e.key === "ArrowLeft") player.dx = -player.speed;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key === "ArrowLeft") player.dx = 0;
        });

        function startGame() {
            if (!isPlaying) {
                isPlaying = true;
                level = 1;
                player.x = 180;
                obstacles = [];
                document.getElementById("actionBtn").style.display = "none";
                document.getElementById("msg").innerText = "یاری دەستی پێکرد! سەرنج بدە.";
                loop();
            }
        }

        function update() {
            // جووڵەی یاریزان
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // دیاریکردنی ڕێژەی مەترسی و ئەگەری بڕین
            let dangerChance = 0;
            let obstacleSpeed = 2;

            if (level <= 15) {
                dangerChance = 0; // 0% لە ١ تا ١٥
                obstacleSpeed = 1.5;
            } else {
                // لە ١٦ بەرەو سەرەوە وردە وردە قورس دەبێت و مەترسی زیاد دەکات
                dangerChance = Math.min(95, (level - 15) * 0.05); 
                obstacleSpeed = 2 + (level - 15) * 0.003;
            }

            // نوێکردنەوەی نوسینی سەر شاشە
            document.getElementById("levelText").innerText = level;
            document.getElementById("dangerText").innerText = level <= 15 ? "٠٪ (فێرکاری)" : Math.floor(dangerChance) + "٪";

            // دروستکردنی شتە بێتامەکان (ئاستەنگ)
            if (Math.random() < 0.03) {
                obstacles.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: obstacleSpeed
                });
            }

            // جووڵەی ئاستەنگەکان و پشکنینی پێکدادان
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // پشکنینی پێکدادان (Collision Detection)
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    // ئەگەر لە قۆناغی فێرکاری بێت (١-١٥)، نایبڕێت و تەنها تێدەپەڕێت
                    if (level <= 15) {
                        obstacles.splice(i, 1); // شتە بێتامەکە لاببە بێ ئەوەی بشکێیت
                    } else {
                        // لە ١٦ بە سەرەوە ئەگەر ڕێبدات، دەدۆڕێیت
                        if (Math.random() * 100 < dangerChance) {
                            gameOver();
                            return;
                        } else {
                            obstacles.splice(i, 1);
                        }
                    }
                }

                // لابردنی ئاستەنگە تێپەڕیوەکان
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    // بەرزکردنەوەی قۆناغ بە تێپەڕبوونی کات یان خاڵ
                    if (score % 5 === 0 && level < 5000) {
                        level++;
                    }
                }
            }
        }

        function draw() {
            // سڕینەوەی شاشە
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // کێشانی یاریزان
            ctx.fillStyle = level <= 15 ? "#00e676" : "#ff5722";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // کێشانی شتە بێتامەکان (ئاستەنگەکان)
            ctx.fillStyle = "#ffcc00";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById("actionBtn").style.display = "inline-block";
            document.getElementById("actionBtn").innerText = "دووبارە هەوڵبدەوە";
            document.getElementById("msg").innerText = "دۆڕایت! گەیشتیتە قۆناغی " + level;
        }
    </script>
</body>
</html>
