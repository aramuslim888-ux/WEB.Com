<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ARO B Slemany — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090a0f;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:pointer;
  transition:all .2s ease;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 14px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  z-index:50;
  pointer-events:none;
}

.pill{
  background:rgba(20,24,36,.78);
  color:#fff;
  padding:12px 17px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.15);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
}

#tier{
  font-size:11px;
  opacity:.8;
  margin-left:5px;
  color:#a78bfa;
}

#hearts{
  color:#fb7185;
  margin-left:5px;
  letter-spacing:2px;
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(139,92,246,.35),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(236,72,153,.3),transparent 40%),
    linear-gradient(135deg,#0f172a,#090a0f);
}

.introCard{
  width:min(92vw,460px);
  padding:36px 24px;
  animation:scaleUp .7s ease forwards;
}

@keyframes scaleUp{
  from{
    transform:scale(.85);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.introTitle{
  margin:0;
  font-size:clamp(44px,13vw,76px);
  line-height:.9;
  font-weight:1000;
  background:linear-gradient(135deg,#fff 30%,#a78bfa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.introName{
  margin:22px 0 8px;
  font-size:18px;
  font-weight:800;
  color:#cbd5e1;
}

.creator{
  margin:0 0 28px;
  opacity:.7;
  font-size:13px;
  letter-spacing:1px;
}

#start{
  border:0;
  padding:18px 36px;
  border-radius:999px;
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 10px 25px rgba(124,58,237,.5);
}

#start:active{
  transform:scale(.95);
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:max(20px,env(safe-area-inset-left) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.02));
  border:2px solid rgba(255,255,255,.25);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.05),
    0 10px 35px rgba(0,0,0,.3);
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

#stick{
  position:absolute;
  width:64px;
  height:64px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  color:#fff;
  will-change:transform;
}

#actionArea{
  position:absolute;
  right:max(20px,env(safe-area-inset-right) + 20px);
  bottom:max(24px,env(safe-area-inset-bottom) + 24px);
  display:grid;
  grid-template-columns:78px 78px;
  gap:12px;
  pointer-events:none;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(20,24,36,.65);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.action:active{
  transform:scale(.92);
  background:rgba(124,58,237,.85);
}

#levelIdea{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 176px);
  transform:translateX(-50%);
  width:min(92vw,580px);
  padding:10px 16px;
  text-align:center;
  border-radius:16px;
  background:rgba(15,23,42,.75);
  color:#e2e8f0;
  font-size:13px;
  font-weight:800;
  z-index:40;
  pointer-events:none;
  opacity:.95;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
}

#danger{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 70px);
  transform:translateX(-50%);
  z-index:60;
  color:#fff;
  background:rgba(239,68,68,.85);
  padding:8px 16px;
  border-radius:999px;
  font-size:11px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
}

#danger.show{
  opacity:1;
}

#damage{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 112px);
  transform:translateX(-50%);
  z-index:100;
  color:#fff;
  background:rgba(239,68,68,.88);
  padding:9px 18px;
  border-radius:999px;
  font-size:12px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.2s ease;
}

#damage.show{
  opacity:1;
}

/* =========================================================
   WIN
========================================================= */

#win{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,7,12,.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  text-align:center;
}

.winCard{
  width:min(92vw,440px);
  background:rgba(20,24,36,.94);
  color:#fff;
  border-radius:32px;
  padding:32px 24px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.12);
  animation:scaleUp .4s ease forwards;
}

.winCard h1{
  margin:0 0 10px;
  font-size:24px;
  font-weight:1000;
}

.winCard p{
  line-height:1.6;
  color:#cbd5e1;
  font-size:15px;
}

.winButtons{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:22px;
}

.winButtons button{
  border:0;
  border-radius:16px;
  padding:14px 20px;
  font-size:14px;
  font-weight:900;
}

#nextBtn{
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  color:#fff;
}

#retryBtn{
  background:rgba(255,255,255,.08);
  color:#fff;
}

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:140;
  color:#fff;
  background:linear-gradient(135deg,#7c3aed,#6d28d9);
  padding:20px 28px;
  border-radius:22px;
  font-size:22px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:finishPop .8s ease forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
  }
  40%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

body.hardMode #levelIdea{
  display:none;
}

body.hardMode #tier{
  display:none;
}

@media(max-width:430px){

  #hud{
    gap:6px;
  }

  .pill{
    padding:10px 12px;
    font-size:12px;
  }

  #actionArea{
    grid-template-columns:68px 68px;
    gap:9px;
  }

  .action{
    width:68px;
    height:68px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">
  <div class="introCard">

    <h1 class="introTitle">
      ARO<br>B SLEMANY
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 smooth challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>
</div>

<div id="hud">

  <div class="pill">
    ARO B Slemany
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
    <span id="tier"></span>
    <span id="hearts">♥♥♥</span>
  </div>

</div>

<div id="danger">
  ⚠️ مەترسیی زۆر بەرزە
</div>

<div id="damage">
  💥 کەمێک ئاگادار بە!
</div>

<div id="levelIdea">
  💡 ئامادە بە...
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick">↔</div>
  </div>

  <div id="actionArea">

    <button class="action" id="jumpBtn">
      JUMP
    </button>

    <button class="action" id="dashBtn">
      DASH
    </button>

    <button class="action" id="resetBtn">
      RESET
    </button>

    <button class="action" id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە 😎
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const intro=document.getElementById("intro");
const startBtn=document.getElementById("start");

const levelEl=document.getElementById("level");
const tierEl=document.getElementById("tier");
const levelIdea=document.getElementById("levelIdea");
const heartsEl=document.getElementById("hearts");

const damageEl=document.getElementById("damage");
const dangerEl=document.getElementById("danger");

const win=document.getElementById("win");
const winText=document.getElementById("winText");
const finishBanner=document.getElementById("finishBanner");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(
    devicePixelRatio||1,
    2
  );

  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

addEventListener(
  "resize",
  resize,
  {passive:true}
);

resize();

/* =========================================================
   SAVE SYSTEM
========================================================= */

const SAVE_KEY="aro_b_slemany_5000_v30";
const TOTAL_LEVELS=5000;

function readSavedLevel(){

  try{

    const value=
      parseInt(
        localStorage.getItem(SAVE_KEY)||"1",
        10
      );

    if(
      Number.isFinite(value)&&
      value>=1&&
      value<=TOTAL_LEVELS
    ){

      return value;
    }

  }catch(e){}

  return 1;
}

let level=readSavedLevel();

function saveLevel(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      String(
        Math.max(
          1,
          Math.min(
            TOTAL_LEVELS,
            level
          )
        )
      )
    );

  }catch(e){}
}

/* =========================================================
   GAME STATE
========================================================= */

let playing=false;
let paused=false;

let cameraX=0;
let lastTime=0;

let levelData=null;
let levelWon=false;

let particles=[];

let screenShake=0;
let stormFlash=0;

const MAX_HEARTS=3;

let hearts=MAX_HEARTS;

let damageCooldown=0;

let lastSafeX=70;
let lastSafeY=0;

/* =========================================================
   PLAYER
========================================================= */

const player={

  x:70,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:250,
  jumpPower:660,

  grounded:false,
  coyote:0,

  dashCooldown:0,
  dashTime:0,

  slowTimer:0,
  reverseTimer:0,

  invincible:0
};

/* =========================================================
   INPUT
========================================================= */

const input={
  x:0
};

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joystickPointer=null;

function setJoystick(e){

  const r=
    joystick.getBoundingClientRect();

  const centerX=
    r.left+r.width/2;

  let dx=
    e.clientX-centerX;

  dx=
    Math.max(
      -42,
      Math.min(
        42,
        dx
      )
    );

  input.x=
    dx/42;

  stick.style.transform=
    "translateX("+dx+"px)";
}

function resetJoystick(){

  joystickPointer=null;

  input.x=0;

  stick.style.transform=
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickPointer=
      e.pointerId;

    try{
      joystick.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    setJoystick(e);
  },
  {passive:false}
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      e.preventDefault();

      setJoystick(e);
    }
  },
  {passive:false}
);

joystick.addEventListener(
  "pointerup",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      resetJoystick();
    }
  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

/* =========================================================
   ACTION BUTTONS
========================================================= */

const jumpBtn=
  document.getElementById("jumpBtn");

const dashBtn=
  document.getElementById("dashBtn");

const resetBtn=
  document.getElementById("resetBtn");

const nextQuickBtn=
  document.getElementById("nextQuickBtn");

function jump(){

  if(
    !playing||
    paused
  ){
    return;
  }

  if(
    player.grounded||
    player.coyote>0
  ){

    player.vy=
      -player.jumpPower;

    player.grounded=false;

    player.coyote=0;

    particleBurst(
      player.x+player.w/2,
      player.y+player.h,
      "jump"
    );
  }
}

function dash(){

  if(
    !playing||
    paused||
    !levelData||
    player.dashCooldown>0
  ){
    return;
  }

  let dir=
    Math.abs(input.x)>.1
    ?input.x
    :1;

  player.vx=
    dir*760;

  player.dashTime=.16;

  player.dashCooldown=
    Math.max(
      .30,
      .82-levelData.tier.d*.15
    );

  player.invincible=.28;

  screenShake=5;
}

jumpBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    jump();
  },
  {passive:false}
);

dashBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    dash();
  },
  {passive:false}
);

resetBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetLevel();
  },
  {passive:false}
);

nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(levelWon){
      nextLevel();
    }
  },
  {passive:false}
);

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
  "keydown",
  e=>{

    const k=
      e.key.toLowerCase();

    if(
      e.key==="ArrowLeft"||
      k==="a"
    ){

      input.x=-1;
    }

    if(
      e.key==="ArrowRight"||
      k==="d"
    ){

      input.x=1;
    }

    if(
      e.key===" "||
      e.key==="ArrowUp"
    ){

      e.preventDefault();

      jump();
    }

    if(k==="shift"){
      dash();
    }

    if(k==="r"){
      resetLevel();
    }
  }
);

addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft"||
      e.key==="ArrowRight"||
      e.key.toLowerCase()==="a"||
      e.key.toLowerCase()==="d"
    ){

      input.x=0;
    }
  }
);

/* =========================================================
   IOS TOUCH PROTECTION
========================================================= */

for(
  const event of [
    "gesturestart",
    "gesturechange",
    "gestureend"
  ]
){

  document.addEventListener(
    event,
    e=>e.preventDefault(),
    {passive:false}
  );
}

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

/* =========================================================
   DETERMINISTIC RANDOM
========================================================= */

function random(n){

  const x=
    Math.sin(
      n*12.9898
    )*43758.5453123;

  return x-
    Math.floor(x);
}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

function lerp(
  a,
  b,
  t
){

  return a+
    (b-a)*t;
}

/* =========================================================
   DIFFICULTY
========================================================= */

function difficulty(n){

  /*
    Levels 1-15 remain very easy.
  */

  if(n<=15){

    const p=
      (n-1)/14;

    return{

      d:0,

      p,

      stage:1,

      name:
        "فێرکاری "+n,

      gap:
        105-p*18,

      width:
        185-p*15,

      rise:
        5+p*15,

      spikes:
        n>=8?p*.10:0,

      balls:
        n>=10?p*.08:0,

      moving:
        n>=12?p*.05:0,

      saws:0,
      lasers:0,
      bombs:0,
      wind:0,
      ice:0,

      springs:
        n>=5?p*.08:0,

      speed:245,

      jump:665
    };
  }

  /*
    IMPORTANT:

    From 16 to 5000 difficulty grows
    slowly and continuously.

    The exponent makes early levels
    noticeably easier while later levels
    become harder.
  */

  const progress=
    (n-16)/
    (TOTAL_LEVELS-16);

  const p=
    clamp(
      progress,
      0,
      1
    );

  const d=
    clamp(
      .018+
      Math.pow(p,2.35)*.70,
      .018,
      .72
    );

  return{

    d,

    p,

    stage:
      1+
      Math.floor(d*14),

    name:
      "ئاستی "+(
        1+
        Math.floor(d*14)
      ),

    /*
      Gaps never become impossible.
    */

    gap:
      lerp(
        76,
        48,
        d
      ),

    width:
      lerp(
        175,
        112,
        d
      ),

    rise:
      lerp(
        7,
        30,
        d
      ),

    spikes:
      lerp(
        .05,
        .28,
        d
      ),

    balls:
      lerp(
        .03,
        .22,
        d
      ),

    moving:
      lerp(
        .02,
        .18,
        d
      ),

    saws:
      lerp(
        .01,
        .16,
        d
      ),

    lasers:
      lerp(
        .01,
        .13,
        d
      ),

    bombs:
      lerp(
        .01,
        .12,
        d
      ),

    wind:
      lerp(
        .01,
        .14,
        d
      ),

    ice:
      lerp(
        .02,
        .13,
        d
      ),

    springs:
      lerp(
        .04,
        .18,
        d
      ),

    fallingSpears:
      lerp(
        .01,
        .15,
        d
      ),

    rollingBalls:
      lerp(
        .01,
        .13,
        d
      ),

    speed:
      lerp(
        250,
        275,
        d
      ),

    jump:
      lerp(
        660,
        625,
        d
      )
  };
}

/* =========================================================
   IDEAS
========================================================= */

/* =========================================================
   COLLISION
========================================================= */

function rectHit(a,b){

  /*
    Forgiving player hitbox.

    This is intentionally smaller than
    the visible character.
  */

  const ax=
    a.x+6;

  const ay=
    a.y+5;

  const aw=
    Math.max(
      1,
      a.w-12
    );

  const ah=
    Math.max(
      1,
      a.h-9
    );

  return(
    ax<
      b.x+b.w&&
    ax+aw>
      b.x&&
    ay<
      b.y+b.h&&
    ay+ah>
      b.y
  );
}

function circleHit(
  cx,
  cy,
  r,
  box
){

  const rr=
    Math.max(
      3,
      r-5
    );

  const px=
    clamp(
      cx,
      box.x,
      box.x+box.w
    );

  const py=
    clamp(
      cy,
      box.y,
      box.y+box.h
    );

  return(
    Math.hypot(
      cx-px,
      cy-py
    )<rr
  );
}

/* =========================================================
   LEVEL GENERATOR
========================================================= */

function makeLevel(n){

  const D=
    difficulty(n);

  const groundY=
    H-
    Math.max(
      125,
      Math.min(
        165,
        H*.18
      )
    );

  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const movingPlatforms=[];
  const saws=[];
  const lasers=[];
  const bombs=[];
  const windZones=[];
  const springs=[];
  const finishGates=[];

  /*
    NEW OBSTACLE TYPES
  */

  const fallingSpears=[];
  const rollingBalls=[];
  const shockwaves=[];
  const bounceOrbs=[];
  const movingSpikes=[];

  /*
    START PLATFORM
  */

  platforms.push({

    x:-300,

    y:groundY,

    w:520,

    h:80,

    safe:true
  });

  let x=190;

  /*
    Number of sections grows slowly.

    This prevents Level 16 from suddenly
    becoming a giant maze.
  */

  const count=
    n<=15
    ?4+Math.floor(n/5)
    :7+
      Math.floor(D.d*8);

  /*
    Each level gets a unique pattern.
  */

  const pattern=
    n>=16
    ?(n-16)%12
    :0;

  for(
    let i=0;
    i<count;
    i++
  ){

    const seed=
      n*100000+
      i*991+
      777;

    /*
      SAFE GAP
    */

    const gap=
      D.gap+
      random(seed+1)*17;

    x+=gap;

    /*
      SAFE PLATFORM WIDTH
    */

    const width=
      Math.max(
        100,
        D.width+
        random(seed+2)*30
      );

    /*
      Height difference remains jumpable.
    */

    const py=
      groundY-
      random(seed+3)*
      D.rise;

    const p={
      x,
      y:py,
      w:width,
      h:18,
      safe:true
    };

    platforms.push(p);

    /*
      STAR
    */

    if(
      i%2===0||
      random(seed+4)>.78
    ){

      stars.push({

        x:
          x+
          width*.5,

        y:
          py-38,

        r:9,

        taken:false
      });
    }

    /* =====================================================
       MOVING PLATFORM
    ===================================================== */

    if(
      n>=16&&
      random(seed+10)<
      D.moving
    ){

      movingPlatforms.push({

        x:
          x+
          width*.5,

        y:py,

        baseX:
          x+
          width*.5,

        baseY:py,

        w:
          Math.max(
            74,
            width*.70
          ),

        h:18,

        range:
          18+
          D.d*30,

        speed:
          .42+
          D.d*.55,

        phase:
          random(seed+11)*
          Math.PI*2,

        axis:
          random(seed+12)>.5
          ?"x"
          :"y"
      });
    }

    /* =====================================================
       NORMAL SPIKES
    ===================================================== */

    if(
      n>=8&&
      random(seed+20)<
      D.spikes
    ){

      const side=
        random(seed+21)>.5
        ?0
        :Math.max(
          0,
          width-34
        );

      hazards.push({

        x:
          x+side,

        y:
          py-22,

        w:22,

        h:22
      });
    }

    /* =====================================================
       BALL
    ===================================================== */

    if(
      n>=10&&
      random(seed+30)<
      D.balls
    ){

      balls.push({

        x:
          x+
          width*.5,

        y:
          py-
          75-
          random(seed+31)*25,

        r:
          12+
          D.d*3,

        speed:
          100+
          D.d*80,

        minX:
          x+25,

        maxX:
          x+width-25,

        dir:
          random(seed+32)>.5
          ?1
          :-1,

        targetTimer:
          1.2+
          random(seed+33)
      });
    }

    /* =====================================================
       SAW
    ===================================================== */

    if(
      n>=25&&
      random(seed+40)<
      D.saws
    ){

      saws.push({

        x:
          x+
          width*.5,

        baseY:
          py-55,

        y:
          py-55,

        r:
          15+
          D.d*4,

        amp:
          7+
          D.d*13,

        speed:
          .65+
          D.d*.65,

        phase:
          random(seed+41)*
          Math.PI*2
      });
    }

    /* =====================================================
       LASER
    ===================================================== */

    if(
      n>=50&&
      random(seed+50)<
      D.lasers
    ){

      lasers.push({

        x:
          x+
          width*.28,

        y:
          py-36,

        w:
          width*.44,

        h:7,

        period:
          2.6-
          D.d*.5,

        phase:
          random(seed+51)*2.6,

        warning:.85
      });
    }

    /* =====================================================
       BOMB
    ===================================================== */

    if(
      n>=100&&
      random(seed+60)<
      D.bombs
    ){

      bombs.push({

        x:
          x+
          width*.5,

        y:
          py-70,

        r:13,

        timer:
          2+
          random(seed+61)*1.5
      });
    }

    /* =====================================================
       WIND
    ===================================================== */

    if(
      n>=150&&
      random(seed+70)<
      D.wind
    ){

      windZones.push({

        x:
          x+15,

        y:
          py-100,

        w:
          Math.max(
            55,
            width-30
          ),

        h:100,

        force:
          (
            random(seed+71)>.5
            ?1
            :-1
          )*
          (
            30+
            D.d*65
          )
      });
    }

    /* =====================================================
       SPRING
    ===================================================== */

    if(
      n>=5&&
      random(seed+80)<
      D.springs
    ){

      springs.push({

        x:
          x+
          width*.5-
          11,

        y:
          py-12,

        w:22,

        h:12,

        power:
          690+
          D.d*120
      });
    }

    /* =====================================================
       FALLING SPEAR
       This is one of the main new obstacles.
    ===================================================== */

    if(
      n>=16&&
      (
        pattern===0||
        pattern===4||
        pattern===8||
        random(seed+90)<
        D.fallingSpears
      )
    ){

      /*
        Spear starts above the platform,
        falls vertically.

        It is NOT placed at the only landing
        point. It is slightly to one side.
      */

      const side=
        random(seed+91)>.5
        ?width*.30
        :width*.70;

      fallingSpears.push({

        x:
          x+
          side,

        startY:
          py-230-
          random(seed+92)*70,

        y:
          py-230,

        length:
          30+
          D.d*8,

        speed:
          210+
          D.d*120,

        resetY:
          py-230,

        phase:
          random(seed+93)*2.5,

        timer:
          random(seed+94)*2.2,

        delay:
          1.2+
          D.d*.8,

        active:false
      });
    }

    /* =====================================================
       ROLLING BALL
    ===================================================== */

    if(
      n>=16&&
      (
        pattern===1||
        pattern===5||
        pattern===9||
        random(seed+100)<
        D.rollingBalls
      )
    ){

      rollingBalls.push({

        x:
          x+12,

        y:
          py-18,

        r:
          13+
          D.d*4,

        speed:
          85+
          D.d*115,

        minX:
          x+8,

        maxX:
          x+
          width-8,

        dir:
          random(seed+101)>.5
          ?1
          :-1,

        wait:
          random(seed+102)*1.4
      });
    }

    /* =====================================================
       SHOCKWAVE
    ===================================================== */

    if(
      n>=40&&
      (
        pattern===2||
        pattern===6||
        pattern===10
      )
    ){

      shockwaves.push({

        x:
          x+
          width*.5,

        y:
          py-8,

        radius:0,

        maxRadius:
          38+
          D.d*25,

        speed:
          70+
          D.d*60,

        cooldown:
          random(seed+110)*2,

        active:false
      });
    }

    /* =====================================================
       BOUNCE ORB
    ===================================================== */

    if(
      n>=70&&
      (
        pattern===3||
        pattern===7||
        pattern===11
      )
    ){

      bounceOrbs.push({

        x:
          x+
          width*.5,

        baseY:
          py-75,

        y:
          py-75,

        r:
          12+
          D.d*4,

        amp:
          25+
          D.d*30,

        speed:
          1.2+
          D.d*.8,

        phase:
          random(seed+120)*6.28
      });
    }

    /* =====================================================
       MOVING SPIKE
    ===================================================== */

    if(
      n>=250&&
      random(seed+130)<
      D.d*.18
    ){

      movingSpikes.push({

        baseX:
          x+
          width*.5,

        x:
          x+
          width*.5,

        y:
          py-22,

        range:
          Math.min(
            28+
            D.d*35,
            width*.28
          ),

        speed:
          .8+
          D.d*.7,

        phase:
          random(seed+131)*6.28,

        w:24,

        h:24
      });
    }

    /*
      Move to next section.
    */

    x+=width;
  }

  /* =======================================================
     GUARANTEED SIGNATURE OBSTACLE
  ======================================================= */

  if(n>=16){

    const finalPlatform=
      platforms[
        Math.max(
          1,
          platforms.length-2
        )
      ];

    const signatureX=
      finalPlatform.x+
      finalPlatform.w*.5;

    /*
      Exactly one guaranteed special obstacle
      for every level from 16 to 5000.

      Pattern rotates every 12 levels.
    */

    switch(pattern){

      case 0:

        fallingSpears.push({

          x:signatureX,

          startY:
            finalPlatform.y-220,

          y:
            finalPlatform.y-220,

          length:32,

          speed:
            210+
            D.d*100,

          resetY:
            finalPlatform.y-220,

          phase:.4,

          timer:.35,

          delay:
            1.5+
            D.d*.5,

          active:false
        });

        break;

      case 1:

        rollingBalls.push({

          x:
            finalPlatform.x+10,

          y:
            finalPlatform.y-18,

          r:
            13+
            D.d*3,

          speed:
            90+
            D.d*100,

          minX:
            finalPlatform.x+8,

          maxX:
            finalPlatform.x+
            finalPlatform.w-8,

          dir:1,

          wait:.3
        });

        break;

      case 2:

        shockwaves.push({

          x:signatureX,

          y:
            finalPlatform.y-8,

          radius:0,

          maxRadius:
            40+
            D.d*25,

          speed:
            70+
            D.d*60,

          cooldown:.5,

          active:false
        });

        break;

      case 3:

        bounceOrbs.push({

          x:signatureX,

          baseY:
            finalPlatform.y-70,

          y:
            finalPlatform.y-70,

          r:
            12+
            D.d*3,

          amp:
            28+
            D.d*28,

          speed:
            1.2+
            D.d*.7,

          phase:.8
        });

        break;

      case 4:

        saws.push({

          x:signatureX,

          baseY:
            finalPlatform.y-60,

          y:
            finalPlatform.y-60,

          r:
            15+
            D.d*3,

          amp:
            8+
            D.d*10,

          speed:
            .7+
            D.d*.5,

          phase:.7
        });

        break;

      case 5:

        lasers.push({

          x:
            finalPlatform.x+
            finalPlatform.w*.30,

          y:
            finalPlatform.y-38,

          w:
            finalPlatform.w*.40,

          h:7,

          period:
            2.7-
            D.d*.4,

          phase:.3,

          warning:.9
        });

        break;

      case 6:

        bombs.push({

          x:signatureX,

          y:
            finalPlatform.y-72,

          r:13,

          timer:
            1.8+
            D.d*.5
        });

        break;

      case 7:

        windZones.push({

          x:
            finalPlatform.x+15,

          y:
            finalPlatform.y-100,

          w:
            finalPlatform.w-30,

          h:100,

          force:
            35+
            D.d*55
        });

        break;

      case 8:

        hazards.push({

          x:
            finalPlatform.x+
            finalPlatform.w*.5-
            11,

          y:
            finalPlatform.y-22,

          w:22,

          h:22
        });

        break;

      case 9:

        movingPlatforms.push({

          x:signatureX,

          y:
            finalPlatform.y-10,

          baseX:signatureX,

          baseY:
            finalPlatform.y-10,

          w:
            Math.max(
              75,
              finalPlatform.w*.5
            ),

          h:18,

          range:
            20+
            D.d*20,

          speed:
            .45+
            D.d*.4,

          phase:1,

          axis:"x"
        });

        break;

      case 10:

        movingSpikes.push({

          baseX:signatureX,

          x:signatureX,

          y:
            finalPlatform.y-22,

          range:
            Math.min(
              30+
              D.d*25,
              finalPlatform.w*.25
            ),

          speed:
            .8+
            D.d*.5,

          phase:1,

          w:24,

          h:24
        });

        break;

      case 11:

        /*
          Combined but still fair:
          one ball + one spring.
        */

        rollingBalls.push({

          x:
            finalPlatform.x+10,

          y:
            finalPlatform.y-18,

          r:
            13+
            D.d*3,

          speed:
            80+
            D.d*100,

          minX:
            finalPlatform.x+8,

          maxX:
            finalPlatform.x+
            finalPlatform.w-8,

          dir:1,

          wait:.2
        });

        springs.push({

          x:
            finalPlatform.x+
            finalPlatform.w*.72,

          y:
            finalPlatform.y-12,

          w:22,

          h:12,

          power:
            700+
            D.d*100
        });

        break;
    }
  }

  /* =======================================================
     FINAL SAFE PLATFORM
  ======================================================= */

  const finalStart=
    x+48;

  platforms.push({

    x:finalStart,

    y:groundY,

    w:700,

    h:80,

    safe:true
  });

  const finishX=
    finalStart+480;

  /*
    No dangerous obstacle is allowed near
    the actual finish point.
  */

  /*
    Finish gate is optional and only used
    in moderate difficulty.
  */

  if(
    n>=16&&
    D.d<.60
  ){

    const chance=
      .035+
      D.d*.05;

    if(
      random(
        n*555+44
      )<chance
    ){

      finishGates.push({

        x:
          finalStart+210,

        y:
          groundY-100,

        w:10,

        h:100,

        period:2.8,

        phase:
          random(
            n*556+55
          )*2.8
      });
    }
  }

  /* =======================================================
     IDEA
  ======================================================= */

  let ideaIndex;

  if(n<=15){

    ideaIndex=n-1;

  }else{

    ideaIndex=
      15+
      Math.floor(
        D.d*
        (
          ideas.length-16
        )
      );

    ideaIndex=
      clamp(
        ideaIndex,
        15,
        ideas.length-1
      );
  }

  return{

    groundY,

    platforms,

    hazards,

    stars,

    balls,

    movingPlatforms,

    saws,

    lasers,

    bombs,

    windZones,

    springs,

    finishGates,

    fallingSpears,

    rollingBalls,

    shockwaves,

    bounceOrbs,

    movingSpikes,

    finishX,

    idea:
      ideas[ideaIndex],

    tier:D
  };
}

/* =========================================================
   HEARTS
========================================================= */

function updateHearts(){

  heartsEl.textContent=
    "♥".repeat(
      Math.max(
        0,
        hearts
      )
    )+
    "♡".repeat(
      Math.max(
        0,
        MAX_HEARTS-hearts
      )
    );
}

function showDamage(){

  damageEl.textContent=
    hearts>0
    ?`💥 ئاگاداربە! ${hearts} ❤️ ماوە`
    :"💀 دووبارە دەستپێدەکات";

  damageEl.classList.remove("show");

  void damageEl.offsetWidth;

  damageEl.classList.add("show");

  setTimeout(
    ()=>{
      damageEl.classList.remove("show");
    },
    650
  );
}

/* =========================================================
   SAFE POSITION
========================================================= */

function updateSafePosition(){

  if(
    !levelData||
    !player.grounded
  ){
    return;
  }

  let safe=true;

  /*
    Don't save a position too close to hazards.
  */

  for(
    const h of levelData.hazards
  ){

    const safeZone={

      x:
        h.x-48,

      y:
        h.y-38,

      w:
        h.w+96,

      h:
        h.h+70
    };

    if(
      rectHit(
        player,
        safeZone
      )
    ){

      safe=false;

      break;
    }
  }

  if(safe){

    lastSafeX=
      player.x;

    lastSafeY=
      player.y;
  }
}

/* =========================================================
   DAMAGE
========================================================= */

function takeDamage(){

  if(
    player.invincible>0||
    damageCooldown>0||
    levelWon
  ){
    return;
  }

  hearts--;

  updateHearts();

  showDamage();

  damageCooldown=.35;

  player.invincible=1.25;

  screenShake=8;

  particleBurst(
    player.x+
    player.w/2,

    player.y+
    player.h/2,

    "danger"
  );

  /*
    Return to last known safe position.
  */

  player.x=
    lastSafeX;

  player.y=
    lastSafeY;

  player.vx=0;
  player.vy=0;

  player.dashTime=0;

  player.dashCooldown=.15;

  if(hearts<=0){

    hearts=MAX_HEARTS;

    updateHearts();

    /*
      Same level.

      IMPORTANT:
      No level increment here.
      No random level here.
      No refresh here.
    */

    levelData=
      makeLevel(level);

    player.x=70;

    player.y=
      levelData.groundY-
      player.h;

    player.vx=0;
    player.vy=0;

    player.grounded=true;

    lastSafeX=
      player.x;

    lastSafeY=
      player.y;

    player.invincible=1.5;
  }
}

/* =========================================================
   RESET LEVEL
========================================================= */

function resetLevel(){

  levelWon=false;

  paused=false;

  levelData=
    makeLevel(level);

  player.x=70;

  player.y=
    levelData.groundY-
    player.h;

  player.vx=0;

  player.vy=0;

  player.grounded=true;

  player.coyote=0;

  player.dashCooldown=0;

  player.dashTime=0;

  player.slowTimer=0;

  player.reverseTimer=0;

  player.invincible=0;

  damageCooldown=0;

  hearts=MAX_HEARTS;

  updateHearts();

  lastSafeX=
    player.x;

  lastSafeY=
    player.y;

  cameraX=0;

  stormFlash=0;

  screenShake=0;

  levelEl.textContent=
    level;

  player.speed=
    levelData.tier.speed;

  player.jumpPower=
    levelData.tier.jump;

  if(level>=16){

    document.body.classList.add(
      "hardMode"
    );

    dangerEl.classList.toggle(
      "show",
      levelData.tier.d>.58
    );

    levelIdea.textContent="";

  }else{

    document.body.classList.remove(
      "hardMode"
    );

    dangerEl.classList.remove(
      "show"
    );

    tierEl.textContent=
      "• "+
      levelData.tier.name;

    levelIdea.textContent=
      `LEVEL ${level}: ${levelData.idea}`;
  }

  win.style.display="none";

  saveLevel();
}

========================================================= */

startBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    intro.style.display="none";

    playing=true;

    resetLevel();

    lastTime=
      performance.now();

/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon){
    return;
  }

  levelWon=true;

  paused=true;

  saveLevel();

  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );

  winText.textContent=
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display="flex";
}

/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

  if(
    level<
    TOTAL_LEVELS
  ){

    level++;

    /*
      Save the new level immediately.

      Refresh now will remain on this level,
      not jump multiple levels.
    */

    saveLevel();

    resetLevel();
  }
}

document.getElementById(
  "retryBtn"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetLevel();
  },
  {passive:false}
);

document.getElementById(
  "nextBtn"
).addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    nextLevel();
  },
  {passive:false}
);

/* =========================================================
   PARTICLES
========================================================= */

function particleBurst(
  x,
  y,
  type="normal"
){

  const count=
    type==="danger"
    ?18
    :type==="jump"
    ?5
    :8;

  for(
    let i=0;
    i<count;
    i++
  ){

    const a=
      Math.random()*
      Math.PI*2;

    const s=
      40+
      Math.random()*160;

    particles.push({

      x,

      y,

      vx:
        Math.cos(a)*s,

      vy:
        Math.sin(a)*s,

      life:
        .35+
        Math.random()*.45,

      size:
        2+
        Math.random()*4
    });
  }
}

function updateParticles(dt){

  for(
    let i=
      particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      250*dt;

    p.life-=dt;

    if(p.life<=0){

      particles.splice(
        i,
        1
      );
    }
  }
}

/* =========================================================
   UPDATE MOVING HAZARDS
========================================================= */

function updateSpecialHazards(dt,now){

  /* -------------------------------------------------------
     FALLING SPEARS
  ------------------------------------------------------- */

  for(
    const s of levelData.fallingSpears
  ){

    s.timer-=dt;

    if(
      !s.active&&
      s.timer<=0
    ){

      s.active=true;

      s.y=
        s.startY;
    }

    if(s.active){

      s.y+=
        s.speed*dt;

      /*
        Once the spear reaches the platform,
        reset it safely after a short delay.
      */

      if(
        s.y>
        levelData.groundY+60
      ){

        s.active=false;

        s.y=
          s.resetY;

        s.timer=
          s.delay;
      }

      const spearBox={

        x:
          s.x-6,

        y:
          s.y,

        w:12,

        h:
          s.length
      };

      if(
        rectHit(
          player,
          spearBox
        )
      ){

        takeDamage();

        return true;
      }
    }
  }

  /* -------------------------------------------------------
     ROLLING BALLS
  ------------------------------------------------------- */

  for(
    const b of levelData.rollingBalls
  ){

    b.wait-=dt;

    if(b.wait>0){
      continue;
    }

    b.x+=
      b.dir*
      b.speed*
      dt;

    if(
      b.x<=b.minX
    ){

      b.x=
        b.minX;

      b.dir=1;
    }

    if(
      b.x>=b.maxX
    ){

      b.x=
        b.maxX;

      b.dir=-1;
    }

    if(
      circleHit(
        b.x,
        b.y,
        b.r,
        player
      )
    ){

      takeDamage();

      return true;
    }
  }

  /* -------------------------------------------------------
     SHOCKWAVES
  ------------------------------------------------------- */

  for(
    const s of levelData.shockwaves
  ){

    s.cooldown-=dt;

    if(
      s.cooldown<=0
    ){

      s.active=true;

      s.radius+=
        s.speed*dt;

      if(
        s.radius>
        s.maxRadius
      ){

        s.radius=0;

        s.cooldown=
          1.4+
          levelData.tier.d;
      }
    }

    if(
      s.active&&
      s.radius>4
    ){

      const dx=
        player.x+
        player.w/2-
        s.x;

      const dy=
        player.y+
        player.h/2-
        s.y;

      const distance=
        Math.hypot(
          dx,
          dy
        );

      if(
        Math.abs(
          distance-
          s.radius
        )<13
      ){

        takeDamage();

        return true;
      }
    }
  }

  /* -------------------------------------------------------
     BOUNCE ORBS
  ------------------------------------------------------- */

  for(
    const b of levelData.bounceOrbs
  ){

    b.y=
      b.baseY+
      Math.sin(
        now*b.speed+
        b.phase
      )*
      b.amp;

    if(
      circleHit(
        b.x,
        b.y,
        b.r,
        player
      )
    ){

      takeDamage();

      return true;
    }
  }

  /* -------------------------------------------------------
     MOVING SPIKES
  ------------------------------------------------------- */

  for(
    const s of levelData.movingSpikes
  ){

    s.x=
      s.baseX+
      Math.sin(
        now*s.speed+
        s.phase
      )*
      s.range;

    const box={

      x:
        s.x-
        s.w/2,

      y:
        s.y,

      w:
        s.w,

      h:
        s.h
    };

    if(
      rectHit(
        player,
        box
      )
    ){

      takeDamage();

      return true;
    }
  }

  return false;
}

/* =========================================================
   MAIN UPDATE
========================================================= */

function update(dt){

  if(
    paused||
    !levelData
  ){
    return;
  }

  updateParticles(dt);

  damageCooldown=
    Math.max(
      0,
      damageCooldown-dt
    );

  player.dashCooldown=
    Math.max(
      0,
      player.dashCooldown-dt
    );

  player.dashTime=
    Math.max(
      0,
      player.dashTime-dt
    );

  player.slowTimer=
    Math.max(
      0,
      player.slowTimer-dt
    );

  player.reverseTimer=
    Math.max(
      0,
      player.reverseTimer-dt
    );

  player.invincible=
    Math.max(
      0,
      player.invincible-dt
    );

  const oldBottom=
    player.y+
    player.h;

  const now=
    performance.now()/1000;

  let control=
    input.x;

  if(
    player.reverseTimer>0
  ){

    control=
      -control;
  }

  const speedMultiplier=
    player.slowTimer>0
    ?.72
    :1;

  const targetVX=
    control*
    player.speed*
    speedMultiplier;

  player.vx+=
    (
      targetVX-
      player.vx
    )*
    Math.min(
      1,
      dt*11
    );

  /* =======================================================
     WIND
  ======================================================= */

  let windForce=0;

  for(
    const w of levelData.windZones
  ){

    if(
      player.x+
        player.w>
        w.x&&

      player.x<
        w.x+w.w&&

      player.y+
        player.h>
        w.y&&

      player.y<
        w.y+w.h
    ){

      windForce+=
        w.force;
    }
  }

  player.vx+=
    windForce*dt;

  if(
    player.dashTime>0
  ){

    player.vx*=1.012;
  }

  /* =======================================================
     PHYSICS
  ======================================================= */

  player.vy+=
    1550*dt;

  player.x+=
    player.vx*dt;

  player.y+=
    player.vy*dt;

  player.grounded=false;

  /* =======================================================
     MOVING PLATFORMS
  ======================================================= */

  for(
    const p of levelData.movingPlatforms
  ){

    if(
      p.axis==="x"
    ){

      p.x=
        p.baseX+
        Math.sin(
          now*p.speed+
          p.phase
        )*
        p.range;

    }else{

      p.y=
        p.baseY+
        Math.sin(
          now*p.speed+
          p.phase
        )*
        p.range;
    }

    if(
      player.x+
        player.w>
        p.x-p.w/2&&

      player.x<
        p.x+p.w/2&&

      player.vy>=0&&

      oldBottom<=
        p.y+14&&

      player.y+
        player.h>=
        p.y
    ){

      player.y=
        p.y-
        player.h;

      player.vy=0;

      player.grounded=true;
    }
  }

  /* =======================================================
     NORMAL PLATFORMS
  ======================================================= */

  for(
    const p of levelData.platforms
  ){

    if(
      player.x+
        player.w>
        p.x&&

      player.x<
        p.x+p.w&&

      player.vy>=0&&

      oldBottom<=
        p.y+14&&

      player.y+
        player.h>=
        p.y
    ){

      player.y=
        p.y-
        player.h;

      player.vy=0;

      player.grounded=true;
    }
  }

  /* =======================================================
     COYOTE TIME
  ======================================================= */

  if(
    player.grounded
  ){

    player.coyote=.12;

  }else{

    player.coyote=
      Math.max(
        0,
        player.coyote-dt
      );
  }

  updateSafePosition();

  /* =======================================================
     SPRINGS
  ======================================================= */

  for(
    const s of levelData.springs
  ){

    if(
      rectHit(
        player,
        s
      )&&
      player.vy>=0
    ){

      player.vy=
        -s.power;

      player.grounded=false;

      particleBurst(
        s.x,
        s.y,
        "jump"
      );
    }
  }

  /* =======================================================
     STARS
  ======================================================= */

  for(
    const s of levelData.stars
  ){

    if(s.taken){
      continue;
    }

    const dx=
      player.x+
      player.w/2-
      s.x;

    const dy=
      player.y+
      player.h/2-
      s.y;

    if(
      Math.hypot(
        dx,
        dy
      )<30
    ){

      s.taken=true;

      particleBurst(
        s.x,
        s.y
      );
    }
  }

  /* =======================================================
     ICE
  ======================================================= */

  if(
    levelData.tier.d>.08&&
    player.y>
      levelData.groundY-40
  ){

    player.slowTimer=
      Math.max(
        player.slowTimer,
        .08*
        levelData.tier.d*
        4
      );
  }

  /* =======================================================
     NORMAL BALLS
  ======================================================= */

  for(
    const b of levelData.balls
  ){

    b.targetTimer-=dt;

    if(
      b.targetTimer<=0
    ){

      b.dir=
        player.x>b.x
        ?1
        :-1;

      b.targetTimer=
        .8+
        levelData.tier.d*.5;
    }

    b.x+=
      b.dir*
      b.speed*
      dt;

    if(
      b.x<=b.minX
    ){

      b.x=
        b.minX;

      b.dir=1;
    }

    if(
      b.x>=b.maxX
    ){

      b.x=
        b.maxX;

      b.dir=-1;
    }

    if(
      circleHit(
        b.x,
        b.y,
        b.r,
        player
      )
    ){

      takeDamage();

      return;
    }
  }

  /* =======================================================
     SPECIAL OBSTACLES
  ======================================================= */

  if(
    updateSpecialHazards(
      dt,
      now
    )
  ){

    return;
  }

  /* =======================================================
     SAWS
  ======================================================= */

  for(
    const s of levelData.saws
  ){

    s.y=
      s.baseY+
      Math.sin(
        now*s.speed+
        s.phase
      )*
      s.amp;

    if(
      circleHit(
        s.x,
        s.y,
        s.r,
        player
      )
    ){

      takeDamage();

      return;
    }
  }

  /* =======================================================
     LASERS
  ======================================================= */

  for(
    const l of levelData.lasers
  ){

    const phase=
      (
        now+
        l.phase
      )%
      l.period;

    const active=
      phase>
      l.warning;

    if(
      active&&
      rectHit(
        player,
        {
          x:l.x,
          y:l.y,
          w:l.w,
          h:l.h
        }
      )
    ){

      takeDamage();

      return;
    }
  }

  /* =======================================================
     BOMBS
  ======================================================= */

  for(
    const b of levelData.bombs
  ){

    b.timer-=dt;

    if(
      b.timer<=0
    ){

      const dx=
        player.x+
        player.w/2-
        b.x;

      const dy=
        player.y+
        player.h/2-
        b.y;

      const distance=
        Math.hypot(
          dx,
          dy
        );

      if(
        distance<
        48+
        levelData.tier.d*20
      ){

        takeDamage();

        return;
      }

      b.timer=
        2+
        random(
          Math.floor(
            now*10+
            b.x
          )
        )*
        1.2;
    }
  }

  /* =======================================================
     SPIKES
  ======================================================= */

  for(
    const h of levelData.hazards
  ){

    if(
      rectHit(
        player,
        h
      )
    ){

      takeDamage();

      return;
    }
  }

  /* =======================================================
     FALL
  ======================================================= */

  if(
    player.y>
    H+180
  ){

    takeDamage();

    return;
  }

  /* =======================================================
     FINISH GATES
  ======================================================= */

  let gateBlocked=false;

  for(
    const g of levelData.finishGates
  ){

    const phase=
      (
        now+
        g.phase
      )%
      g.period;

    const active=
      phase<
      g.period*.42;

    if(
      active&&
      rectHit(
        player,
        {
          x:g.x,
          y:g.y,
          w:g.w,
          h:g.h
        }
      )
    ){

      /*
        Gate never kills.

        It only gently stops the player.
      */

      player.x=
        Math.min(
          player.x,
          g.x-
          player.w-
          3
        );

      player.vx=
        Math.min(
          player.vx,
          0
        );

      gateBlocked=true;
    }
  }

  /* =======================================================
     FINISH
  ======================================================= */

  if(
    !gateBlocked&&
    player.x+
      player.w>=
      levelData.finishX
  ){

    winLevel();

    return;
  }

  /* =======================================================
     CAMERA
  ======================================================= */

  const targetCamera=
    Math.max(
      0,
      player.x-
      W*.32
    );

  cameraX+=
    (
      targetCamera-
      cameraX
    )*
    Math.min(
      1,
      dt*7
    );

  cameraX=
    Math.max(
      0,
      cameraX
    );

  dangerEl.classList.toggle(
    "show",
    level>=16&&
    levelData.tier.d>.58
  );

  stormFlash=
    Math.max(
      0,
      stormFlash-
      dt*5
    );

  screenShake=
    Math.max(
      0,
      screenShake-
      dt*18
    );
}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const d=
    levelData
    ?levelData.tier.d
    :0;

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  sky.addColorStop(
    0,
    d>.5
    ?" #090d16".trim()
    :"#0f172a"
  );

  sky.addColorStop(
    .5,
    d>.5
    ?" #131c31".trim()
    :"#1e1b4b"
  );

  sky.addColorStop(
    1,
    d>.5
    ?" #1e1b4b".trim()
    :"#311042"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  ctx.translate(
    -cameraX*.08,
    0
  );

  for(
    let i=0;
    i<25;
    i++
  ){

    const x=
      i*350+
      (i*73)%200;

    const y=
      60+
      (i*41)%180;

    const glow=
      ctx.createRadialGradient(
        x,
        y,
        0,
        x,
        y,
        70
      );

    glow.addColorStop(
      0,
      "rgba(139,92,246,.12)"
    );

    glow.addColorStop(
      1,
      "transparent"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      70,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();

  if(
    stormFlash>0
  ){

    ctx.fillStyle=
      `rgba(255,255,255,${Math.min(
        .4,
        stormFlash*.4
      )})`;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

  ctx.save();

  let sx=0;
  let sy=0;

  if(
    screenShake>0
  ){

    sx=
      (Math.random()-.5)*
      screenShake;

    sy=
      (Math.random()-.5)*
      screenShake;
  }

  ctx.translate(
    -cameraX+sx,
    sy
  );

  /* =======================================================
     PLATFORMS
  ======================================================= */

  for(
    const p of levelData.platforms
  ){

    ctx.fillStyle="#1e293b";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );

    ctx.fillStyle="#8b5cf6";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      6
    );

    ctx.fillStyle=
      "rgba(255,255,255,.08)";

    for(
      let xx=
        p.x+18;
      xx<
        p.x+p.w;
      xx+=48
    ){

      ctx.fillRect(
        xx,
        p.y+22,
        12,
        4
      );
    }
  }

  /* =======================================================
     MOVING PLATFORMS
  ======================================================= */

  for(
    const p of levelData.movingPlatforms
  ){

    ctx.fillStyle="#334155";

    ctx.fillRect(
      p.x-p.w/2,
      p.y,
      p.w,
      p.h
    );

    ctx.fillStyle="#a78bfa";

    ctx.fillRect(
      p.x-p.w/2,
      p.y,
      p.w,
      6
    );
  }

  /* =======================================================
     SPIKES
  ======================================================= */

  for(
    const h of levelData.hazards
  ){

    ctx.fillStyle="#f43f5e";

    ctx.beginPath();

    ctx.moveTo(
      h.x,
      h.y+h.h
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-8
    );

    ctx.lineTo(
      h.x+h.w,
      h.y+h.h
    );

    ctx.closePath();

    ctx.fill();
  }

  /* =======================================================
     STARS
  ======================================================= */

  for(
    const s of levelData.stars
  ){

    if(s.taken){
      continue;
    }

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/700
    );

    ctx.fillStyle="#fbbf24";

    ctx.beginPath();

    for(
      let i=0;
      i<10;
      i++
    ){

      const a=
        i*Math.PI/5;

      const r=
        i%2===0
        ?10
        :5;

      const xx=
        Math.cos(a)*r;

      const yy=
        Math.sin(a)*r;

      if(i===0){
        ctx.moveTo(
          xx,
          yy
        );
      }else{
        ctx.lineTo(
          xx,
          yy
        );
      }
    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }

  /* =======================================================
     NORMAL BALLS
  ======================================================= */

  for(
    const b of levelData.balls
  ){

    ctx.fillStyle="#fb923c";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
      "rgba(255,255,255,.25)";

    ctx.beginPath();

    ctx.arc(
      b.x-4,
      b.y-4,
      b.r*.25,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /* =======================================================
     ROLLING BALLS
  ======================================================= */

  for(
    const b of levelData.rollingBalls
  ){

    ctx.fillStyle="#ef4444";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
      "rgba(255,255,255,.3)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r*.65,
      0,
      Math.PI*1.3
    );

    ctx.stroke();
  }

  /* =======================================================
     SAWS
  ======================================================= */

  for(
    const s of levelData.saws
  ){

    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/120
    );

    ctx.fillStyle="#cbd5e1";

    ctx.beginPath();

    for(
      let i=0;
      i<14;
      i++
    ){

      const a=
        i*Math.PI/7;

      const r=
        i%2===0
        ?s.r
        :s.r*.58;

      const xx=
        Math.cos(a)*r;

      const yy=
        Math.sin(a)*r;

      if(i===0){
        ctx.moveTo(
          xx,
          yy
        );
      }else{
        ctx.lineTo(
          xx,
          yy
        );
      }
    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }

  /* =======================================================
     LASERS
  ======================================================= */

  for(
    const l of levelData.lasers
  ){

    const now=
      performance.now()/1000;

    const phase=
      (
        now+
        l.phase
      )%
      l.period;

    const active=
      phase>
      l.warning;

    ctx.fillStyle=
      active
      ?"rgba(244,63,94,.9)"
      :"rgba(251,191,36,.45)";

    ctx.fillRect(
      l.x,
      l.y,
      l.w,
      active
      ?l.h*2
      :l.h
    );
  }

  /* =======================================================
     BOMBS
  ======================================================= */

  for(
    const b of levelData.bombs
  ){

    ctx.fillStyle="#1e293b";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#f43f5e";

    ctx.beginPath();

    ctx.arc(
      b.x-3,
      b.y-3,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /* =======================================================
     WIND
  ======================================================= */

  for(
    const w of levelData.windZones
  ){

    ctx.strokeStyle=
      "rgba(139,92,246,.18)";

    ctx.lineWidth=2;

    for(
      let i=0;
      i<3;
      i++
    ){

      ctx.beginPath();

      ctx.moveTo(
        w.x,
        w.y+20+i*25
      );

      ctx.lineTo(
        w.x+w.w,
        w.y+20+i*25
      );

      ctx.stroke();
    }
  }

  /* =======================================================
     SPRINGS
  ======================================================= */

  for(
    const s of levelData.springs
  ){

    ctx.fillStyle="#fbbf24";

    ctx.fillRect(
      s.x,
      s.y,
      s.w,
      s.h
    );

    ctx.fillStyle=
      "rgba(255,255,255,.5)";

    ctx.fillRect(
      s.x+3,
      s.y+3,
      s.w-6,
      2
    );
  }

  /* =======================================================
     FALLING SPEARS
  ======================================================= */

  for(
    const s of levelData.fallingSpears
  ){

    const drawY=
      s.active
      ?s.y
      :s.startY;

    ctx.fillStyle=
      "rgba(244,63,94,.35)";

    if(!s.active){

      ctx.fillRect(
        s.x-2,
        drawY-18,
        4,
        14
      );
    }

    ctx.fillStyle="#e2e8f0";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      drawY+
      s.length
    );

    ctx.lineTo(
      s.x-8,
      drawY
    );

    ctx.lineTo(
      s.x+8,
      drawY
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#94a3b8";

    ctx.fillRect(
      s.x-3,
      drawY,
      6,
      s.length
    );
  }

  /* =======================================================
     SHOCKWAVES
  ======================================================= */

  for(
    const s of levelData.shockwaves
  ){

    if(
      s.active&&
      s.radius>2
    ){

      ctx.strokeStyle=
        "rgba(251,191,36,.75)";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        s.x,
        s.y,
        s.radius,
        0,
        Math.PI*2
      );

      ctx.stroke();
    }
  }

  /* =======================================================
     BOUNCE ORBS
  ======================================================= */

  for(
    const b of levelData.bounceOrbs
  ){

    ctx.fillStyle="#38bdf8";

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
      "rgba(255,255,255,.45)";

    ctx.beginPath();

    ctx.arc(
      b.x-4,
      b.y-4,
      b.r*.25,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /* =======================================================
     MOVING SPIKES
  ======================================================= */

  for(
    const s of levelData.movingSpikes
  ){

    ctx.fillStyle="#fb7185";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y-8
    );

    ctx.lineTo(
      s.x-s.w/2,
      s.y+s.h
    );

    ctx.lineTo(
      s.x+s.w/2,
      s.y+s.h
    );

    ctx.closePath();

    ctx.fill();
  }

  /* =======================================================
     FINISH GATES
  ======================================================= */

  for(
    const g of levelData.finishGates
  ){

    const now=
      performance.now()/1000;

    const phase=
      (
        now+
        g.phase
      )%
      g.period;

    const active=
      phase<
      g.period*.42;

    ctx.fillStyle=
      active
      ?"rgba(244,63,94,.85)"
      :"rgba(74,222,128,.4)";

    ctx.fillRect(
      g.x,
      g.y,
      g.w,
      g.h
    );
  }

  /* =======================================================
     FINISH FLAG
  ======================================================= */

  const fx=
    levelData.finishX;

  ctx.fillStyle="#1e293b";

  ctx.fillRect(
    fx,
    levelData.groundY-120,
    6,
    120
  );

  ctx.fillStyle="#f43f5e";

  ctx.beginPath();

  ctx.moveTo(
    fx+6,
    levelData.groundY-120
  );

  ctx.lineTo(
    fx+65,
    levelData.groundY-96
  );

  ctx.lineTo(
    fx+6,
    levelData.groundY-72
  );

  ctx.closePath();

  ctx.fill();

  /* =======================================================
     PLAYER
  ======================================================= */

  ctx.save();

  if(
    player.invincible>0&&
    Math.floor(
      player.invincible*12
    )%2===0
  ){

    ctx.globalAlpha=.35;
  }

  ctx.translate(
    player.x,
    player.y
  );

  ctx.fillStyle="#7c3aed";

  ctx.beginPath();

  if(
    typeof ctx.roundRect==="function"
  ){

    ctx.roundRect(
      0,
      0,
      player.w,
      player.h,
      10
    );

  }else{

    ctx.rect(
      0,
      0,
      player.w,
      player.h
    );
  }

  ctx.fill();

  /* DASH TRAIL */

  if(
    player.dashTime>0
  ){

    ctx.fillStyle=
      "rgba(124,58,237,.35)";

    ctx.fillRect(
      -22,
      6,
      18,
      30
    );
  }

  /* EYES */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    10,
    12,
    4.5,
    0,
    Math.PI*2
  );

  ctx.arc(
    23,
    12,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#090a0f";

  ctx.beginPath();

  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* SMILE */

  ctx.strokeStyle="#090a0f";

  ctx.lineWidth=2.5;

  ctx.beginPath();

  ctx.arc(
    17,
    17,
    7,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.restore();

  /* =======================================================
     PARTICLES
  ======================================================= */

  for(
    const p of particles
  ){

    ctx.globalAlpha=
      clamp(
        p.life,
        0,
        1
      );

    ctx.fillStyle="#fbbf24";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;

  /* =======================================================
     TRAINING TEXT
  ======================================================= */

  if(
    level<=15
  ){

    ctx.fillStyle=
      "rgba(255,255,255,.5)";

    ctx.font=
      "900 14px system-ui";

    ctx.fillText(
      "هەموو شتێک نەرم و ئارامە 😎",
      player.x+90,
      player.y-30
    );
  }

  ctx.restore();
}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  if(levelData){

    drawWorld();
  }
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(time){

  if(!playing){
    return;
  }

  const dt=
    Math.min(
      .033,
      Math.max(
        .001,
        (time-lastTime)/1000
      )
    );

  lastTime=time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );
}

/* =========================================================
   INITIAL LEVEL
========================================================= */

levelData=
  makeLevel(level);

levelEl.textContent=
  level;

hearts=
  MAX_HEARTS;

updateHearts();

if(
  level>=16
){

  document.body.classList.add(
    "hardMode"
  );

}else{

  tierEl.textContent=
    "• "+
    levelData.tier.name;

  levelIdea.textContent=
    `LEVEL ${level}: ${levelData.idea}`;
}

lastSafeX=70;

lastSafeY=
  levelData.groundY-
  player.h;

draw();

</script>

</body>
</html>
