<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SAN B AHAMD — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101116;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  z-index:20;
  pointer-events:none;
}

.pill{
  background:rgba(20,30,24,.88);
  color:white;
  padding:12px 17px;
  border-radius:999px;
  font-size:15px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(10px);
}

#tier{
  font-size:11px;
  opacity:.8;
  margin-left:4px;
}

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;

  background:
    radial-gradient(
      circle at 15% 20%,
      #ffd166 0 12%,
      transparent 13%
    ),
    radial-gradient(
      circle at 90% 90%,
      #7bdcb5 0 15%,
      transparent 16%
    ),
    #f07157;
}

.introCard{
  width:min(92vw,460px);
  padding:30px 24px;
}

.introTitle{
  margin:0;
  font-size:clamp(42px,12vw,76px);
  line-height:.88;
  font-weight:1000;
  text-transform:uppercase;
  color:#fff;
  text-shadow:4px 4px 0 #202020;
}

.introName{
  margin:18px 0 6px;
  font-size:18px;
  font-weight:900;
}

.creator{
  margin:0 0 24px;
  opacity:.9;
  font-size:14px;
}

#start{
  border:0;
  padding:15px 28px;
  border-radius:999px;
  background:#20283a;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.2);
}

#start:active{
  transform:translateY(4px);
  box-shadow:none;
}

#san{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:12;
  pointer-events:none;

  filter:
    drop-shadow(
      0 8px 8px rgba(0,0,0,.25)
    );

  animation:
    sanFunny 2.1s ease-in-out infinite;
}

@keyframes sanFunny{
  0%,100%{
    transform:
      rotate(-7deg)
      translateY(0)
      scale(1);
  }

  50%{
    transform:
      rotate(8deg)
      translateY(-8px)
      scale(1.04);
  }
}

#controls{
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
}

#joystick{
  position:absolute;

  left:
    max(20px, env(safe-area-inset-left) + 20px);

  bottom:
    max(24px, env(safe-area-inset-bottom) + 24px);

  width:126px;
  height:126px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.14),
      rgba(255,255,255,.05)
    );

  border:3px solid rgba(255,255,255,.55);

  box-shadow:
    inset 0 0 20px rgba(255,255,255,.08),
    0 8px 30px rgba(0,0,0,.18);

  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;

  width:60px;
  height:60px;

  left:30px;
  top:30px;

  border-radius:50%;

  background:rgba(255,255,255,.25);

  border:2px solid rgba(255,255,255,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  color:white;

  transition:transform .06s linear;
}

#actionArea{
  position:absolute;

  right:
    max(20px, env(safe-area-inset-right) + 20px);

  bottom:
    max(24px, env(safe-area-inset-bottom) + 24px);

  display:grid;

  grid-template-columns:82px 82px;

  gap:12px;

  pointer-events:none;
}

.action{
  width:82px;
  height:82px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.5);

  background:rgba(25,25,25,.55);

  color:white;

  font-size:14px;
  font-weight:1000;

  pointer-events:auto;
  touch-action:none;

  backdrop-filter:blur(8px);
}

.action:active{
  transform:scale(.93);
  background:rgba(108,76,255,.8);
}

#win{
  position:fixed;
  inset:0;

  z-index:90;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(7px);

  text-align:center;
}

.winCard{
  width:min(92vw,430px);

  background:#17181d;
  color:white;

  border-radius:28px;

  padding:28px 22px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.4);

  border:1px solid rgba(255,255,255,.1);
}

.winCard h1{
  margin:0 0 10px;
  font-size:30px;
}

.winCard p{
  line-height:1.6;
}

.winButtons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:18px;
}

.winButtons button{
  border:0;
  border-radius:15px;
  padding:13px 18px;
  font-size:15px;
  font-weight:900;
}

#nextBtn{
  background:#6c4cff;
  color:white;
}

#retryBtn{
  background:#30323a;
  color:white;
}

#levelIdea{
  position:fixed;

  left:50%;

  bottom:
    calc(env(safe-area-inset-bottom) + 170px);

  transform:translateX(-50%);

  width:min(90vw,480px);

  padding:10px 15px;

  text-align:center;

  border-radius:15px;

  background:rgba(10,10,12,.58);

  color:white;

  font-size:13px;
  font-weight:800;

  z-index:15;

  pointer-events:none;

  opacity:.9;
}

#finishBanner{
  position:fixed;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  z-index:60;

  color:white;

  background:#6c4cff;

  padding:18px 24px;

  border-radius:20px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:finishPop .8s ease forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  35%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">

  <div class="introCard">

    <h1 class="introTitle">
      SAN<br>B AHAMD
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 tiny challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>

</div>

<div id="hud">

  <div class="pill">
    SAN B AHAMD
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
    <span id="tier"></span>
  </div>

</div>

<img
  id="san"
  src="san.PNG"
  alt=""
>

<div id="levelIdea">
  💡 Get ready...
</div>

<div id="controls">

  <div id="joystick">

    <div id="stick">
      ↔
    </div>

  </div>

  <div id="actionArea">

    <button
      class="action"
      id="jumpBtn">
      JUMP
    </button>

    <button
      class="action"
      id="dashBtn">
      DASH
    </button>

    <button
      class="action"
      id="resetBtn">
      RESET
    </button>

    <button
      class="action"
      id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە! 🎉
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <p>
      تۆ دیار جۆینی گروپی سان FX ـت کردووە 😎
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>


<script>

"use strict";


/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const intro =
  document.getElementById("intro");

const startBtn =
  document.getElementById("start");

const levelEl =
  document.getElementById("level");

const tierEl =
  document.getElementById("tier");

const levelIdea =
  document.getElementById("levelIdea");

const san =
  document.getElementById("san");

const win =
  document.getElementById("win");

const winText =
  document.getElementById("winText");

const finishBanner =
  document.getElementById("finishBanner");


let W=innerWidth;
let H=innerHeight;

let DPR=
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width=
    Math.floor(W*DPR);

  canvas.height=
    Math.floor(H*DPR);

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY =
  "san_b_ahamd_saved_level_v4";

const TOTAL_LEVELS =
  5000;

let savedLevel =
  parseInt(
    localStorage.getItem(
      SAVE_KEY
    ) || "1",
    10
  );

if(
  !Number.isFinite(savedLevel) ||
  savedLevel<1 ||
  savedLevel>TOTAL_LEVELS
){
  savedLevel=1;
}

let level=savedLevel;


/* =========================================================
   GAME STATE
========================================================= */

let playing=false;
let paused=false;
let cameraX=0;
let lastTime=0;
let levelData=null;
let levelWon=false;

let stormFlash=0;


/* =========================================================
   PLAYER
========================================================= */

const player={

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:255,
  jumpPower:650,

  grounded:false,
  coyote:0,

  previousY:0

};


/* =========================================================
   INPUT
========================================================= */

const input={
  x:0
};


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickPointer=null;


function setJoystick(e){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  let dx=
    e.clientX-cx;

  const max=42;

  dx=
    Math.max(
      -max,
      Math.min(max,dx)
    );

  input.x=dx/max;

  stick.style.transform=
    `translateX(${dx}px)`;

}


function resetJoystick(){

  joystickPointer=null;

  input.x=0;

  stick.style.transform=
    "translateX(0)";

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickPointer=
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      e.preventDefault();

      setJoystick(e);

    }

  }
);


joystick.addEventListener(
  "pointerup",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      resetJoystick();

    }

  }
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn=
  document.getElementById(
    "jumpBtn"
  );

const dashBtn=
  document.getElementById(
    "dashBtn"
  );

const resetBtn=
  document.getElementById(
    "resetBtn"
  );

const nextQuickBtn=
  document.getElementById(
    "nextQuickBtn"
  );


function jump(){

  if(
    player.grounded ||
    player.coyote>0
  ){

    player.vy=
      -player.jumpPower;

    player.grounded=false;

    player.coyote=0;

  }

}


jumpBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    jump();

  }
);


dashBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(
      Math.abs(input.x)>.1
    ){

      player.vx=
        input.x*700;

    }else{

      player.vx=700;

    }

  }
);


resetBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetLevel();

  }
);


nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(levelWon){

      nextLevel();

    }

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      input.x=-1;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      input.x=1;

    }

    if(
      e.key===" " ||
      e.key==="ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){

      input.x=0;

    }

  }
);


/* =========================================================
   IPHONE
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);


/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x=
    Math.sin(n*12.9898)
    *43758.5453123;

  return x-
    Math.floor(x);

}


/* =========================================================
   DIFFICULTY
========================================================= */

function tierInfo(n){

  if(n<=1666){

    return{

      name:"ئاستی سەرەتا",

      key:"easy",

      d:
        (n-1)/1665

    };

  }

  if(n<=3332){

    return{

      name:"ئاستی ناوەند",

      key:"medium",

      d:
        (n-1667)/1665

    };

  }

  return{

    name:"ئاستی پڕۆفیشناڵ",

    key:"pro",

    d:
      (n-3333)/1667

  };

}


/* =========================================================
   IDEAS
========================================================= */

const ideas=[

  "💡 هەورەتریشقە دەکرێت لە هەر شوێنێک بێت.",

  "💡 تۆپەکە چاو لە تۆ دەکات!",

  "💡 زەوییە شەقبووەکان ماوەیەکی کەم دەمێنن.",

  "💡 خێرا ڕۆیشتن هەمیشە باشترین چارە نییە.",

  "💡 کاتێک ئاسمان دەدرەوشێتەوە، خۆت لە ناوچەی مەترسیدار دوور بخەرەوە.",

  "💡 دەتوانیت بە DASH لە مەترسییەکان تێپەڕیت.",

  "💡 ڕێگای سەرەوە هەندێ جار ئاسانترە.",

  "💡 تۆپەکە جارێک لە پشتەوە دێت، جارێک لە پێشەوە.",

  "💡 زەوی شەق دەبێت، بەردەوام بە.",

  "💡 هەر مەرحەلەیەک ڕێگایەکی دیکەی هەیە.",

  "💡 خێرا بڕۆ، بەڵام کاتی خۆی بزانە.",

  "💡 هەورە تریشقە لەگەڵ ڕێگای شەقبوو زۆر مەترسیدارە."

];


/* =========================================================
   LEVEL GENERATOR
   5000 LEVELS
========================================================= */

function makeLevel(n){

  const T=
    tierInfo(n);

  const d=
    T.d;


  const groundY=
    H-
    Math.max(
      125,
      Math.min(
        165,
        H*.18
      )
    );


  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];
  const cracks=[];
  const lightnings=[];
  const fallers=[];


  /*
    START
  */

  platforms.push({

    x:-250,
    y:groundY,
    w:470,
    h:75,

    safe:true

  });


  let x=270;


  /*
    OBSTACLE COUNT
  */

  let obstacleCount;


  if(T.key==="easy"){

    obstacleCount=
      5+
      Math.floor(d*4);

  }

  else if(T.key==="medium"){

    obstacleCount=
      8+
      Math.floor(d*4);

  }

  else{

    obstacleCount=
      11+
      Math.floor(d*7);

  }


  for(
    let i=0;
    i<obstacleCount;
    i++
  ){

    const r=
      random(
        n*100+i*19
      );


    /*
      GAP
    */

    let gapBase;
    let gapExtra;


    if(T.key==="easy"){

      gapBase=68;
      gapExtra=35;

    }

    else if(T.key==="medium"){

      gapBase=78;
      gapExtra=55;

    }

    else{

      gapBase=88;
      gapExtra=70;

    }


    const gap=
      gapBase+
      Math.floor(
        r*gapExtra
      );


    x+=gap;


    /*
      PLATFORM WIDTH
    */

    let minWidth;
    let widthRange;


    if(T.key==="easy"){

      minWidth=120;
      widthRange=75;

    }

    else if(T.key==="medium"){

      minWidth=105;
      widthRange=65;

    }

    else{

      minWidth=92;
      widthRange=58;

    }


    const width=
      minWidth+
      Math.floor(
        random(
          n*200+i*31
        )*
        widthRange
      );


    /*
      HEIGHT
    */

    let maxRise;


    if(T.key==="easy"){

      maxRise=25;

    }

    else if(T.key==="medium"){

      maxRise=50;

    }

    else{

      maxRise=72;

    }


    const py=
      groundY-
      Math.floor(
        random(
          n*300+i*17
        )*
        maxRise
      );


    platforms.push({

      x:x,
      y:py,
      w:width,
      h:18,

      safe:true

    });


    /*
      STAR
    */

    if(
      i%2===0 ||
      r>.55
    ){

      stars.push({

        x:
          x+
          width*.5,

        y:
          py-38,

        r:9,

        taken:false

      });

    }


    /*
      SPIKES
    */

    let spikeChance=false;


    if(T.key==="easy"){

      spikeChance=
        i%5===3;

    }

    else if(T.key==="medium"){

      spikeChance=
        i%3===1;

    }

    else{

      spikeChance=
        i%2===1 ||
        r>.7;

    }


    if(
      spikeChance
    ){

      const spikeX=
        x+
        25+
        Math.floor(
          random(
            n*500+i
          )*
          Math.max(
            20,
            width-65
          )
        );


      hazards.push({

        x:spikeX,

        y:py-22,

        w:24,

        h:22

      });

    }


    /*
      BALL
    */

    let ballChance=false;


    if(T.key==="easy"){

      ballChance=
        n%11===0 &&
        i===2;

    }

    else if(T.key==="medium"){

      ballChance=
        i%4===2 ||
        (n%13===0 && i===3);

    }

    else{

      ballChance=
        i%3!==0 ||
        n%7===0;

    }


    if(ballChance){

      balls.push({

        x:
          x+
          width+
          90,

        y:
          py-22,

        r:17,

        speed:
          145+
          d*115,

        minX:
          x-30,

        maxX:
          x+
          width+
          210,

        dir:
          random(n+i)>.5
          ?1
          :-1,

        targetTimer:
          random(
            n*44+i
          )*2

      });

    }


    /*
      SLOPE
    */

    if(
      i%5===2 ||
      (
        T.key!=="easy" &&
        i%4===0
      )
    ){

      const sx=
        x+
        width+
        30;


      const sw=
        170+
        Math.floor(
          random(
            n*700+i
          )*95
        );


      const rise=
        25+
        Math.floor(
          random(
            n*800+i
          )*
          (
            T.key==="pro"
            ?65
            :45
          )
        );


      slopes.push({

        x:sx,

        y:groundY,

        w:sw,

        rise:rise

      });


      x=
        sx+
        sw;

    }

    else{

      x+=width;

    }


    /*
      EARTH CRACKS
    */

    if(
      T.key!=="easy" &&
      (
        i%4===1 ||
        random(n*901+i)>.72
      )
    ){

      cracks.push({

        x:x-60,

        y:groundY-3,

        w:50,

        h:10,

        timer:0,

        active:false,

        broken:false

      });

    }


    /*
      FALLING OBJECTS
      PROFESSIONAL ONLY
    */

    if(
      T.key==="pro" &&
      i%3===0
    ){

      fallers.push({

        x:
          x+30,

        y:
          -100-
          Math.floor(
            random(
              n*99+i
            )*180
          ),

        w:20,

        h:20,

        vy:
          70+
          random(
            n*77+i
          )*70,

        minY:
          groundY-260,

        maxY:
          groundY+10,

        resetY:
          groundY-250

      });

    }

  }


  /*
    FINAL AREA
  */

  const finalStart=
    x+50;


  platforms.push({

    x:finalStart,

    y:groundY,

    w:380,

    h:75,

    safe:true

  });


  const finishX=
    finalStart+125;


  /*
    THUNDERSTORMS
  */

  let stormCount=0;


  if(T.key==="easy"){

    stormCount=
      n%29===0
      ?1
      :0;

  }

  else if(T.key==="medium"){

    stormCount=
      1+
      (
        n%5===0
        ?1
        :0
      );

  }

  else{

    stormCount=
      1+
      (
        n%3===0
        ?1
        :0
      )+
      (
        n%17===0
        ?1
        :0
      );

  }


  for(
    let i=0;
    i<stormCount;
    i++
  ){

    const sx=
      420+
      Math.floor(
        random(
          n*4000+
          i*91
        )*
        Math.max(
          200,
          x-600
        )
      );


    lightnings.push({

      x:sx,

      y:
        groundY-
        260-
        Math.floor(
          random(
            n*401+i
          )*100
        ),

      timer:0,

      cool:
        1.2+
        random(
          n*402+i
        )*1.8,

      warning:.75

    });

  }


  return{

    groundY,

    platforms,

    hazards,

    stars,

    balls,

    slopes,

    cracks,

    lightnings,

    fallers,

    finishX,

    idea:
      ideas[
        (n-1)%
        ideas.length
      ],

    tier:T

  };

}

   SAVE
========================================================= */

function saveLevel(){

    SAVE_KEY,
    String(level)
  );

}


/* =========================================================
   RESET
========================================================= */

function resetLevel(){

  levelWon=false;
  paused=false;

  levelData=
    makeLevel(level);


  player.x=70;

  player.y=
    levelData.groundY-
    player.h;

  player.previousY=
    player.y;

  player.vx=0;
  player.vy=0;

  player.grounded=true;
  player.coyote=0;

  cameraX=0;

  stormFlash=0;


  levelEl.textContent=
    level;


  tierEl.textContent=
    "• "+
    levelData.tier.name;


  levelIdea.textContent=
    `LEVEL ${level}: ${levelData.idea}`;


  win.style.display="none";

  saveLevel();

}

/* =========================================================
   COLLISION
========================================================= */

function intersects(a,b){

  return(

    a.x <
      b.x+b.w &&

    a.x+a.w >
      b.x &&

    a.y <
      b.y+b.h &&

    a.y+a.h >
      b.y

  );

}


/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)return;

  levelWon=true;

  paused=true;

  saveLevel();


  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );


  winText.textContent=
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display="flex";

}

  saveLevel();

  resetLevel();

}

/* =========================================================
   SLOPE
========================================================= */

function slopeSurfaceY(
  s,
  x
){

  const t=
    Math.max(
      0,
      Math.min(
        1,
        (x-s.x)/s.w
      )
    );


  return s.y-
    s.rise*t;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    paused ||
    !levelData
  ){

    return;

  }


  const oldY=
    player.y;

  const oldBottom=
    oldY+
    player.h;


  /*
    MOVEMENT
  */

  const targetVX=
    input.x*
    player.speed;


  player.vx +=
    (
      targetVX-
      player.vx
    )*
    Math.min(
      1,
      dt*12
    );


  player.vy +=
    1550*dt;


  player.x +=
    player.vx*dt;


  player.y +=
    player.vy*dt;


  player.grounded=false;


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    const horizontal=
      player.x+
      player.w>
      p.x &&
      player.x<
      p.x+p.w;


    const newBottom=
      player.y+
      player.h;


    const descending=
      player.vy>=0;


    const crossedTop=
      oldBottom<=
      p.y+8 &&
      newBottom>=
      p.y;


    if(
      horizontal &&
      descending &&
      crossedTop
    ){

      player.y=
        p.y-
        player.h;

      player.vy=0;

      player.grounded=true;

    }

  }


  /*
    SLOPES
  */

  for(
    const s
    of levelData.slopes
  ){

    if(
      player.x+
      player.w>
      s.x &&

      player.x<
      s.x+s.w
    ){

      const surface=
        slopeSurfaceY(
          s,
          player.x+
          player.w*.5
        );


      const bottom=
        player.y+
        player.h;


      if(
        player.vy>=0 &&
        bottom>=surface &&
        oldBottom<=
        surface+12
      ){

        player.y=
          surface-
          player.h;

        player.vy=0;

        player.grounded=true;

      }

    }

  }


  /*
    COYOTE
  */

  if(
    player.grounded
  ){

    player.coyote=.12;

  }

  else{

    player.coyote=
      Math.max(
        0,
        player.coyote-dt
      );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)
      continue;


    const dx=
      player.x+
      player.w/2-
      s.x;

    const dy=
      player.y+
      player.h/2-
      s.y;


    if(
      Math.hypot(dx,dy)<30
    ){

      s.taken=true;

    }

  }


  /*
    EARTH CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    const hit=
      player.x+
      player.w>
      c.x &&

      player.x<
      c.x+c.w &&

      player.y+
      player.h>=
      c.y-12 &&

      player.y+
      player.h<=
      c.y+20;


    if(
      hit &&
      !c.active
    ){

      c.active=true;

      c.timer=1.0;

    }


    if(
      c.active &&
      !c.broken
    ){

      c.timer-=dt;


      if(
        c.timer<=0
      ){

        c.broken=true;

      }

    }


    /*
      If the cracked ground opens
      while the player is on it,
      the player falls naturally.
    */

    if(
      c.broken &&
      player.x+
      player.w>
      c.x &&
      player.x<
      c.x+c.w &&
      player.y+
      player.h>
      c.y-25
    ){

      /*
        Small upward push to make
        the crack feel like an earth shock.
      */

      player.vy+=180;

    }

  }


  /*
    BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    b.targetTimer-=dt;


    /*
      Every while, the ball
      changes direction toward Player.
    */

    if(
      b.targetTimer<=0
    ){

      b.dir=
        player.x>
        b.x
        ?1
        :-1;


      b.targetTimer=
        1.1+
        random(
          level*77+
          Math.floor(
            performance.now()/1000
          )
        )*
        2.2;

    }


    b.x+=
      b.dir*
      b.speed*
      dt;


    if(
      b.x<=b.minX
    ){

      b.x=b.minX;

      b.dir=1;

    }


    if(
      b.x>=b.maxX
    ){

      b.x=b.maxX;

      b.dir=-1;

    }


    const dx=
      player.x+
      player.w/2-
      b.x;


    const dy=
      player.y+
      player.h/2-
      b.y;


    if(
      Math.hypot(
        dx,
        dy
      )<
      b.r+18
    ){

      resetLevel();

      return;

    }

  }


  /*
    FALLING OBJECTS
  */

  for(
    const f
    of levelData.fallers
  ){

    f.y+=
      f.vy*
      dt;


    if(
      f.y>
      f.maxY
    ){

      f.y=
        f.resetY;

    }


    const box={

      x:f.x-10,

      y:f.y-10,

      w:f.w+20,

      h:f.h+20

    };


    if(
      intersects(
        player,
        box
      )
    ){

      resetLevel();

      return;

    }

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    if(
      intersects(
        player,
        h
      )
    ){

      resetLevel();

      return;

    }

  }


  /*
    THUNDERSTORM
  */

  for(
    const l
    of levelData.lightnings
  ){

    l.timer+=dt;


    if(
      l.timer>
      l.cool
    ){

      l.timer=0;

    }


    const phase=
      l.timer/
      l.cool;


    /*
      Warning phase
    */

    if(
      phase<
      l.warning/
      l.cool
    ){

      /*
        warning only

        player has time
        to move away
      */

    }

    /*
      Actual lightning
    */

    else if(
      phase<
      l.warning/
      l.cool+
      .13
    ){

      stormFlash=1;


      /*
        Strike column is narrow.
      */

      if(
        Math.abs(
          (
            player.x+
            player.w/2
          )-
          l.x
        )<34 &&

        player.y>
        l.y-10
      ){

        resetLevel();

        return;

      }

    }

  }


  stormFlash=
    Math.max(
      0,
      stormFlash-
      dt*4
    );


  /*
    FALL
  */

  if(
    player.y>
    H+150
  ){

    resetLevel();

    return;

  }


  /*
    FINISH
  */

  if(
    player.x+
    player.w>=
    levelData.finishX
  ){

    winLevel();

    return;

  }


  /*
    CAMERA
  */

  const targetCamera=
    Math.max(
      0,
      player.x-
      W*.32
    );


  cameraX +=
    (
      targetCamera-
      cameraX
    )*
    Math.min(
      1,
      dt*7
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );


  sky.addColorStop(
    0,
    "#8fd3ff"
  );

  sky.addColorStop(
    .55,
    "#b9e8b0"
  );

  sky.addColorStop(
    1,
    "#e9d8a6"
  );


  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.save();

  ctx.translate(
    -cameraX*.12,
    0
  );


  /*
    CLOUDS
  */

  for(
    let i=0;
    i<30;
    i++
  ){

    const x=
      i*280+100;

    const y=
      95+
      (i%4)*45;


    ctx.fillStyle=
      "rgba(255,255,255,.45)";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      28,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+30,
      y-8,
      35,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+65,
      y,
      25,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /*
    STORM CLOUDS
  */

  if(
    levelData &&
    levelData.lightnings.length
  ){

    for(
      const l
      of levelData.lightnings
    ){

      const phase=
        l.timer/
        l.cool;


      let alpha=.2;


      if(
        phase<
        l.warning/
        l.cool
      ){

        alpha=.65;

      }


      ctx.fillStyle=
        `rgba(50,55,70,${alpha})`;


      ctx.beginPath();

      ctx.arc(
        l.x,
        75,
        45,
        0,
        Math.PI*2
      );

      ctx.arc(
        l.x+42,
        85,
        55,
        0,
        Math.PI*2
      );

      ctx.arc(
        l.x-40,
        88,
        42,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  ctx.restore();


  /*
    LIGHTNING FLASH
  */

  if(
    stormFlash>0
  ){

    ctx.fillStyle=
      `rgba(
        255,
        255,
        255,
        ${Math.min(
          .45,
          stormFlash*.45
        )}
      )`;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.save();

  ctx.translate(
    -cameraX,
    0
  );


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    ctx.fillStyle=
      "#292b31";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );


    ctx.fillStyle=
      "#65d878";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      7
    );


    ctx.fillStyle=
      "rgba(255,255,255,.13)";


    for(
      let xx=p.x+18;
      xx<p.x+p.w;
      xx+=48
    ){

      ctx.fillRect(
        xx,
        p.y+22,
        12,
        5
      );

    }

  }


  /*
    SLOPED ROADS
  */

  for(
    const s
    of levelData.slopes
  ){

    ctx.fillStyle=
      "#292b31";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.lineTo(
      s.x+s.w,
      s.y+55-s.rise
    );

    ctx.lineTo(
      s.x,
      s.y+55
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle=
      "#65d878";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.stroke();

  }


  /*
    EARTH CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    if(
      c.broken
    ){

      /*
        Open crack
      */

      ctx.fillStyle=
        "#111";

      ctx.fillRect(
        c.x-4,
        c.y-4,
        c.w+8,
        24
      );


      ctx.strokeStyle=
        "#ef476f";

      ctx.lineWidth=2;

      ctx.beginPath();

      ctx.moveTo(
        c.x+8,
        c.y
      );

      ctx.lineTo(
        c.x+18,
        c.y+15
      );

      ctx.lineTo(
        c.x+28,
        c.y+2
      );

      ctx.lineTo(
        c.x+39,
        c.y+16
      );

      ctx.stroke();

      continue;

    }


    ctx.fillStyle=
      c.active
      ? "#ef476f"
      : "#555861";


    ctx.fillRect(
      c.x,
      c.y,
      c.w,
      8
    );


    ctx.strokeStyle=
      "#111";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      c.x+10,
      c.y
    );

    ctx.lineTo(
      c.x+20,
      c.y+8
    );

    ctx.lineTo(
      c.x+28,
      c.y
    );

    ctx.lineTo(
      c.x+40,
      c.y+8
    );

    ctx.stroke();

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    ctx.fillStyle=
      "#ef476f";

    ctx.beginPath();

    ctx.moveTo(
      h.x,
      h.y+h.h
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-10
    );

    ctx.lineTo(
      h.x+h.w,
      h.y+h.h
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 9px system-ui";

    ctx.fillText(
      "!",
      h.x+9,
      h.y+10
    );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(
      s.taken
    ){

      continue;

    }


    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/700
    );

    ctx.fillStyle=
      "#ffd166";

    ctx.beginPath();


    for(
      let i=0;
      i<10;
      i++
    ){

      const a=
        i*Math.PI/5;

      const r=
        i%2===0
        ?11
        :5;

      const sx=
        Math.cos(a)*r;

      const sy=
        Math.sin(a)*r;


      if(i===0){

        ctx.moveTo(
          sx,
          sy
        );

      }

      else{

        ctx.lineTo(
          sx,
          sy
        );

      }

    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /*
    BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );


    ctx.fillStyle=
      "#ff6b35";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
      "#fff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r-5,
      0,
      Math.PI*1.5
    );

    ctx.stroke();


    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
      -5,
      -3,
      3,
      0,
      Math.PI*2
    );

    ctx.arc(
      5,
      -3,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.restore();

  }


  /*
    FALLING BLOCKS
  */

  for(
    const f
    of levelData.fallers
  ){

    ctx.fillStyle=
      "#7b61ff";

    ctx.fillRect(
      f.x,
      f.y,
      f.w,
      f.h
    );


    ctx.fillStyle="#fff";

    ctx.fillRect(
      f.x+5,
      f.y+5,
      4,
      4
    );

    ctx.fillRect(
      f.x+12,
      f.y+5,
      4,
      4
    );

  }


  /*
    LIGHTNING
  */

  for(
    const l
    of levelData.lightnings
  ){

    const phase=
      l.timer/
      l.cool;


    /*
      Warning circle
    */

    if(
      phase<
      l.warning/
      l.cool
    ){

      ctx.fillStyle=
        "rgba(255,230,80,.75)";

      ctx.beginPath();

      ctx.arc(
        l.x,
        l.y,
        10+
        Math.sin(
          performance.now()/90
        )*4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    /*
      Lightning strike
    */

    else if(
      phase<
      l.warning/
      l.cool+
      .13
    ){

      ctx.strokeStyle=
        "#fff36b";

      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.moveTo(
        l.x,
        l.y
      );

      ctx.lineTo(
        l.x-18,
        l.y+45
      );

      ctx.lineTo(
        l.x+10,
        l.y+45
      );

      ctx.lineTo(
        l.x-5,
        l.y+105
      );

      ctx.stroke();

    }

  }


  /*
    FINISH FLAG
  */

  const fx=
    levelData.finishX;


  ctx.fillStyle="#222";

  ctx.fillRect(
    fx,
    levelData.groundY-120,
    7,
    120
  );


  ctx.fillStyle="#ff4d6d";

  ctx.beginPath();

  ctx.moveTo(
    fx+7,
    levelData.groundY-120
  );

  ctx.lineTo(
    fx+75,
    levelData.groundY-94
  );

  ctx.lineTo(
    fx+7,
    levelData.groundY-68
  );

  ctx.closePath();

  ctx.fill();


  /*
    PLAYER
  */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  ctx.fillStyle=
    "#684cff";

  ctx.beginPath();

  ctx.roundRect(
    0,
    0,
    player.w,
    player.h,
    8
  );

  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    10,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    23,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    SMILE
  */

  ctx.strokeStyle="#111";

  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    17,
    17,
    9,
    0,
    Math.PI
  );

  ctx.stroke();


  /*
    LEGS
  */

  ctx.fillStyle="#222";

  ctx.fillRect(
    6,
    38,
    7,
    5
  );

  ctx.fillRect(
    21,
    38,
    7,
    5
  );


  ctx.restore();


  /*
    FUNNY TEXT
  */

  ctx.fillStyle=
    "rgba(20,20,20,.35)";

  ctx.font=
    "900 15px system-ui";


  ctx.fillText(
    "هەموو شتێک باشە 😎",
    player.x+100,
    player.y-30
  );


  ctx.restore();

}


/* =========================================================
   SAN IMAGE
========================================================= */

function updateSanPosition(){

  const positions=[

    {
      right:18,
      top:110
    },

    {
      right:W*.28,
      top:90
    },

    {
      right:35,
      top:180
    },

    {
      right:W*.45,
      top:120
    },

    {
      right:20,
      top:250
    }

  ];


  const p=
    positions[
      (level-1)%
      positions.length
    ];


  san.style.right=
    p.right+"px";

  san.style.top=
    p.top+"px";


  const size=
    Math.min(
      86,
      Math.max(
        64,
        W*.19
      )
    );


  san.style.width=
    size+"px";

  san.style.height=
    size+"px";

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  if(levelData){

    drawWorld();

  }

  updateSanPosition();

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!playing)return;


  const dt=
    Math.min(
      .033,
      Math.max(
        .001,
        (time-lastTime)/1000
      )
    );


  lastTime=time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   INITIAL
========================================================= */

levelData=
  makeLevel(level);

levelEl.textContent=
  level;

tierEl.textContent=
  "• "+
  levelData.tier.name;

draw();

</script>
