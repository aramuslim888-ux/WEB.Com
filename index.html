<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SAN B AHAMD — 5000 Levels Brutal</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0a0b0e;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

/* HUD */

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:7px;
  z-index:50;
  pointer-events:none;
}

.pill{
  background:rgba(16,20,27,.9);
  color:#fff;
  padding:10px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 28px rgba(0,0,0,.3);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);
}

#tier{
  font-size:10px;
  opacity:.72;
  margin-left:4px;
}

/* INTRO */

#intro{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 10% 15%,#ff3366 0 11%,transparent 12%),
    radial-gradient(circle at 92% 88%,#220033 0 14%,transparent 15%),
    radial-gradient(circle at 80% 15%,#ff0055 0 8%,transparent 9%),
    #050508;
}

.introCard{
  width:min(94vw,470px);
  padding:28px 20px;
}

.introTitle{
  margin:0;
  font-size:clamp(38px,12vw,72px);
  line-height:.84;
  font-weight:1000;
  color:#ff2a5f;
  text-shadow:4px 4px 0 #000, 0 0 25px rgba(255,42,95,.6);
}

.introName{
  margin:20px 0 7px;
  font-size:17px;
  font-weight:900;
  color:#ffccd5;
}

.creator{
  margin:0 0 23px;
  opacity:.9;
  font-size:13px;
}

#start{
  border:0;
  padding:16px 29px;
  border-radius:999px;
  background:linear-gradient(135deg, #ff2a5f, #7b00ff);
  color:#fff;
  font-size:17px;
  font-weight:1000;
  box-shadow:0 8px 25px rgba(255,42,95,.4);
}

#start:active{
  transform:translateY(4px);
  box-shadow:none;
}

/* SAN */

#san{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:35;
  pointer-events:none;
  filter:drop-shadow(0 8px 12px rgba(255,0,80,.4));
  animation:sanFunny 1.5s ease-in-out infinite;
}

@keyframes sanFunny{
  0%,100%{
    transform:rotate(-12deg) translateY(0) scale(1);
  }
  50%{
    transform:rotate(12deg) translateY(-12px) scale(1.08);
  }
}

/* CONTROLS */

#controls{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

/* JOYSTICK */

#joystick{
  position:absolute;
  left:max(18px,env(safe-area-inset-left) + 18px);
  bottom:max(22px,env(safe-area-inset-bottom) + 22px);
  width:124px;
  height:124px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.18),
    rgba(255,255,255,.05)
  );
  border:3px solid rgba(255,255,255,.65);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.12),
    0 8px 30px rgba(0,0,0,.3);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:60px;
  height:60px;
  left:30px;
  top:30px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:white;
  transition:transform .05s linear;
}

/* ACTIONS */

#actionArea{
  position:absolute;
  right:max(18px,env(safe-area-inset-right) + 18px);
  bottom:max(22px,env(safe-area-inset-bottom) + 22px);
  display:grid;
  grid-template-columns:78px 78px;
  gap:10px;
  pointer-events:none;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.6);
  background:rgba(20,20,25,.75);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(8px);
}

.action:active{
  transform:scale(.91);
  background:rgba(255,42,95,.85);
}

/* IDEA */

#levelIdea{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 166px);
  transform:translateX(-50%);
  width:min(91vw,560px);
  padding:9px 13px;
  text-align:center;
  border-radius:15px;
  background:rgba(15,10,18,.82);
  color:#ff99bb;
  font-size:12px;
  font-weight:800;
  z-index:40;
  pointer-events:none;
  opacity:.96;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,42,95,.3);
}

/* WIN */

#win{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  text-align:center;
}

.winCard{
  width:min(93vw,430px);
  background:#17121c;
  color:white;
  border-radius:28px;
  padding:27px 20px;
  box-shadow:0 25px 80px rgba(255,0,80,.25);
  border:1px solid rgba(255,42,95,.3);
}

.winCard h1{
  margin:0 0 8px;
  font-size:30px;
  color:#ff2a5f;
}

.winCard p{
  line-height:1.55;
}

.winButtons{
  display:flex;
  gap:9px;
  justify-content:center;
  margin-top:17px;
}

.winButtons button{
  border:0;
  border-radius:15px;
  padding:13px 17px;
  font-size:14px;
  font-weight:900;
}

#nextBtn{
  background:linear-gradient(135deg, #ff2a5f, #7b00ff);
  color:#fff;
}

#retryBtn{
  background:#30283a;
  color:#fff;
}

/* FINISH */

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:140;
  color:#fff;
  background:linear-gradient(135deg, #ff2a5f, #7b00ff);
  padding:18px 24px;
  border-radius:20px;
  font-size:21px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:finishPop .8s ease forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
  }
  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* SMALL STATUS */

#danger{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 65px);
  transform:translateX(-50%);
  z-index:60;
  color:white;
  background:rgba(255,30,60,.92);
  padding:6px 12px;
  border-radius:999px;
  font-size:10px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  box-shadow:0 0 15px rgba(255,30,60,.7);
}

#danger.show{
  opacity:1;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- INTRO -->

<div id="intro">
  <div class="introCard">

    <h1 class="introTitle">
      SAN<br>
      BRUTAL
    </h1>

    <div class="introName">
      16 بۆ 5000: دۆزەخی بێبەزەیی!<br>
      تۆپ، تریشقە، شەقبوونی زەوی و ١٠٠٠ شتی بیتام!
    </div>

    <p class="creator">

    </p>

    <button id="start">

    </button>

</div>

<!-- HUD -->

<div id="hud">

  <div class="pill">
    SAN B AHAMD
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
    <span id="tier"></span>
  </div>

</div>

<img id="san" src="san.PNG" alt="">

  ⚠️ مەترسیی زۆر بەرزە: دۆزەخ دەستی پێکرد!

  💡 ئامادە بە بۆ مەرگ...

<!-- CONTROLS -->

<div id="controls">

    <div id="stick">↔</div>

  <div id="actionArea">

    </button>

<div id="win">

    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <p>
      تۆ دیار جۆینی گروپی سان FX ـت کردووە 😎
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">

      </button>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!

<script>
"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");

const levelEl = document.getElementById("level");
const tierEl = document.getElementById("tier");
const levelIdea = document.getElementById("levelIdea");

const san = document.getElementById("san");

const win = document.getElementById("win");
const winText = document.getElementById("winText");
const finishBanner = document.getElementById("finishBanner");
const dangerEl = document.getElementById("danger");

let W = innerWidth;
let H = innerHeight;

let DPR = Math.min(window.devicePixelRatio || 1,2);

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY = "san_b_ahamd_5000_brutal_v1";
const TOTAL_LEVELS = 5000;

let level = parseInt(
  localStorage.getItem(SAVE_KEY) || "1",
  10
);

if(
  !Number.isFinite(level) ||
  level < 1 ||
  level > TOTAL_LEVELS
){
  level = 1;
}

/* =========================================================
   STATE
========================================================= */

let playing = false;
let paused = false;
let cameraX = 0;
let lastTime = 0;

let levelData = null;
let levelWon = false;

let stormFlash = 0;
let screenShake = 0;

let particles = [];

/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:255,
  jumpPower:650,

  grounded:false,
  coyote:0,

  dashCooldown:0,
  dashTime:0,

  gravityScale:1,

  slowTimer:0,
  reverseTimer:0,

  invincible:0

};

/* =========================================================
   INPUT
========================================================= */

const input = {
  x:0
};

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickPointer = null;

function setJoystick(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left + r.width / 2;

  let dx =
    e.clientX - cx;

  const max = 42;

  dx = Math.max(
    -max,
    Math.min(max,dx)
  );

  input.x = dx / max;

  stick.style.transform =
    `translateX(${dx}px)`;
}

function resetJoystick(){

  joystickPointer = null;
  input.x = 0;
  stick.style.transform =
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    joystickPointer = e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      e.preventDefault();
      setJoystick(e);
    }
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      resetJoystick();
    }
  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn =
  document.getElementById("jumpBtn");

const dashBtn =
  document.getElementById("dashBtn");

const resetBtn =
  document.getElementById("resetBtn");

const nextQuickBtn =
  document.getElementById("nextQuickBtn");

function jump(){

  if(
    player.grounded ||
    player.coyote > 0
  ){

    player.vy =
      -player.jumpPower;

    player.grounded = false;
    player.coyote = 0;

  }
}

function dash(){

  if(
    player.dashCooldown > 0
  ) return;

  let dir =
    Math.abs(input.x) > .1
    ? input.x
    : 1;

  player.vx =
    dir * 760;

  player.dashTime = .17;
  player.dashCooldown =
    Math.max(
      .2,
      .6 -
      levelData.tier.d * .2
    );

  player.invincible = .15;

  screenShake = 6;
}

jumpBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

dashBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    dash();
  }
);

resetBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    resetLevel();
  }
);

nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    if(levelWon){
      nextLevel();
    }
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){
      input.x = -1;
    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){
      input.x = 1;
    }

    if(
      e.key === " " ||
      e.key === "ArrowUp"
    ){
      e.preventDefault();
      jump();
    }

    if(
      e.key.toLowerCase() === "shift"
    ){
      dash();
    }

    if(
      e.key.toLowerCase() === "r"
    ){
      resetLevel();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){
      input.x = 0;
    }

  }
);

/* =========================================================
   IPHONE LOCK
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x =
    Math.sin(
      n * 12.9898
    ) * 43758.5453123;

  return x - Math.floor(x);
}

/* =========================================================
   HELPERS
========================================================= */

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );
}

function lerp(a,b,t){
  return a + (b-a)*t;
}

function chance(seed,p){
  return random(seed) < p;
}

function rectHit(a,b){

  return(
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

function circleHit(px,py,pr,box){

  const cx =
    clamp(
      px,
      box.x,
      box.x+box.w
    );

  const cy =
    clamp(
      py,
      box.y,
      box.y+box.h
    );

  return(
    Math.hypot(
      px-cx,
      py-cy
    ) < pr
  );
}

/* =========================================================
   DIFFICULTY (BRUTAL FROM 16 TO 5000)
========================================================= */

function difficulty(n){

  if(n <= 5){
    const p = (n-1)/4;
    return{
      p, d:0.05, stage:1,
      name:`فێرکاری زۆر کورتی ${n}`,
      gap:130, width:170, rise:10,
      spikes:0.1, balls:0.1, cracks:0.1,
      moving:0, disappearing:0, saws:0, lasers:0, bombs:0,
      wind:0, ice:0, fake:0, walls:0, springs:0.1, portals:0,
      gravity:0, reverse:0, fallers:0, storms:0,
      ballSpeed:120, speed:250, jump:650, groups:5
    };
  }

  /*
    FROM LEVEL 16 TO 5000: PURE HARDCORE BRUTAL HELL
  */

  const p = clamp((n-1)/(TOTAL_LEVELS-1), 0, 1);
  const d = Math.pow(p, 0.42); // Extreme exponential scaling so even early levels are tough and 5000 is impossible nightmare

  const stage = Math.min(5000, n);

  return{
    p,
    d,
    stage,
    name: n === 5000 ? `دۆزەخی کۆتایی 5000` : `ئاستی قورسی دۆزەخ ${n}`,
    gap: lerp(120, 22, d),
    width: lerp(140, 32, d),
    rise: lerp(20, 160, d),
    spikes: lerp(0.35, 0.99, d),
    balls: lerp(0.30, 0.99, d),
    cracks: lerp(0.25, 0.98, d),
    moving: lerp(0.25, 0.98, d),
    disappearing: lerp(0.20, 0.98, d),
    saws: lerp(0.20, 0.98, d),
    lasers: lerp(0.18, 0.98, d),
    bombs: lerp(0.15, 0.98, d),
    wind: lerp(0.20, 0.95, d),
    ice: lerp(0.20, 0.95, d),
    fake: lerp(0.15, 0.92, d),
    walls: lerp(0.15, 0.95, d),
    springs: lerp(0.2, 0.8, d),
    portals: lerp(0.1, 0.8, d),
    gravity: lerp(0.15, 0.85, d),
    reverse: lerp(0.15, 0.85, d),
    fallers: lerp(0.3, 0.99, d),
    storms: lerp(0.2, 1.0, d),
    ballSpeed: lerp(180, 580, d),
    speed: lerp(255, 325, d),
    jump: lerp(650, 560, d),
    groups: Math.round(lerp(8, 45, d))
  };
}

/* =========================================================
   1000+ BITAM & CRAZY IDEAS
========================================================= */

const ideas = [
"💡 Level 16: چیتر ئاسانکاری بوونی نییە، ئامادەبە!",
"⚡ توپ و تریشقە بەیەکەوە دێن بۆ کوشتنت!",
"💥 زەویەکە لەپڕ شەق دەبات و دەکەویتە خوارەوە!",
"🌪 بادەکان هەڵتەسێنن و ئاراستەت دەگۆڕن!",
"🧊 سەهۆڵ کۆنترۆڵ لە دەستت دەردەهێنێت!",
"👻 پلاتفۆرمی درۆزن (Fake) لەژێر پێشت دەبەن!",
"💣 بۆمبەکان بە دەوروبەرتدا دەتەقنەوە!",
"🌀 پۆرتاڵەکان سەرت لێ تێکدەدەن!",
"☠️ سەددان مەترسی و گیانداری کوشندە چاوەڕێتن!",
"🔥 ئەوە تەنها سەرەتایە بۆ گەیشتن بە 5000!",
"💀 هۆشیاربە: شتی بیتام و شێتگیر زیاتر دەبن!",
"⚡ تریشقەکان بە بێ ئاگاداری لێت دەدەن!",
"🌀 گრავیتی گۆڕاو و خولانەوەی مێشکبر!",
"☠️ Level 1000: لێرەدا مردن مسۆگەرە ئەگەر خێرا نەبیت!",
"🔥 Level 2500: دۆزەخی ڕاستەقینە، هیچ شوێنێك سەلامەت نییە!",

];

function getIdeaForLevel(n, d) {
  if (n === 5000) return "👑 لوتکەی دۆزەخ: Level 5000 - کۆتایی گەورە!";
  const index = Math.floor(d * (ideas.length - 1));
  return ideas[clamp(index, 0, ideas.length - 1)] + ` (ئاستی قورسی: ${(d*100).toFixed(1)}%)`;
}

/* =========================================================
   LEVEL GENERATOR (1000+ CRAZY TRAPS & MECHANICS)
========================================================= */

function makeLevel(n){

  const D = difficulty(n);

  const groundY =
    H -
    Math.max(
      125,
      Math.min(165,H*.18)
    );

  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];
  const cracks=[];
  const lightnings=[];
  const fallers=[];

  const movingPlatforms=[];
  const disappearingPlatforms=[];
  const saws=[];
  const lasers=[];
  const bombs=[];
  const windZones=[];
  const iceZones=[];
  const fakePlatforms=[];
  const walls=[];
  const springs=[];
  const portals=[];
  const gravityZones=[];
  const reverseZones=[];
  const finishGates=[];

  /* START */

  platforms.push({
    x:-300,
    y:groundY,
    w:520,
    h:80,
    safe:true
  });

  let x=230;

  const count=D.groups;

  for(let i=0;i<count;i++){

    const base = n * 10000 + i * 79;

    const gap = Math.max(22, D.gap + random(base + 1) * 35);
    x += gap;

    let width = Math.max(32, D.width + random(base + 2) * 30);
    let py = groundY - random(base + 3) * D.rise;

    const platform = {
      x,
      y: py,
      w: width,
      h: 18,
      safe: true
    };

    platforms.push(platform);

    /* STARS */
    if(random(base + 4) > 0.4){
      stars.push({
        x: x + width * 0.5,
        y: py - 38,
        r: 9,
        taken: false
      });
    }

    /* MOVING PLATFORM */
    if(chance(base + 10, D.moving)){
      movingPlatforms.push({
        x: x + width * 0.5,
        y: py,
        baseX: x + width * 0.5,
        baseY: py,
        w: Math.max(38, width * 0.7),
        h: 18,
        range: 40 + random(base + 11) * (80 + D.d * 100),
        speed: 0.8 + random(base + 12) * (1.5 + D.d * 2.5),
        phase: random(base + 13) * Math.PI * 2,
        axis: random(base + 14) > 0.5 ? "x" : "y",
        safe: true
      });
    }

    /* DISAPPEARING PLATFORM */
    if(chance(base + 20, D.disappearing)){
      disappearingPlatforms.push({
        x: x,
        y: py,
        w: width,
        h: 18,
        timer: 0.5 + random(base + 21) * 1.0,
        active: true,
        respawn: 0.8 + random(base + 22) * 1.5
      });
    }

    /* FAKE PLATFORM */
    if(chance(base + 30, D.fake)){
      fakePlatforms.push({
        x: x + random(base + 31) * Math.max(10, width - 30),
        y: py - 30 - random(base + 32) * 60,
        w: Math.max(30, width * 0.5),
        h: 14,
        fake: true
      });
    }

    /* SPIKES (MULTI) */
    if(chance(base + 40, D.spikes)){
      const amount = Math.min(6, 1 + Math.floor(D.d * 5 + random(base + 41) * 3));
      for(let s = 0; s < amount; s++){
        hazards.push({
          x: x + 6 + random(base + 50 + s) * Math.max(10, width - 20),
          y: py - 22,
          w: 20,
          h: 20
        });
      }
    }

    /* BALLS (BRUTAL) */
    if(chance(base + 60, D.balls)){
      const amount = Math.min(5, 1 + Math.floor(D.d * 4 + random(base + 61) * 2));
      for(let b = 0; b < amount; b++){
        balls.push({
          x: x + width + 40 + random(base + 70 + b) * 100,
          y: py - 20 - b * 16,
          r: 14 + D.d * 6,
          speed: D.ballSpeed * (1 + b * 0.15),
          minX: x - 50,
          maxX: x + width + 280 + D.d * 150,
          dir: random(base + 80 + b) > 0.5 ? 1 : -1,
          targetTimer: 0.3 + random(base + 90 + b) * 1.0
        });
      }
    }

    /* SAWS */
    if(chance(base + 100, D.saws)){
      saws.push({
        x: x + width + 35 + random(base + 101) * 70,
        y: py - 30 - random(base + 102) * 50,
        r: 16 + D.d * 12,
        baseY: py - 30,
        amp: 20 + D.d * 70,
        speed: 1.5 + D.d * 5,
        phase: random(base + 103) * 6.28
      });
    }

    /* LASERS */
    if(chance(base + 110, D.lasers)){
      lasers.push({
        x: x + width + 25 + random(base + 111) * 90,
        y: py - 15 - random(base + 112) * 60,
        w: 90 + random(base + 113) * 110,
        h: 8,
        period: 0.5 + random(base + 114) * 1.2,
        phase: random(base + 115) * 2,
        warning: 0.2 + random(base + 116) * 0.2
      });
    }

    /* BOMBS */
    if(chance(base + 120, D.bombs)){
      bombs.push({
        x: x + width + 50 + random(base + 121) * 100,
        y: py - 35 - random(base + 122) * 80,
        r: 12 + D.d * 6,
        timer: 0.8 + random(base + 123) * 1.5,
        pulse: 0
      });
    }

    /* SLOPES */
    if(random(base + 130) < 0.15 + D.d * 0.75){
      const sx = x + width + 10;
      const sw = 90 + random(base + 131) * Math.max(60, 160 - D.d * 50);
      const rise = 10 + random(base + 132) * (25 + D.rise * 0.8);
      slopes.push({
        x: sx,
        y: groundY,
        w: sw,
        rise
      });
      x = sx + sw;
    } else {
      x += width;
    }

    /* CRACKS */
    if(chance(base + 140, D.cracks)){
      const amount = Math.min(5, 1 + Math.floor(D.d * 4));
      for(let c = 0; c < amount; c++){
        cracks.push({
          x: x - 65 + c * 22,
          y: groundY - 3,
          w: 42,
          h: 10,
          timer: 0,
          active: false,
          broken: false
        });
      }
    }

    /* WIND */
    if(chance(base + 150, D.wind)){
      windZones.push({
        x: x + 15,
        y: groundY - 140 - random(base + 151) * 80,
        w: 90 + random(base + 152) * 110,
        h: 120 + random(base + 153) * 90,
        force: (random(base + 154) > 0.5 ? 1 : -1) * (150 + D.d * 450)
      });
    }

    /* ICE */
    if(chance(base + 160, D.ice)){
      iceZones.push({
        x: x - 15,
        y: groundY - 25,
        w: 70 + random(base + 161) * 130,
        h: 30
      });
    }

    /* SPRINGS */
    if(chance(base + 170, D.springs)){
      springs.push({
        x: x + random(base + 171) * Math.max(10, width - 22),
        y: py - 12,
        w: 22,
        h: 12,
        power: 750 + D.d * 550
      });
    }

    /* PORTALS */
    if(chance(base + 180, D.portals)){
      portals.push({
        x: x + width + 25 + random(base + 181) * 70,
        y: py - 70 - random(base + 182) * 90,
        r: 18,
        targetOffset: 220 + random(base + 183) * 550,
        used: false
      });
    }

    /* GRAVITY */
    if(chance(base + 190, D.gravity)){
      gravityZones.push({
        x: x + 10,
        y: py - 120,
        w: 80 + random(base + 191) * 120,
        h: 160,
        scale: random(base + 192) > 0.5 ? 0.45 : 1.85
      });
    }

    /* REVERSE */
    if(chance(base + 200, D.reverse)){
      reverseZones.push({
        x: x + 10,
        y: py - 150,
        w: 90 + random(base + 201) * 120,
        h: 170,
        time: 1.0 + random(base + 202) * 2.0
      });
    }

    /* FALLERS */
    if(chance(base + 210, D.fallers)){
      const amount = Math.min(5, 1 + Math.floor(D.d * 4));
      for(let f = 0; f < amount; f++){
        fallers.push({
          x: x + random(base + 220 + f) * 90,
          y: -100 - random(base + 230 + f) * 250,
          w: 18 + D.d * 14,
          h: 18 + D.d * 14,
          vy: 120 + random(base + 240 + f) * 250 + D.d * 300,
          resetY: -200 - random(base + 250 + f) * 120
        });
      }
    }

    /* WALLS */
    if(chance(base + 260, D.walls)){
      walls.push({
        x: x + width + 60 + random(base + 261) * 80,
        y: py - 90,
        w: 16 + D.d * 14,
        h: 90 + D.d * 110,
        range: 20 + D.d * 90,
        speed: 1.0 + D.d * 2.5,
        phase: random(base + 262) * 6.28
      });
    }

  }

  /* FINAL SAFE */
  const finalStart = x + 50;
  platforms.push({
    x: finalStart,
    y: groundY,
    w: 500,
    h: 80,
    safe: true
  });

  /* FINISH GATES */
  const gateCount = Math.min(6, Math.floor(D.d * 6));
  for(let g = 0; g < gateCount; g++){
    finishGates.push({
      x: finalStart + 70 + g * 70,
      y: groundY - 120,
      w: 12,
      h: 120,
      phase: random(n * 6000 + g) * 6.28,
      period: 0.7 + random(n * 6001 + g) * 1.1
    });
  }

  const finishX = finalStart + 430;

  /* LIGHTNINGNINGS (HEAVY STORM) */
  const stormCount = Math.min(15, 2 + Math.floor(D.d * 14));
  for(let i = 0; i < stormCount; i++){
    const seed = n * 8000 + i * 31;
    lightnings.push({
      x: 350 + random(seed) * Math.max(300, x - 350),
      y: groundY - 220 - random(seed + 1) * 160,
      timer: random(seed + 2) * 1.2,
      cool: Math.max(0.35, 1.2 - D.d * 0.75 - random(seed + 3) * 0.3),
      warning: Math.max(0.12, 0.6 - D.d * 0.4)
    });
  }

  /* 1000+ EXTRA CHAOS TRAPS */
  const chaos = [];
  const chaosCount = Math.floor(8 + D.d * 45);
  for(let i = 0; i < chaosCount; i++){
    const seed = n * 90000 + i * 541;
    chaos.push({
      x: 300 + random(seed) * Math.max(300, x - 300),
      y: 70 + random(seed + 1) * Math.max(100, groundY - 150),
      type: Math.floor(random(seed + 2) * 16),
      size: 8 + random(seed + 3) * (10 + D.d * 40),
      speed: 50 + random(seed + 4) * (120 + D.d * 400),
      phase: random(seed + 5) * 6.28
    });
  }

  return{
    groundY,
    platforms,
    hazards,
    stars,
    balls,
    slopes,
    cracks,
    lightnings,
    fallers,
    movingPlatforms,
    disappearingPlatforms,
    saws,
    lasers,
    bombs,
    windZones,
    iceZones,
    fakePlatforms,
    walls,
    springs,
    portals,
    gravityZones,
    reverseZones,
    finishGates,
    chaos,
    finishX,
    idea: getIdeaForLevel(n, D.d),
    tier: D
  };
}

/* =========================================================
   SAVE
========================================================= */

function saveLevel(){
  localStorage.setItem(SAVE_KEY, String(level));
}

/* =========================================================
   RESET
========================================================= */

function resetLevel(){

  levelWon=false;
  paused=false;

  levelData=
    makeLevel(level);

  player.x=70;

  player.y=
    levelData.groundY-
    player.h;

  player.vx=0;
  player.vy=0;

  player.grounded=true;
  player.coyote=0;

  player.dashCooldown=0;
  player.dashTime=0;
  player.gravityScale=1;
  player.slowTimer=0;
  player.reverseTimer=0;
  player.invincible=0;

  cameraX=0;

  stormFlash=0;
  screenShake=0;

  levelEl.textContent=level;

  tierEl.textContent=
    "• "+
    levelData.tier.name;

  levelIdea.textContent=
    `LEVEL ${level}: ${levelData.idea}`;

  player.speed=
    levelData.tier.speed;

  player.jumpPower=
    levelData.tier.jump;

  win.style.display="none";

  saveLevel();
}

startBtn.addEventListener(

  e=>{

    e.preventDefault();

    intro.style.display="none";

    playing=true;

    resetLevel();

    lastTime=
      performance.now();

    requestAnimationFrame(loop);
  }
);

/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)
    return;

  levelWon=true;
  paused=true;

  saveLevel();

  finishBanner.classList.remove("show");

  void finishBanner.offsetWidth;

  finishBanner.classList.add("show");

  winText.textContent=
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە!`;

  win.style.display="flex";
}

/* =========================================================
   NEXT
========================================================= */

function nextLevel(){

  if(level>=TOTAL_LEVELS){
    level=1;
  }else{
    level++;
  }

  saveLevel();
  resetLevel();
}

document
  .getElementById("retryBtn")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      resetLevel();
    }
  );

document
  .getElementById("nextBtn")
  .addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      nextLevel();
    }
  );

/* =========================================================
   SLOPE
========================================================= */

function slopeSurfaceY(s,x){

  const t=
    clamp(
      (x-s.x)/s.w,
      0,
      1
    );

  return s.y-s.rise*t;
}

/* =========================================================
   PARTICLES
========================================================= */

function particleBurst(x,y,type="normal"){

  const count=
    type==="danger"
    ?22
    :12;

  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (random(
          performance.now()+i*31
        )-.5)*260,

      vy:
        (random(
          performance.now()+i*53
        )-.5)*260,

      life:.4+
        random(
          performance.now()+i*71
        )*.5,

      size:
        2+
        random(
          performance.now()+i*91
        )*6

    });

  }
}

function updateParticles(dt){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=350*dt;
    p.life-=dt;

    if(p.life<=0){
      particles.splice(i,1);
    }

  }
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(paused || !levelData) return;

  updateParticles(dt);

  player.dashCooldown = Math.max(0, player.dashCooldown - dt);
  player.dashTime = Math.max(0, player.dashTime - dt);
  player.slowTimer = Math.max(0, player.slowTimer - dt);
  player.reverseTimer = Math.max(0, player.reverseTimer - dt);
  player.invincible = Math.max(0, player.invincible - dt);

  const oldY = player.y;
  const oldBottom = oldY + player.h;

  let gravityScale = 1;
  let speedMultiplier = player.slowTimer > 0 ? 0.5 : 1;

  if(player.reverseTimer > 0){
    speedMultiplier *= 0.85;
  }

  for(const g of levelData.gravityZones){
    if(
      player.x + player.w > g.x &&
      player.x < g.x + g.w &&
      player.y + player.h > g.y &&
      player.y < g.y + g.h
    ){
      gravityScale = g.scale;
    }
  }

  let windForce = 0;
  for(const w of levelData.windZones){
    if(
      player.x + player.w > w.x &&
      player.x < w.x + w.w &&
      player.y + player.h > w.y &&
      player.y < w.y + w.h
    ){
      windForce += w.force;
    }
  }

  let controlX = input.x;
  if(player.reverseTimer > 0){
    controlX = -controlX;
  }

  const targetVX = controlX * player.speed * speedMultiplier;
  const accel = player.slowTimer > 0 ? 5 : 14;

  player.vx += (targetVX - player.vx) * Math.min(1, dt * accel);
  player.vx += windForce * dt;

  if(player.dashTime > 0){
    player.vx *= 1.02;
  }

  player.vy += 1600 * gravityScale * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.grounded = false;

  const now = performance.now() / 1000;

  /* MOVING PLATFORMS */
  for(const m of levelData.movingPlatforms){
    if(m.axis === "x"){
      m.x = m.baseX + Math.sin(now * m.speed + m.phase) * m.range;
    } else {
      m.y = m.baseY + Math.sin(now * m.speed + m.phase) * m.range;
    }

    const horizontal = player.x + player.w > m.x - m.w/2 && player.x < m.x + m.w/2;
    const top = m.y;
    const newBottom = player.y + player.h;

    if(horizontal && player.vy >= 0 && oldBottom <= top + 12 && newBottom >= top){
      player.y = top - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* NORMAL PLATFORMS */
  for(const p of levelData.platforms){
    const horizontal = player.x + player.w > p.x && player.x < p.x + p.w;
    const newBottom = player.y + player.h;

    if(horizontal && player.vy >= 0 && oldBottom <= p.y + 12 && newBottom >= p.y){
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* DISAPPEARING PLATFORMS */
  for(const p of levelData.disappearingPlatforms){
    if(p.active){
      p.timer -= dt;
      if(p.timer <= 0){
        p.active = false;
        p.timer = p.respawn;
      }
    } else {
      p.timer -= dt;
      if(p.timer <= 0){
        p.active = true;
        p.timer = 0.6 + levelData.tier.d * 0.5;
      }
    }

    if(!p.active) continue;

    const horizontal = player.x + player.w > p.x && player.x < p.x + p.w;
    const newBottom = player.y + player.h;

    if(horizontal && player.vy >= 0 && oldBottom <= p.y + 12 && newBottom >= p.y){
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  }

  /* FAKE PLATFORMS */
  for(const p of levelData.fakePlatforms){
    if(rectHit(player, p)){
      particleBurst(p.x + p.w/2, p.y, "danger");
      player.vy += 120;
    }
  }

  /* SLOPES */
  for(const s of levelData.slopes){
    if(player.x + player.w > s.x && player.x < s.x + s.w){
      const surface = slopeSurfaceY(s, player.x + player.w * 0.5);
      const bottom = player.y + player.h;

      if(player.vy >= 0 && bottom >= surface && oldBottom <= surface + 15){
        player.y = surface - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  if(player.grounded){
    player.coyote = 0.14;
  } else {
    player.coyote = Math.max(0, player.coyote - dt);
  }

  /* ICE */
  for(const ice of levelData.iceZones){
    if(
      player.x + player.w > ice.x &&
      player.x < ice.x + ice.w &&
      player.y + player.h > ice.y &&
      player.y < ice.y + ice.h
    ){
      player.slowTimer = 0.25;
      player.vx *= 0.98;
    }
  }

  /* SPRINGS */
  for(const s of levelData.springs){
    if(rectHit(player, s) && player.vy >= 0){
      player.vy = -s.power;
      player.grounded = false;
      particleBurst(s.x, s.y, "normal");
    }
  }

  /* STARS */
  for(const s of levelData.stars){
    if(s.taken) continue;
    if(Math.hypot(player.x + player.w/2 - s.x, player.y + player.h/2 - s.y) < 32){
      s.taken = true;
      particleBurst(s.x, s.y);
    }
  }

  /* CRACKS */
  for(const c of levelData.cracks){
    const hit = player.x + player.w > c.x && player.x < c.x + c.w && player.y + player.h >= c.y - 12 && player.y + player.h <= c.y + 25;
    if(hit && !c.active){
      c.active = true;
      c.timer = Math.max(0.25, 0.8 - levelData.tier.d * 0.5);
    }
    if(c.active && !c.broken){
      c.timer -= dt;
      if(c.timer <= 0){
        c.broken = true;
        particleBurst(c.x + c.w/2, c.y, "danger");
      }
    }
    if(c.broken && rectHit(player, {x:c.x, y:c.y, w:c.w, h:30})){
      player.vy += 300;
    }
  }

  /* BALLS */
  for(const b of levelData.balls){
    b.targetTimer -= dt;
    if(b.targetTimer <= 0){
      b.dir = player.x > b.x ? 1 : -1;
      b.targetTimer = Math.max(0.2, 0.6 + random(level * 77) * 0.8 - levelData.tier.d * 0.3);
    }
    b.x += b.dir * b.speed * dt;
    if(b.x <= b.minX){ b.x = b.minX; b.dir = 1; }
    if(b.x >= b.maxX){ b.x = b.maxX; b.dir = -1; }

    if(circleHit(b.x, b.y, b.r, player)){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* SAWS */
  for(const s of levelData.saws){
    s.y = s.baseY + Math.sin(now * s.speed + s.phase) * s.amp;
    if(circleHit(s.x, s.y, s.r, player)){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* LASERS */
  for(const l of levelData.lasers){
    const phase = (now + l.phase) % l.period;
    const active = phase > l.warning;
    if(active && rectHit(player, {x:l.x, y:l.y, w:l.w, h:l.h})){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* BOMBS */
  for(const b of levelData.bombs){
    b.timer -= dt;
    b.pulse += dt;
    if(b.timer <= 0){
      const distance = Math.hypot(player.x + player.w/2 - b.x, player.y + player.h/2 - b.y);
      if(distance < 120 + levelData.tier.d * 90){
        if(player.invincible <= 0){ resetLevel(); return; }
      }
      b.timer = 0.6 + random(performance.now()) * 1.2;
    }
  }

  /* FALLERS */
  for(const f of levelData.fallers){
    f.y += f.vy * dt;
    if(f.y > levelData.groundY + 40){ f.y = f.resetY; }
    if(rectHit(player, {x:f.x-6, y:f.y-6, w:f.w+12, h:f.h+12})){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* MOVING WALLS */
  for(const w of levelData.walls){
    w.x += Math.sin(now * w.speed + w.phase) * w.range * dt;
    if(rectHit(player, w)){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* PORTALS */
  for(const p of levelData.portals){
    if(p.used) continue;
    if(Math.hypot(player.x + player.w/2 - p.x, player.y + player.h/2 - p.y) < p.r + 18){
      p.used = true;
      player.x += p.targetOffset;
      particleBurst(p.x, p.y);
      screenShake = 9;
    }
  }

  /* REVERSE */
  for(const r of levelData.reverseZones){
    if(
      player.x + player.w > r.x &&
      player.x < r.x + r.w &&
      player.y + player.h > r.y &&
      player.y < r.y + r.h
    ){
      player.reverseTimer = r.time;
      dangerEl.classList.add("show");
    }
  }

  /* SPIKES */
  for(const h of levelData.hazards){
    if(rectHit(player, h)){
      if(player.invincible <= 0){ resetLevel(); return; }
    }
  }

  /* LIGHTNING */
  for(const l of levelData.lightnings){
    l.timer += dt;
    if(l.timer > l.cool){ l.timer = 0; }
    const phase = l.timer / l.cool;
    const strikeStart = l.warning / l.cool;

    if(phase >= strikeStart && phase < strikeStart + 0.16){
      stormFlash = 1;
      if(Math.abs(player.x + player.w/2 - l.x) < 52 && player.y > l.y - 20){
        if(player.invincible <= 0){ resetLevel(); return; }
      }
    }
  }

  /* CHAOS TRAPS */
  for(const c of levelData.chaos){
    const t = now + c.phase;
    let hit = false;
    let xx = c.x;
    let yy = c.y;

    if(c.type === 0){ xx += Math.sin(t*2)*45; yy += Math.cos(t*1.5)*35; hit = circleHit(xx, yy, c.size, player); }
    else if(c.type === 1){ hit = rectHit(player, {x: xx + Math.sin(t)*70, y: yy, w: c.size*2, h: c.size}); }
    else if(c.type === 2){ hit = rectHit(player, {x: xx, y: yy + Math.sin(t*2)*50, w: c.size, h: c.size*3}); }
    else if(c.type === 3){ xx += Math.cos(t*2)*60; yy += Math.sin(t*2)*60; hit = circleHit(xx, yy, c.size, player); }
    else if(c.type === 4){ hit = circleHit(c.x, c.y, c.size * (1 + Math.sin(t*6)*0.6), player); }
    else if(c.type === 5){ hit = circleHit(c.x, c.y + ((t*c.speed)%300), c.size*0.7, player); }
    else if(c.type === 6){ hit = rectHit(player, {x: c.x-90, y: c.y + Math.sin(t*2)*100, w: 180, h: 6}); }
    else if(c.type === 7){ xx += Math.cos(t)*80; yy += Math.sin(t)*80; hit = circleHit(xx, yy, c.size, player); }
    else if(c.type === 8){ hit = rectHit(player, {x: xx + Math.sin(t*2)*50, y: c.y-80, w: c.size, h: 160}); }
    else if(c.type === 9){ hit = circleHit(c.x, c.y + Math.abs(Math.sin(t*2))*90, c.size, player); }
    else if(c.type === 10){ hit = circleHit(c.x + Math.sin(t*3)*100, c.y, c.size, player); }
    else if(c.type === 11){ hit = circleHit(c.x + Math.sin(t)*60, c.y + Math.cos(t)*60, c.size, player); }
    else if(c.type === 12){ hit = rectHit(player, {x: c.x + Math.sin(t)*40, y: c.y + Math.cos(t)*40, w: c.size, h: c.size}); }
    else { if(Math.sin(t * c.speed * 0.04) > 0.75){ hit = circleHit(c.x, c.y, c.size, player); } }

    if(hit && player.invincible <= 0){
      resetLevel();
      return;
    }
  }

  if(levelData.tier.d > 0.5 || player.reverseTimer > 0){
    dangerEl.classList.add("show");
  } else {
    dangerEl.classList.remove("show");
  }

  stormFlash = Math.max(0, stormFlash - dt * 6);
  screenShake = Math.max(0, screenShake - dt * 20);

  if(player.y > H + 180){
    resetLevel();
    return;
  }

  let gateBlocked = false;
  for(const g of levelData.finishGates){
    const phase = (now + g.phase) % g.period;
    if(phase < g.period * 0.6 && rectHit(player, {x:g.x, y:g.y, w:g.w, h:g.h})){
      gateBlocked = true;
    }
  }

  if(!gateBlocked && player.x + player.w >= levelData.finishX){
    winLevel();
    return;
  }

  const targetCamera = Math.max(0, player.x - W * 0.32);
  cameraX += (targetCamera - cameraX) * Math.min(1, dt * 8);
}

/* =========================================================
   BACKGROUND (HELL MODE)
========================================================= */

function drawBackground(){

  const d = levelData ? levelData.tier.d : 0;

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, d > 0.5 ? "#1a0814" : "#101116");
  sky.addColorStop(0.55, d > 0.5 ? "#260c1f" : "#1c1e28");
  sky.addColorStop(1, d > 0.5 ? "#0c040a" : "#0d0e12");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cameraX * 0.12, 0);

  for(let i = 0; i < 35; i++){
    const x = i * 280 + 100;
    const y = 95 + (i % 4) * 45;

    ctx.fillStyle = d > 0.5 ? "rgba(255,42,95,.08)" : "rgba(255,255,255,.12)";
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI*2);
    ctx.arc(x+30, y-8, 35, 0, Math.PI*2);
    ctx.arc(x+65, y, 25, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  if(stormFlash > 0){
    ctx.fillStyle = `rgba(255,42,95,${Math.min(0.6, stormFlash * 0.6)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   WORLD DRAW
========================================================= */

function drawWorld(){

  ctx.save();

  let sx = 0;
  let sy = 0;

  if(screenShake > 0){
    sx = (Math.random() - 0.5) * screenShake;
    sy = (Math.random() - 0.5) * screenShake;
  }

  ctx.translate(-cameraX + sx, sy);

  /* PLATFORMS */
  for(const p of levelData.platforms){
    ctx.fillStyle = "#1e1b26";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#ff2a5f";
    ctx.fillRect(p.x, p.y, p.w, 7);
  }

  /* MOVING PLATFORMS */
  for(const p of levelData.movingPlatforms){
    ctx.fillStyle = "#2d1b36";
    ctx.fillRect(p.x - p.w/2, p.y, p.w, p.h);
    ctx.fillStyle = "#ff5588";
    ctx.fillRect(p.x - p.w/2, p.y, p.w, 6);
  }

  /* DISAPPEARING */
  for(const p of levelData.disappearingPlatforms){
    if(!p.active) continue;
    ctx.globalAlpha = 0.4 + 0.6 * Math.min(1, p.timer);
    ctx.fillStyle = "#7b00ff";
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.globalAlpha = 1;
  }

  /* FAKE */
  for(const p of levelData.fakePlatforms){
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  /* SLOPES */
  for(const s of levelData.slopes){
    ctx.fillStyle = "#1e1b26";
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.w, s.y - s.rise);
    ctx.lineTo(s.x + s.w, s.y + 55 - s.rise);
    ctx.lineTo(s.x, s.y + 55);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ff2a5f";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.w, s.y - s.rise);
    ctx.stroke();
  }

  /* ICE */
  for(const ice of levelData.iceZones){
    ctx.fillStyle = "rgba(100,220,255,.65)";
    ctx.fillRect(ice.x, ice.y, ice.w, ice.h);
  }

  /* CRACKS */
  for(const c of levelData.cracks){
    if(c.broken){
      ctx.fillStyle = "#050508";
      ctx.fillRect(c.x-4, c.y-4, c.w+8, 24);
      continue;
    }
    ctx.fillStyle = c.active ? "#ff2a5f" : "#444";
    ctx.fillRect(c.x, c.y, c.w, 8);
  }

  /* SPIKES */
  for(const h of levelData.hazards){
    ctx.fillStyle = "#ff1e56";
    ctx.beginPath();
    ctx.moveTo(h.x, h.y + h.h);
    ctx.lineTo(h.x + h.w/2, h.y - 10);
    ctx.lineTo(h.x + h.w, h.y + h.h);
    ctx.closePath();
    ctx.fill();
  }

  /* STARS */
  for(const s of levelData.stars){
    if(s.taken) continue;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(performance.now()/600);
    ctx.fillStyle = "#ffcc00";
    ctx.beginPath();
    for(let i=0; i<10; i++){
      const a = i * Math.PI / 5;
      const r = i % 2 === 0 ? 11 : 5;
      const xx = Math.cos(a)*r;
      const yy = Math.sin(a)*r;
      if(i===0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* BALLS */
  for(const b of levelData.balls){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = "#ff2a5f";
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, b.r-4, 0, Math.PI*1.5);
    ctx.stroke();
    ctx.restore();
  }

  /* SAWS */
  for(const s of levelData.saws){
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(performance.now()/100);
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    for(let i=0; i<16; i++){
      const a = i * Math.PI / 8;
      const r = i % 2 === 0 ? s.r : s.r * 0.6;
      const xx = Math.cos(a)*r;
      const yy = Math.sin(a)*r;
      if(i===0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* LASERS */
  for(const l of levelData.lasers){
    const phase = (now + l.phase) % l.period;
    const active = phase > l.warning;
    ctx.fillStyle = active ? "rgba(255,0,80,.95)" : "rgba(255,200,50,.4)";
    ctx.fillRect(l.x, l.y, l.w, active ? l.h*2 : l.h);
  }

  /* BOMBS */
  for(const b of levelData.bombs){
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#ff0055";
    ctx.beginPath();
    ctx.arc(b.x-3, b.y-3, 4, 0, Math.PI*2);
    ctx.fill();
  }

  /* FALLERS */
  for(const f of levelData.fallers){
    ctx.fillStyle = "#b533ff";
    ctx.fillRect(f.x, f.y, f.w, f.h);
  }

  /* WIND */
  for(const w of levelData.windZones){
    ctx.fillStyle = "rgba(255,42,95,.05)";
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }

  /* SPRINGS */
  for(const s of levelData.springs){
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }

  /* PORTALS */
  for(const p of levelData.portals){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(performance.now()/400);
    ctx.strokeStyle = p.used ? "rgba(100,100,100,.3)" : "#ff0055";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  /* GRAVITY & REVERSE ZONES */
  for(const g of levelData.gravityZones){
    ctx.fillStyle = "rgba(120,0,255,.06)";
    ctx.fillRect(g.x, g.y, g.w, g.h);
  }
  for(const r of levelData.reverseZones){
    ctx.fillStyle = "rgba(255,0,100,.06)";
    ctx.fillRect(r.x, r.y, r.w, r.h);
  }

  /* WALLS */
  for(const w of levelData.walls){
    ctx.fillStyle = "#7b00ff";
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }

  /* LIGHTNINGNING */
  for(const l of levelData.lightnings){
    const phase = l.timer / l.cool;
    const warning = l.warning / l.cool;
    if(phase < warning){
      ctx.fillStyle = "rgba(255,255,0,.85)";
      ctx.beginPath();
      ctx.arc(l.x, l.y, 8, 0, Math.PI*2);
      ctx.fill();
    } else if(phase < warning + 0.16){
      ctx.strokeStyle = "#ff2a5f";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(l.x, l.y);
      ctx.lineTo(l.x-15, l.y+40);
      ctx.lineTo(l.x+10, l.y+40);
      ctx.lineTo(l.x-5, l.y+95);
      ctx.stroke();
    }
  }

  /* FINISH GATES */
  for(const g of levelData.finishGates){
    const phase = (now + g.phase) % g.period;
    const active = phase < g.period * 0.6;
    ctx.fillStyle = active ? "rgba(255,0,80,.9)" : "rgba(0,255,150,.4)";
    ctx.fillRect(g.x, g.y, g.w, g.h);
  }

  /* CHAOS TRAPS */
  for(const c of levelData.chaos){
    ctx.fillStyle = "rgba(255,0,85,.6)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
    ctx.fill();
  }

  /* FINISH FLAG */
  const fx = levelData.finishX;
  ctx.fillStyle = "#111";
  ctx.fillRect(fx, levelData.groundY-120, 7, 120);
  ctx.fillStyle = "#ff0055";
  ctx.beginPath();
  ctx.moveTo(fx+7, levelData.groundY-120);
  ctx.lineTo(fx+75, levelData.groundY-94);
  ctx.lineTo(fx+7, levelData.groundY-68);
  ctx.closePath();
  ctx.fill();

  /* PLAYER */
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = "#ff2a5f";
  ctx.beginPath();
  ctx.roundRect(0, 0, player.w, player.h, 8);
  ctx.fill();

  if(player.dashTime > 0){
    ctx.fillStyle = "rgba(255,42,95,.4)";
    ctx.fillRect(-25, 5, 20, 30);
  }

  /* EYES & SMILE */
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(10, 12, 5, 0, Math.PI*2);
  ctx.arc(23, 12, 5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(11, 12, 2, 0, Math.PI*2);
  ctx.arc(24, 12, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(17, 17, 9, 0, Math.PI);
  ctx.stroke();

  ctx.restore();

  /* PARTICLES */
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.font = "900 15px system-ui";
  ctx.fillText("دۆزەخی سان 😎", player.x + 100, player.y - 30);

  ctx.restore();
}

/* =========================================================
   SAN POSITION
========================================================= */

function updateSanPosition(){
  const positions=[
    {right:18,top:110},
    {right:W*.28,top:90},
    {right:35,top:180},
    {right:W*.45,top:120},
    {right:20,top:250}
  ];

  const p = positions[(level-1)%positions.length];
  san.style.right = p.right+"px";
  san.style.top = p.top+"px";

  const size = Math.min(86, Math.max(64, W*.19));
  san.style.width = size+"px";
  san.style.height = size+"px";
}

/* =========================================================
   DRAW LOOP
========================================================= */

function draw(){
  drawBackground();
  if(levelData){
    drawWorld();
  }
  updateSanPosition();
}

function loop(time){
  if(!playing) return;

  const dt = Math.min(0.033, Math.max(0.001, (time - lastTime)/1000));
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

levelData = makeLevel(level);
levelEl.textContent = level;
tierEl.textContent = "• " + levelData.tier.name;
draw();

</script>
