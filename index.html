<script>

"use strict";

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");
const levelEl = document.getElementById("level");
const levelIdea = document.getElementById("levelIdea");
const san = document.getElementById("san");
const win = document.getElementById("win");
const winText = document.getElementById("winText");
const finishBanner = document.getElementById("finishBanner");

let W = innerWidth;
let H = innerHeight;

let DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    DPR, 0, 0, DPR, 0, 0
  );
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY = "san_b_ahamd_saved_level_v4";
const TOTAL_LEVELS = 5000;

let savedLevel = parseInt(
  localStorage.getItem(SAVE_KEY) || "1",
  10
);

if(
  !Number.isFinite(savedLevel) ||
  savedLevel < 1 ||
  savedLevel > TOTAL_LEVELS
){
  savedLevel = 1;
}

let level = savedLevel;


/* =========================================================
   GAME STATE
========================================================= */

let playing = false;
let paused = false;
let cameraX = 0;
let lastTime = 0;

let levelData = null;
let levelWon = false;

let gameTime = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:250,
  jumpPower:620,

  grounded:false,
  coyote:0,

  previousY:0,

  invincible:0,

  dashCooldown:0

};


/* =========================================================
   INPUT
========================================================= */

const input = {
  x:0
};


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickPointer = null;

function setJoystick(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left + r.width / 2;

  let dx =
    e.clientX - cx;

  const max = 42;

  dx = Math.max(
    -max,
    Math.min(max, dx)
  );

  input.x = dx / max;

  stick.style.transform =
    `translateX(${dx}px)`;
}

function resetJoystick(){

  joystickPointer = null;

  input.x = 0;

  stick.style.transform =
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    joystickPointer = e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);

  }
);

joystick.addEventListener(
  "pointermove",
  e => {

    if(
      e.pointerId ===
      joystickPointer
    ){

      e.preventDefault();

      setJoystick(e);

    }

  }
);

joystick.addEventListener(
  "pointerup",
  e => {

    if(
      e.pointerId ===
      joystickPointer
    ){

      resetJoystick();

    }

  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn =
  document.getElementById("jumpBtn");

const dashBtn =
  document.getElementById("dashBtn");

const resetBtn =
  document.getElementById("resetBtn");

const nextQuickBtn =
  document.getElementById("nextQuickBtn");


function jump(){

  if(
    player.grounded ||
    player.coyote > 0
  ){

    player.vy =
      -player.jumpPower;

    player.grounded = false;

    player.coyote = 0;

  }
}


jumpBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    jump();

  }
);


dashBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    if(player.dashCooldown > 0)
      return;

    let dir = input.x;

    if(Math.abs(dir) < .1)
      dir = 1;

    player.vx = dir * 680;

    player.dashCooldown = .75;

  }
);


resetBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    resetLevel();

  }
);


nextQuickBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    if(levelWon)
      nextLevel();

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.x = -1;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.x = 1;

    }

    if(
      e.key === " " ||
      e.key === "ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "keyup",
  e => {

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){

      input.x = 0;

    }

  }
);


/* =========================================================
   IPHONE
========================================================= */

document.addEventListener(
  "gesturestart",
  e => e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e => e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e => e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e => e.preventDefault(),
  {passive:false}
);


/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x =
    Math.sin(n * 12.9898) *
    43758.5453123;

  return x - Math.floor(x);

}


/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficulty(n){

  if(n <= 1666){

    return {
      tier:"سەرەتایی",
      value:n / 1666,
      obstacle:1,
      gap:1,
      speed:1,
      storm:.35,
      crack:.25,
      falling:.20
    };

  }

  if(n <= 3332){

    return {
      tier:"ناوەند",
      value:(n - 1666) / 1666,
      obstacle:1.35,
      gap:1.25,
      speed:1.25,
      storm:.65,
      crack:.65,
      falling:.60
    };

  }

  return {

    tier:"پڕۆفیشناڵ",

    value:
      (n - 3332) / 1668,

    obstacle:1.8,
    gap:1.55,
    speed:1.55,
    storm:1,
    crack:1,
    falling:1

  };

}


/* =========================================================
   IDEAS
========================================================= */

const ideas = [

  "💡 Jump the tiny wall.",
  "💡 The gap looks scary. It isn't.",
  "💡 Grab the star before moving on.",
  "💡 Small jump. Big brain.",
  "💡 Don't rush the moving block.",
  "💡 Try the upper route.",
  "💡 Wait... then jump!",
  "💡 The spikes are pretending to be scary.",
  "💡 Follow the stars.",
  "💡 Short jump, short problem.",
  "💡 Dash across the gap.",
  "💡 Look before you jump.",
  "💡 One obstacle at a time.",
  "💡 Watch the ball!",
  "💡 The road is tilted.",
  "💡 Think before you jump.",
  "⚡ Watch the sky!",
  "🕳️ The ground may crack!",
  "⚽ Don't let the ball hit you!",
  "☄️ Something is falling from above!",
  "💡 Sometimes waiting is smarter than running.",
  "💡 Professional levels need timing.",
  "💡 Jump first, dash second.",
  "💡 The safest road is not always the fastest."
];


/* =========================================================
   LEVEL GENERATOR
   5000 DIFFERENT LEVELS
========================================================= */

function makeLevel(n){

  const d = getDifficulty(n);

  const groundY =
    H -
    Math.max(
      125,
      Math.min(165, H * .18)
    );

  const platforms = [];
  const hazards = [];
  const stars = [];
  const balls = [];
  const slopes = [];
  const cracks = [];
  const fallingObjects = [];
  const lightning = [];

  /*
    START AREA
    Always safe.
  */

  platforms.push({

    x:-300,
    y:groundY,
    w:500,
    h:75

  });


  let x = 270;


  /*
    OBSTACLE COUNT
  */

  const obstacleCount =
    6 +
    Math.floor(
      d.obstacle * 7 +
      d.value * 4
    );


  for(
    let i=0;
    i<obstacleCount;
    i++
  ){

    const r =
      random(n * 100 + i * 19);


    /*
      GAP
      Increased gradually,
      but always reachable by jump/dash.
    */

    const gap =
      65 +
      Math.floor(
        r * 40 * d.gap +
        d.value * 25
      );


    x += gap;


    /*
      PLATFORM
    */

    const width =
      115 +
      Math.floor(
        random(n * 200 + i * 31) *
        Math.max(
          45,
          100 - d.value * 20
        )
      );


    /*
      HEIGHT
    */

    const maxRise =
      20 +
      d.value * 60;


    const py =
      groundY -
      Math.floor(
        random(n * 300 + i * 17) *
        maxRise
      );


    platforms.push({

      x:x,
      y:py,
      w:width,
      h:18

    });


    /*
      STAR
    */

    if(
      i % 2 === 0 ||
      r > .55
    ){

      stars.push({

        x:x + width * .5,

        y:py - 38,

        r:9,

        taken:false

      });

    }


    /*
      SPIKES
    */

    const spikeChance =
      .28 +
      d.value * .35;


    if(
      random(n * 500 + i) <
      spikeChance &&
      width > 125
    ){

      const spikeX =
        x +
        30 +
        Math.floor(
          random(n * 510 + i) *
          Math.max(
            20,
            width - 70
          )
        );


      hazards.push({

        x:spikeX,

        y:py - 22,

        w:24,

        h:22

      });

    }


    /*
      EARTH CRACK
    */

    const crackChance =
      .12 +
      d.crack * .35;


    if(
      random(n * 600 + i) <
      crackChance &&
      width > 120
    ){

      const crackX =
        x +
        25 +
        Math.floor(
          random(n * 610 + i) *
          Math.max(
            30,
            width - 70
          )
        );


      cracks.push({

        x:crackX,

        y:py,

        w:
          28 +
          Math.floor(
            random(n * 620 + i) * 28
          ),

        timer:0,

        triggered:false,

        collapsed:false

      });

    }


    /*
      SIDE BALL
    */

    const ballChance =
      .10 +
      d.value * .32;


    if(
      random(n * 700 + i) <
      ballChance
    ){

      balls.push({

        x:x + width + 90,

        y:py - 22,

        r:17,

        speed:
          120 +
          d.speed * 75,

        minX:x - 30,

        maxX:x + width + 200,

        dir:
          random(n * 710 + i) > .5
          ? 1
          : -1

      });

    }


    /*
      SLOPE
    */

    if(
      i % 5 === 2 ||
      random(n * 800 + i) <
      .15 + d.value * .25
    ){

      const sx =
        x + width + 35;

      const sw =
        170 +
        Math.floor(
          random(n * 810 + i) * 90
        );

      const rise =
        25 +
        Math.floor(
          random(n * 820 + i) *
          (35 + d.value * 35)
        );


      slopes.push({

        x:sx,

        y:groundY,

        w:sw,

        rise:rise

      });


      x = sx + sw;

    }else{

      x += width;

    }


    /*
      FALLING BALLS
      These fall from above.
    */

    const fallingChance =
      .08 +
      d.falling * .35;


    if(
      random(n * 900 + i) <
      fallingChance
    ){

      fallingObjects.push({

        x:
          x -
          width * .5,

        y:
          groundY -
          360,

        r:
          12 +
          Math.floor(
            random(n * 910 + i) * 7
          ),

        vy:0,

        active:false,

        delay:
          .5 +
          random(n * 920 + i) * 2

      });

    }


    /*
      LIGHTNING
    */

    const lightningChance =
      .04 +
      d.storm * .22;


    if(
      random(n * 1000 + i) <
      lightningChance
    ){

      lightning.push({

        x:
          x -
          width * .25,

        warning:0,

        strike:false,

        cooldown:
          1 +
          random(n * 1010 + i) * 2

      });

    }

  }


  /*
    FINAL SAFE AREA
  */

  const finalStart =
    x + 50;


  platforms.push({

    x:finalStart,

    y:groundY,

    w:360,

    h:75

  });


  /*
    FINAL FLAG
  */

  const finishX =
    finalStart + 110;


  return {

    groundY,

    platforms,

    hazards,

    stars,

    balls,

    slopes,

    cracks,

    fallingObjects,

    lightning,

    finishX,

    difficulty:d,

    idea:
      ideas[
        (n - 1) %
        ideas.length
      ]

  };

}


/* =========================================================
   SAVE
========================================================= */

function saveLevel(){

  localStorage.setItem(
    SAVE_KEY,
    String(level)
  );

}


/* =========================================================
   RESET
========================================================= */

function resetLevel(){

  levelWon = false;
  paused = false;

  gameTime = 0;

  levelData =
    makeLevel(level);


  player.x = 70;

  player.y =
    levelData.groundY -
    player.h;

  player.previousY =
    player.y;

  player.vx = 0;
  player.vy = 0;

  player.grounded = true;
  player.coyote = 0;

  player.invincible = 0;
  player.dashCooldown = 0;

  cameraX = 0;


  levelEl.textContent =
    level;


  levelIdea.textContent =
    `LEVEL ${level} — ${levelData.difficulty.tier}: ${levelData.idea}`;


  win.style.display = "none";

  saveLevel();

}


/* =========================================================
   START
========================================================= */

startBtn.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    intro.style.display = "none";

    playing = true;

    resetLevel();

    lastTime =
      performance.now();

    requestAnimationFrame(loop);

  }
);


/* =========================================================
   COLLISION
========================================================= */

function intersects(a,b){

  return(

    a.x <
      b.x + b.w &&

    a.x + a.w >
      b.x &&

    a.y <
      b.y + b.h &&

    a.y + a.h >
      b.y

  );

}


/* =========================================================
   PLAYER HIT
========================================================= */

function playerHit(){

  if(player.invincible > 0)
    return;

  resetLevel();

}


/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)
    return;

  levelWon = true;

  paused = true;

  saveLevel();


  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );


  winText.textContent =
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display = "flex";

}


/* =========================================================
   NEXT
========================================================= */

function nextLevel(){

  if(level >= TOTAL_LEVELS){

    level = 1;

  }else{

    level++;

  }

  saveLevel();

  resetLevel();

}


/* =========================================================
   WIN BUTTONS
========================================================= */

document
  .getElementById("retryBtn")
  .addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      resetLevel();

    }
  );


document
  .getElementById("nextBtn")
  .addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      nextLevel();

    }
  );


/* =========================================================
   SLOPE
========================================================= */

function slopeSurfaceY(s,x){

  const t =
    Math.max(
      0,
      Math.min(
        1,
        (x - s.x) / s.w
      )
    );

  return s.y - s.rise * t;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    paused ||
    !levelData
  )
    return;


  gameTime += dt;


  player.previousY =
    player.y;


  if(player.invincible > 0)
    player.invincible -= dt;


  if(player.dashCooldown > 0)
    player.dashCooldown -= dt;


  const oldY =
    player.y;

  const oldBottom =
    oldY + player.h;


  /*
    MOVEMENT
  */

  const targetVX =
    input.x *
    player.speed;


  player.vx +=
    (
      targetVX -
      player.vx
    ) *
    Math.min(
      1,
      dt * 12
    );


  player.vy +=
    1550 * dt;


  player.x +=
    player.vx * dt;


  player.y +=
    player.vy * dt;


  player.grounded = false;


  /*
    NORMAL PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    const horizontal =
      player.x + player.w > p.x &&
      player.x < p.x + p.w;


    const newBottom =
      player.y + player.h;


    const descending =
      player.vy >= 0;


    const crossedTop =
      oldBottom <= p.y + 8 &&
      newBottom >= p.y;


    if(
      horizontal &&
      descending &&
      crossedTop
    ){

      player.y =
        p.y - player.h;

      player.vy = 0;

      player.grounded = true;

    }

  }


  /*
    SLOPES
  */

  for(
    const s
    of levelData.slopes
  ){

    if(
      player.x + player.w > s.x &&
      player.x < s.x + s.w
    ){

      const surface =
        slopeSurfaceY(
          s,
          player.x +
          player.w * .5
        );


      const bottom =
        player.y +
        player.h;


      if(
        player.vy >= 0 &&
        bottom >= surface &&
        oldBottom <= surface + 14
      ){

        player.y =
          surface -
          player.h;

        player.vy = 0;

        player.grounded = true;

      }

    }

  }


  /*
    COYOTE TIME
  */

  if(player.grounded){

    player.coyote = .12;

  }else{

    player.coyote =
      Math.max(
        0,
        player.coyote - dt
      );

  }


  /*
    EARTH CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    if(c.collapsed)
      continue;


    const crackRect = {

      x:c.x,

      y:c.y - 9,

      w:c.w,

      h:18

    };


    if(
      !c.triggered &&
      intersects(player, crackRect)
    ){

      c.triggered = true;

      c.timer = .55;

    }


    if(c.triggered){

      c.timer -= dt;


      if(c.timer <= 0){

        c.collapsed = true;

      }

    }


    if(
      c.collapsed &&
      intersects(player, {

        x:c.x,

        y:c.y - 12,

        w:c.w,

        h:40

      })
    ){

      playerHit();

      return;

    }

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)
      continue;


    const dx =
      player.x +
      player.w / 2 -
      s.x;


    const dy =
      player.y +
      player.h / 2 -
      s.y;


    if(
      Math.hypot(dx,dy) < 30
    ){

      s.taken = true;

    }

  }


  /*
    SIDE BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    b.x +=
      b.dir *
      b.speed *
      dt;


    if(b.x <= b.minX){

      b.x = b.minX;
      b.dir = 1;

    }


    if(b.x >= b.maxX){

      b.x = b.maxX;
      b.dir = -1;

    }


    const dx =
      player.x +
      player.w / 2 -
      b.x;


    const dy =
      player.y +
      player.h / 2 -
      b.y;


    if(
      Math.hypot(dx,dy) <
      b.r + 18
    ){

      playerHit();

      return;

    }

  }


  /*
    FALLING OBJECTS
  */

  for(
    const b
    of levelData.fallingObjects
  ){

    if(!b.active){

      b.delay -= dt;

      if(b.delay <= 0){

        b.active = true;

        b.vy = 80;

      }

    }else{

      b.vy += 1450 * dt;

      b.y += b.vy * dt;


      /*
        Small horizontal movement
        makes it harder to predict.
      */

      b.x +=
        Math.sin(
          gameTime * 3 +
          b.r
        ) *
        30 *
        dt;


      const hit = {

        x:b.x - b.r,

        y:b.y - b.r,

        w:b.r * 2,

        h:b.r * 2

      };


      if(
        intersects(player,hit)
      ){

        playerHit();

        return;

      }


      /*
        Reset object after falling.
      */

      if(b.y > H + 200){

        b.y =
          levelData.groundY -
          360;

        b.vy = 0;

        b.active = false;

        b.delay =
          .7 +
          Math.random() * 1.5;

      }

    }

  }


  /*
    LIGHTNING
  */

  for(
    const l
    of levelData.lightning
  ){

    if(l.strike){

      l.cooldown -= dt;


      const strikeRect = {

        x:l.x - 17,

        y:0,

        w:34,

        h:H

      };


      if(
        intersects(player,strikeRect)
      ){

        playerHit();

        return;

      }


      if(l.cooldown <= 0){

        l.strike = false;

        l.warning = 0;

        l.cooldown =
          1.5 +
          Math.random() * 2;

      }

    }else{

      l.cooldown -= dt;


      if(l.cooldown <= 0){

        /*
          WARNING BEFORE LIGHTNING
        */

        l.warning = .65;

        l.strike = true;

      }

    }

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    if(
      intersects(
        player,
        h
      )
    ){

      playerHit();

      return;

    }

  }


  /*
    FALL
  */

  if(
    player.y >
    H + 150
  ){

    playerHit();

    return;

  }


  /*
    FINISH
  */

  if(
    player.x +
    player.w >=
    levelData.finishX
  ){

    winLevel();

    return;

  }


  /*
    CAMERA
  */

  const targetCamera =
    Math.max(
      0,
      player.x -
      W * .32
    );


  cameraX +=
    (
      targetCamera -
      cameraX
    ) *
    Math.min(
      1,
      dt * 7
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      0,0,0,H
    );


  sky.addColorStop(
    0,
    "#8fd3ff"
  );

  sky.addColorStop(
    .55,
    "#b9e8b0"
  );

  sky.addColorStop(
    1,
    "#e9d8a6"
  );


  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.save();

  ctx.translate(
    -cameraX * .12,
    0
  );


  for(
    let i=0;
    i<30;
    i++
  ){

    const x =
      i * 280 + 100;

    const y =
      95 +
      (i % 4) * 45;


    ctx.fillStyle =
      "rgba(255,255,255,.45)";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      28,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 30,
      y - 8,
      35,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 65,
      y,
      25,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.save();

  ctx.translate(
    -cameraX,
    0
  );


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    ctx.fillStyle =
      "#292b31";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );


    ctx.fillStyle =
      "#65d878";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      7
    );


    ctx.fillStyle =
      "rgba(255,255,255,.13)";


    for(
      let xx=p.x+18;
      xx<p.x+p.w;
      xx+=48
    ){

      ctx.fillRect(
        xx,
        p.y+22,
        12,
        5
      );

    }

  }


  /*
    SLOPES
  */

  for(
    const s
    of levelData.slopes
  ){

    ctx.fillStyle =
      "#292b31";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.lineTo(
      s.x+s.w,
      s.y+55-s.rise
    );

    ctx.lineTo(
      s.x,
      s.y+55
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle =
      "#65d878";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.stroke();

  }


  /*
    EARTH CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    ctx.save();

    if(c.collapsed){

      ctx.fillStyle =
        "#090909";

      ctx.fillRect(
        c.x,
        c.y - 3,
        c.w,
        32
      );

    }else{

      ctx.strokeStyle =
        c.triggered
        ? "#ff4d6d"
        : "#111";

      ctx.lineWidth =
        c.triggered
        ? 4
        : 3;


      ctx.beginPath();

      ctx.moveTo(
        c.x,
        c.y
      );

      ctx.lineTo(
        c.x + c.w*.25,
        c.y + 8
      );

      ctx.lineTo(
        c.x + c.w*.45,
        c.y - 5
      );

      ctx.lineTo(
        c.x + c.w*.7,
        c.y + 7
      );

      ctx.lineTo(
        c.x + c.w,
        c.y
      );

      ctx.stroke();

    }

    ctx.restore();

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    ctx.fillStyle =
      "#ef476f";

    ctx.beginPath();

    ctx.moveTo(
      h.x,
      h.y+h.h
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-10
    );

    ctx.lineTo(
      h.x+h.w,
      h.y+h.h
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold 9px system-ui";

    ctx.fillText(
      "!",
      h.x+9,
      h.y+10
    );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)
      continue;


    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now() / 700
    );

    ctx.fillStyle =
      "#ffd166";

    ctx.beginPath();


    for(
      let i=0;
      i<10;
      i++
    ){

      const a =
        i * Math.PI / 5;

      const r =
        i % 2 === 0
        ? 11
        : 5;


      const sx =
        Math.cos(a) * r;

      const sy =
        Math.sin(a) * r;


      if(i===0){

        ctx.moveTo(
          sx,
          sy
        );

      }else{

        ctx.lineTo(
          sx,
          sy
        );

      }

    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /*
    SIDE BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    drawBall(
      b.x,
      b.y,
      b.r
    );

  }


  /*
    FALLING BALLS
  */

  for(
    const b
    of levelData.fallingObjects
  ){

    if(!b.active)
      continue;


    drawBall(
      b.x,
      b.y,
      b.r
    );

  }


  /*
    LIGHTNING WARNING + STRIKE
  */

  for(
    const l
    of levelData.lightning
  ){

    if(l.strike){

      /*
        Warning flash
      */

      if(l.warning > 0){

        ctx.fillStyle =
          "rgba(255,255,0,.13)";

        ctx.fillRect(
          l.x - 28,
          0,
          56,
          H
        );

        ctx.fillStyle =
          "#fff";

        ctx.font =
          "900 18px system-ui";

        ctx.fillText(
          "⚡",
          l.x - 10,
          70
        );

      }


      /*
        Actual lightning
      */

      if(l.warning <= 0){

        ctx.strokeStyle =
          "#fff";

        ctx.lineWidth = 6;

        ctx.beginPath();

        ctx.moveTo(
          l.x,
          0
        );

        ctx.lineTo(
          l.x - 12,
          H*.25
        );

        ctx.lineTo(
          l.x + 10,
          H*.48
        );

        ctx.lineTo(
          l.x - 7,
          H*.72
        );

        ctx.lineTo(
          l.x,
          H
        );

        ctx.stroke();

      }

      l.warning -=
        1 / 60;

    }

  }


  /*
    FINISH FLAG
  */

  const fx =
    levelData.finishX;


  ctx.fillStyle =
    "#222";

  ctx.fillRect(
    fx,
    levelData.groundY - 120,
    7,
    120
  );


  ctx.fillStyle =
    "#ff4d6d";

  ctx.beginPath();

  ctx.moveTo(
    fx+7,
    levelData.groundY-120
  );

  ctx.lineTo(
    fx+75,
    levelData.groundY-94
  );

  ctx.lineTo(
    fx+7,
    levelData.groundY-68
  );

  ctx.closePath();

  ctx.fill();


  /*
    PLAYER
  */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  ctx.fillStyle =
    "#684cff";

  ctx.beginPath();

  ctx.roundRect(
    0,
    0,
    player.w,
    player.h,
    8
  );

  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    10,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    23,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    SMILE
  */

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    17,
    17,
    9,
    0,
    Math.PI
  );

  ctx.stroke();


  /*
    LEGS
  */

  ctx.fillStyle =
    "#222";

  ctx.fillRect(
    6,
    38,
    7,
    5
  );

  ctx.fillRect(
    21,
    38,
    7,
    5
  );


  ctx.restore();


  /*
    FUNNY TEXT
  */

  ctx.fillStyle =
    "rgba(20,20,20,.35)";

  ctx.font =
    "900 15px system-ui";


  ctx.fillText(
    "هەموو شتێک باشە 😎",
    player.x + 100,
    player.y - 30
  );


  ctx.restore();

}


/* =========================================================
   BALL DRAW
========================================================= */

function drawBall(x,y,r){

  ctx.save();

  ctx.translate(
    x,
    y
  );


  ctx.fillStyle =
    "#ff6b35";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "#fff";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r - 5,
    0,
    Math.PI * 1.5
  );

  ctx.stroke();


  /*
    Funny face
  */

  ctx.fillStyle =
    "#222";

  ctx.beginPath();

  ctx.arc(
    -5,
    -3,
    3,
    0,
    Math.PI*2
  );

  ctx.arc(
    5,
    -3,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   SAN IMAGE
========================================================= */

function updateSanPosition(){

  const positions = [

    {
      right:18,
      top:110
    },

    {
      right:W*.28,
      top:90
    },

    {
      right:35,
      top:180
    },

    {
      right:W*.45,
      top:120
    },

    {
      right:20,
      top:250
    }

  ];


  const p =
    positions[
      (level - 1) %
      positions.length
    ];


  san.style.right =
    p.right + "px";

  san.style.top =
    p.top + "px";


  const size =
    Math.min(
      86,
      Math.max(
        64,
        W * .19
      )
    );


  san.style.width =
    size + "px";

  san.style.height =
    size + "px";

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  if(levelData)
    drawWorld();

  updateSanPosition();

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!playing)
    return;


  const dt =
    Math.min(
      .033,
      Math.max(
        .001,
        (time - lastTime) / 1000
      )
    );


  lastTime = time;

  update(dt);

  draw();

  requestAnimationFrame(loop);

}


/* =========================================================
   INITIAL
========================================================= */

levelData =
  makeLevel(level);

levelEl.textContent =
  level;

draw();

</script>
