<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA: San Andreas - Web Edition 🚗</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #fff;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: #27272a;
            border: 3px solid #eab308;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.3);
        }
    </style>
</head>
<body>

    <div class="text-center mb-1">
        <h1 class="text-base font-black text-yellow-400">GTA: San Andreas (Street Life) 🌴</h1>
        <p class="text-[11px] text-gray-300" id="statusText">بارودۆخ: بە پێ دەڕوات 🚶‍♂️</p>
    </div>

    <canvas id="gameCanvas" width="380" height="340"></canvas>

    <!-- کۆنتڕۆڵی یاری وەک مۆبایل -->
    <div class="mt-2 flex justify-between w-[380px] px-2">
        <!-- دەستە چەپ: ڕۆیشتن / ڕاکردن و سواربوون -->
        <div class="flex flex-col gap-1.5">
            <button onclick="enterCar()" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-black font-black rounded-xl shadow text-xs active:scale-95 transition">
                🚗 سوار/دابەزین
            </button>
            <button onmousedown="startMove()" onmouseup="stopMove()" ontouchstart="startMove()" ontouchend="stopMove()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl shadow text-xs active:scale-95 transition">
                🏃‍♂️ ڕاکردن (چەپ)
            </button>
        </div>

        <!-- دەستە ڕاست: پێشەوە و دواوە -->
        <div class="flex flex-col gap-1.5">
            <button onmousedown="accelerate(1)" onmouseup="stopAccelerate()" ontouchstart="accelerate(1)" ontouchend="stopAccelerate()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow text-xs active:scale-95 transition">
                ⬆️ پێشەوە
            </button>
            <button onmousedown="accelerate(-1)" onmouseup="stopAccelerate()" ontouchstart="accelerate(-1)" ontouchend="stopAccelerate()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl shadow text-xs active:scale-95 transition">
                ⬇️ دواوە
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let isGameOver = false;

        const sanImg = new Image();
        sanImg.src = 'san.PNG';

        let player = {
            x: 180,
            y: 250,
            size: 35,
            speed: 3,
            inCar: false,
            dir: 0 // 0: پێشەوە، 1: چەپ، 2: ڕاست
        };

        let cars = [
            { x: 60, y: 50, width: 35, height: 60, color: "#ef4444", speed: 1.5 },
            { x: 280, y: 180, width: 35, height: 60, color: "#3b82f6", speed: -1.5 }
        ];

        let movingUp = false;
        let movingDown = false;
        let movingLeft = false;

        function startMove() {
            player.x -= 15;
            if(player.x < 20) player.x = 20;
        }

        function accelerate(val) {
            if(val === 1) movingUp = true;
            if(val === -1) movingDown = true;
        }

        function stopAccelerate() {
            movingUp = false;
            movingDown = false;
        }

        function enterCar() {
            // پشکنینی نزیکی لە سەیارەکان بۆ سواربوون
            cars.forEach(car => {
                let dist = Math.hypot(player.x - car.x, player.y - car.y);
                if(dist < 50) {
                    player.inCar = !player.inCar;
                    document.getElementById('statusText').innerText = player.inCar ? "بارودۆخ: سواری سەیارە بوو! 🏎️" : "بارودۆخ: بە پێ دەڕوات 🚶‍♂️";
                }
            });
        }

        function update() {
            if(isGameOver) return;

            // جووڵەی سەیارەکان لە شەقامدا
            cars.forEach(car => {
                car.y += car.speed;
                if(car.y > canvas.height) car.y = -70;
                if(car.y < -70) car.y = canvas.height;

                // پشکنینی پێکدادان ئەگەر بە پێ یان سەیارە بێت
                let pWidth = player.inCar ? 35 : player.size;
                let pHeight = player.inCar ? 60 : player.size;

                if(
                    player.x < car.x + car.width &&
                    player.x + pWidth > car.x &&
                    player.y < car.y + car.height &&
                    player.y + pHeight > car.y
                ) {
                    // ئەگەر لەناو سەیارەدا نەبێت و پێکدادان ڕووبدات واستد دەبێت
                    if(!player.inCar) {
                        isGameOver = true;
                    }
                }
            });

            if(movingUp) player.y -= player.inCar ? 4 : 2.5;
            if(movingDown) player.y += player.inCar ? 3 : 2;

            // سنوری شاشە
            if(player.y < 10) player.y = 10;
            if(player.y > canvas.height - 50) player.y = canvas.height - 50;

            score++;
        }

        function drawMap() {
            // زەوی و شەقامەکان
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // شەقامی سەرەکی (تۆنی خۆڵەمێشی GTA)
            ctx.fillStyle = "#334155";
            ctx.fillRect(40, 0, 300, canvas.height);

            // هێڵی ناوەڕاستی شەقام
            ctx.strokeStyle = "#eab308";
            ctx.setLineDash([15, 15]);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(190, 0); ctx.lineTo(190, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // کێشانی خانووەکان لە لای چەپ و ڕاست (ستایلی گیتا)
            ctx.fillStyle = "#78716c";
            // خانووی چەپ
            ctx.fillRect(0, 0, 40, 110);
            ctx.fillRect(0, 150, 40, 130);
            // خانووی ڕاست
            ctx.fillRect(340, 0, 40, 140);
            ctx.fillRect(340, 190, 40, 150);

            // دەرگاو پەنجەرەی خانووەکان بۆ جوانی گرافیکەکە
            ctx.fillStyle = "#292524";
            ctx.fillRect(10, 30, 20, 30);
            ctx.fillRect(350, 50, 20, 30);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawMap();

            // کێشانی سەیارەکانی ناو شەقام
            cars.forEach(car => {
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.width, car.height);
                // شووشەی سەیارە
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(car.x + 5, car.y + 10, 25, 12);
                ctx.fillRect(car.x + 5, car.y + 38, 25, 12);
            });

            // کێشانی کەسایەتی San (یان سەیارەکەی کاتێک سوار دەبێت)
            if(player.inCar) {
                ctx.fillStyle = "#eab308";
                ctx.fillRect(player.x, player.y, 35, 60);
                ctx.fillStyle = "#000";
                ctx.fillRect(player.x + 5, player.y + 12, 25, 15);
            } else {
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x + player.size/2, player.y + player.size/2, player.size/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                if (sanImg.complete && sanImg.naturalWidth !== 0) {
                    ctx.drawImage(sanImg, player.x, player.y, player.size, player.size);
                } else {
                    ctx.fillStyle = "#3b82f6";
                    ctx.fillRect(player.x, player.y, player.size, player.size);
                }
                ctx.restore();

                // نوسینی ناوی San لەسەری
                ctx.fillStyle = "#facc15";
                ctx.font = "bold 10px Vazirmatn";
                ctx.fillText("San", player.x + 8, player.y - 4);
            }

            // نیشاندانی خاڵەکان
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px Vazirmatn";
            ctx.fillText(`Score: ${Math.floor(score/10)}`, 15, 25);

            if(isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 22px Vazirmatn";
                ctx.textAlign = "center";
                ctx.fillText("WASTED 💀", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#eab308";
                ctx.font = "12px Vazirmatn";
                ctx.fillText("کلیک بکە بۆ دوبارە دەستپێکردنەوە", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }
        }

        canvas.addEventListener('click', () => {
            if(isGameOver) {
                score = 0;
                isGameOver = false;
                player.x = 180;
                player.y = 250;
                player.inCar = false;
            }
        });

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
