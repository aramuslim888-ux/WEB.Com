<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SAN B AHAMD — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101116;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  z-index:20;
  pointer-events:none;
}

.pill{
  background:rgba(20,30,24,.88);
  color:white;
  padding:12px 17px;
  border-radius:999px;
  font-size:15px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(10px);
}

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;

  background:
    radial-gradient(
      circle at 15% 20%,
      #ffd166 0 12%,
      transparent 13%
    ),
    radial-gradient(
      circle at 90% 90%,
      #7bdcb5 0 15%,
      transparent 16%
    ),
    #f07157;
}

.introCard{
  width:min(92vw,460px);
  padding:30px 24px;
}

.introTitle{
  margin:0;
  font-size:clamp(42px,12vw,76px);
  line-height:.88;
  font-weight:1000;
  text-transform:uppercase;
  color:#fff;
  text-shadow:4px 4px 0 #202020;
}

.introName{
  margin:18px 0 6px;
  font-size:18px;
  font-weight:900;
}

.creator{
  margin:0 0 24px;
  opacity:.9;
  font-size:14px;
}

#start{
  border:0;
  padding:15px 28px;
  border-radius:999px;
  background:#20283a;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.2);
}

#start:active{
  transform:translateY(4px);
  box-shadow:none;
}

#san{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:12;
  pointer-events:none;

  filter:
    drop-shadow(
      0 8px 8px rgba(0,0,0,.25)
    );

  animation:
    sanFunny 2.1s ease-in-out infinite;
}

@keyframes sanFunny{
  0%,100%{
    transform:
      rotate(-7deg)
      translateY(0)
      scale(1);
  }

  50%{
    transform:
      rotate(8deg)
      translateY(-8px)
      scale(1.04);
  }
}

#controls{
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
}

#joystick{
  position:absolute;

  left:
    max(20px, env(safe-area-inset-left) + 20px);

  bottom:
    max(24px, env(safe-area-inset-bottom) + 24px);

  width:126px;
  height:126px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.14),
      rgba(255,255,255,.05)
    );

  border:3px solid rgba(255,255,255,.55);

  box-shadow:
    inset 0 0 20px rgba(255,255,255,.08),
    0 8px 30px rgba(0,0,0,.18);

  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;

  width:60px;
  height:60px;

  left:30px;
  top:30px;

  border-radius:50%;

  background:rgba(255,255,255,.25);

  border:2px solid rgba(255,255,255,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  color:white;

  transition:transform .06s linear;
}

#actionArea{
  position:absolute;

  right:
    max(20px, env(safe-area-inset-right) + 20px);

  bottom:
    max(24px, env(safe-area-inset-bottom) + 24px);

  display:grid;

  grid-template-columns:82px 82px;

  gap:12px;

  pointer-events:none;
}

.action{
  width:82px;
  height:82px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.5);

  background:rgba(25,25,25,.55);

  color:white;

  font-size:14px;
  font-weight:1000;

  pointer-events:auto;
  touch-action:none;

  backdrop-filter:blur(8px);
}

.action:active{
  transform:scale(.93);
  background:rgba(108,76,255,.8);
}

#win{
  position:fixed;
  inset:0;

  z-index:90;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(7px);

  text-align:center;
}

.winCard{
  width:min(92vw,430px);

  background:#17181d;
  color:white;

  border-radius:28px;

  padding:28px 22px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.4);

  border:1px solid rgba(255,255,255,.1);
}

.winCard h1{
  margin:0 0 10px;
  font-size:30px;
}

.winCard p{
  line-height:1.6;
}

.winButtons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:18px;
}

.winButtons button{
  border:0;
  border-radius:15px;
  padding:13px 18px;
  font-size:15px;
  font-weight:900;
}

#nextBtn{
  background:#6c4cff;
  color:white;
}

#retryBtn{
  background:#30323a;
  color:white;
}

#levelIdea{
  position:fixed;

  left:50%;

  bottom:
    calc(env(safe-area-inset-bottom) + 170px);

  transform:translateX(-50%);

  width:min(90vw,480px);

  padding:10px 15px;

  text-align:center;

  border-radius:15px;

  background:rgba(10,10,12,.58);

  color:white;

  font-size:13px;
  font-weight:800;

  z-index:15;

  pointer-events:none;

  opacity:.9;
}

#finishBanner{
  position:fixed;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  z-index:60;

  color:white;

  background:#6c4cff;

  padding:18px 24px;

  border-radius:20px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:finishPop .8s ease forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  35%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">

  <div class="introCard">

    <h1 class="introTitle">
      SAN<br>B AHAMD
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 tiny challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>

</div>

<div id="hud">

  <div class="pill">
    SAN B AHAMD
  </div>

  <div class="pill">
    LEVEL
    <span id="level">1</span>
    / 5000
  </div>

</div>

<img
  id="san"
  src="san.PNG"
  alt=""
>

<div id="levelIdea">
  💡 Get ready...
</div>

<div id="controls">

  <div id="joystick">

    <div id="stick">
      ↔
    </div>

  </div>

  <div id="actionArea">

    <button
      class="action"
      id="jumpBtn">
      JUMP
    </button>

    <button
      class="action"
      id="dashBtn">
      DASH
    </button>

    <button
      class="action"
      id="resetBtn">
      RESET
    </button>

    <button
      class="action"
      id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە! 🎉
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <p>
      تۆ دیار جۆینی گروپی سان FX ـت کردووە 😎
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>

<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>


<script>

"use strict";


/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const intro =
  document.getElementById("intro");

const startBtn =
  document.getElementById("start");

const levelEl =
  document.getElementById("level");

const levelIdea =
  document.getElementById("levelIdea");

const san =
  document.getElementById("san");

const win =
  document.getElementById("win");

const winText =
  document.getElementById("winText");

const finishBanner =
  document.getElementById("finishBanner");


let W=innerWidth;
let H=innerHeight;

let DPR=
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width=
    Math.floor(W*DPR);

  canvas.height=
    Math.floor(H*DPR);

  canvas.style.width=
    W+"px";

  canvas.style.height=
    H+"px";

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   SAVE PROGRESS
   Refresh -> same level
========================================================= */

const SAVE_KEY =
  "san_b_ahamd_saved_level_v3";

const TOTAL_LEVELS=5000;

let savedLevel =
  parseInt(
    localStorage.getItem(
      SAVE_KEY
    ) || "1",
    10
  );

if(
  !Number.isFinite(savedLevel) ||
  savedLevel<1 ||
  savedLevel>TOTAL_LEVELS
){
  savedLevel=1;
}

let level=savedLevel;


/* =========================================================
   GAME STATE
========================================================= */

let playing=false;
let paused=false;
let cameraX=0;
let lastTime=0;
let levelData=null;
let levelWon=false;


/* =========================================================
   PLAYER
========================================================= */

const player={

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:250,
  jumpPower:620,

  grounded:false,
  coyote:0,

  previousY:0

};


/* =========================================================
   INPUT
========================================================= */

const input={
  x:0
};


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickPointer=null;


function setJoystick(e){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  let dx=
    e.clientX-cx;

  const max=42;

  dx=
    Math.max(
      -max,
      Math.min(max,dx)
    );

  input.x=dx/max;

  stick.style.transform=
    `translateX(${dx}px)`;

}


function resetJoystick(){

  joystickPointer=null;

  input.x=0;

  stick.style.transform=
    "translateX(0)";

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickPointer=
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      e.preventDefault();

      setJoystick(e);

    }

  }
);


joystick.addEventListener(
  "pointerup",
  e=>{

    if(
      e.pointerId===
      joystickPointer
    ){

      resetJoystick();

    }

  }
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn=
  document.getElementById(
    "jumpBtn"
  );

const dashBtn=
  document.getElementById(
    "dashBtn"
  );

const resetBtn=
  document.getElementById(
    "resetBtn"
  );

const nextQuickBtn=
  document.getElementById(
    "nextQuickBtn"
  );


function jump(){

  if(
    player.grounded ||
    player.coyote>0
  ){

    player.vy=
      -player.jumpPower;

    player.grounded=false;

    player.coyote=0;

  }

}


jumpBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    jump();

  }
);


dashBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(
      Math.abs(input.x)>.1
    ){

      player.vx=
        input.x*620;

    }else{

      player.vx=620;

    }

  }
);


resetBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetLevel();

  }
);


nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(levelWon){

      nextLevel();

    }

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      input.x=-1;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      input.x=1;

    }

    if(
      e.key===" " ||
      e.key==="ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){

      input.x=0;

    }

  }
);


/* =========================================================
   IPHONE PREVENT ZOOM
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);


/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x=
    Math.sin(n*12.9898)
    *43758.5453123;

  return x-Math.floor(x);

}


/* =========================================================
   IDEAS
========================================================= */

const ideas=[

  "💡 Jump the tiny wall.",
  "💡 The gap looks scary. It isn't.",
  "💡 Grab the star before moving on.",
  "💡 Small jump. Big brain.",
  "💡 Don't rush the moving block.",
  "💡 Try the upper route.",
  "💡 Wait... then jump!",
  "💡 The spikes are pretending to be scary.",
  "💡 Follow the stars.",
  "💡 Short jump, short problem.",
  "💡 Dash across the gap.",
  "💡 Look before you jump.",
  "💡 One obstacle at a time.",
  "💡 The funny block hides the shortcut.",
  "💡 Keep calm and jump.",
  "💡 The finish is closer than it looks.",
  "💡 Don't overthink it.",
  "💡 Watch the ball!",
  "💡 The road is tilted.",
  "💡 Think before you jump."

];


/* =========================================================
   LEVEL GENERATOR
   5000 SOLVABLE LEVELS
========================================================= */

function makeLevel(n){

  const difficulty=
    Math.min(
      1,
      (n-1)/4999
    );


  const groundY=
    H-
    Math.max(
      125,
      Math.min(
        165,
        H*.18
      )
    );


  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];


  /*
    START
  */

  platforms.push({

    x:-250,
    y:groundY,
    w:470,
    h:75

  });


  let x=270;


  /*
    More obstacles later,
    but jumps stay reachable.
  */

  const obstacleCount=
    5+
    Math.floor(
      difficulty*8
    );


  for(
    let i=0;
    i<obstacleCount;
    i++
  ){

    const r=
      random(
        n*100+i*19
      );


    /*
      GAP
      Never becomes impossible.
    */

    const gap=
      70+
      Math.floor(
        r*45+
        difficulty*20
      );


    x+=gap;


    const width=
      105+
      Math.floor(
        random(
          n*200+i*31
        )*80
      );


    /*
      PLATFORM HEIGHT
    */

    const maxRise=
      20+
      difficulty*55;


    const py=
      groundY-
      Math.floor(
        random(
          n*300+i*17
        )*maxRise
      );


    /*
      Normal platform
    */

    platforms.push({

      x:x,
      y:py,
      w:width,
      h:18

    });


    /*
      STAR
    */

    if(
      i%2===0 ||
      r>.6
    ){

      stars.push({

        x:x+width*.5,
        y:py-38,
        r:9,
        taken:false

      });

    }


    /*
      SPIKE
    */

    if(
      i%3===1 &&
      width>125
    ){

      const spikeX=
        x+
        28+
        Math.floor(
          random(
            n*500+i
          )*
          Math.max(
            20,
            width-70
          )
        );


      hazards.push({

        x:spikeX,
        y:py-22,
        w:24,
        h:22

      });

    }


    /*
      BALL
      Some levels have a ball.
    */

    if(
      (n%7===0 && i===2) ||
      (n%13===0 && i===4) ||
      (n%29===0 && i===3)
    ){

      balls.push({

        x:x+width+100,

        y:py-20,

        r:17,

        speed:
          130+
          difficulty*80,

        minX:x-20,

        maxX:x+width+190,

        dir:-1

      });

    }


    /*
      SLOPED ROAD
    */

    if(
      i%5===2 ||
      (n%11===0 && i===3)
    ){

      const sx=
        x+width+35;

      const sw=
        170+
        Math.floor(
          random(
            n*700+i
          )*90
        );

      const rise=
        25+
        Math.floor(
          random(
            n*800+i
          )*45
        );


      slopes.push({

        x:sx,

        y:groundY,

        w:sw,

        rise:rise

      });


      /*
        Put a safe platform after slope.
      */

      x=
        sx+
        sw;

    }else{

      x+=width;

    }

  }


  /*
    EASY FINAL AREA

    Always reachable.
  */

  const finalStart=
    x+50;


  platforms.push({

    x:finalStart,
    y:groundY,
    w:330,
    h:75

  });


  const finishX=
    finalStart+110;


  return{

    groundY,

    platforms,
    hazards,
    stars,
    balls,
    slopes,

    finishX,

    idea:
      ideas[
        (n-1)%
        ideas.length
      ]

  };

}


/* =========================================================
   SAVE
========================================================= */

function saveLevel(){

  localStorage.setItem(
    SAVE_KEY,
    String(level)
  );

}


/* =========================================================
   RESET LEVEL
========================================================= */

function resetLevel(){

  levelWon=false;
  paused=false;

  levelData=
    makeLevel(level);


  player.x=70;

  player.y=
    levelData.groundY-
    player.h;

  player.previousY=
    player.y;

  player.vx=0;
  player.vy=0;

  player.grounded=true;
  player.coyote=0;

  cameraX=0;


  levelEl.textContent=
    level;


  levelIdea.textContent=
    `LEVEL ${level}: ${levelData.idea}`;


  win.style.display="none";

  saveLevel();

}


/* =========================================================
   START
========================================================= */

startBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    intro.style.display="none";

    playing=true;

    /*
      IMPORTANT:
      Start from saved level,
      NOT level 1.
    */

    resetLevel();

    lastTime=
      performance.now();

    requestAnimationFrame(loop);

  }
);


/* =========================================================
   COLLISION
========================================================= */

function intersects(a,b){

  return(

    a.x <
      b.x+b.w &&

    a.x+a.w >
      b.x &&

    a.y <
      b.y+b.h &&

    a.y+a.h >
      b.y

  );

}


/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)return;

  levelWon=true;
  paused=true;

  /*
    Save CURRENT completed level.
    Refresh stays here.
  */

  saveLevel();


  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );


  winText.textContent=
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display="flex";

}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

  if(
    level>=TOTAL_LEVELS
  ){

    /*
      Finished all 5000.
      Start again from 1.
    */

    level=1;

  }else{

    level++;

  }


  saveLevel();

  resetLevel();

}

   WIN BUTTONS
========================================================= */

document
  .getElementById("retryBtn")
  .addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

document
  .getElementById("nextBtn")

/* =========================================================
   SLOPE HEIGHT
========================================================= */

function slopeSurfaceY(s,x){

  const t=
    Math.max(
      0,
      Math.min(
        1,
        (x-s.x)/s.w
      )
    );

  return s.y-s.rise*t;

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    paused ||
    !levelData
  )return;


  /*
    SAVE OLD POSITION
    This fixes falling through platforms.
  */

  const oldY=
    player.y;

  const oldBottom=
    oldY+
    player.h;


  /*
    MOVEMENT
  */

  const targetVX=
    input.x*
    player.speed;


  player.vx +=
    (
      targetVX-
      player.vx
    )*
    Math.min(
      1,
      dt*12
    );


  player.vy +=
    1550*dt;


  player.x +=
    player.vx*dt;


  player.y +=
    player.vy*dt;


  player.grounded=false;


  /*
    NORMAL PLATFORM LANDING

    More reliable than before.
  */

  for(
    const p
    of levelData.platforms
  ){

    const horizontal=
      player.x+player.w>p.x &&
      player.x<p.x+p.w;


    const newBottom=
      player.y+
      player.h;


    const descending=
      player.vy>=0;


    const crossedTop=
      oldBottom<=p.y+8 &&
      newBottom>=p.y;


    if(
      horizontal &&
      descending &&
      crossedTop
    ){

      player.y=
        p.y-player.h;

      player.vy=0;

      player.grounded=true;

    }

  }


  /*
    SLOPED ROADS

    Safe walkable tilted surface.
  */

  for(
    const s
    of levelData.slopes
  ){

    if(
      player.x+player.w>s.x &&
      player.x<s.x+s.w
    ){

      const surface=
        slopeSurfaceY(
          s,
          player.x+
          player.w*.5
        );


      const bottom=
        player.y+
        player.h;


      if(
        player.vy>=0 &&
        bottom>=surface &&
        oldBottom<=surface+12
      ){

        player.y=
          surface-
          player.h;

        player.vy=0;

        player.grounded=true;

      }

    }

  }


  /*
    COYOTE TIME
  */

  if(player.grounded){

    player.coyote=.12;

  }else{

    player.coyote=
      Math.max(
        0,
        player.coyote-dt
      );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)continue;


    const dx=
      player.x+
      player.w/2-
      s.x;

    const dy=
      player.y+
      player.h/2-
      s.y;


    if(
      Math.hypot(dx,dy)<30
    ){

      s.taken=true;

    }

  }


  /*
    BALLS

    Ball travels toward player.
  */

  for(
    const b
    of levelData.balls
  ){

    b.x+=
      b.dir*
      b.speed*
      dt;


    if(
      b.x<=b.minX
    ){

      b.x=b.minX;
      b.dir=1;

    }


    if(
      b.x>=b.maxX
    ){

      b.x=b.maxX;
      b.dir=-1;

    }


    const dx=
      player.x+
      player.w/2-
      b.x;

    const dy=
      player.y+
      player.h/2-
      b.y;


    if(
      Math.hypot(dx,dy)<
      b.r+18
    ){

      resetLevel();

      return;

    }

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    if(
      intersects(
        player,
        h
      )
    ){

      resetLevel();

      return;

    }

  }


  /*
    FALL
  */

  if(
    player.y>
    H+150
  ){

    resetLevel();

    return;

  }


  /*
    FINISH
  */

  if(
    player.x+
    player.w>=
    levelData.finishX
  ){

    winLevel();

    return;

  }


  /*
    CAMERA
  */

  const targetCamera=
    Math.max(
      0,
      player.x-
      W*.32
    );


  cameraX +=
    (
      targetCamera-
      cameraX
    )*
    Math.min(
      1,
      dt*7
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );


  sky.addColorStop(
    0,
    "#8fd3ff"
  );

  sky.addColorStop(
    .55,
    "#b9e8b0"
  );

  sky.addColorStop(
    1,
    "#e9d8a6"
  );


  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );


  ctx.save();

  ctx.translate(
    -cameraX*.12,
    0
  );


  for(
    let i=0;
    i<30;
    i++
  ){

    const x=
      i*280+100;

    const y=
      95+
      (i%4)*45;


    ctx.fillStyle=
      "rgba(255,255,255,.45)";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      28,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+30,
      y-8,
      35,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+65,
      y,
      25,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.save();

  ctx.translate(
    -cameraX,
    0
  );


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    ctx.fillStyle=
      "#292b31";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );


    ctx.fillStyle=
      "#65d878";

    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      7
    );


    ctx.fillStyle=
      "rgba(255,255,255,.13)";


    for(
      let xx=p.x+18;
      xx<p.x+p.w;
      xx+=48
    ){

      ctx.fillRect(
        xx,
        p.y+22,
        12,
        5
      );

    }

  }


  /*
    SLOPED ROADS
  */

  for(
    const s
    of levelData.slopes
  ){

    ctx.fillStyle="#292b31";

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.lineTo(
      s.x+s.w,
      s.y+55-s.rise
    );

    ctx.lineTo(
      s.x,
      s.y+55
    );

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle=
      "#65d878";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x+s.w,
      s.y-s.rise
    );

    ctx.stroke();

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    ctx.fillStyle=
      "#ef476f";

    ctx.beginPath();

    ctx.moveTo(
      h.x,
      h.y+h.h
    );

    ctx.lineTo(
      h.x+h.w/2,
      h.y-10
    );

    ctx.lineTo(
      h.x+h.w,
      h.y+h.h
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 9px system-ui";

    ctx.fillText(
      "!",
      h.x+9,
      h.y+10
    );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)continue;


    ctx.save();

    ctx.translate(
      s.x,
      s.y
    );

    ctx.rotate(
      performance.now()/700
    );

    ctx.fillStyle=
      "#ffd166";

    ctx.beginPath();


    for(
      let i=0;
      i<10;
      i++
    ){

      const a=
        i*Math.PI/5;

      const r=
        i%2===0
        ?11
        :5;

      const sx=
        Math.cos(a)*r;

      const sy=
        Math.sin(a)*r;


      if(i===0){

        ctx.moveTo(
          sx,
          sy
        );

      }else{

        ctx.lineTo(
          sx,
          sy
        );

      }

    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /*
    BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );


    ctx.fillStyle=
      "#ff6b35";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
      "#fff";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      b.r-5,
      0,
      Math.PI*1.5
    );

    ctx.stroke();


    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
      -5,
      -3,
      3,
      0,
      Math.PI*2
    );

    ctx.arc(
      5,
      -3,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.restore();

  }


  /*
    FINISH FLAG
  */

  const fx=
    levelData.finishX;


  ctx.fillStyle="#222";

  ctx.fillRect(
    fx,
    levelData.groundY-120,
    7,
    120
  );


  ctx.fillStyle="#ff4d6d";

  ctx.beginPath();

  ctx.moveTo(
    fx+7,
    levelData.groundY-120
  );

  ctx.lineTo(
    fx+75,
    levelData.groundY-94
  );

  ctx.lineTo(
    fx+7,
    levelData.groundY-68
  );

  ctx.closePath();

  ctx.fill();


  /*
    PLAYER
  */

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  ctx.fillStyle=
    "#684cff";

  ctx.beginPath();

  ctx.roundRect(
    0,
    0,
    player.w,
    player.h,
    8
  );

  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    10,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.arc(
    23,
    12,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    SMILE
  */

  ctx.strokeStyle="#111";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.arc(
    17,
    17,
    9,
    0,
    Math.PI
  );

  ctx.stroke();


  /*
    LEGS
  */

  ctx.fillStyle="#222";

  ctx.fillRect(
    6,
    38,
    7,
    5
  );

  ctx.fillRect(
    21,
    38,
    7,
    5
  );


  ctx.restore();


  /*
    FUNNY TEXT
  */

  ctx.fillStyle=
    "rgba(20,20,20,.35)";

  ctx.font=
    "900 15px system-ui";


  ctx.fillText(
    "هەموو شتێک باشە 😎",
    player.x+100,
    player.y-30
  );


  ctx.restore();

}


/* =========================================================
   SAN IMAGE
========================================================= */

function updateSanPosition(){

  const positions=[

    {
      right:18,
      top:110
    },

    {
      right:W*.28,
      top:90
    },

    {
      right:35,
      top:180
    },

    {
      right:W*.45,
      top:120
    },

    {
      right:20,
      top:250
    }

  ];


  const p=
    positions[
      (level-1)%
      positions.length
    ];


  san.style.right=
    p.right+"px";

  san.style.top=
    p.top+"px";


  const size=
    Math.min(
      86,
      Math.max(
        64,
        W*.19
      )
    );


  san.style.width=
    size+"px";

  san.style.height=
    size+"px";

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();

  if(levelData){

    drawWorld();

  }

  updateSanPosition();

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!playing)return;


  const dt=
    Math.min(
      .033,
      Math.max(
        .001,
        (time-lastTime)/1000
      )
    );


  lastTime=time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   INITIAL
========================================================= */

levelData=
  makeLevel(level);

levelEl.textContent=
  level;

draw();

</script>
