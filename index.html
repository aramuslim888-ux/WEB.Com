<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  /* Prevent iPhone Safari zoom / scroll */
  touch-action: none;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

canvas,
#game,
.game,
.game-container {
  touch-action: none !important;
  -webkit-user-select: none !important;
  user-select: none !important;
}

/* Mobile controls */
.mobile-controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 20px;
  z-index: 9999;

  display: flex;
  justify-content: space-between;
  align-items: center;

  pointer-events: none;
}

.direction-controls {
  display: flex;
  gap: 14px;
  margin-left: 24px;
  pointer-events: auto;
}

.direction-btn {
  width: 76px;
  height: 76px;

  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.65);

  background: rgba(40,40,40,.78);
  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 32px;
  font-weight: bold;

  touch-action: none;
  -webkit-tap-highlight-color: transparent;

  transition: transform .08s, background .08s;
}

.direction-btn:active,
.direction-btn.active {
  transform: scale(.92);
  background: rgba(90,70,255,.9);
}

@media (max-width: 600px) {
  .direction-btn {
    width: 68px;
    height: 68px;
    font-size: 28px;
  }

  .direction-controls {
    margin-left: 18px;
    gap: 10px;
  }
}
</style>
