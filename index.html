<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San on the Road 🚗</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 2px solid rgba(59, 130, 246, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>

    <div class="text-center mb-2">
        <h1 class="text-xl font-black text-blue-400">San on the Road 🚗</h1>
        <p class="text-xs text-gray-400" id="levelInfo">مەرحەلەی ١: پیاسەی هێمن</p>
    </div>

    <canvas id="gameCanvas" width="400" height="250"></canvas>

    <div class="mt-3 flex gap-3">
        <button onclick="jump()" class="px-6 py-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-extrabold rounded-xl shadow-lg text-xs active:scale-95 transition">
            بازدان ⬆️
        </button>
        <button onclick="getInCar()" class="px-6 py-2.5 bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-extrabold rounded-xl shadow-lg text-xs active:scale-95 transition">
            سواری سەیارە 🚗
        </button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let level = 1;
        let isGameOver = false;

        const sanImg = new Image();
        sanImg.src = 'san.PNG';

        let san = {
            x: 40,
            y: 155,
            size: 45,
            dy: 0,
            jumpPower: -9.5,
            gravity: 0.5,
            grounded: true,
            inCar: false
        };

        let obstacles = [];
        let obstacleTimer = 0;

        function jump() {
            if (san.grounded && !isGameOver) {
                san.dy = san.jumpPower;
                san.grounded = false;
            }
            if (isGameOver) {
                resetGame();
            }
        }

        function getInCar() {
            if (!isGameOver) {
                san.inCar = !san.inCar;
                document.getElementById('levelInfo').innerText = san.inCar ? "سوار بوو بۆ سەیارە! 🏎️" : "گەڕایەوە سەر پێ ڕیشتن 🚶‍♂️";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            } else if (e.code === 'KeyC') {
                getInCar();
            }
        });

        function update() {
            if (isGameOver) return;

            san.dy += san.gravity;
            san.y += san.dy;

            if (san.y > 155) {
                san.y = 155;
                san.dy = 0;
                san.grounded = true;
            }

            obstacleTimer++;
            let spawnInterval = level === 1 ? 110 : level === 2 ? 85 : 65;
            
            if (obstacleTimer > spawnInterval) {
                obstacles.push({
                    x: canvas.width,
                    y: 165,
                    width: 22,
                    height: 40,
                    speed: (level === 1 ? 4 : level === 2 ? 5.5 : 7) * (san.inCar ? 1.3 : 1)
                });
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                let charWidth = san.inCar ? 65 : san.size;
                let charHeight = san.inCar ? 35 : san.size;

                if (
                    san.x < obstacles[i].x + obstacles[i].width &&
                    san.x + charWidth > obstacles[i].x &&
                    san.y < obstacles[i].y + obstacles[i].height &&
                    san.y + charHeight > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += san.inCar ? 20 : 10;

                    if (score >= 60 && score < 120) {
                        level = 2;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٢: شەقامی خێرا 🔥";
                    } else if (score >= 120) {
                        level = 3;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٣: سوپەر سان ⚡️";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // هێڵی شەقام
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();

            // ئەگەر سواری سەیارە بوو یان بە پێ بوو
            if (san.inCar) {
                // کێشانی سەیارە
                ctx.fillStyle = "#eab308";
                ctx.fillRect(san.x, san.y + 15, 65, 30);
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                ctx.arc(san.x + 15, san.y + 45, 8, 0, Math.PI * 2);
                ctx.arc(san.x + 50, san.y + 45, 8, 0, Math.PI * 2);
                ctx.fill();

                // ڕوخساری سان لەسەر سەیارەکە
                ctx.save();
                ctx.beginPath();
                ctx.arc(san.x + 32, san.y + 12, 16, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                if (sanImg.complete && sanImg.naturalWidth !== 0) {
                    ctx.drawImage(sanImg, san.x + 16, san.y - 4, 32, 32);
                }
                ctx.restore();
            } else {
                // بە پێ ڕێکردن و دەموچاو
                ctx.save();
                ctx.beginPath();
                ctx.arc(san.x + san.size / 2, san.y + san.size / 2, san.size / 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                if (sanImg.complete && sanImg.naturalWidth !== 0) {
                    ctx.drawImage(sanImg, san.x, san.y, san.size, san.size);
                } else {
                    ctx.fillStyle = "#3b82f6";
                    ctx.fillRect(san.x, san.y, san.size, san.size);
                }
                ctx.restore();

                ctx.beginPath();
                ctx.arc(san.x + san.size / 2, san.y + san.size / 2, san.size / 2, 0, Math.PI * 2);
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 2;
                ctx.stroke();

                // نوسینی San لەسەری
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px Vazirmatn";
                ctx.fillText("San", san.x + 10, san.y - 5);
            }

            // ئاستەنگەکان
            ctx.fillStyle = "#ef4444";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            // خاڵەکان
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Vazirmatn";
            ctx.fillText(`خاڵ: ${score}`, 15, 25);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 18px Vazirmatn";
                ctx.textAlign = "center";
                ctx.fillText("قەوما! پێکدادان ڕوویدا ❌", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#3b82f6";
                ctx.font = "12px Vazirmatn";
                ctx.fillText("بۆ دەستپێکردنەوە کلیک بکە", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }
        }

        function resetGame() {
            score = 0;
            level = 1;
            obstacles = [];
            isGameOver = false;
            san.inCar = false;
            document.getElementById('levelInfo').innerText = "مەرحەلەی ١: پیاسەی هێمن";
            san.y = 155;
            san.dy = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
