<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SAN B AHAMD — 5000 Levels</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101116;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:7px;
  z-index:50;
  pointer-events:none;
}

.pill{
  background:rgba(16,20,27,.86);
  color:#fff;
  padding:10px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 28px rgba(0,0,0,.22);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
}

#tier{
  font-size:10px;
  opacity:.72;
  margin-left:4px;
}

#intro{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 10% 15%,#ffd166 0 11%,transparent 12%),
    radial-gradient(circle at 92% 88%,#7bdcb5 0 14%,transparent 15%),
    radial-gradient(circle at 80% 15%,#6c4cff 0 8%,transparent 9%),
    #f07157;
}

.introCard{
  width:min(94vw,470px);
  padding:28px 20px;
}

.introTitle{
  margin:0;
  font-size:clamp(42px,13vw,78px);
  line-height:.84;
  font-weight:1000;
  color:#fff;
  text-shadow:5px 5px 0 #202020;
}

.introName{
  margin:20px 0 7px;
  font-size:17px;
  font-weight:900;
}

.creator{
  margin:0 0 23px;
  opacity:.9;
  font-size:13px;
}

#start{
  border:0;
  padding:16px 29px;
  border-radius:999px;
  background:#20283a;
  color:#fff;
  font-size:17px;
  font-weight:1000;
  box-shadow:0 8px 0 rgba(0,0,0,.22);
}

#start:active{
  transform:translateY(4px);
  box-shadow:none;
}

#san{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:35;
  pointer-events:none;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));
  animation:sanFunny 2.1s ease-in-out infinite;
}

@keyframes sanFunny{
  0%,100%{
    transform:rotate(-7deg) translateY(0) scale(1);
  }
  50%{
    transform:rotate(8deg) translateY(-8px) scale(1.04);
  }
}

#controls{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:max(18px,env(safe-area-inset-left) + 18px);
  bottom:max(22px,env(safe-area-inset-bottom) + 22px);
  width:124px;
  height:124px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(255,255,255,.14),
    rgba(255,255,255,.04)
  );
  border:3px solid rgba(255,255,255,.55);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.08),
    0 8px 30px rgba(0,0,0,.18);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:60px;
  height:60px;
  left:30px;
  top:30px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  border:2px solid rgba(255,255,255,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  color:white;
  transition:transform .05s linear;
}

#actionArea{
  position:absolute;
  right:max(18px,env(safe-area-inset-right) + 18px);
  bottom:max(22px,env(safe-area-inset-bottom) + 22px);
  display:grid;
  grid-template-columns:78px 78px;
  gap:10px;
  pointer-events:none;
}

.action{
  width:78px;
  height:78px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.5);
  background:rgba(20,20,25,.58);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  pointer-events:auto;
  touch-action:none;
  backdrop-filter:blur(8px);
}

.action:active{
  transform:scale(.91);
  background:rgba(108,76,255,.85);
}

#levelIdea{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 166px);
  transform:translateX(-50%);
  width:min(91vw,560px);
  padding:9px 13px;
  text-align:center;
  border-radius:15px;
  background:rgba(10,10,12,.62);
  color:white;
  font-size:12px;
  font-weight:800;
  z-index:40;
  pointer-events:none;
  opacity:.94;
  backdrop-filter:blur(8px);
}

#win{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(8px);
  text-align:center;
}

.winCard{
  width:min(93vw,430px);
  background:#17181d;
  color:white;
  border-radius:28px;
  padding:27px 20px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.1);
}

.winCard h1{
  margin:0 0 8px;
  font-size:30px;
}

.winCard p{
  line-height:1.55;
}

.winButtons{
  display:flex;
  gap:9px;
  justify-content:center;
  margin-top:17px;
}

.winButtons button{
  border:0;
  border-radius:15px;
  padding:13px 17px;
  font-size:14px;
  font-weight:900;
}

#nextBtn{
  background:#6c4cff;
  color:#fff;
}

#retryBtn{
  background:#30323a;
  color:#fff;
}

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:140;
  color:#fff;
  background:#6c4cff;
  padding:18px 24px;
  border-radius:20px;
  font-size:21px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:finishPop .8s ease forwards;
}

@keyframes finishPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
  }
  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

#danger{
  position:fixed;
  left:50%;
  top:calc(env(safe-area-inset-top) + 65px);
  transform:translateX(-50%);
  z-index:60;
  color:white;
  background:rgba(220,40,70,.8);
  padding:6px 12px;
  border-radius:999px;
  font-size:10px;
  font-weight:1000;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

#danger.show{
  opacity:1;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- Background Music Audio Element -->
<audio id="bgMusic" loop>

<div id="intro">

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");

const levelEl = document.getElementById("level");
const tierEl = document.getElementById("tier");
const levelIdea = document.getElementById("levelIdea");

const san = document.getElementById("san");

const win = document.getElementById("win");
const winText = document.getElementById("winText");
const finishBanner = document.getElementById("finishBanner");
const dangerEl = document.getElementById("danger");

const bgMusic = document.getElementById("bgMusic");
bgMusic.volume = 0.4;

let W = innerWidth;
let H = innerHeight;

let DPR = Math.min(window.devicePixelRatio || 1,2);

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener("resize",resize);
resize();

const SAVE_KEY = "san_b_ahamd_5000_v10";
const TOTAL_LEVELS = 5000;

let level = parseInt(
  localStorage.getItem(SAVE_KEY) || "1",
  10
);

if(
  !Number.isFinite(level) ||
  level < 1 ||
  level > TOTAL_LEVELS
){
  level = 1;
}

let playing = false;
let paused = false;
let cameraX = 0;
let lastTime = 0;

let levelData = null;
let levelWon = false;

let stormFlash = 0;
let screenShake = 0;

let particles = [];

const player = {

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:255,
  jumpPower:650,

  grounded:false,
  coyote:0,

  dashCooldown:0,
  dashTime:0,

  gravityScale:1,

  slowTimer:0,
  reverseTimer:0,

  invincible:0

};

const input = {
  x:0
};

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickPointer = null;

function setJoystick(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left + r.width / 2;

  let dx =
    e.clientX - cx;

  const max = 42;

  dx = Math.max(
    -max,
    Math.min(max,dx)
  );

  input.x = dx / max;

  stick.style.transform =
    `translateX(${dx}px)`;
}

function resetJoystick(){

  joystickPointer = null;
  input.x = 0;
  stick.style.transform =
    "translateX(0)";
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    joystickPointer = e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      e.preventDefault();
      setJoystick(e);
    }
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{
    if(
      e.pointerId ===
      joystickPointer
    ){
      resetJoystick();
    }
  }
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

const jumpBtn =
  document.getElementById("jumpBtn");

const dashBtn =
  document.getElementById("dashBtn");

const resetBtn =
  document.getElementById("resetBtn");

const nextQuickBtn =
  document.getElementById("nextQuickBtn");

function jump(){

  if(
    player.grounded ||
    player.coyote > 0
  ){

    player.vy =
      -player.jumpPower;

    player.grounded = false;
    player.coyote = 0;

  }
}

function dash(){

  if(
    player.dashCooldown > 0
  ) return;

  let dir =
    Math.abs(input.x) > .1
    ? input.x
    : 1;

  player.vx =
    dir * 760;

  player.dashTime = .17;

  player.dashCooldown =
    Math.max(
      .3,
      .8 -
      levelData.tier.d * .25
    );

  player.invincible = .12;

  screenShake = 5;
}

jumpBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

dashBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    dash();
  }
);

resetBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    resetLevel();
  }
);

nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();

    if(levelWon){
      nextLevel();
    }
  }
);

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){
      input.x = -1;
    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){
      input.x = 1;
    }

    if(
      e.key === " " ||
      e.key === "ArrowUp"
    ){
      e.preventDefault();
      jump();
    }

    if(
      e.key.toLowerCase() === "shift"
    ){
      dash();
    }

    if(
      e.key.toLowerCase() === "r"
    ){
      resetLevel();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){
      input.x = 0;
    }

  }
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);

function random(n){

  const x =
    Math.sin(
      n * 12.9898
    ) * 43758.5453123;

  return x - Math.floor(x);
}

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );
}

function lerp(a,b,t){
  return a + (b-a)*t;
}

function chance(seed,p){
  return random(seed) < p;
}

function rectHit(a,b){

  return(
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

function circleHit(px,py,pr,box){

  const cx =
    clamp(
      px,
      box.x,
      box.x+box.w
    );

  const cy =
    clamp(
      py,
      box.y,
      box.y+box.h
    );

  return(
    Math.hypot(
      px-cx,
      py-cy
    ) < pr
  );
}

function difficulty(n){

  if(n <= 15){

    const p =
      (n-1)/14;

    return{

      p,
      d:0,

      stage:1,

      name:`فێرکاری ${n}`,

      gap:145-p*28,
      width:185-p*25,
      rise:5+p*18,

      spikes:n>=8 ? p*.18 : 0,
      balls:n>=10 ? p*.15 : 0,
      cracks:n>=12 ? p*.12 : 0,

      moving:0,
      disappearing:0,
      saws:0,
      lasers:0,
      bombs:0,
      wind:0,
      ice:0,
      fake:0,
      walls:0,
      springs:n>=5 ? p*.12 : 0,
      portals:0,
      gravity:0,
      reverse:0,
      fallers:0,
      storms:0,

      ballSpeed:120+p*30,

      speed:245,
      jump:665,

      groups:4+Math.floor(p*3)

    };
  }

  const p =
    clamp(
      (n-16)/(TOTAL_LEVELS-16),
      0,
      1
    );

  const d =
    Math.pow(p,.63);

  const stage =
    Math.min(
      20,
      1+
      Math.floor(d*20)
    );

  return{

    p,
    d,

    stage,

    name:
      `ئاستی قورس ${stage}`,

    gap:
      lerp(118,30,d),

    width:
      lerp(155,38,d),

    rise:
      lerp(12,145,d),

    spikes:
      lerp(.18,.97,d),

    balls:
      lerp(.15,.96,d),

    cracks:
      lerp(.12,.94,d),

    moving:
      lerp(.12,.96,d),

    disappearing:
      lerp(.04,.93,d),

    saws:
      lerp(.04,.94,d),

    lasers:
      lerp(.02,.90,d),

    bombs:
      lerp(.01,.88,d),

    wind:
      lerp(.02,.86,d),

    ice:
      lerp(.03,.84,d),

    fake:
      lerp(.02,.72,d),

    walls:
      lerp(.01,.78,d),

    springs:
      lerp(.08,.72,d),

    portals:
      lerp(.01,.55,d),

    gravity:
      lerp(.01,.65,d),

    reverse:
      lerp(.01,.62,d),

    fallers:
      lerp(.02,.90,d),

    storms:
      lerp(.05,1,d),

    ballSpeed:
      lerp(145,470,d),

    speed:
      lerp(250,310,d),

    jump:
      lerp(650,570,d),

    groups:
      Math.round(
        lerp(7,34,d)
      )

  };
}

const ideas = [
"💡 بە joystick بڕۆ بۆ ڕاست.",
"💡 JUMP بۆ بازدان بەکاربهێنە.",
"💡 لە پلاتفۆرمەکان نەکەویت.",
"💡 کاتی JUMP زۆر گرنگە.",
"💡 DASH بۆ بۆشاییە درێژەکانە.",
"💡 لە Level 6 بۆشاییەکان گەورەتر دەبن.",
"💡 پلاتفۆرمی بەرز هەمیشە ڕێگای ئاسان نییە.",
"💡 لە Level 8 ـەوە ئاگاداری spike بە.",
"💡 تۆپەکان دەجوڵێن.",
"💡 تۆپ + spike دەتوانن پێکەوە بێن.",
"💡 crack ـەکان لەژێر پێت دەشکێن.",
"💡 زۆر لەسەر crack مەوەستە.",
"💡 لە ئێستاوە یارییەکە جدی دەبێت.",
"💡 کۆتایی فێرکاری نزیکە.",
"💡 Level 15 دوا قۆناغی فێرکارییە.",
"😈 Level 16: هیچ ئاسانکارییەک نییە.",
"🔥 دوو مەترسی دەتوانن لە یەک کاتدا بێن.",
"🔥 پلاتفۆرمی جوڵاو دەتوانێت ڕێگاکەت بگۆڕێت.",
"⚠️ تۆپەکان خێراتر دەبن.",
"⚠️ saw ـەکان لە ڕێگادا دەسوڕێن.",
"⚡ laser ـەکان لە کاتێکی دیاریکراودا دەدرەوشێن.",
"💣 bomb لە نزیکتدا مەوەستێت.",
"🌪 wind دەتوانێت ئاراستەی جوڵانت بگۆڕێت.",
"🧊 ice واتە کۆنترۆڵکردنت کەمتر دەبێت.",
"👻 هەندێک پلاتفۆرم fake ـن.",
"🧱 دیوارە جوڵاوەکان ڕێگات دەگرن.",
"🌀 portal دەتوانێت شوێنت بگۆڕێت.",
"⬆️ spring دەتوانێت زۆر بەرزت بکات.",
"🔄 هەندێک کات direction دەگۆڕێت.",
"🌌 gravity دەتوانێت گۆڕانکاری بکات.",

const ADVANCED_OBSTACLE_TYPES = 1000;

function makeAdvancedObstacles(n,groundY,finishX,D){
  const result=[];
  if(n<16){
    return result;
  }
  const count = Math.min(92, 10+Math.floor(D.d*82));
  const worldLength = Math.max(1200, finishX-520);

  for(let i=0;i<count;i++){
    const seed = n*1000003 + i*7919;
    const id = Math.floor(random(seed)*ADVANCED_OBSTACLE_TYPES);
    const type = id%20;
    const progress = count===1 ? 0 : i/(count-1);
    const baseX = 520 + progress*worldLength;
    const variant = id;
    const size = 12 + random(seed+1)*(10+D.d*30);
    const speed = 80 + random(seed+2)*(100+D.d*430);
    const phase = random(seed+3)*Math.PI*2;
    const width = 35 + random(seed+4)*(45+D.d*70);

    result.push({
      id, type, variant, baseX, x:baseX,
      baseY: groundY-40-random(seed+5)*Math.max(20,150+D.rise),
      y: groundY-40-random(seed+5)*Math.max(20,150+D.rise),
      w: width,
      h: 18+random(seed+6)*(25+D.d*50),
      size, speed, phase,
      range: 25+random(seed+7)*(45+D.d*150),
      delay: random(seed+8)*1.5,
      timer: random(seed+9)*2,
      active: true,
      triggered: false,
      vy: 80+random(seed+10)*200,
      targetX: baseX+(random(seed+11)-.5)*(160+D.d*260),
      dir: random(seed+12)>.5?1:-1
    });
  }
  return result;
}

function makeLevel(n){
  const D = difficulty(n);
  const groundY = H - Math.max(125, Math.min(165,H*.18));

  const platforms=[];
  const hazards=[];
  const stars=[];
  const balls=[];
  const slopes=[];
  const cracks=[];
  const lightnings=[];
  const fallers=[];
  const movingPlatforms=[];
  const disappearingPlatforms=[];
  const saws=[];
  const lasers=[];
  const bombs=[];
  const windZones=[];
  const iceZones=[];
  const fakePlatforms=[];
  const walls=[];
  const springs=[];
  const portals=[];
  const gravityZones=[];
  const reverseZones=[];
  const finishGates=[];

  platforms.push({x:-300, y:groundY, w:520, h:80, safe:true});

  let x=230;
  const count=D.groups;

  for(let i=0;i<count;i++){
    const base=n*100000+i*997;
    const gap=Math.max(25, D.gap+random(base+1)*45);
    x+=gap;

    let width=Math.max(36, D.width+random(base+2)*42);
    let py=groundY-random(base+3)*D.rise;

    const platform={x, y:py, w:width, h:18, safe:true};
    platforms.push(platform);

    if(i%2===0 || random(base+4)>.45){
      stars.push({x:x+width*.5, y:py-38, r:9, taken:false});
    }

    if(chance(base+10,D.moving)){
      movingPlatforms.push({
        x:x+width*.5, y:py,
        baseX:x+width*.5, baseY:py,
        w:Math.max(42,width*.75), h:18,
        range:35+random(base+11)*(70+D.d*90),
        speed:.6+random(base+12)*(1.2+D.d*1.6),
        phase:random(base+13)*Math.PI*2,
        axis:random(base+14)>.5?"x":"y",
        safe:true
      });
    }

    if(chance(base+20,D.disappearing)){
      disappearingPlatforms.push({
        x, y:py, w:width, h:18,
        timer:.8+random(base+21)*1.5,
        active:true,
        respawn:1.2+random(base+22)*2
      });
    }

    if(chance(base+30,D.fake)){
      fakePlatforms.push({
        x:x+random(base+31)*Math.max(10,width-30),
        y:py-40-random(base+32)*70,
        w:Math.max(35,width*.6), h:14,
        fake:true
      });
    }

    if(chance(base+40,D.spikes)){
      const amount = n<16 ? 1 : Math.min(5, 1+Math.floor(D.d*4+random(base+41)*2));
      for(let s=0; s<amount; s++){
        hazards.push({
          x:x+8+random(base+50+s)*Math.max(12,width-28),
          y:py-22, w:22, h:22
        });
      }
    }

    if(chance(base+60,D.balls)){
      const amount= n<16 ? 1 : Math.min(4, 1+Math.floor(D.d*3+random(base+61)*2));
      for(let b=0; b<amount; b++){
        balls.push({
          x:x+width+50+random(base+70+b)*120,
          y:py-20-b*18,
          r:16+D.d*5,
          speed:D.ballSpeed*(1+b*.12),
          minX:x-65,
          maxX:x+width+260+D.d*130,
          dir:random(base+80+b)>.5?1:-1,
          targetTimer:.5+random(base+90+b)*1.3
        });
      }
    }

    if(chance(base+100,D.saws)){
      saws.push({
        x:x+width+45+random(base+101)*80,
        y:py-35-random(base+102)*60,
        r:17+D.d*10,
        baseY:py-35,
        amp:15+D.d*60,
        speed:1+D.d*4,
        phase:random(base+103)*6.28
      });
    }

    if(chance(base+110,D.lasers)){
      lasers.push({
        x:x+width+35+random(base+111)*100,
        y:py-15-random(base+112)*70,
        w:80+random(base+113)*120,
        h:8,
        period:.65+random(base+114)*1.4,
        phase:random(base+115)*2,
        warning:.25+random(base+116)*.25
      });
    }

    if(chance(base+120,D.bombs)){
      bombs.push({
        x:x+width+70+random(base+121)*120,
        y:py-40-random(base+122)*100,
        r:13+D.d*5,
        timer:1+random(base+123)*2,
        pulse:0
      });
    }

    if(random(base+130)<.12+D.d*.70){
      const sx=x+width+15;
      const sw=100+random(base+131)*Math.max(70,180-D.d*60);
      const rise=12+random(base+132)*(20+D.rise*.8);
      slopes.push({x:sx, y:groundY, w:sw, rise});
      x=sx+sw;
    }else{
      x+=width;
    }

    if(chance(base+140,D.cracks)){
      const amount=Math.min(4, 1+Math.floor(D.d*3));
      for(let c=0;c<amount;c++){
        cracks.push({
          x:x-75+c*24, y:groundY-3, w:48, h:10,
          timer:0, active:false, broken:false
        });
      }
    }

    if(chance(base+150,D.wind)){
      windZones.push({
        x:x+20, y:groundY-150-random(base+151)*100,
        w:100+random(base+152)*120,
        h:130+random(base+153)*100,
        force:(random(base+154)>.5?1:-1)*(100+D.d*400)
      });
    }

    if(chance(base+160,D.ice)){
      iceZones.push({x:x-20, y:groundY-25, w:80+random(base+161)*150, h:30});
    }

    if(chance(base+170,D.springs)){
      springs.push({
        x:x+random(base+171)*Math.max(10,width-25),
        y:py-12, w:22, h:12,
        power:720+D.d*520
      });
    }

    if(chance(base+180,D.portals)){
      portals.push({
        x:x+width+30+random(base+181)*80,
        y:py-80-random(base+182)*100,
        r:20, targetOffset:260+random(base+183)*600, used:false
      });
    }

    if(chance(base+190,D.gravity)){
      gravityZones.push({
        x:x+10, y:py-130,
        w:90+random(base+191)*130, h:170,
        scale:random(base+192)>.5?.48:1.75
      });
    }

    if(chance(base+200,D.reverse)){
      reverseZones.push({
        x:x+10, y:py-160,
        w:100+random(base+201)*140, h:180,
        time:1.2+random(base+202)*2.2
      });
    }

    if(chance(base+210,D.fallers)){
      const amount=Math.min(4, 1+Math.floor(D.d*3));
      for(let f=0; f<amount; f++){
        fallers.push({
          x:x+random(base+220+f)*100,
          y:-100-random(base+230+f)*300,
          w:20+D.d*12, h:20+D.d*12,
          vy:100+random(base+240+f)*220+D.d*250,
          resetY:-220-random(base+250+f)*150
        });
      }
    }

    if(chance(base+260,D.walls)){
      walls.push({
        x:x+width+70+random(base+261)*90,
        y:py-100,
        w:18+D.d*12, h:100+D.d*120,
        range:20+D.d*100, speed:.8+D.d*2,
        phase:random(base+262)*6.28
      });
    }
  }

  const finalStart=x+60;
  platforms.push({x:finalStart, y:groundY, w:500, h:80, safe:true});

  const gateCount=n<16 ? 0 : Math.min(5, Math.floor(D.d*5));
  for(let g=0; g<gateCount; g++){
    finishGates.push({
      x:finalStart+80+g*75, y:groundY-130,
      w:12, h:130,
      phase:random(n*6000+g)*6.28,
      period:.8+random(n*6001+g)*1.3
    });
  }

  const finishX=finalStart+430;
  const stormCount=n<16 ? 0 : Math.min(12, 1+Math.floor(D.d*11));

  for(let i=0; i<stormCount; i++){
    const seed=n*8000+i*31;
    lightnings.push({
      x:430+random(seed)*Math.max(300,x-400),
      y:groundY-250-random(seed+1)*180,
      timer:random(seed+2)*1.5,
      cool:Math.max(.42, 1.35-D.d*.78-random(seed+3)*.35),
      warning:Math.max(.16, .72-D.d*.48)
    });
  }

  const chaos=[];
  const chaosCount=n<16 ? 0 : Math.floor(5+D.d*35);
  for(let i=0; i<chaosCount; i++){
    const seed=n*90000+i*719;
    chaos.push({
      x:350+random(seed)*Math.max(300,x-300),
      y:80+random(seed+1)*Math.max(100,groundY-160),
      type:Math.floor(random(seed+2)*14),
      size:8+random(seed+3)*(10+D.d*35),
      speed:40+random(seed+4)*(100+D.d*350),
      phase:random(seed+5)*6.28
    });
  }

  const advancedObstacles = makeAdvancedObstacles(n,groundY,finishX,D);

  let ideaIndex;
  if(n<=15){
    ideaIndex=n-1;
  }else{
    ideaIndex=15+Math.floor(D.d*(ideas.length-16));
    ideaIndex=Math.min(ideas.length-1,ideaIndex);
  }

  return{
    groundY, platforms, hazards, stars, balls, slopes, cracks, lightnings, fallers,
    movingPlatforms, disappearingPlatforms, saws, lasers, bombs, windZones, iceZones,
    fakePlatforms, walls, springs, portals, gravityZones, reverseZones, finishGates,
    chaos, advancedObstacles, finishX, idea:ideas[ideaIndex], tier:D
  };
}

function saveLevel(){
  localStorage.setItem(SAVE_KEY, String(level));
}

function resetLevel(){
  levelWon=false;
  paused=false;
  levelData=makeLevel(level);

  player.x=70;
  player.y=levelData.groundY-player.h;
  player.vx=0;
  player.vy=0;
  player.grounded=true;
  player.coyote=0;
  player.dashCooldown=0;
  player.dashTime=0;
  player.gravityScale=1;
  player.slowTimer=0;
  player.reverseTimer=0;
  player.invincible=0;

  cameraX=0;
  stormFlash=0;
  screenShake=0;

  levelEl.textContent=level;
  tierEl.textContent="• "+levelData.tier.name;

  if(level<=15){
    levelIdea.style.display="block";
    levelIdea.textContent=`LEVEL ${level}: ${levelData.idea}`;
  }else{
    levelIdea.style.display="none";
  }

  player.speed=levelData.tier.speed;
  player.jumpPower=levelData.tier.jump;
  win.style.display="none";
  saveLevel();
}

startBtn.addEventListener("pointerdown", e=>{
  e.preventDefault();
  intro.style.display="none";
  playing=true;
  bgMusic.play().catch(err => console.log("Audio play blocked:", err));
  resetLevel();
  lastTime=performance.now();
  requestAnimationFrame(loop);
});

function winLevel(){
  if(levelWon) return;
  levelWon=true;
  paused=true;
  saveLevel();

  finishBanner.classList.remove("show");
  void finishBanner.offsetWidth;
  finishBanner.classList.add("show");

  winText.textContent=`تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;
  win.style.display="flex";
}

function nextLevel(){
  if(level>=TOTAL_LEVELS){
    level=1;
  }else{
    level++;
  }
  saveLevel();
  resetLevel();
}

document.getElementById("retryBtn").addEventListener("pointerdown", e=>{
  e.preventDefault();
  resetLevel();
});

document.getElementById("nextBtn").addEventListener("pointerdown", e=>{
  e.preventDefault();
  nextLevel();
});

function slopeSurfaceY(s,x){
  const t=clamp((x-s.x)/s.w,0,1);
  return s.y-s.rise*t;
}

function particleBurst(x,y,type="normal"){
  const count=type==="danger"?18:10;
  for(let i=0; i<count; i++){
    particles.push({
      x, y,
      vx:(random(performance.now()+i*31)-.5)*220,
      vy:(random(performance.now()+i*53)-.5)*220,
      life:.5+random(performance.now()+i*71)*.6,
      size:2+random(performance.now()+i*91)*5
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1; i>=0; i--){
    const p=particles[i];
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=300*dt;
    p.life-=dt;
    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function updateAdvancedObstacles(dt){
  if(!levelData || !levelData.advancedObstacles) return false;
  const now = performance.now()/1000;
  const D = levelData.tier.d;

  for(const o of levelData.advancedObstacles){
    const t = now+o.phase+o.variant*.001;
    let hit=false;

    if(o.type===0){
      const targetX = player.x+player.w/2;
      const targetY = player.y+player.h/2;
      const dx = targetX-o.x;
      const dy = targetY-o.y;
      const dist = Math.max(1, Math.hypot(dx,dy));
      const tracking = .45+D*1.7+(o.variant%7)*.025;
      o.x += dx/dist*o.speed*tracking*dt;
      o.y += dy/dist*o.speed*.35*dt;

      if(Math.hypot(player.x+player.w/2-o.x, player.y+player.h/2-o.y) < o.size+17){
        hit=true;
      }
    }
    else if(o.type===1){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance < 110+D*120){
        o.triggered=true;
      }
      if(o.triggered){
        o.timer+=dt;
        if(o.timer > Math.max(.08, .42-D*.28)){
          hit=player.grounded && player.x+player.w>o.baseX-o.w && player.x<o.baseX+o.w;
        }
      }
    }
    else if(o.type===2){
      const cycle = (t+o.delay)%(1.25-D*.35);
      const active = cycle>(.55-D*.2);
      if(active){
        hit=rectHit(player, {x:o.baseX-o.w/2, y:levelData.groundY-48-o.h, w:o.w, h:o.h+48});
      }
    }
    else if(o.type===3){
      const cycle = Math.sin(t*(1.2+D*3));
      const xx = o.baseX+cycle*o.range;
      const yy = o.baseY+Math.sin(t*2)*25;
      hit=rectHit(player, {x:xx, y:yy, w:o.w, h:o.h});
    }
    else if(o.type===4){
      const cycle = (t*(.75+D*2.2))%2;
      const down = cycle<1?cycle:2-cycle;
      const yy = 50+down*(levelData.groundY-100);
      hit=rectHit(player, {x:o.baseX-o.w/2, y:yy, w:o.w, h:o.h+25});
    }
    else if(o.type===5){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance<170+D*130){ o.triggered=true; }
      if(o.triggered){
        o.timer+=dt;
        const radius = o.timer*(180+D*260);
        const vertical = Math.abs(player.y+player.h/2-o.baseY);
        if(Math.abs(player.x+player.w/2-o.baseX)<radius+18 && vertical<42+D*35){
          hit=true;
        }
        if(radius>300+D*500){
          o.triggered=false;
          o.timer=0;
        }
      }
    }
    else if(o.type===6){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance<70+D*80){ o.triggered=true; }
      if(o.triggered){
        const fall = Math.min(1, (o.timer+=dt)*(1+D*2));
        if(player.grounded && player.x+player.w>o.baseX-o.w && player.x<o.baseX+o.w){
          player.vy += 250+D*450;
          if(fall>.45){ hit=true; }
        }
      }
    }
    else if(o.type===7){
      o.y += o.vy*(1+D*1.8)*dt;
      if(o.y>levelData.groundY+80){
        o.y = -120-random(o.variant*77+level)*240;
        o.x = o.baseX+(random(o.variant*81+Math.floor(now))-.5)*(120+D*260);
      }
      hit=rectHit(player, {x:o.x-o.size, y:o.y-o.size, w:o.size*2, h:o.size*2});
    }
    else if(o.type===8){
      const xx = o.baseX+Math.sin(t*(.8+D*2.5))*o.range;
      const yy = levelData.groundY-o.h-10-Math.abs(Math.sin(t*1.4))*(30+D*100);
      hit=rectHit(player, {x:xx, y:yy, w:o.w, h:o.h});
    }
    else if(o.type===9){
      const cycle = (t*(.9+D*3))%1;
      const active = cycle>(.22-D*.1);
      if(active){
        const yy = o.baseY+Math.sin(t*1.7)*(25+D*100);
        hit=rectHit(player, {x:o.baseX-90-D*60, y:yy, w:180+D*120, h:7+D*7});
      }
    }
    else if(o.type===10){
      const distance = Math.hypot(player.x+player.w/2-o.baseX, player.y+player.h/2-o.baseY);
      if(distance<120+D*100){ o.triggered=true; }
      if(o.triggered){
        o.timer+=dt;
        if(o.timer>Math.max(.15, .75-D*.45)){
          hit=distance<(55+D*95);
        }
      }
      if(o.timer>1.3){ o.triggered=false; o.timer=0; }
    }
    else if(o.type===11){
      const xx = o.baseX+Math.sin(t*(1.5+D*3))*o.range;
      const yy = o.baseY+Math.cos(t*(2+D*3))*(20+D*80);
      hit=circleHit(xx, yy, o.size, player);
    }
    else if(o.type===12){
      const cx=o.baseX, cy=o.baseY;
      const angle = t*(1.5+D*5);
      const length = 45+D*75;
      const ex = cx+Math.cos(angle)*length;
      const ey = cy+Math.sin(angle)*length;
      const px = player.x+player.w/2, py = player.y+player.h/2;
      const A=ex-cx, B=ey-cy, C=px-cx, E=py-cy;
      const dot=A*C+B*E, len2=A*A+B*B;
      const u=clamp(dot/Math.max(1,len2),0,1);
      hit=Math.hypot(px-(cx+A*u), py-(cy+B*u)) < 13+D*9;
    }
    else if(o.type===13){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance<100+D*120){ o.triggered=true; }
      if(o.triggered){
        o.y += (120+D*500)*dt;
        if(o.y>levelData.groundY+100){ o.y=o.baseY; o.triggered=false; }
      }
      hit=rectHit(player, {x:o.baseX-o.w/2, y:o.y, w:o.w, h:o.h});
    }
    else if(o.type===14){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance<80+D*120){
        player.gravityScale=1.7+D*1.7;
        player.vy+=80+D*180;
      }
    }
    else if(o.type===15){
      const distance = Math.abs(player.x+player.w/2-o.baseX);
      if(distance<75+D*115){
        player.reverseTimer=Math.max(player.reverseTimer, .45+D*1.4);
      }
    }
    else if(o.type===16){
      const distance = Math.hypot(player.x+player.w/2-o.baseX, player.y+player.h/2-o.baseY);
      if(distance<o.size+22 && !o.triggered){
        o.triggered=true;
        player.x=Math.max(70, player.x-(180+D*350));
        screenShake=8;
        particleBurst(o.baseX, o.baseY, "danger");
      }
      if(distance>100){ o.triggered=false; }
    }
    else if(o.type===17){
      const cx=o.baseX, cy=o.baseY;
      const radius = 30+(Math.sin(t*(2+D*4))*.5+.5)*(60+D*100);
      const distance=Math.hypot(player.x+player.w/2-cx, player.y+player.h/2-cy);
      hit=Math.abs(distance-radius)<12+D*8;
    }
    else if(o.type===18){
      const xx = o.baseX+Math.sin(t*2)*o.range;
      hit=rectHit(player, {x:xx, y:levelData.groundY-90-D*80, w:16+D*20, h:90+D*120});
    }
    else if(o.type===19){
      o.y = o.baseY+Math.abs(Math.sin(t*(1.5+D*3)))*(80+D*170);
      o.x = o.baseX+Math.sin(t*.8)*(25+D*80);
      hit=circleHit(o.x, o.y, o.size+D*5, player);
    }

    if(hit && player.invincible<=0){
      resetLevel();
      return true;
    }
  }
  return false;
}

function update(dt){
  if(paused || !levelData) return;

  updateParticles(dt);
  player.dashCooldown=Math.max(0, player.dashCooldown-dt);
  player.dashTime=Math.max(0, player.dashTime-dt);
  player.slowTimer=Math.max(0, player.slowTimer-dt);
  player.reverseTimer=Math.max(0, player.reverseTimer-dt);
  player.invincible=Math.max(0, player.invincible-dt);

  const oldY=player.y;
  const oldBottom=oldY+player.h;

  let gravityScale=1;
  let speedMultiplier=player.slowTimer>0?.55:1;
  if(player.reverseTimer>0){ speedMultiplier*=.9; }

  for(const g of levelData.gravityZones){
    if(player.x+player.w>g.x && player.x<g.x+g.w && player.y+player.h>g.y && player.y<g.y+g.h){
      gravityScale=g.scale;
    }
  }

  let windForce=0;
  for(const w of levelData.windZones){
    if(player.x+player.w>w.x && player.x<w.x+w.w && player.y+player.h>w.y && player.y<w.y+w.h){
      windForce+=w.force;
    }
  }

  let controlX=input.x;
  if(player.reverseTimer>0){ controlX=-controlX; }

  const targetVX=controlX*player.speed*speedMultiplier;
  const accel=player.slowTimer>0?6:12;
  player.vx+=(targetVX-player.vx)*Math.min(1, dt*accel);
  player.vx+=windForce*dt;

  if(player.dashTime>0){ player.vx*=1.015; }

  player.vy+=1550*gravityScale*dt;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  player.grounded=false;

  const now=performance.now()/1000;

  for(const m of levelData.movingPlatforms){
    if(m.axis==="x"){
      m.x=m.baseX+Math.sin(now*m.speed+m.phase)*m.range;
    }else{
      m.y=m.baseY+Math.sin(now*m.speed+m.phase)*m.range;
    }
    const horizontal=player.x+player.w>m.x-m.w/2 && player.x<m.x+m.w/2;
    const top=m.y, newBottom=player.y+player.h;
    if(horizontal && player.vy>=0 && oldBottom<=top+10 && newBottom>=top){
      player.y=top-player.h;
      player.vy=0;
      player.grounded=true;
    }
  }

  for(const p of levelData.platforms){
    const horizontal=player.x+player.w>p.x && player.x<p.x+p.w;
    const newBottom=player.y+player.h;
    if(horizontal && player.vy>=0 && oldBottom<=p.y+10 && newBottom>=p.y){
      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;
    }
  }

  for(const p of levelData.disappearingPlatforms){
    if(p.active){
      p.timer-=dt;
      if(p.timer<=0){ p.active=false; p.timer=p.respawn; }
    }else{
      p.timer-=dt;
      if(p.timer<=0){ p.active=true; p.timer=.8+levelData.tier.d; }
    }
    if(!p.active) continue;
    const horizontal=player.x+player.w>p.x && player.x<p.x+p.w;
    const newBottom=player.y+player.h;
    if(horizontal && player.vy>=0 && oldBottom<=p.y+10 && newBottom>=p.y){
      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;
    }
  }

  for(const p of levelData.fakePlatforms){
    if(rectHit(player,p)){
      particleBurst(p.x+p.w/2, p.y, "danger");
      player.vy+=100;
    }
  }

  for(const s of levelData.slopes){
    if(player.x+player.w>s.x && player.x<s.x+s.w){
      const surface=slopeSurfaceY(s, player.x+player.w*.5);
      const bottom=player.y+player.h;
      if(player.vy>=0 && bottom>=surface && oldBottom<=surface+15){
        player.y=surface-player.h;
        player.vy=0;
        player.grounded=true;
      }
    }
  }

  if(player.grounded){
    player.coyote=.12;
  }else{
    player.coyote=Math.max(0, player.coyote-dt);
  }

  for(const ice of levelData.iceZones){
    if(player.x+player.w>ice.x && player.x<ice.x+ice.w && player.y+player.h>ice.y && player.y<ice.y+ice.h){
      player.slowTimer=.25;
      player.vx*=.985;
    }
  }

  for(const s of levelData.springs){
    if(rectHit(player,s) && player.vy>=0){
      player.vy=-s.power;
      player.grounded=false;
      particleBurst(s.x, s.y, "normal");
    }
  }

  for(const s of levelData.stars){
    if(s.taken) continue;
    const dx=player.x+player.w/2-s.x, dy=player.y+player.h/2-s.y;
    if(Math.hypot(dx,dy)<30){
      s.taken=true;
      particleBurst(s.x, s.y);
    }
  }

  for(const c of levelData.cracks){
    const hit=player.x+player.w>c.x && player.x<c.x+c.w && player.y+player.h>=c.y-12 && player.y+player.h<=c.y+25;
    if(hit && !c.active){
      c.active=true;
      c.timer=Math.max(.35, 1.0-levelData.tier.d*.6);
    }
    if(c.active && !c.broken){
      c.timer-=dt;
      if(c.timer<=0){
        c.broken=true;
        particleBurst(c.x+c.w/2, c.y, "danger");
      }
    }
    if(c.broken && rectHit(player, {x:c.x, y:c.y, w:c.w, h:30})){
      player.vy+=260;
    }
  }

  for(const b of levelData.balls){
    b.targetTimer-=dt;
    if(b.targetTimer<=0){
      b.dir=player.x>b.x?1:-1;
      b.targetTimer=Math.max(.25, .75+random(level*77+Math.floor(performance.now()/700))*1.2-levelData.tier.d*.4);
    }
    b.x+=b.dir*b.speed*dt;
    if(b.x<=b.minX){ b.x=b.minX; b.dir=1; }
    if(b.x>=b.maxX){ b.x=b.maxX; b.dir=-1; }
    if(circleHit(b.x, b.y, b.r, player)){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const s of levelData.saws){
    s.y=s.baseY+Math.sin(now*s.speed+s.phase)*s.amp;
    if(circleHit(s.x, s.y, s.r, player)){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const l of levelData.lasers){
    const phase=(now+l.phase)%l.period;
    const active=phase>l.warning;
    if(active && rectHit(player, {x:l.x, y:l.y, w:l.w, h:l.h})){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const b of levelData.bombs){
    b.timer-=dt;
    b.pulse+=dt;
    if(b.timer<=0){
      const dx=player.x+player.w/2-b.x, dy=player.y+player.h/2-b.y;
      if(Math.hypot(dx,dy)<110+levelData.tier.d*80){
        if(player.invincible<=0){ resetLevel(); return; }
      }
      b.timer=.8+random(performance.now())*1.5;
    }
  }

  for(const f of levelData.fallers){
    f.y+=f.vy*dt;
    if(f.y>levelData.groundY+40){ f.y=f.resetY; }
    if(rectHit(player, {x:f.x-8, y:f.y-8, w:f.w+16, h:f.h+16})){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const w of levelData.walls){
    w.x+=Math.sin(now*w.speed+w.phase)*w.range*dt;
    if(rectHit(player, w)){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const p of levelData.portals){
    if(p.used) continue;
    if(Math.hypot(player.x+player.w/2-p.x, player.y+player.h/2-p.y)<p.r+18){
      p.used=true;
      player.x+=p.targetOffset;
      particleBurst(p.x, p.y);
      screenShake=8;
    }
  }

  for(const r of levelData.reverseZones){
    if(player.x+player.w>r.x && player.x<r.x+r.w && player.y+player.h>r.y && player.y<r.y+r.h){
      player.reverseTimer=r.time;
      dangerEl.classList.add("show");
    }
  }

  for(const h of levelData.hazards){
    if(rectHit(player, h)){
      if(player.invincible<=0){ resetLevel(); return; }
    }
  }

  for(const l of levelData.lightnings){
    l.timer+=dt;
    if(l.timer>l.cool){ l.timer=0; }
    const phase=l.timer/l.cool;
    const strikeStart=l.warning/l.cool;
    if(phase>=strikeStart && phase<strikeStart+.14){
      stormFlash=1;
      if(Math.abs(player.x+player.w/2-l.x)<48 && player.y>l.y-15){
        if(player.invincible<=0){ resetLevel(); return; }
      }
    }
  }

  for(const c of levelData.chaos){
    const t=now+c.phase;
    let hit=false;
    if(c.type===0){
      hit=circleHit(c.x+Math.sin(t*2)*40, c.y+Math.cos(t*1.5)*30, c.size, player);
    }
    else if(c.type===1){
      hit=rectHit(player, {x:c.x+Math.sin(t)*60, y:c.y, w:c.size*2, h:c.size});
    }
    else if(c.type===2){
      hit=rectHit(player, {x:c.x, y:c.y+Math.sin(t*2)*40, w:c.size, h:c.size*3});
    }
    else if(c.type===3){
      hit=circleHit(c.x+Math.cos(t*2)*55, c.y+Math.sin(t*2)*55, c.size, player);
    }
    else if(c.type===4){
      hit=circleHit(c.x, c.y, c.size*(1+Math.sin(t*5)*.5), player);
    }
    else if(c.type===5){
      hit=circleHit(c.x, c.y+((t*c.speed)%280), c.size*.7, player);
    }
    else if(c.type===6){
      hit=rectHit(player, {x:c.x-80, y:c.y+Math.sin(t*1.7)*90, w:160, h:5});
    }
    else if(c.type===7){
      hit=circleHit(c.x+Math.cos(t)*70, c.y+Math.sin(t)*70, c.size, player);
    }
    else if(c.type===8){
      hit=rectHit(player, {x:c.x+Math.sin(t*2)*45, y:c.y-70, w:c.size, h:140});
    }
    else if(c.type===9){
      hit=circleHit(c.x, c.y+Math.abs(Math.sin(t*2))*80, c.size, player);
    }
    else if(c.type===10){
      hit=circleHit(c.x+Math.sin(t*3)*90, c.y, c.size, player);
    }
    else if(c.type===11){
      hit=circleHit(c.x+Math.sin(t)*50, c.y+Math.cos(t)*50, c.size, player);
    }
    else if(c.type===12){
      hit=rectHit(player, {x:c.x+Math.sin(t)*35, y:c.y+Math.cos(t)*35, w:c.size, h:c.size});
    }
    else{
      if(Math.sin(t*c.speed*.03)>0.8){
        hit=circleHit(c.x, c.y, c.size, player);
      }
    }

    if(hit && player.invincible<=0){
      resetLevel();
      return;
    }
  }

  if(updateAdvancedObstacles(dt)) return;

  const danger=levelData.tier.d;
  if(danger>.65 || player.reverseTimer>0){
    dangerEl.classList.add("show");
  }else{
    dangerEl.classList.remove("show");
  }

  stormFlash=Math.max(0, stormFlash-dt*5);
  screenShake=Math.max(0, screenShake-dt*18);

  if(player.y>H+180){
    resetLevel();
    return;
  }

  let gateBlocked=false;
  for(const g of levelData.finishGates){
    const phase=(now+g.phase)%g.period;
    const active=phase<g.period*.55;
    if(active && rectHit(player, {x:g.x, y:g.y, w:g.w, h:g.h})){
      gateBlocked=true;
    }
  }

  if(!gateBlocked && player.x+player.w>=levelData.finishX){
    winLevel();
    return;
  }

  const targetCamera=Math.max(0, player.x-W*.32);
  cameraX+=(targetCamera-cameraX)*Math.min(1, dt*7);
}

function drawBackground(){
  const d=levelData?levelData.tier.d:0;
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, d>.7?"#20243a":"#8fd3ff");
  sky.addColorStop(.55, d>.7?"#343047":"#b9e8b0");
  sky.addColorStop(1, d>.7?"#171821":"#e9d8a6");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-cameraX*.12,0);

  for(let i=0; i<35; i++){
    const x=i*280+100;
    const y=95+(i%4)*45;
    ctx.fillStyle=d>.7?"rgba(150,150,180,.15)":"rgba(255,255,255,.45)";
    ctx.beginPath();
    ctx.arc(x,y,28,0,Math.PI*2);
    ctx.arc(x+30,y-8,35,0,Math.PI*2);
    ctx.arc(x+65,y,25,0,Math.PI*2);
    ctx.fill();
  }

  if(levelData && levelData.lightnings.length){
    for(const l of levelData.lightnings){
      const phase=l.timer/l.cool;
      let alpha=.2;
      if(phase<l.warning/l.cool){ alpha=.65; }
      ctx.fillStyle=`rgba(35,40,60,${alpha})`;
      ctx.beginPath();
      ctx.arc(l.x,75,45,0,Math.PI*2);
      ctx.arc(l.x+42,85,55,0,Math.PI*2);
      ctx.arc(l.x-40,88,42,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();

  if(stormFlash>0){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(.5, stormFlash*.5)})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawAdvancedObstacles(){
  if(!levelData || !levelData.advancedObstacles) return;
  const now=performance.now()/1000;
  const D=levelData.tier.d;

  for(const o of levelData.advancedObstacles){
    const t=now+o.phase+o.variant*.001;
    ctx.save();

    if(o.type===0){
      ctx.fillStyle="#ff315d";
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.size+4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.arc(o.x-4, o.y-3, 3, 0, Math.PI*2);
      ctx.arc(o.x+5, o.y-3, 3, 0, Math.PI*2);
      ctx.fill();
    }
    else if(o.type===1){
      ctx.fillStyle=o.triggered?"rgba(255,50,80,.9)":"#4b4d55";
      ctx.fillRect(o.baseX-o.w, levelData.groundY-7, o.w*2, 9);
      if(o.triggered){
        ctx.fillStyle="#ef476f";
        for(let i=-1; i<=1; i++){
          ctx.beginPath();
          ctx.moveTo(o.baseX+i*18-8, levelData.groundY);
          ctx.lineTo(o.baseX+i*18, levelData.groundY-35-D*25);
          ctx.lineTo(o.baseX+i*18+8, levelData.groundY);
          ctx.fill();
        }
      }
    }
    else if(o.type===2){
      const cycle=(t+o.delay)%(1.25-D*.35);
      const active=cycle>(.55-D*.2);
      ctx.fillStyle="#ef476f";
      const h=active?48+D*35:7;
      ctx.beginPath();
      ctx.moveTo(o.baseX-o.w/2, levelData.groundY);
      ctx.lineTo(o.baseX, levelData.groundY-h);
      ctx.lineTo(o.baseX+o.w/2, levelData.groundY);
      ctx.fill();
    }
    else if(o.type===3){
      const xx=o.baseX+Math.sin(t*(1.2+D*3))*o.range;
      const yy=o.baseY+Math.sin(t*2)*25;
      ctx.fillStyle="#ff4d6d";
      ctx.fillRect(xx, yy, o.w, o.h);
    }
    else if(o.type===4){
      const cycle=(t*(.75+D*2.2))%2;
      const down=cycle<1?cycle:2-cycle;
      const yy=50+down*(levelData.groundY-100);
      ctx.fillStyle="#5f55a8";
      ctx.fillRect(o.baseX-o.w/2, yy, o.w, o.h+25);
      ctx.fillStyle="#ef476f";
      ctx.fillRect(o.baseX-o.w/2, yy+o.h+20, o.w, 7);
    }
    else if(o.type===5){
      if(o.triggered){
        const radius=o.timer*(180+D*260);
        ctx.strokeStyle="rgba(255,70,100,.85)";
        ctx.lineWidth=5+D*4;
        ctx.beginPath();
        ctx.arc(o.baseX, o.baseY, radius, 0, Math.PI*2);
        ctx.stroke();
      }else{
        ctx.fillStyle="#ffb703";
        ctx.beginPath();
        ctx.arc(o.baseX, o.baseY, 10+Math.sin(t*5)*3, 0, Math.PI*2);
        ctx.fill();
      }
    }
    else if(o.type===6){
      ctx.globalAlpha=o.triggered?.55:1;
      ctx.fillStyle="#8e72ff";
      ctx.fillRect(o.baseX-o.w, levelData.groundY-8, o.w*2, 8);
      ctx.globalAlpha=1;
    }
    else if(o.type===7){
      ctx.fillStyle="#7b61ff";
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.size, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle="#ff4d6d";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y-o.size);
      ctx.lineTo(o.x, o.y-o.size-35);
      ctx.stroke();
    }
    else if(o.type===8){
      const xx=o.baseX+Math.sin(t*(.8+D*2.5))*o.range;
      const yy=levelData.groundY-o.h-10-Math.abs(Math.sin(t*1.4))*(30+D*100);
      ctx.fillStyle="#8e72ff";
      ctx.fillRect(xx, yy, o.w, o.h);
    }
    else if(o.type===9){
      const cycle=(t*(.9+D*3))%1;
      const active=cycle>(.22-D*.1);
      const yy=o.baseY+Math.sin(t*1.7)*(25+D*100);
      ctx.fillStyle=active?"rgba(255,40,70,.95)":"rgba(255,220,70,.5)";
      ctx.fillRect(o.baseX-90-D*60, yy, 180+D*120, active?8+D*7:3);
    }
    else if(o.type===10){
      const pulse=Math.sin(t*8)*.2;
      ctx.fillStyle="#222";
      ctx.beginPath();
      ctx.arc(o.baseX, o.baseY, o.size*(1+pulse), 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle=o.triggered?"red":"#ffd166";
      ctx.beginPath();
      ctx.arc(o.baseX, o.baseY, o.size*.5, 0, Math.PI*2);
      ctx.fill();
    }
    else if(o.type===11){
      const xx=o.baseX+Math.sin(t*(1.5+D*3))*o.range;
      const yy=o.baseY+Math.cos(t*(2+D*3))*(20+D*80);
      ctx.fillStyle="#4cc9f0";
      ctx.beginPath();
      ctx.arc(xx, yy, o.size, 0, Math.PI*2);
      ctx.fill();
    }
    else if(o.type===12){
      const cx=o.baseX, cy=o.baseY;
      const angle=t*(1.5+D*5);
      const length=45+D*75;
      const ex=cx+Math.cos(angle)*length;
      const ey=cy+Math.sin(angle)*length;
      ctx.strokeStyle="#f72585";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    else if(o.type===13){
      ctx.fillStyle="#480ca8";
      ctx.fillRect(o.baseX-o.w/2, o.y, o.w, o.h);
    }
    else if(o.type===14){
      ctx.fillStyle="rgba(72,12,168,.18)";
      ctx.fillRect(o.baseX-50, 0, 100, levelData.groundY);
    }
    else if(o.type===15){
      ctx.fillStyle="rgba(247,37,133,.18)";
      ctx.fillRect(o.baseX-60, 0, 120, levelData.groundY);
    }
    else if(o.type===16){
      ctx.fillStyle="#3a0ca3";
      ctx.beginPath();
      ctx.arc(o.baseX, o.baseY, o.size, 0, Math.PI*2);
      ctx.fill();
    }
    else if(o.type===17){
      const cx=o.baseX, cy=o.baseY;
      const radius=30+(Math.sin(t*(2+D*4))*.5+.5)*(60+D*100);
      ctx.strokeStyle="rgba(247,37,133,.6)";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.stroke();
    }
    else if(o.type===18){
      const xx=o.baseX+Math.sin(t*2)*o.range;
      ctx.fillStyle="#7209b7";
      ctx.fillRect(xx, levelData.groundY-90-D*80, 16+D*20, 90+D*120);
    }
    else if(o.type===19){
      ctx.fillStyle="#f72585";
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.size+D*5, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function draw(){
  ctx.save();

  if(screenShake>0){
    const s=screenShake;
    ctx.translate(
      (random(performance.now())-.5)*s,
      (random(performance.now()+1)-.5)*s
    );
  }

  drawBackground();

  ctx.save();
  ctx.translate(-cameraX,0);

  ctx.fillStyle="#1b1c25";
  ctx.fillRect(
    -400,
    levelData.groundY,
    levelData.finishX+1200,
    H-levelData.groundY+200
  );

  for(const p of levelData.platforms){
    ctx.fillStyle=p.safe?"#303548":"#e63946";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  for(const m of levelData.movingPlatforms){
    ctx.fillStyle="#4361ee";
    ctx.fillRect(m.x-m.w/2, m.y, m.w, m.h);
  }

  for(const p of levelData.disappearingPlatforms){
    if(!p.active) continue;
    ctx.fillStyle="#f77f00";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  for(const p of levelData.fakePlatforms){
    ctx.fillStyle="#303548";
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  for(const s of levelData.slopes){
    ctx.fillStyle="#3a3f58";
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x+s.w, s.y-s.rise);
    ctx.lineTo(s.x+s.w, levelData.groundY+80);
    ctx.lineTo(s.x, levelData.groundY+80);
    ctx.fill();
  }

  for(const h of levelData.hazards){
    ctx.fillStyle="#ef476f";
    ctx.beginPath();
    ctx.moveTo(h.x, h.y+h.h);
    ctx.lineTo(h.x+h.w/2, h.y);
    ctx.lineTo(h.x+h.w, h.y+h.h);
    ctx.fill();
  }

  for(const c of levelData.cracks){
    ctx.fillStyle=c.broken?"transparent":"#8d99ae";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    if(c.active && !c.broken){
      ctx.strokeStyle="#ef476f";
      ctx.lineWidth=2;
      ctx.strokeRect(c.x, c.y, c.w, c.h);
    }
  }

  for(const s of levelData.springs){
    ctx.fillStyle="#4cc9f0";
    ctx.fillRect(s.x, s.y, s.w, s.h);
  }

  for(const ice of levelData.iceZones){
    ctx.fillStyle="rgba(150,220,255,.45)";
    ctx.fillRect(ice.x, ice.y, ice.w, ice.h);
  }

  for(const p of levelData.portals){
    if(p.used) continue;
    ctx.fillStyle="#7209b7";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#4cc9f0";
    ctx.lineWidth=3;
    ctx.stroke();
  }

  for(const s of levelData.stars){
    if(s.taken) continue;
    ctx.fillStyle="#ffd166";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }

  for(const b of levelData.balls){
    ctx.fillStyle="#f72585";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }

  for(const s of levelData.saws){
    ctx.fillStyle="#adb5bd";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#ef476f";
    ctx.lineWidth=3;
    ctx.stroke();
  }

  for(const l of levelData.lasers){
    const phase=(performance.now()/1000+l.phase)%l.period;
    const active=phase>l.warning;
    ctx.fillStyle=active?"#f72585":"rgba(247,37,133,.3)";
    ctx.fillRect(l.x, l.y, l.w, l.h);
  }

  for(const b of levelData.bombs){
    ctx.fillStyle="#3a0ca3";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#ffb703";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  for(const f of levelData.fallers){
    ctx.fillStyle="#480ca8";
    ctx.fillRect(f.x, f.y, f.w, f.h);
  }

  for(const w of levelData.walls){
    ctx.fillStyle="#560bad";
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }

  for(const g of levelData.finishGates){
    const phase=(performance.now()/1000+g.phase)%g.period;
    const active=phase<g.period*.55;
    ctx.fillStyle=active?"rgba(230,57,70,.85)":"rgba(76,201,240,.35)";
    ctx.fillRect(g.x, g.y, g.w, g.h);
  }

  drawAdvancedObstacles();

  for(const c of levelData.chaos){
    ctx.fillStyle="rgba(247,37,133,.65)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
    ctx.fill();
  }

  for(const l of levelData.lightnings){
    const phase=l.timer/l.cool;
    const strikeStart=l.warning/l.cool;
    if(phase>=strikeStart && phase<strikeStart+.14){
      ctx.strokeStyle="#fff";
      ctx.lineWidth=6;
      ctx.beginPath();
      ctx.moveTo(l.x, l.y-200);
      ctx.lineTo(l.x+15, l.y-70);
      ctx.lineTo(l.x-10, l.y);
      ctx.lineTo(l.x+5, levelData.groundY);
      ctx.stroke();
    }else if(phase<strikeStart){
      ctx.strokeStyle="rgba(255,255,255,.35)";
      ctx.lineWidth=2;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.moveTo(l.x, l.y-200);
      ctx.lineTo(l.x, levelData.groundY);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.fillStyle="#ffd166";
  ctx.fillRect(
    player.x,
    player.y,
    player.w,
    player.h
  );

  ctx.fillStyle="#202020";
  ctx.fillRect(
    player.x+6,
    player.y+10,
    6,
    8
  );
  ctx.fillRect(
    player.x+20,
    player.y+10,
    6,
    8
  );

  for(const p of particles){
    ctx.fillStyle="rgba(255,255,255,.8)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#4cc9f0";
  ctx.fillRect(
    levelData.finishX,
    levelData.groundY-140,
    18,
    140
  );

  ctx.restore();
  ctx.restore();

  const sanScreenX = player.x - cameraX + 10;
  const sanScreenY = player.y - 75;
  san.style.left = Math.max(10, Math.min(W - 90, sanScreenX)) + "px";
  san.style.top = Math.max(50, Math.min(H - 150, sanScreenY)) + "px";
}

function loop(timestamp){
  if(!playing) return;

  const dt = Math.min(0.033, (timestamp-lastTime)/1000);
  lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

</script>
</body>
</html>
