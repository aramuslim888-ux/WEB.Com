<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA San Andreas - 3D Edition 🌴</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- هێنانی Three.js بۆ دروستکردنی دنیای 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #050508;
            color: #fff;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #webgl-container {
            width: 380px;
            height: 380px;
            border: 3px solid #eab308;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="text-center mb-1">
        <h1 class="text-base font-black text-yellow-400">GTA: San Andreas 3D 🚗💨</h1>
        <p class="text-[11px] text-gray-300" id="infoText">ستایلی ڕاستەقینەی 3D</p>
    </div>

    <!-- شوێنی پیشاندانی گرافیکی 3D -->
    <div id="webgl-container"></div>

    <!-- کۆنتڕۆڵی جووڵە و سەیارە -->
    <div class="mt-2 flex justify-between w-[380px] px-2">
        <div class="flex flex-col gap-1">
            <button onclick="movePlayer(-1)" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-xs">◀️ چەپ</button>
            <button onclick="toggleCar()" class="px-4 py-2 bg-yellow-500 text-black font-black rounded-lg text-xs">🚗 سواری سەیارە</button>
        </div>
        <div class="flex flex-col gap-1">
            <button onclick="movePlayer(1)" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg text-xs">ڕاست ▶️</button>
            <button onclick="movePlayerForward()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-lg text-xs">⬆️ پێشەوە</button>
        </div>
    </div>

    <script>
        // دروستکردنی دنیای 3D بە Three.js
        const container = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);

        const camera = new THREE.PerspectiveCamera(60, 380 / 380, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(380, 380);
        container.appendChild(renderer.domElement);

        // ڕووناکی بۆ بینینی شتەکان بە ٣ ڕەهەندی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // دروستکردنی شەقامی ٣D
        const roadGeo = new THREE.PlaneGeometry(10, 100);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        // دروستکردنی خانووەکان بە ٣D لە لای راست و چەپ
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x78716c });
        
        function createBuilding(x, z) {
            const geo = new THREE.BoxGeometry(4, 8, 6);
            const mesh = new THREE.Mesh(geo, buildingMat);
            mesh.position.set(x, 4, z);
            scene.add(mesh);
        }

        // دانانی چەند خانوویەک لە هەردوولا
        for(let z = -40; z <= 40; z += 10) {
            createBuilding(-7, z);
            createBuilding(7, z);
        }

        // دروستکردنی کەسایەتی San (یاخود سەیارەکەی) بە 3D Box / Mesh
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
        const playerGeo = new THREE.BoxGeometry(1.2, 1.8, 1.2);
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 5);
        scene.add(player);

        // شوێنی دوربین (لە پشتی San ـەوە وەک GTA)
        camera.position.set(0, 5, 12);
        camera.lookAt(player.position);

        let inCar = false;

        function movePlayer(dir) {
            player.position.x += dir * 1.5;
            if(player.position.x < -3) player.position.x = -3;
            if(player.position.x > 3) player.position.x = 3;
        }

        function movePlayerForward() {
            player.position.z -= 2;
            camera.position.z -= 2;
        }

        function toggleCar() {
            inCar = !inCar;
            if(inCar) {
                player.material.color.set(0xeab308); // ڕەنگی سەیارە
                player.scale.set(1.5, 0.8, 2);
                document.getElementById('infoText').innerText = "سواری سەیارە بوو 🏎️ (3D)";
            } else {
                player.material.color.set(0x3b82f6); // گەڕانەوە بۆ San
                player.scale.set(1, 1, 1);
                document.getElementById('infoText').innerText = "بە پێ دەڕوات 🚶‍♂️ (3D)";
            }
        }

        // جووڵەی بەردەوامی دوربین و صحنەکە
        function animate() {
            requestAnimationFrame(animate);

            // جووڵەی دوربین بەدوای کەسایەتییەکەدا
            camera.position.x = player.position.x * 0.5;
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
