<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>San B Ahamd</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}

#intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 20%,#ffcc66 0 12%,transparent 13%),
    radial-gradient(circle at 90% 85%,#8dd3c7 0 15%,transparent 16%),
    #f27659;
  color:white;
}

.introBox{
  width:min(88vw,480px);
  padding:28px 20px;
}

.smallTitle{
  font-size:14px;
  letter-spacing:4px;
  font-weight:bold;
  opacity:.9;
}

.gameTitle{
  margin:12px 0;
  font-size:48px;
  line-height:.9;
  font-weight:1000;
  text-shadow:4px 4px 0 #222;
}

.playerName{
  font-size:20px;
  font-weight:bold;
  margin:14px;
}

.created{
  font-size:15px;
  opacity:.9;
}

#start{
  margin-top:22px;
  border:0;
  border-radius:30px;
  padding:15px 34px;
  background:#222;
  color:white;
  font-size:18px;
  font-weight:bold;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.55);
  color:#fff;
  padding:8px 12px;
  border-radius:14px;
  font-weight:bold;
  font-size:14px;
}

#restart{
  pointer-events:auto;
  border:0;
  background:#222;
  color:#fff;
  border-radius:12px;
  padding:9px 12px;
  font-weight:bold;
}

#message{
  position:fixed;
  inset:0;
  z-index:15;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.72);
  color:#fff;
}

.messageBox{
  width:min(88vw,460px);
  padding:28px;
  border-radius:24px;
  background:#202020;
  box-shadow:0 15px 50px #000;
}

.messageBox h1{
  margin:0 0 12px;
  font-size:28px;
}

.messageBox p{
  line-height:1.5;
}

.nextBtn{
  border:0;
  border-radius:20px;
  padding:13px 25px;
  background:#6c4cff;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

#funny{
  position:fixed;
  z-index:4;
  width:78px;
  height:78px;
  object-fit:contain;
  display:none;
  pointer-events:none;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.45));
  animation:bob .8s infinite alternate ease-in-out;
}

@keyframes bob{
  from{transform:rotate(-8deg) translateY(0)}
  to{transform:rotate(8deg) translateY(-8px)}
}

#touchControls{
  position:fixed;
  inset:0;
  z-index:8;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  position:absolute;
  border:2px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.16);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  backdrop-filter:blur(4px);
}

#leftBtn{
  left:20px;
  bottom:25px;
  width:70px;
  height:70px;
  border-radius:50%;
}

#rightBtn{
  left:100px;
  bottom:25px;
  width:70px;
  height:70px;
  border-radius:50%;
}

#jumpBtn{
  right:22px;
  bottom:28px;
  width:78px;
  height:78px;
  border-radius:50%;
  background:rgba(108,76,255,.45);
}

#hint{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  color:white;
  background:rgba(0,0,0,.45);
  border-radius:12px;
  padding:6px 10px;
  font-size:12px;
  pointer-events:none;
}

@media(min-width:700px){
  #touchControls{display:none}
  #hint{font-size:14px}
}
</style>
</head>

<body>

<div id="intro">
  <div class="introBox">
    <div class="smallTitle">A POCKET-SIZED ADVENTURE</div>

    <div class="gameTitle">
      SAN<br>
      B A H A M D
    </div>

    <div class="playerName">
      One tiny hero. 1000 funny problems.
    </div>

    <div class="created">
      Created by aro bestun
    </div>

    <button id="start">Tap to begin</button>
  </div>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hudBox">
    LEVEL <span id="level">1</span> / 1000
  </div>

  <button id="restart">↻ Restart</button>
</div>

<img id="funny" src="san.PNG" alt="San">

<div id="hint">
  ← → Move &nbsp; • &nbsp; SPACE / TAP Jump
</div>

<div id="touchControls">
  <div class="control" id="leftBtn">←</div>
  <div class="control" id="rightBtn">→</div>
  <div class="control" id="jumpBtn">JUMP</div>
</div>

<div id="message">
  <div class="messageBox">
    <h1 id="messageTitle">🎉 پیرۆزە!</h1>
    <p id="messageText"></p>
    <button class="nextBtn" id="nextBtn">
      Next Level →
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const startBtn = document.getElementById("start");
const restartBtn = document.getElementById("restart");

const levelText = document.getElementById("level");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const nextBtn = document.getElementById("nextBtn");
const funny = document.getElementById("funny");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

const TOTAL_LEVELS=1000;

let level=1;
let levelData=null;

let cameraX=0;

const player={
  x:60,
  y:0,
  w:28,
  h:36,
  vx:0,
  vy:0,
  speed:4.3,
  jump:-10.5,
  grounded:false,
  alive:true
};

const keys={
  left:false,
  right:false,
  jump:false
};

let jumpPressed=false;

function seededRandom(seed){
  let x=Math.sin(seed*9999.91)*43758.5453;
  return x-Math.floor(x);
}

/*
  Important:
  Every gap is deliberately kept small enough
  for the player to cross.
*/
function createLevel(n){

  const rng=seed=>{
    return seededRandom(n*10000+seed);
  };

  const platforms=[];

  let x=0;

  // Starting platform
  platforms.push({
    x:0,
    y:Math.floor(H*.78),
    w:260,
    h:35
  });

  x=230;

  const count=10 + Math.floor(Math.min(n,80)/8);

  for(let i=0;i<count;i++){

    const gap=35 + Math.floor(rng(i*3)*55);

    const width=170 + Math.floor(rng(i*3+1)*150);

    const previous=platforms[platforms.length-1];

    let y=previous.y +
      (rng(i*3+2)>.5 ? -35 : 35);

    const minY=H*.42;
    const maxY=H*.80;

    y=Math.max(minY,Math.min(maxY,y));

    x=previous.x+previous.w+gap;

    platforms.push({
      x,
      y,
      w:width,
      h:35
    });
  }

  // Final safe platform
  const last=platforms[platforms.length-1];

  platforms.push({
    x:last.x+last.w+45,
    y:last.y,
    w:300,
    h:35,
    goal:true
  });

  // Small obstacles, but always jumpable.
  const obstacles=[];

  for(let i=1;i<platforms.length-1;i++){

    const p=platforms[i];

    if(rng(i+100)>.25){

      obstacles.push({
        x:p.x+p.w*.45,
        y:p.y-34,
        w:28+Math.floor(rng(i+200)*18),
        h:34,
        type:rng(i+300)>.5?"box":"spike"
      });
    }
  }

  return {
    platforms,
    obstacles,
    width:platforms[platforms.length-1].x+
          platforms[platforms.length-1].w
  };
}

function resetLevel(){

  levelData=createLevel(level);

  const first=levelData.platforms[0];

  player.x=70;
  player.y=first.y-player.h-2;
  player.vx=0;
  player.vy=0;
  player.alive=true;
  player.grounded=true;

  cameraX=0;

  levelText.textContent=level;

  message.style.display="none";

  showFunny();
}

function showFunny(){

  funny.style.display="block";

  // Funny image appears in a different place each level.
  const positions=[
    [15,105],
    [W-100,110],
    [W*.45,120],
    [W-115,H*.35],
    [15,H*.45]
  ];

  const p=positions[(level-1)%positions.length];

  funny.style.left=p[0]+"px";
  funny.style.top=p[1]+"px";
}

function hideFunny(){
  funny.style.display="none";
}

function startGame(){

  intro.style.display="none";

  level=1;

  resetLevel();

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click",startGame);

restartBtn.addEventListener("click",()=>{
  resetLevel();
});

function setKey(name,value){
  keys[name]=value;
}

addEventListener("keydown",e=>{

  if(e.code==="ArrowLeft" || e.code==="KeyA"){
    setKey("left",true);
    e.preventDefault();
  }

  if(e.code==="ArrowRight" || e.code==="KeyD"){
    setKey("right",true);
    e.preventDefault();
  }

  if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){

    if(!keys.jump){
      jumpPressed=true;
    }

    setKey("jump",true);

    e.preventDefault();
  }
});

addEventListener("keyup",e=>{

  if(e.code==="ArrowLeft" || e.code==="KeyA")
    setKey("left",false);

  if(e.code==="ArrowRight" || e.code==="KeyD")
    setKey("right",false);

  if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW")
    setKey("jump",false);
});

function bindButton(id,key){

  const el=document.getElementById(id);

  const down=e=>{
    e.preventDefault();

    if(key==="jump"){
      if(!keys.jump) jumpPressed=true;
    }

    keys[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
}

bindButton("leftBtn","left");
bindButton("rightBtn","right");
bindButton("jumpBtn","jump");

function rectCollision(a,b){

  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

function update(){

  if(!levelData || !player.alive) return;

  // Horizontal movement
  if(keys.left && !keys.right){
    player.vx=-player.speed;
  }
  else if(keys.right && !keys.left){
    player.vx=player.speed;
  }
  else{
    player.vx*=.78;
  }

  // Jump
  if(jumpPressed && player.grounded){

    player.vy=player.jump;
    player.grounded=false;
  }

  jumpPressed=false;

  // Gravity
  player.vy+=.48;

  if(player.vy>12)
    player.vy=12;

  const oldY=player.y;

  player.x+=player.vx;
  player.y+=player.vy;

  player.grounded=false;

  // Platform landing
  for(const p of levelData.platforms){

    const horizontal=
      player.x+player.w>p.x &&
      player.x<p.x+p.w;

    const wasAbove=
      oldY+player.h<=p.y+5;

    const isFalling=player.vy>=0;

    const crossed=
      player.y+player.h>=p.y;

    if(horizontal && wasAbove && isFalling && crossed){

      player.y=p.y-player.h;
      player.vy=0;
      player.grounded=true;

      if(p.goal){
        winLevel();
        return;
      }
    }
  }

  // Obstacles
  for(const o of levelData.obstacles){

    if(rectCollision(player,o)){
      die();
      return;
    }
  }

  // Fell off map
  if(player.y>H+150){
    die();
    return;
  }

  // Camera follows player
  const target=player.x-W*.35;

  cameraX += (target-cameraX)*.10;

  cameraX=Math.max(
    0,
    Math.min(cameraX,levelData.width-W)
  );
}

function die(){

  if(!player.alive) return;

  player.alive=false;

  setTimeout(()=>{
    message.style.display="flex";

    messageTitle.textContent="😅 نزیک بوو!";

    messageText.textContent=
      "ئەمجارە نەبوو. بەڵام مەرحەلەکە بە شێوەیەک دروست کراوە کە دەتوانیت بیبەیتەوە.";

    nextBtn.textContent="دووبارە هەوڵ بدە ↻";

    nextBtn.onclick=()=>{
      resetLevel();
    };

  },180);
}

function winLevel(){

  player.alive=false;

  hideFunny();

  message.style.display="flex";

  messageTitle.textContent="🎉 پیرۆزە!";

  messageText.textContent=
    "تۆ مەرحەلەی "+level+
    " ـت بردەوە! پیرۆزە، تۆ دیار جۆینی گروپی سان ئێفێکست کردوە ❤️";

  if(level>=TOTAL_LEVELS){

    nextBtn.textContent="🏆 تەواوی یاری";

    nextBtn.onclick=()=>{
      messageTitle.textContent="🏆 1000 / 1000";
      messageText.textContent=
        "تۆ هەموو ١٠٠٠ مەرحەلەت بردەوە! San b ahamd";
      nextBtn.style.display="none";
    };

  }else{

    nextBtn.textContent="مەرحەلەی داهاتوو →";

    nextBtn.onclick=()=>{
      level++;
      resetLevel();
    };
  }
}

function drawBackground(){

  const gradient=ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#8ed8ff");
  gradient.addColorStop(1,"#d9f7ff");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  // Clouds
  ctx.fillStyle="rgba(255,255,255,.75)";

  for(let i=0;i<7;i++){

    const x=
      ((i*260-cameraX*.15)%(W+300))-150;

    const y=70+(i%3)*65;

    ctx.beginPath();
    ctx.arc(x,y,28,0,Math.PI*2);
    ctx.arc(x+30,y-12,35,0,Math.PI*2);
    ctx.arc(x+65,y,27,0,Math.PI*2);
    ctx.fill();
  }

  // Mountains
  ctx.fillStyle="#82bd83";

  ctx.beginPath();

  ctx.moveTo(0,H*.72);

  for(let x=0;x<=W+200;x+=120){

    const y=H*.58+(x%240)/8;

    ctx.lineTo(x,y);
  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();
}

function drawPlatform(p){

  const x=p.x-cameraX;

  ctx.fillStyle="#303030";
  ctx.fillRect(x,p.y,p.w,p.h);

  ctx.fillStyle="#5fdb72";
  ctx.fillRect(x,p.y,p.w,7);

  // little decorative dots
  ctx.fillStyle="rgba(255,255,255,.12)";

  for(let i=10;i<p.w;i+=35){
    ctx.fillRect(x+i,p.y+15,5,5);
  }

  if(p.goal){

    ctx.fillStyle="#ffd43b";
    ctx.fillRect(x+p.w-55,p.y-62,35,62);

    ctx.fillStyle="#222";
    ctx.fillRect(x+p.w-48,p.y-54,21,54);

    ctx.fillStyle="#fff";
    ctx.font="bold 14px Arial";
    ctx.fillText("GO!",x+p.w-58,p.y-70);
  }
}

function drawObstacle(o){

  const x=o.x-cameraX;

  if(o.type==="spike"){

    ctx.fillStyle="#ff4f4f";

    ctx.beginPath();
    ctx.moveTo(x,o.y+o.h);
    ctx.lineTo(x+o.w/2,o.y);
    ctx.lineTo(x+o.w,o.y+o.h);
    ctx.closePath();
    ctx.fill();

  }else{

    ctx.fillStyle="#e59a44";
    ctx.fillRect(x,o.y,o.w,o.h);

    ctx.strokeStyle="#713f12";
    ctx.lineWidth=3;
    ctx.strokeRect(x,o.y,o.w,o.h);
  }
}

function drawPlayer(){

  const x=player.x-cameraX;

  // Body
  ctx.fillStyle="#5f3cff";
  ctx.fillRect(x,player.y,player.w,player.h);

  // Face
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x+8,player.y+11,5,0,Math.PI*2);
  ctx.arc(x+20,player.y+11,5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(x+8,player.y+11,2,0,Math.PI*2);
  ctx.arc(x+20,player.y+11,2,0,Math.PI*2);
  ctx.fill();

  // Funny mouth
  ctx.strokeStyle="#111";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(x+14,player.y+18,7,0,Math.PI);
  ctx.stroke();
}

function draw(){

  drawBackground();

  if(!levelData) return;

  for(const p of levelData.platforms)
    drawPlatform(p);

  for(const o of levelData.obstacles)
    drawObstacle(o);

  drawPlayer();
}

let running=false;

function loop(){

  if(!running){
    running=true;
  }

  update();
  draw();

  requestAnimationFrame(loop);
}

// Prevent iPhone browser gestures/scrolling
document.addEventListener("touchmove",e=>{
  e.preventDefault();
},{passive:false});

document.addEventListener("gesturestart",e=>{
  e.preventDefault();
});

</script>

</body>
</html>
