<!doctype html>
<html lang="ku">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>SAN B AHAMD — 5000 Levels</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101116;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  touch-action:none;
  overscroll-behavior:none;

  -webkit-user-select:none;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

button{
  font-family:inherit;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}


/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  z-index:20;
  pointer-events:none;
}

.pill{
  background:rgba(20,30,24,.88);
  color:white;
  padding:12px 17px;
  border-radius:999px;
  font-size:15px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(10px);
}

#tier{
  font-size:11px;
  opacity:.8;
  margin-left:4px;
}


/* =========================================================
   INTRO
========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;

  background:
    radial-gradient(
      circle at 15% 20%,
      #ffd166 0 12%,
      transparent 13%
    ),
    radial-gradient(
      circle at 90% 90%,
      #7bdcb5 0 15%,
      transparent 16%
    ),
    #f07157;
}

.introCard{
  width:min(92vw,460px);
  padding:30px 24px;
}

.introTitle{
  margin:0;
  font-size:clamp(42px,12vw,76px);
  line-height:.88;
  font-weight:1000;
  text-transform:uppercase;
  color:#fff;
  text-shadow:4px 4px 0 #202020;
}

.introName{
  margin:18px 0 6px;
  font-size:18px;
  font-weight:900;
}

.creator{
  margin:0 0 24px;
  opacity:.9;
  font-size:14px;
}

#start{
  border:0;
  padding:15px 28px;
  border-radius:999px;
  background:#20283a;
  color:white;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 0 rgba(0,0,0,.2);
}

#start:active{
  transform:translateY(4px);
  box-shadow:none;
}


/* =========================================================
   SAN IMAGE
========================================================= */

#san{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  z-index:12;
  pointer-events:none;

  filter:
    drop-shadow(
      0 8px 8px rgba(0,0,0,.25)
    );

  animation:
    sanFunny 2.1s
    ease-in-out
    infinite;
}

@keyframes sanFunny{

  0%,100%{
    transform:
      rotate(-7deg)
      translateY(0)
      scale(1);
  }

  50%{
    transform:
      rotate(8deg)
      translateY(-8px)
      scale(1.04);
  }
}


/* =========================================================
   CONTROLS
========================================================= */

#controls{
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
}


/* JOYSTICK */

#joystick{
  position:absolute;

  left:
    max(
      20px,
      env(safe-area-inset-left) + 20px
    );

  bottom:
    max(
      24px,
      env(safe-area-inset-bottom) + 24px
    );

  width:126px;
  height:126px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.14),
      rgba(255,255,255,.05)
    );

  border:
    3px solid
    rgba(255,255,255,.55);

  box-shadow:
    inset
    0 0 20px
    rgba(255,255,255,.08),

    0 8px 30px
    rgba(0,0,0,.18);

  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:60px;
  height:60px;
  left:30px;
  top:30px;
  border-radius:50%;

  background:
    rgba(255,255,255,.25);

  border:
    2px solid
    rgba(255,255,255,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
  color:white;

  transition:
    transform .06s linear;
}


/* ACTIONS */

#actionArea{
  position:absolute;

  right:
    max(
      20px,
      env(safe-area-inset-right) + 20px
    );

  bottom:
    max(
      24px,
      env(safe-area-inset-bottom) + 24px
    );

  display:grid;
  grid-template-columns:82px 82px;
  gap:12px;

  pointer-events:none;
}

.action{
  width:82px;
  height:82px;
  border-radius:50%;

  border:
    3px solid
    rgba(255,255,255,.5);

  background:
    rgba(25,25,25,.55);

  color:white;

  font-size:14px;
  font-weight:1000;

  pointer-events:auto;
  touch-action:none;

  backdrop-filter:blur(8px);
}

.action:active{
  transform:scale(.93);
  background:rgba(108,76,255,.8);
}


/* =========================================================
   LEVEL IDEA
========================================================= */

#levelIdea{
  position:fixed;

  left:50%;

  bottom:
    calc(
      env(safe-area-inset-bottom)
      + 170px
    );

  transform:translateX(-50%);

  width:min(90vw,520px);

  padding:10px 15px;

  text-align:center;

  border-radius:15px;

  background:
    rgba(10,10,12,.62);

  color:white;

  font-size:13px;
  font-weight:800;

  z-index:15;
  pointer-events:none;
  opacity:.92;
}


/* =========================================================
   WIN
========================================================= */

#win{
  position:fixed;
  inset:0;
  z-index:90;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(7px);

  text-align:center;
}

.winCard{
  width:min(92vw,430px);

  background:#17181d;
  color:white;

  border-radius:28px;

  padding:28px 22px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.4);

  border:
    1px solid
    rgba(255,255,255,.1);
}

.winCard h1{
  margin:0 0 10px;
  font-size:30px;
}

.winCard p{
  line-height:1.6;
}

.winButtons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:18px;
}

.winButtons button{
  border:0;
  border-radius:15px;
  padding:13px 18px;
  font-size:15px;
  font-weight:900;
}

#nextBtn{
  background:#6c4cff;
  color:white;
}

#retryBtn{
  background:#30323a;
  color:white;
}


/* =========================================================
   FINISH
========================================================= */

#finishBanner{
  position:fixed;
  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  z-index:60;

  color:white;

  background:#6c4cff;

  padding:18px 24px;

  border-radius:20px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
  pointer-events:none;
}

#finishBanner.show{
  animation:
    finishPop
    .8s
    ease
    forwards;
}

@keyframes finishPop{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.7);
  }

  35%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =======================================================
     INTRO
======================================================= -->

<div id="intro">

  <div class="introCard">

    <h1 class="introTitle">
      SAN<br>
      B AHAMD
    </h1>

    <div class="introName">
      One funny hero.<br>
      5000 tiny challenges.
    </div>

    <p class="creator">
      Created by aro bestun
    </p>

    <button id="start">
      TAP TO BEGIN
    </button>

  </div>

</div>


<!-- =======================================================
     HUD
======================================================= -->

<div id="hud">

  <div class="pill">
    SAN B AHAMD
  </div>

  <div class="pill">

    LEVEL
    <span id="level">1</span>

    / 5000

    <span id="tier"></span>

  </div>

</div>


<img
  id="san"
  src="san.PNG"
  alt=""
>


<div id="levelIdea">
  💡 ئامادە بە...
</div>


<!-- =======================================================
     CONTROLS
======================================================= -->

<div id="controls">

  <div id="joystick">

    <div id="stick">
      ↔
    </div>

  </div>


  <div id="actionArea">

    <button class="action" id="jumpBtn">
      JUMP
    </button>

    <button class="action" id="dashBtn">
      DASH
    </button>

    <button class="action" id="resetBtn">
      RESET
    </button>

    <button class="action" id="nextQuickBtn">
      NEXT
    </button>

  </div>

</div>


<!-- =======================================================
     WIN
======================================================= -->

<div id="win">

  <div class="winCard">

    <h1>
      پیرۆزە! 🎉
    </h1>

    <p id="winText">
      تۆ مەرحەلەکەت بردەوە!
    </p>

    <p>
      تۆ دیار جۆینی گروپی سان FX ـت کردووە 😎
    </p>

    <div class="winButtons">

      <button id="retryBtn">
        دووبارە
      </button>

      <button id="nextBtn">
        مەرحەلەی داهاتوو →
      </button>

    </div>

  </div>

</div>


<div id="finishBanner">
  🎉 LEVEL COMPLETE!
</div>


<script>

"use strict";


/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const intro =
  document.getElementById("intro");

const startBtn =
  document.getElementById("start");

const levelEl =
  document.getElementById("level");

const tierEl =
  document.getElementById("tier");

const levelIdea =
  document.getElementById("levelIdea");

const san =
  document.getElementById("san");

const win =
  document.getElementById("win");

const winText =
  document.getElementById("winText");

const finishBanner =
  document.getElementById("finishBanner");


let W = innerWidth;
let H = innerHeight;

let DPR =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(W * DPR);

  canvas.height =
    Math.floor(H * DPR);

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

}


window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY =
  "san_b_ahamd_saved_level_v6";

const TOTAL_LEVELS =
  5000;


let level =
  parseInt(
    localStorage.getItem(
      SAVE_KEY
    ) || "1",
    10
  );


if(
  !Number.isFinite(level) ||
  level < 1 ||
  level > TOTAL_LEVELS
){

  level = 1;

}


/* =========================================================
   GAME STATE
========================================================= */

let playing = false;
let paused = false;

let cameraX = 0;
let lastTime = 0;

let levelData = null;

let levelWon = false;

let stormFlash = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:80,
  y:0,

  w:34,
  h:42,

  vx:0,
  vy:0,

  speed:255,
  jumpPower:650,

  grounded:false,
  coyote:0

};


/* =========================================================
   INPUT
========================================================= */

const input = {
  x:0
};


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );


let joystickPointer = null;


function setJoystick(e){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left +
    r.width / 2;

  let dx =
    e.clientX -
    cx;

  const max = 42;

  dx =
    Math.max(
      -max,
      Math.min(
        max,
        dx
      )
    );

  input.x =
    dx / max;

  stick.style.transform =
    `translateX(${dx}px)`;

}


function resetJoystick(){

  joystickPointer = null;

  input.x = 0;

  stick.style.transform =
    "translateX(0)";

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickPointer =
      e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId ===
      joystickPointer
    ){

      e.preventDefault();

      setJoystick(e);

    }

  }
);


joystick.addEventListener(
  "pointerup",
  e=>{

    if(
      e.pointerId ===
      joystickPointer
    ){

      resetJoystick();

    }

  }
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   BUTTONS
========================================================= */

const jumpBtn =
  document.getElementById(
    "jumpBtn"
  );

const dashBtn =
  document.getElementById(
    "dashBtn"
  );

const resetBtn =
  document.getElementById(
    "resetBtn"
  );

const nextQuickBtn =
  document.getElementById(
    "nextQuickBtn"
  );


function jump(){

  if(
    player.grounded ||
    player.coyote > 0
  ){

    player.vy =
      -player.jumpPower;

    player.grounded =
      false;

    player.coyote =
      0;

  }

}


jumpBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    jump();

  }
);


dashBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    player.vx =
      (
        Math.abs(input.x) > .1
        ? input.x
        : 1
      ) * 700;

  }
);


resetBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    resetLevel();

  }
);


nextQuickBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    if(levelWon){
      nextLevel();
    }

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.x = -1;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.x = 1;

    }

    if(
      e.key === " " ||
      e.key === "ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "a",
        "d"
      ].includes(e.key)
    ){

      input.x = 0;

    }

  }
);


/* =========================================================
   IPHONE
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>e.preventDefault(),
  {passive:false}
);


/* =========================================================
   RANDOM
========================================================= */

function random(n){

  const x =
    Math.sin(
      n * 12.9898
    ) *
    43758.5453123;

  return (
    x -
    Math.floor(x)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function smooth(t){

  return (
    t *
    t *
    (3 - 2 * t)
  );

}


/* =========================================================
   TUTORIAL + EXTREME DIFFICULTY
========================================================= */

function difficulty(n){

  /*
    LEVEL 1–15
    -------------------------
    Explicit tutorial system.
  */

  if(n <= 15){

    const p =
      (n - 1) / 14;

    return {

      progress:p,

      d:0,

      stage:1,

      name:
        `فێرکاری ${n}`,

      gap:
        Math.round(
          145 -
          p * 28
        ),

      width:
        Math.round(
          185 -
          p * 25
        ),

      rise:
        Math.round(
          5 +
          p * 20
        ),

      spikes:
        n >= 9
        ? .04 + p * .08
        : 0,

      balls:
        n >= 11
        ? .10 + p * .10
        : 0,

      cracks:
        n >= 13
        ? .08 + p * .10
        : 0,

      slopes:
        n >= 7
        ? .10 + p * .12
        : 0,

      storms:0,

      fallers:0,

      ballSpeed:
        115 +
        p * 25,

      speed:
        245,

      jump:
        665,

      groups:
        Math.round(
          4 +
          p * 3
        )

    };

  }


  /*
    LEVEL 16+
    -------------------------
    Real difficulty begins.
  */

  const p =
    clamp(
      (n - 16) /
      (TOTAL_LEVELS - 16),
      0,
      1
    );


  /*
    Stronger curve.

    Early:
    gradual

    Middle:
    aggressive

    End:
    brutal
  */

  const d =
    Math.pow(
      p,
      .72
    );


  const stage =
    Math.min(
      12,
      Math.floor(
        d * 12
      ) + 1
    );


  const names = [

    "ئاستی قورس ١",
    "ئاستی قورس ٢",
    "ئاستی قورس ٣",
    "ئاستی قورس ٤",
    "ئاستی قورس ٥",
    "ئاستی قورس ٦",
    "ئاستی قورس ٧",
    "ئاستی قورس ٨",
    "ئاستی قورس ٩",
    "ئاستی قورس ١٠",
    "ئاستی قورس ١١",
    "ئاستی قورس ١٢"

  ];


  return {

    progress:p,

    d,

    stage,

    name:
      names[
        stage - 1
      ],


    /*
      GAP
      122 → 47
    */

    gap:
      Math.round(
        122 -
        75 * d
      ),


    /*
      PLATFORM
      158 → 57
    */

    width:
      Math.round(
        158 -
        101 * d
      ),


    /*
      HEIGHT
      8 → 115
    */

    rise:
      Math.round(
        8 +
        107 * d
      ),


    /*
      SPIKES
      5% → 94%
    */

    spikes:
      .05 +
      .89 * d,


    /*
      BALLS
      3% → 96%
    */

    balls:
      .03 +
      .93 * d,


    /*
      CRACKS
      2% → 90%
    */

    cracks:
      .02 +
      .88 * d,


    /*
      SLOPES
    */

    slopes:
      .08 +
      .72 * d,


    /*
      LIGHTNING
    */

    storms:
      Math.floor(
        d * 3.8
      ),


    /*
      FALLERS
    */

    fallers:
      Math.floor(
        d * 4.5
      ),


    /*
      BALL SPEED
      145 → 430
    */

    ballSpeed:
      145 +
      285 * d,


    /*
      PLAYER SPEED
    */

    speed:
      255 +
      35 * d,


    /*
      JUMP
    */

    jump:
      650 -
      70 * d,


    /*
      GROUPS
    */

    groups:
      Math.round(
        6 +
        d * 18
      )

  };

}


/* =========================================================
   IDEAS
========================================================= */

const ideas = [

  "💡 فێرکاری: بە joystick بڕۆ بۆ لای ڕاست.",

  "💡 فێرکاری: JUMP بەکاربهێنە بۆ بازدان.",

  "💡 فێرکاری: پلاتفۆرمەکان بە ئارامی تێپەڕێنە.",

  "💡 فێرکاری: کاتی JUMP گرنگە؛ زوو یان درەنگ مەکە.",

  "💡 فێرکاری: DASH بۆ خێرا تێپەڕین لە بۆشایی بەکاربهێنە.",

  "💡 فێرکاری: بۆشاییەکان کەم کەم درێژتر دەبن.",

  "💡 فێرکاری: پلاتفۆرمی بەرزتر دەتوانێت ڕێگای باشتر بێت.",

  "💡 فێرکاری: slope ـەکان ڕێگای نوێت پێشان دەدەن.",

  "💡 ئاگاداری: spike ـەکان دەست بە دەرکەوتن دەکەن.",

/* =========================================================
   LEVEL GENERATOR
========================================================= */

function makeLevel(n){

  const D =
    difficulty(n);


  const groundY =
    H -
    Math.max(
      125,
      Math.min(
        165,
        H * .18
      )
    );


  const platforms = [];
  const hazards = [];
  const stars = [];
  const balls = [];
  const slopes = [];
  const cracks = [];
  const lightnings = [];
  const fallers = [];


  /*
    START SAFE PLATFORM
  */

  platforms.push({

    x:-250,
    y:groundY,
    w:500,
    h:75,
    safe:true

  });


  let x = 270;


  /*
    NUMBER OF GROUPS

    Tutorial:
    4 → 7

    Hard:
    6 → 24
  */

  const count =
    n <= 15
    ? D.groups
    : D.groups;


  for(
    let i=0;
    i<count;
    i++
  ){

    const base =
      n * 10000 +
      i * 137;


    /*
      GAP
    */

    const gap =
      Math.max(
        38,
        D.gap +
        Math.floor(
          random(base + 1) * 50
        )
      );


    x += gap;


    /*
      PLATFORM WIDTH
    */

    const width =
      Math.max(
        55,
        D.width +
        Math.floor(
          random(base + 2) * 42
        )
      );


    /*
      HEIGHT
    */

    const py =
      groundY -
      Math.floor(
        random(base + 3) *
        D.rise
      );


    platforms.push({

      x:x,
      y:py,
      w:width,
      h:18,
      safe:true

    });


    /*
      STAR

      Stars are optional.
    */

    if(
      i % 2 === 0 ||
      random(base + 4) > .50
    ){

      stars.push({

        x:
          x +
          width * .5,

        y:
          py - 38,

        r:9,

        taken:false

      });

    }


    /*
      SPIKES

      Tutorial:
      only after level 9.

      Hard:
      progressively almost everywhere.
    */

    if(
      random(base + 5) <
      D.spikes
    ){

      const spikeCount =
        n < 16
        ? 1
        : Math.min(
            3,
            1 +
            Math.floor(
              D.d * 3
            )
          );


      for(
        let s=0;
        s<spikeCount;
        s++
      ){

        hazards.push({

          x:
            x +
            12 +
            Math.floor(
              random(
                base + 50 + s
              ) *
              Math.max(
                15,
                width - 35
              )
            ),

          y:
            py - 22,

          w:24,
          h:22

        });

      }

    }


    /*
      BALL

      Tutorial:
      starts at 11.

      Hard:
      up to multiple balls.
    */

    if(
      random(base + 6) <
      D.balls
    ){

      const ballCount =
        n < 16
        ? 1
        : Math.min(
            3,
            1 +
            Math.floor(
              D.d * 2
            )
          );


      for(
        let bIndex=0;
        bIndex<ballCount;
        bIndex++
      ){

        balls.push({

          x:
            x +
            width +
            60 +
            random(
              base + 60 + bIndex
            ) * 110,

          y:
            py -
            24 -
            bIndex * 18,

          r:
            n >= 16
            ? 17 + D.d * 3
            : 17,

          speed:
            D.ballSpeed *
            (
              1 +
              bIndex * .12
            ),

          minX:
            x - 55,

          maxX:
            x +
            width +
            260,

          dir:
            random(
              base + 70 + bIndex
            ) > .5
            ? 1
            : -1,

          targetTimer:
            .55 +
            random(
              base + 80 + bIndex
            ) * 1.3

        });

      }

    }


    /*
      SLOPE
    */

    if(
      random(base + 7) <
      D.slopes
    ){

      const sx =
        x +
        width +
        15;


      const sw =
        130 +
        Math.floor(
          random(base + 8) *
          (
            150 -
            D.d * 50
          )
        );


      const rise =
        10 +
        Math.floor(
          random(base + 9) *
          (
            18 +
            D.rise * .75
          )
        );


      slopes.push({

        x:sx,
        y:groundY,
        w:sw,
        rise:rise

      });


      x =
        sx +
        sw;

    }

    else{

      x += width;

    }


    /*
      CRACKS
    */

    if(
      random(base + 10) <
      D.cracks
    ){

      const crackCount =
        n < 16
        ? 1
        : Math.min(
            3,
            1 +
            Math.floor(
              D.d * 2
            )
          );


      for(
        let cIndex=0;
        cIndex<crackCount;
        cIndex++
      ){

        cracks.push({

          x:
            x -
            65 +
            cIndex * 22,

          y:
            groundY - 3,

          w:
            52,

          h:10,

          timer:0,

          active:false,

          broken:false

        });

      }

    }


    /*
      FALLING OBJECTS

      Start only after 1200.
      Become common later.
    */

    if(
      n >= 1200 &&
      random(base + 11) <
      D.fallers * .13
    ){

      const fallCount =
        Math.min(
          3,
          1 +
          Math.floor(
            D.d * 2
          )
        );


      for(
        let fIndex=0;
        fIndex<fallCount;
        fIndex++
      ){

        fallers.push({

          x:
            x +
            20 +
            random(
              base + 100 + fIndex
            ) * 80,

          y:
            -100 -
            random(
              base + 110 + fIndex
            ) * 250,

          w:
            20 +
            D.d * 7,

          h:
            20 +
            D.d * 7,

          vy:
            100 +
            random(
              base + 120 + fIndex
            ) * 160,

          minY:
            groundY - 300,

          maxY:
            groundY + 10,

          resetY:
            groundY - 280

        });

      }

    }

  }


  /*
    FINAL SAFE AREA
  */

  const finalStart =
    x + 55;


  platforms.push({

    x:finalStart,
    y:groundY,
    w:440,
    h:75,
    safe:true

  });


  /*
    FINISH
  */

  const finishX =
    finalStart + 145;


  /*
    LIGHTNING

    Tutorial:
    none.

    Hard:
    begins later,
    becomes much more frequent.
  */

  const stormCount =
    n < 16
    ? 0
    : Math.min(
        7,
        Math.floor(
          D.d * 7
        )
      );


  for(
    let i=0;
    i<stormCount;
    i++
  ){

    const sx =
      430 +
      Math.floor(
        random(
          n * 4000 +
          i * 91
        ) *
        Math.max(
          250,
          x - 500
        )
      );


    lightnings.push({

      x:sx,

      y:
        groundY -
        250 -
        Math.floor(
          random(
            n * 401 +
            i
          ) * 150
        ),

      timer:
        random(
          n * 402 +
          i
        ) * 1.5,

      cool:
        Math.max(
          .62,
          1.35 -
          D.d * .65 -
          random(
            n * 403 +
            i
          ) * .28
        ),

      warning:
        Math.max(
          .25,
          .78 -
          D.d * .48
        )

    });

  }


  return {

    groundY,

    platforms,
    hazards,
    stars,
    balls,
    slopes,
    cracks,
    lightnings,
    fallers,

    finishX,

    idea:
      n <= 15
      ? ideas[n - 1]
      : ideas[
          15 +
          Math.min(
            ideas.length - 16,
            Math.floor(
              D.d *
              (ideas.length - 16)
            )
          )
        ],

    tier:D

  };

}


/* =========================================================
   SAVE
========================================================= */

function saveLevel(){

  localStorage.setItem(
    SAVE_KEY,
    String(level)
  );

}


/* =========================================================
   RESET
========================================================= */

function resetLevel(){

  levelWon = false;
  paused = false;

  levelData =
    makeLevel(level);


  player.x = 70;

  player.y =
    levelData.groundY -
    player.h;

  player.vx = 0;
  player.vy = 0;

  player.grounded = true;
  player.coyote = 0;

  cameraX = 0;

  stormFlash = 0;


  levelEl.textContent =
    level;


  tierEl.textContent =
    "• " +
    levelData.tier.name;


  levelIdea.textContent =
    `LEVEL ${level}: ${levelData.idea}`;


  player.speed =
    levelData.tier.speed;

  player.jumpPower =
    levelData.tier.jump;


  win.style.display =
    "none";


  saveLevel();

}

/* =========================================================
   COLLISION
========================================================= */

function intersects(a,b){

  return(

    a.x <
      b.x + b.w &&

    a.x + a.w >
      b.x &&

    a.y <
      b.y + b.h &&

    a.y + a.h >
      b.y

  );

}


/* =========================================================
   WIN
========================================================= */

function winLevel(){

  if(levelWon)
    return;


  levelWon = true;
  paused = true;

  saveLevel();


  finishBanner.classList.remove(
    "show"
  );

  void finishBanner.offsetWidth;

  finishBanner.classList.add(
    "show"
  );


  winText.textContent =
    `تۆ مەرحەلەی ${level} ـت بە سەرکەوتوویی بردەوە.`;

  win.style.display =
    "flex";

}

function nextLevel(){

  if(
    level >=
    TOTAL_LEVELS
  ){

    level = 1;

  }

  else{

    level++;

  }


  saveLevel();

  resetLevel();

}

      nextLevel();

    }
  );


/* =========================================================
   SLOPE
========================================================= */

function slopeSurfaceY(
  s,
  x
){

  const t =
    clamp(
      (x - s.x) /
      s.w,
      0,
      1
    );


  return (
    s.y -
    s.rise * t
  );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(
    paused ||
    !levelData
  ){

    return;

  }


  const oldY =
    player.y;

  const oldBottom =
    oldY +
    player.h;


  /*
    MOVEMENT
  */

  const targetVX =
    input.x *
    player.speed;


  player.vx +=
    (
      targetVX -
      player.vx
    ) *
    Math.min(
      1,
      dt * 12
    );


  player.vy +=
    1550 * dt;


  player.x +=
    player.vx * dt;

  player.y +=
    player.vy * dt;


  player.grounded = false;


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    const horizontal =
      player.x +
      player.w >
      p.x &&

      player.x <
      p.x +
      p.w;


    const newBottom =
      player.y +
      player.h;


    const descending =
      player.vy >= 0;


    const crossedTop =
      oldBottom <=
      p.y + 8 &&

      newBottom >=
      p.y;


    if(
      horizontal &&
      descending &&
      crossedTop
    ){

      player.y =
        p.y -
        player.h;

      player.vy = 0;

      player.grounded = true;

    }

  }


  /*
    SLOPES
  */

  for(
    const s
    of levelData.slopes
  ){

    if(
      player.x +
      player.w >
      s.x &&

      player.x <
      s.x +
      s.w
    ){

      const surface =
        slopeSurfaceY(
          s,
          player.x +
          player.w * .5
        );


      const bottom =
        player.y +
        player.h;


      if(
        player.vy >= 0 &&
        bottom >= surface &&
        oldBottom <=
        surface + 14
      ){

        player.y =
          surface -
          player.h;

        player.vy = 0;

        player.grounded = true;

      }

    }

  }


  /*
    COYOTE
  */

  if(
    player.grounded
  ){

    player.coyote = .12;

  }

  else{

    player.coyote =
      Math.max(
        0,
        player.coyote - dt
      );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)
      continue;


    const dx =
      player.x +
      player.w / 2 -
      s.x;


    const dy =
      player.y +
      player.h / 2 -
      s.y;


    if(
      Math.hypot(
        dx,
        dy
      ) < 30
    ){

      s.taken = true;

    }

  }


  /*
    CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    const hit =

      player.x +
      player.w >
      c.x &&

      player.x <
      c.x +
      c.w &&

      player.y +
      player.h >=
      c.y - 12 &&

      player.y +
      player.h <=
      c.y + 20;


    if(
      hit &&
      !c.active
    ){

      c.active = true;

      c.timer =
        Math.max(
          .45,
          1.05 -
          Math.min(
            .45,
            levelData.tier.d * .45
          )
        );

    }


    if(
      c.active &&
      !c.broken
    ){

      c.timer -= dt;


      if(
        c.timer <= 0
      ){

        c.broken = true;

      }

    }


    if(
      c.broken &&
      player.x +
      player.w >
      c.x &&

      player.x <
      c.x +
      c.w &&

      player.y +
      player.h >
      c.y - 25
    ){

      player.vy += 180;

    }

  }


  /*
    BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    b.targetTimer -= dt;


    if(
      b.targetTimer <= 0
    ){

      b.dir =
        player.x >
        b.x
        ? 1
        : -1;


      b.targetTimer =
        Math.max(
          .35,
          .8 +
          random(
            level * 77 +
            Math.floor(
              performance.now() /
              1000
            )
          ) * 1.7 -
          levelData.tier.d * .35
        );

    }


    b.x +=
      b.dir *
      b.speed *
      dt;


    if(
      b.x <=
      b.minX
    ){

      b.x = b.minX;
      b.dir = 1;

    }


    if(
      b.x >=
      b.maxX
    ){

      b.x = b.maxX;
      b.dir = -1;

    }


    const dx =
      player.x +
      player.w / 2 -
      b.x;


    const dy =
      player.y +
      player.h / 2 -
      b.y;


    if(
      Math.hypot(
        dx,
        dy
      ) <
      b.r + 18
    ){

      resetLevel();

      return;

    }

  }


  /*
    FALLING OBJECTS
  */

  for(
    const f
    of levelData.fallers
  ){

    f.y +=
      f.vy *
      dt;


    if(
      f.y >
      f.maxY
    ){

      f.y =
        f.resetY;

    }


    const box = {

      x:
        f.x - 10,

      y:
        f.y - 10,

      w:
        f.w + 20,

      h:
        f.h + 20

    };


    if(
      intersects(
        player,
        box
      )
    ){

      resetLevel();

      return;

    }

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    if(
      intersects(
        player,
        h
      )
    ){

      resetLevel();

      return;

    }

  }


  /*
    LIGHTNING
  */

  for(
    const l
    of levelData.lightnings
  ){

    l.timer += dt;


    if(
      l.timer >
      l.cool
    ){

      l.timer = 0;

    }


    const phase =
      l.timer /
      l.cool;


    if(
      phase >=
      l.warning /
      l.cool &&

      phase <
      l.warning /
      l.cool +
      .13
    ){

      stormFlash = 1;


      if(
        Math.abs(
          (
            player.x +
            player.w / 2
          ) -
          l.x
        ) < 42 &&

        player.y >
        l.y - 10
      ){

        resetLevel();

        return;

      }

    }

  }


  stormFlash =
    Math.max(
      0,
      stormFlash -
      dt * 4
    );


  /*
    FALL
  */

  if(
    player.y >
    H + 150
  ){

    resetLevel();

    return;

  }


  /*
    FINISH
  */

  if(
    player.x +
    player.w >=
    levelData.finishX
  ){

    winLevel();

    return;

  }


  /*
    CAMERA
  */

  const targetCamera =
    Math.max(
      0,
      player.x -
      W * .32
    );


  cameraX +=
    (
      targetCamera -
      cameraX
    ) *
    Math.min(
      1,
      dt * 7
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  sky.addColorStop(
    0,
    "#8fd3ff"
  );

  sky.addColorStop(
    .55,
    "#b9e8b0"
  );

  sky.addColorStop(
    1,
    "#e9d8a6"
  );


  ctx.fillStyle = sky;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.save();


  ctx.translate(
    -cameraX * .12,
    0
  );


  /*
    CLOUDS
  */

  for(
    let i=0;
    i<35;
    i++
  ){

    const x =
      i * 280 + 100;

    const y =
      95 +
      (i % 4) * 45;


    ctx.fillStyle =
      "rgba(255,255,255,.45)";


    ctx.beginPath();


    ctx.arc(
      x,
      y,
      28,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 30,
      y - 8,
      35,
      0,
      Math.PI * 2
    );

    ctx.arc(
      x + 65,
      y,
      25,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  /*
    STORM CLOUDS
  */

  if(
    levelData &&
    levelData.lightnings.length
  ){

    for(
      const l
      of levelData.lightnings
    ){

      const phase =
        l.timer /
        l.cool;


      let alpha = .2;


      if(
        phase <
        l.warning /
        l.cool
      ){

        alpha = .65;

      }


      ctx.fillStyle =
        `rgba(50,55,70,${alpha})`;


      ctx.beginPath();


      ctx.arc(
        l.x,
        75,
        45,
        0,
        Math.PI * 2
      );

      ctx.arc(
        l.x + 42,
        85,
        55,
        0,
        Math.PI * 2
      );

      ctx.arc(
        l.x - 40,
        88,
        42,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }

  }


  ctx.restore();


  /*
    FLASH
  */

  if(
    stormFlash > 0
  ){

    ctx.fillStyle =
      `rgba(
        255,
        255,
        255,
        ${Math.min(
          .45,
          stormFlash * .45
        )}
      )`;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }

}


/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  ctx.save();


  ctx.translate(
    -cameraX,
    0
  );


  /*
    PLATFORMS
  */

  for(
    const p
    of levelData.platforms
  ){

    ctx.fillStyle =
      "#292b31";


    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      p.h
    );


    ctx.fillStyle =
      "#65d878";


    ctx.fillRect(
      p.x,
      p.y,
      p.w,
      7
    );


    ctx.fillStyle =
      "rgba(255,255,255,.13)";


    for(
      let xx =
        p.x + 18;

      xx <
        p.x + p.w;

      xx += 48
    ){

      ctx.fillRect(
        xx,
        p.y + 22,
        12,
        5
      );

    }

  }


  /*
    SLOPES
  */

  for(
    const s
    of levelData.slopes
  ){

    ctx.fillStyle =
      "#292b31";


    ctx.beginPath();


    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x + s.w,
      s.y - s.rise
    );

    ctx.lineTo(
      s.x + s.w,
      s.y + 55 - s.rise
    );

    ctx.lineTo(
      s.x,
      s.y + 55
    );


    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle =
      "#65d878";

    ctx.lineWidth = 7;


    ctx.beginPath();


    ctx.moveTo(
      s.x,
      s.y
    );

    ctx.lineTo(
      s.x + s.w,
      s.y - s.rise
    );


    ctx.stroke();

  }


  /*
    CRACKS
  */

  for(
    const c
    of levelData.cracks
  ){

    if(c.broken){

      ctx.fillStyle =
        "#111";


      ctx.fillRect(
        c.x - 4,
        c.y - 4,
        c.w + 8,
        24
      );


      ctx.strokeStyle =
        "#ef476f";

      ctx.lineWidth = 2;


      ctx.beginPath();


      ctx.moveTo(
        c.x + 8,
        c.y
      );

      ctx.lineTo(
        c.x + 18,
        c.y + 15
      );

      ctx.lineTo(
        c.x + 28,
        c.y + 2
      );

      ctx.lineTo(
        c.x + 39,
        c.y + 16
      );


      ctx.stroke();

      continue;

    }


    ctx.fillStyle =
      c.active
      ? "#ef476f"
      : "#555861";


    ctx.fillRect(
      c.x,
      c.y,
      c.w,
      8
    );


    ctx.strokeStyle =
      "#111";

    ctx.lineWidth = 2;


    ctx.beginPath();


    ctx.moveTo(
      c.x + 10,
      c.y
    );

    ctx.lineTo(
      c.x + 20,
      c.y + 8
    );

    ctx.lineTo(
      c.x + 28,
      c.y
    );

    ctx.lineTo(
      c.x + 40,
      c.y + 8
    );


    ctx.stroke();

  }


  /*
    SPIKES
  */

  for(
    const h
    of levelData.hazards
  ){

    ctx.fillStyle =
      "#ef476f";


    ctx.beginPath();


    ctx.moveTo(
      h.x,
      h.y + h.h
    );

    ctx.lineTo(
      h.x + h.w / 2,
      h.y - 10
    );

    ctx.lineTo(
      h.x + h.w,
      h.y + h.h
    );


    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
      "#fff";

    ctx.font =
      "bold 9px system-ui";


    ctx.fillText(
      "!",
      h.x + 9,
      h.y + 10
    );

  }


  /*
    STARS
  */

  for(
    const s
    of levelData.stars
  ){

    if(s.taken)
      continue;


    ctx.save();


    ctx.translate(
      s.x,
      s.y
    );


    ctx.rotate(
      performance.now() / 700
    );


    ctx.fillStyle =
      "#ffd166";


    ctx.beginPath();


    for(
      let i=0;
      i<10;
      i++
    ){

      const a =
        i * Math.PI / 5;


      const r =
        i % 2 === 0
        ? 11
        : 5;


      const sx =
        Math.cos(a) * r;


      const sy =
        Math.sin(a) * r;


      if(i===0){

        ctx.moveTo(
          sx,
          sy
        );

      }

      else{

        ctx.lineTo(
          sx,
          sy
        );

      }

    }


    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /*
    BALLS
  */

  for(
    const b
    of levelData.balls
  ){

    ctx.save();


    ctx.translate(
      b.x,
      b.y
    );


    ctx.fillStyle =
      "#ff6b35";


    ctx.beginPath();


    ctx.arc(
      0,
      0,
      b.r,
      0,
      Math.PI * 2
    );


    ctx.fill();


    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth = 3;


    ctx.beginPath();


    ctx.arc(
      0,
      0,
      b.r - 5,
      0,
      Math.PI * 1.5
    );


    ctx.stroke();


    ctx.fillStyle =
      "#222";


    ctx.beginPath();


    ctx.arc(
      -5,
      -3,
      3,
      0,
      Math.PI * 2
    );


    ctx.arc(
      5,
      -3,
      3,
      0,
      Math.PI * 2
    );


    ctx.fill();

    ctx.restore();

  }


  /*
    FALLING BLOCKS
  */

  for(
    const f
    of levelData.fallers
  ){

    ctx.fillStyle =
      "#7b61ff";


    ctx.fillRect(
      f.x,
      f.y,
      f.w,
      f.h
    );


    ctx.fillStyle =
      "#fff";


    ctx.fillRect(
      f.x + 5,
      f.y + 5,
      4,
      4
    );

    ctx.fillRect(
      f.x + 12,
      f.y + 5,
      4,
      4
    );

  }


  /*
    LIGHTNING
  */

  for(
    const l
    of levelData.lightnings
  ){

    const phase =
      l.timer /
      l.cool;


    /*
      WARNING
    */

    if(
      phase <
      l.warning /
      l.cool
    ){

      ctx.fillStyle =
        "rgba(255,230,80,.75)";


      ctx.beginPath();


      ctx.arc(
        l.x,
        l.y,
        10 +
        Math.sin(
          performance.now() / 90
        ) * 4,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    /*
      STRIKE
    */

    else if(
      phase <
      l.warning /
      l.cool +
      .13
    ){

      ctx.strokeStyle =
        "#fff36b";

      ctx.lineWidth = 8;


      ctx.beginPath();


      ctx.moveTo(
        l.x,
        l.y
      );

      ctx.lineTo(
        l.x - 18,
        l.y + 45
      );

      ctx.lineTo(
        l.x + 10,
        l.y + 45
      );

      ctx.lineTo(
        l.x - 5,
        l.y + 105
      );


      ctx.stroke();

    }

  }


  /*
    FINISH FLAG
  */

  const fx =
    levelData.finishX;


  ctx.fillStyle =
    "#222";


  ctx.fillRect(
    fx,
    levelData.groundY - 120,
    7,
    120
  );


  ctx.fillStyle =
    "#ff4d6d";


  ctx.beginPath();


  ctx.moveTo(
    fx + 7,
    levelData.groundY - 120
  );

  ctx.lineTo(
    fx + 75,
    levelData.groundY - 94
  );

  ctx.lineTo(
    fx + 7,
    levelData.groundY - 68
  );


  ctx.closePath();

  ctx.fill();


  /*
    PLAYER
  */

  ctx.save();


  ctx.translate(
    player.x,
    player.y
  );


  ctx.fillStyle =
    "#684cff";


  ctx.beginPath();


  ctx.roundRect(
    0,
    0,
    player.w,
    player.h,
    8
  );


  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle =
    "#fff";


  ctx.beginPath();


  ctx.arc(
    10,
    12,
    5,
    0,
    Math.PI * 2
  );

  ctx.arc(
    23,
    12,
    5,
    0,
    Math.PI * 2
  );


  ctx.fill();


  ctx.fillStyle =
    "#111";


  ctx.beginPath();


  ctx.arc(
    11,
    12,
    2,
    0,
    Math.PI * 2
  );

  ctx.arc(
    24,
    12,
    2,
    0,
    Math.PI * 2
  );


  ctx.fill();


  /*
    SMILE
  */

  ctx.strokeStyle =
    "#111";

  ctx.lineWidth = 3;


  ctx.beginPath();


  ctx.arc(
    17,
    17,
    9,
    0,
    Math.PI
  );


  ctx.stroke();


  /*
    LEGS
  */

  ctx.fillStyle =
    "#222";


  ctx.fillRect(
    6,
    38,
    7,
    5
  );

  ctx.fillRect(
    21,
    38,
    7,
    5
  );


  ctx.restore();


  /*
    FUNNY TEXT
  */

  ctx.fillStyle =
    "rgba(20,20,20,.35)";

  ctx.font =
    "900 15px system-ui";


  ctx.fillText(
    "هەموو شتێک باشە 😎",
    player.x + 100,
    player.y - 30
  );


  ctx.restore();

}


/* =========================================================
   SAN POSITION
========================================================= */

function updateSanPosition(){

  const positions = [

    {
      right:18,
      top:110
    },

    {
      right:W * .28,
      top:90
    },

    {
      right:35,
      top:180
    },

    {
      right:W * .45,
      top:120
    },

    {
      right:20,
      top:250
    }

  ];


  const p =
    positions[
      (level - 1) %
      positions.length
    ];


  san.style.right =
    p.right + "px";

  san.style.top =
    p.top + "px";


  const size =
    Math.min(
      86,
      Math.max(
        64,
        W * .19
      )
    );


  san.style.width =
    size + "px";

  san.style.height =
    size + "px";

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  drawBackground();


  if(levelData){

    drawWorld();

  }


  updateSanPosition();

}


/* =========================================================
   LOOP
========================================================= */

function loop(time){

  if(!playing)
    return;


  const dt =
    Math.min(
      .033,
      Math.max(
        .001,
        (time - lastTime) / 1000
      )
    );


  lastTime = time;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   INITIAL
========================================================= */

levelData =
  makeLevel(level);


levelEl.textContent =
  level;


tierEl.textContent =
  "• " +
  levelData.tier.name;


draw();

</script>
