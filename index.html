<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanFx Adventure 🎮</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>

    <div class="text-center mb-2">
        <h1 class="text-xl font-black text-yellow-400">SanFx Adventure 🎮</h1>
        <p class="text-xs text-gray-400" id="levelInfo">مەرحەلەی ١: دەستپێک</p>
    </div>

    <canvas id="gameCanvas" width="400" height="250"></canvas>

    <div class="mt-3">
        <button onclick="jump()" class="px-8 py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 text-black font-extrabold rounded-xl shadow-lg text-sm active:scale-95 transition">
            بازدان ⬆️ (Jump)
        </button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let level = 1;
        let isGameOver = false;

        // لێرەدا ناوی فایلی وێنەکەت ڕێکخراوە بە PNG گەورە وەک خۆی
        const sanImg = new Image();
        sanImg.src = 'san.PNG'; 

        let san = {
            x: 40,
            y: 155,
            size: 45,
            dy: 0,
            jumpPower: -9.5,
            gravity: 0.5,
            grounded: true
        };

        let obstacles = [];
        let obstacleTimer = 0;

        function jump() {
            if (san.grounded && !isGameOver) {
                san.dy = san.jumpPower;
                san.grounded = false;
            }
            if (isGameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        function update() {
            if (isGameOver) return;

            san.dy += san.gravity;
            san.y += san.dy;

            if (san.y > 155) {
                san.y = 155;
                san.dy = 0;
                san.grounded = true;
            }

            obstacleTimer++;
            let spawnInterval = level === 1 ? 110 : level === 2 ? 85 : 65;
            
            if (obstacleTimer > spawnInterval) {
                obstacles.push({
                    x: canvas.width,
                    y: 165,
                    width: 22,
                    height: 40,
                    speed: level === 1 ? 4 : level === 2 ? 5.5 : 7
                });
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                if (
                    san.x < obstacles[i].x + obstacles[i].width &&
                    san.x + san.size > obstacles[i].x &&
                    san.y < obstacles[i].y + obstacles[i].height &&
                    san.y + san.size > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;

                    if (score >= 50 && score < 100) {
                        level = 2;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٢: خێرا تر 🔥";
                    } else if (score >= 100) {
                        level = 3;
                        document.getElementById('levelInfo').innerText = "مەرحەلەی ٣: پاڵەوان ⚡️";
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();

            ctx.save();
            ctx.beginPath();
            ctx.arc(san.x + san.size / 2, san.y + san.size / 2, san.size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            if (sanImg.complete && sanImg.naturalWidth !== 0) {
                ctx.drawImage(sanImg, san.x, san.y, san.size, san.size);
            } else {
                ctx.fillStyle = "#d4af37";
                ctx.fillRect(san.x, san.y, san.size, san.size);
            }
            ctx.restore();

            ctx.beginPath();
            ctx.arc(san.x + san.size / 2, san.y + san.size / 2, san.size / 2, 0, Math.PI * 2);
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#ef4444";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Vazirmatn";
            ctx.fillText(`خاڵ: ${score}`, 15, 25);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ef4444";
                ctx.font = "bold 18px Vazirmatn";
                ctx.textAlign = "center";
                ctx.fillText("یاریەکە تەواو بوو! ❌", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#d4af37";
                ctx.font = "12px Vazirmatn";
                ctx.fillText("بۆ دووبارە دەستپێکردنەوە کلیک بکە", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }
        }

        function resetGame() {
            score = 0;
            level = 1;
            obstacles = [];
            isGameOver = false;
            document.getElementById('levelInfo').innerText = "مەرحەلەی ١: دەستپێک";
            san.y = 155;
            san.dy = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
