<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>SAN B AHAMD</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #111;
  touch-action: none;
  overscroll-behavior: none;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   GAME
========================= */

#game {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;
  touch-action: none;

  background:
    linear-gradient(
      #7fc184 0 36%,
      #292929 36% 42%,
      #111 42% 100%
    );
}

#world {
  position: absolute;
  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;
}

/* =========================
   INTRO
========================= */

#intro {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 80% 10%, #ffc857 0 12%, transparent 13%),
    radial-gradient(circle at 0% 100%, #8fd3b6 0 16%, transparent 17%),
    #f47758;

  color: white;
  text-align: center;

  transition: opacity .5s ease;
}

#intro h1 {
  margin: 0;

  font-size: clamp(42px, 15vw, 90px);
  line-height: .85;
  font-weight: 900;

  text-shadow:
    4px 4px 0 #222,
    7px 7px 0 rgba(0,0,0,.2);
}

#intro .subtitle {
  margin-top: 16px;

  font-size: 17px;
  font-weight: bold;
}

#creator {
  margin-top: 30px;
  font-size: 15px;
  opacity: .9;
}

#startButton {
  margin-top: 25px;

  border: 0;
  border-radius: 30px;

  padding: 15px 40px;

  background: #222;
  color: white;

  font-size: 18px;
  font-weight: bold;

  box-shadow: 0 7px 0 rgba(0,0,0,.25);

  touch-action: manipulation;
}

#startButton:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 rgba(0,0,0,.25);
}

/* =========================
   TOP UI
========================= */

#topUI {
  position: fixed;
  left: 50%;
  top: max(10px, env(safe-area-inset-top));

  transform: translateX(-50%);

  z-index: 500;

  width: min(94vw, 520px);

  display: flex;
  justify-content: space-between;
  align-items: center;

  pointer-events: none;
}

.badge {
  padding: 9px 14px;

  border-radius: 20px;

  background: rgba(0,0,0,.65);
  color: white;

  font-size: 14px;
  font-weight: bold;

  backdrop-filter: blur(8px);
}

/* =========================
   PLAYER
========================= */

#player {
  position: absolute;

  width: 46px;
  height: 58px;

  background: #6547ff;

  border-radius: 4px;

  z-index: 100;

  transition: transform .05s linear;
}

/* eyes */

.eye {
  position: absolute;

  width: 13px;
  height: 13px;

  top: 12px;

  background: white;
  border-radius: 50%;
}

.eye:after {
  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  left: 4px;
  top: 4px;

  background: #111;
  border-radius: 50%;
}

.eye.left {
  left: 7px;
}

.eye.right {
  right: 7px;
}

/* smile */

#smile {
  position: absolute;

  width: 23px;
  height: 12px;

  left: 11px;
  top: 29px;

  border-bottom: 4px solid #111;
  border-radius: 0 0 20px 20px;
}

/* =========================
   WORLD OBJECTS
========================= */

.ground {
  position: absolute;

  height: 25px;

  background: #51d66b;

  border-top: 4px solid #7aff8f;
}

.platform {
  position: absolute;

  background: #343434;

  border-radius: 4px;

  box-shadow:
    inset 0 -5px 0 rgba(0,0,0,.15);
}

.spike {
  position: absolute;

  width: 0;
  height: 0;

  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 28px solid #efefef;

  filter: drop-shadow(0 2px 0 #111);
}

.wall {
  position: absolute;

  background: #5741e8;

  border: 4px solid #30219d;

  border-radius: 7px;
}

/* =========================
   FUNNY IMAGE
========================= */

#funnyImage {
  position: absolute;

  width: 72px;
  height: 72px;

  object-fit: contain;

  z-index: 120;

  pointer-events: none;

  filter: drop-shadow(0 5px 3px rgba(0,0,0,.35));

  animation: funnyFloat 1.7s ease-in-out infinite;
}

@keyframes funnyFloat {
  0%,100% {
    transform: rotate(-7deg) translateY(0);
  }

  50% {
    transform: rotate(7deg) translateY(-9px);
  }
}

/* =========================
   CONTROLS
========================= */

#controls {
  position: fixed;

  left: 0;
  right: 0;

  bottom: max(18px, env(safe-area-inset-bottom));

  height: 150px;

  z-index: 900;

  pointer-events: none;

  touch-action: none;
}

/*
  LEFT SIDE = steering
  Slightly higher than before.
*/

#steering {
  position: absolute;

  left: 20px;
  bottom: 42px;

  display: flex;
  gap: 10px;

  pointer-events: auto;

  touch-action: none;
}

.steer {
  width: 70px;
  height: 70px;

  border-radius: 50%;

  border: 3px solid rgba(255,255,255,.7);

  background: rgba(45,45,45,.85);

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 31px;
  font-weight: bold;

  box-shadow:
    0 5px 15px rgba(0,0,0,.25);

  touch-action: none;
}

.steer.active {
  background: #6547ff;

  transform: scale(.92);
}

/* =========================
   ACTION BUTTONS
========================= */

#actions {
  position: absolute;

  right: 18px;
  bottom: 30px;

  display: grid;

  grid-template-columns: repeat(2, 62px);

  gap: 8px;

  pointer-events: auto;

  touch-action: none;
}

.action {
  width: 62px;
  height: 62px;

  border: 2px solid rgba(255,255,255,.45);

  border-radius: 50%;

  background: rgba(20,20,20,.75);

  color: white;

  font-size: 13px;
  font-weight: bold;

  touch-action: none;
}

.action:active {
  transform: scale(.9);
  background: #6547ff;
}

/* =========================
   WIN SCREEN
========================= */

#winScreen {
  position: fixed;
  inset: 0;

  z-index: 2000;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 20px;

  background: rgba(0,0,0,.72);

  backdrop-filter: blur(8px);
}

.winBox {
  width: min(90vw, 430px);

  padding: 30px 20px;

  border-radius: 25px;

  background: #171717;

  color: white;

  text-align: center;

  border: 2px solid #6547ff;

  box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}

.winBox h2 {
  margin-top: 0;

  font-size: 28px;
}

.winBox p {
  font-size: 17px;
  line-height: 1.7;
}

.winButton {
  margin-top: 10px;

  padding: 13px 28px;

  border: 0;
  border-radius: 25px;

  background: #6547ff;
  color: white;

  font-weight: bold;
  font-size: 16px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #controls {
    height: 155px;
  }

  #steering {
    left: 16px;
    bottom: 48px;
  }

  .steer {
    width: 66px;
    height: 66px;
  }

  #actions {
    right: 13px;
    bottom: 35px;
  }

  .action {
    width: 58px;
    height: 58px;
  }

  #funnyImage {
    width: 62px;
    height: 62px;
  }
}
</style>
</head>

<body>

<!-- =========================
     INTRO
========================= -->

<div id="intro">

  <h1>SAN<br>B AHAMD</h1>

  <div class="subtitle">
    One tiny hero. Thousands of funny problems.
  </div>

  <div id="creator">
    Created by aro bestun
  </div>

  <button id="startButton">
    Tap to begin
  </button>

</div>

<!-- =========================
     GAME
========================= -->

<div id="game">

  <div id="world">

    <div id="player">

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div id="smile"></div>

    </div>

    <!-- GitHub image -->
    <img
      id="funnyImage"
      src="san.PNG"
      alt=""
    >

  </div>

  <!-- TOP INFO -->

  <div id="topUI">

    <div class="badge">
      SAN B AHAMD
    </div>

    <div class="badge">
      Level <span id="levelNumber">1</span> / 1000
    </div>

  </div>

  <!-- CONTROLS -->

  <div id="controls">

    <!-- STEERING -->

    <div id="steering">

      <button
        id="leftBtn"
        class="steer"
        aria-label="Left"
      >
        ←
      </button>

      <button
        id="rightBtn"
        class="steer"
        aria-label="Right"
      >
        →
      </button>

    </div>

    <!-- ACTIONS -->

    <div id="actions">

      <button class="action" id="jumpBtn">
        JUMP
      </button>

      <button class="action" id="runBtn">
        RUN
      </button>

      <button class="action" id="resetBtn">
        RESET
      </button>

      <button class="action" id="nextBtn">
        NEXT
      </button>

    </div>

  </div>

</div>

<!-- =========================
     WIN
========================= -->

<div id="winScreen">

  <div class="winBox">

    <h2>🎉 پیرۆزە!</h2>

    <p>
      تۆ دیار جۆینی گروپی سان FX کردوە
    </p>

    <p>
      مەرحەلەکەت بە سەرکەوتوویی تەواو کرد!
    </p>

    <button
      id="continueBtn"
      class="winButton"
    >
      مەرحەلەی داهاتوو
    </button>

  </div>

</div>

<script>

/* =====================================================
   SAN B AHAMD
   Mobile platform game
===================================================== */

const game = document.getElementById("game");
const world = document.getElementById("world");

const player = document.getElementById("player");
const funnyImage = document.getElementById("funnyImage");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const jumpBtn = document.getElementById("jumpBtn");
const runBtn = document.getElementById("runBtn");
const resetBtn = document.getElementById("resetBtn");
const nextBtn = document.getElementById("nextBtn");

const levelNumber = document.getElementById("levelNumber");

const winScreen = document.getElementById("winScreen");
const continueBtn = document.getElementById("continueBtn");

const intro = document.getElementById("intro");
const startButton = document.getElementById("startButton");


/* =====================================================
   GAME STATE
===================================================== */

let level = 1;

const TOTAL_LEVELS = 1000;

let playerX = 70;
let playerY = 0;

let velocityX = 0;
let velocityY = 0;

let gravity = 0.72;

let speed = 4.2;

let jumping = false;
let won = false;

let leftPressed = false;
let rightPressed = false;
let runPressed = false;


/* =====================================================
   LEVEL OBJECTS
===================================================== */

let platforms = [];
let spikes = [];
let walls = [];


/* =====================================================
   PREVENT IPHONE ZOOM / SCROLL
===================================================== */

document.addEventListener(
  "gesturestart",
  e => e.preventDefault(),
  { passive: false }
);

document.addEventListener(
  "gesturechange",
  e => e.preventDefault(),
  { passive: false }
);

document.addEventListener(
  "gestureend",
  e => e.preventDefault(),
  { passive: false }
);

let lastTouchEnd = 0;

document.addEventListener(
  "touchend",
  function(e) {

    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }

    lastTouchEnd = now;

  },
  { passive: false }
);


/* =====================================================
   HELPERS
===================================================== */

function clearLevel() {

  document
    .querySelectorAll(".platform,.spike,.wall,.ground")
    .forEach(el => el.remove());

  platforms = [];
  spikes = [];
  walls = [];
}


function createPlatform(x, y, width, height = 25) {

  const el = document.createElement("div");

  el.className = "platform";

  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.width = width + "px";
  el.style.height = height + "px";

  world.appendChild(el);

  platforms.push({
    x,
    y,
    width,
    height
  });

  return el;
}


function createSpike(x, y) {

  const el = document.createElement("div");

  el.className = "spike";

  el.style.left = x + "px";
  el.style.top = y + "px";

  world.appendChild(el);

  spikes.push({
    x,
    y,
    width: 28,
    height: 28
  });
}


function createWall(x, y, width, height) {

  const el = document.createElement("div");

  el.className = "wall";

  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.width = width + "px";
  el.style.height = height + "px";

  world.appendChild(el);

  walls.push({
    x,
    y,
    width,
    height
  });
}


/* =====================================================
   LEVEL GENERATOR

   Every level is different.
   Difficulty increases gradually.
   But every level remains beatable.
===================================================== */

function generateLevel() {

  clearLevel();

  won = false;

  levelNumber.textContent = level;

  const W = window.innerWidth;
  const H = window.innerHeight;

  /*
    Safe starting ground.
  */

  createPlatform(
    0,
    H - 115,
    W * 0.38,
    30
  );

  /*
    Finish platform.
  */

  createPlatform(
    W - W * 0.30,
    H - 115,
    W * 0.30,
    30
  );

  /*
    Middle platforms.
    Always leave a realistic jump route.
  */

  const difficulty =
    Math.min(1, (level - 1) / 999);

  const count =
    3 + Math.floor(difficulty * 4);

  let lastX = W * 0.32;
  let lastY = H - 190;

  for (let i = 0; i < count; i++) {

    const gap =
      65 + Math.random() * 45;

    lastX += gap;

    if (lastX > W - 150) {
      lastX = W - 190;
    }

    /*
      Keep vertical jumps reasonable.
    */

    const verticalChange =
      25 + Math.random() * 65;

    lastY =
      Math.max(
        H - 340,
        Math.min(
          H - 145,
          lastY + (Math.random() > .5
            ? -verticalChange
            : verticalChange)
        )
      );

    const width =
      Math.max(
        110 - difficulty * 15,
        90
      );

    createPlatform(
      lastX,
      lastY,
      width,
      25
    );

    /*
      Funny hazards.
      Not every platform has a spike.
    */

    if (i % 2 === 1 && level > 2) {

      createSpike(
        lastX + width * .55,
        lastY - 28
      );
    }

    /*
      Some levels have walls,
      but never block the whole route.
    */

    if (level > 8 && i === 2) {

      const wallHeight =
        45 + difficulty * 35;

      createWall(
        lastX + width * .75,
        lastY - wallHeight,
        25,
        wallHeight
      );
    }
  }

  /*
    Finish marker.
  */

  const finish = document.createElement("div");

  finish.className = "ground";

  finish.style.left =
    (W - W * .22) + "px";

  finish.style.top =
    (H - 140) + "px";

  finish.style.width =
    "120px";

  finish.style.height =
    "15px";

  world.appendChild(finish);

  /*
    Funny image appears differently
    every level.
  */

  funnyImage.style.left =
    (20 + Math.random() *
      Math.max(20, W - 100)) + "px";

  funnyImage.style.top =
    (80 + Math.random() *
      Math.max(40, H - 260)) + "px";

  /*
    Start position.
  */

  playerX = 60;

  playerY = H - 173;

  velocityX = 0;
  velocityY = 0;

  render();
}


/* =====================================================
   COLLISION
===================================================== */

function rectsOverlap(a, b) {

  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}


function playerRect() {

  return {
    x: playerX,
    y: playerY,
    width: 46,
    height: 58
  };
}


/* =====================================================
   RESET
===================================================== */

function resetPlayer() {

  const H = window.innerHeight;

  playerX = 60;
  playerY = H - 173;

  velocityX = 0;
  velocityY = 0;

  jumping = false;
  won = false;

  winScreen.style.display = "none";

  render();
}


/* =====================================================
   WIN
===================================================== */

function winLevel() {

  if (won) return;

  won = true;

  velocityX = 0;
  velocityY = 0;

  winScreen.style.display = "flex";
}


/* =====================================================
   NEXT LEVEL
===================================================== */

function nextLevel() {

  if (level < TOTAL_LEVELS) {

    level++;

  } else {

    level = 1;
  }

  winScreen.style.display = "none";

  generateLevel();
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

  if (won) {
    requestAnimationFrame(update);
    return;
  }

  const W = window.innerWidth;
  const H = window.innerHeight;

  /*
    IMPORTANT:
    LEFT = negative
    RIGHT = positive

    NO inversion.
  */

  let direction = 0;

  if (leftPressed) {
    direction -= 1;
  }

  if (rightPressed) {
    direction += 1;
  }

  let currentSpeed =
    runPressed ? speed * 1.55 : speed;

  velocityX =
    direction * currentSpeed;

  /*
    Horizontal movement
  */

  playerX += velocityX;

  /*
    Keep inside screen
  */

  playerX =
    Math.max(
      0,
      Math.min(
        W - 46,
        playerX
      )
    );

  /*
    Gravity
  */

  velocityY += gravity;

  playerY += velocityY;

  /*
    Platform collision
  */

  const p = playerRect();

  for (const platform of platforms) {

    const previousBottom =
      p.y + p.height - velocityY;

    const currentBottom =
      playerY + p.height;

    const horizontal =
      playerX + 42 > platform.x &&
      playerX + 4 <
        platform.x + platform.width;

    if (
      horizontal &&
      velocityY >= 0 &&
      previousBottom <= platform.y &&
      currentBottom >= platform.y
    ) {

      playerY =
        platform.y - 58;

      velocityY = 0;

      jumping = false;
    }
  }

  /*
    Spike collision
  */

  const currentRect = playerRect();

  for (const spike of spikes) {

    if (
      rectsOverlap(
        currentRect,
        spike
      )
    ) {

      resetPlayer();

      return;
    }
  }

  /*
    Wall collision
  */

  for (const wall of walls) {

    if (
      rectsOverlap(
        currentRect,
        wall
      )
    ) {

      /*
        Instead of trapping the player,
        gently push them back.
      */

      if (velocityX > 0) {
        playerX = wall.x - 47;
      }

      if (velocityX < 0) {
        playerX =
          wall.x + wall.width + 1;
      }

      velocityX = 0;
    }
  }

  /*
    Falling = reset.
  */

  if (playerY > H + 100) {

    resetPlayer();

    return;
  }

  /*
    Finish line.
    Easy enough to reach.
  */

  if (
    playerX >
    W - 150 &&
    playerY >
    H - 190
  ) {

    winLevel();
  }

  render();

  requestAnimationFrame(update);
}


/* =====================================================
   RENDER
===================================================== */

function render() {

  player.style.left =
    playerX + "px";

  player.style.top =
    playerY + "px";

  /*
    Funny character reaction
  */

  if (velocityX > 0) {

    player.style.transform =
      "scaleX(1)";

  } else if (velocityX < 0) {

    player.style.transform =
      "scaleX(-1)";

  } else {

    player.style.transform =
      "scaleX(1)";
  }
}


/* =====================================================
   TOUCH BUTTONS
===================================================== */

function bindHoldButton(
  button,
  onStart,
  onEnd
) {

  button.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();
      e.stopPropagation();

      button.setPointerCapture?.(
        e.pointerId
      );

      onStart();

    },
    { passive: false }
  );

  button.addEventListener(
    "pointerup",
    function(e) {

      e.preventDefault();
      e.stopPropagation();

      onEnd();

    },
    { passive: false }
  );

  button.addEventListener(
    "pointercancel",
    function(e) {

      e.preventDefault();

      onEnd();

    },
    { passive: false }
  );

  button.addEventListener(
    "pointerleave",
    function(e) {

      if (e.buttons === 0) {
        onEnd();
      }

    },
    { passive: false }
  );
}


/* LEFT */

bindHoldButton(
  leftBtn,

  () => {
    leftPressed = true;
    leftBtn.classList.add("active");
  },

  () => {
    leftPressed = false;
    leftBtn.classList.remove("active");
  }
);


/* RIGHT */

bindHoldButton(
  rightBtn,

  () => {
    rightPressed = true;
    rightBtn.classList.add("active");
  },

  () => {
    rightPressed = false;
    rightBtn.classList.remove("active");
  }
);


/* =====================================================
   JUMP
===================================================== */

bindHoldButton(
  jumpBtn,

  () => {

    if (!jumping) {

      velocityY = -13;

      jumping = true;
    }

  },

  () => {}
);


/* =====================================================
   RUN
===================================================== */

bindHoldButton(
  runBtn,

  () => {
    runPressed = true;
  },

  () => {
    runPressed = false;
  }
);


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    resetPlayer();

  },
  { passive: false }
);


/* =====================================================
   NEXT
===================================================== */

nextBtn.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    nextLevel();

  },
  { passive: false }
);


/* =====================================================
   WIN BUTTON
===================================================== */

continueBtn.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    nextLevel();

  },
  { passive: false }
);


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ) {

      leftPressed = true;
    }

    if (
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ) {

      rightPressed = true;
    }

    if (
      e.key === " " ||
      e.key === "ArrowUp"
    ) {

      if (!jumping) {

        velocityY = -13;

        jumping = true;
      }
    }

  }
);


document.addEventListener(
  "keyup",
  function(e) {

    if (
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ) {

      leftPressed = false;
    }

    if (
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ) {

      rightPressed = false;
    }

  }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    intro.style.opacity = "0";

    setTimeout(
      () => {
        intro.style.display = "none";
      },
      500
    );

    generateLevel();

    requestAnimationFrame(update);

  },
  { passive: false }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function() {

    /*
      Rebuild the current level so
      it remains playable on iPhone.
    */

    if (
      intro.style.display === "none"
    ) {

      generateLevel();
    }

  }
);

</script>

</body>
