<!doctype html>
<html lang="ku"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SAN B AHAMD — 5000 HARD LEVELS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101116;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}button{font:inherit}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;z-index:20;pointer-events:none}.pill{background:#151923dd;color:#fff;padding:9px 12px;border-radius:20px;font-weight:900;font-size:12px}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 10% 15%,#ffd166 0 10%,transparent 11%),radial-gradient(circle at 90% 85%,#7bdcb5 0 13%,transparent 14%),#f07157;color:#fff;text-align:center}.card{width:min(94vw,460px);padding:25px}.title{font-size:clamp(42px,13vw,78px);line-height:.84;font-weight:1000;text-shadow:5px 5px #222}.card button,.win button{border:0;border-radius:999px;padding:15px 25px;background:#20283a;color:#fff;font-weight:1000}
#controls{position:fixed;inset:0;z-index:15;pointer-events:none}.joy{position:absolute;left:18px;bottom:22px;width:124px;height:124px;border:3px solid #ffffff88;border-radius:50%;background:#ffffff0c;pointer-events:auto}.stick{position:absolute;left:30px;top:30px;width:60px;height:60px;border-radius:50%;background:#ffffff40;border:2px solid #fff9;display:grid;place-items:center;color:#fff;font-size:24px}.acts{position:absolute;right:18px;bottom:22px;display:grid;grid-template-columns:78px 78px;gap:9px;pointer-events:none}.act{width:78px;height:78px;border-radius:50%;border:3px solid #fff8;background:#14151acc;color:#fff;font-weight:1000;font-size:11px;pointer-events:auto}.act:active{transform:scale(.9);background:#6c4cff}
#idea{position:fixed;left:50%;bottom:166px;transform:translateX(-50%);width:min(92vw,600px);padding:9px 12px;border-radius:15px;background:#08090acc;color:#fff;text-align:center;font-size:11px;font-weight:900;z-index:16}
#danger{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:19;background:#d92846dd;color:#fff;border-radius:20px;padding:6px 12px;font-size:10px;font-weight:1000;opacity:0}#danger.on{opacity:1}
#win{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:#0009;backdrop-filter:blur(7px)}.win{width:min(92vw,430px);padding:25px;border-radius:25px;background:#17181d;color:#fff;text-align:center}.win button{border-radius:14px;margin:4px}.next{background:#6c4cff!important}.retry{background:#30323a!important}

</style></head><body>
<canvas id="game"></canvas>
<div id="intro"><div class="card"><div class="title">SAN<br>B AHAMD</div><p><b>5000 HARD CHALLENGES</b></p><p>لە Level 16 ـەوە هیچ ئاستێک ئاسان نییە.</p><button id="start">TAP TO BEGIN</button></div></div>
<div id="hud"><div class="pill">SAN B AHAMD</div><div class="pill">LEVEL <span id="level">1</span> / 5000 <span id="tier"></span></div></div>
<div id="danger">⚠️ مەترسیی زۆر بەرزە</div><div id="idea">💡 ئامادە بە...</div>
<div id="controls"><div class="joy" id="joy"><div class="stick" id="stick">↔</div></div><div class="acts"><button class="act" id="jump">JUMP</button><button class="act" id="dash">DASH</button><button class="act" id="reset">RESET</button><button class="act" id="next">NEXT</button></div></div>
<div id="win"><div class="win"><h1>پیرۆزە! 🎉</h1><p id="winText"></p><p>ئامادەی مەرحەلەی داهاتوویت؟ 😈</p><button class="retry" id="retry">دووبارە</button><button class="next" id="nextBtn">مەرحەلەی داهاتوو →</button></div></div>
<div id="banner">🎉 LEVEL COMPLETE!</div>
<script>
"use strict";

const C=document.getElementById("game"),X=C.getContext("2d"),
intro=document.getElementById("intro"),
lvlEl=document.getElementById("level"),
tierEl=document.getElementById("tier"),
ideaEl=document.getElementById("idea"),
win=document.getElementById("win"),
winText=document.getElementById("winText"),
danger=document.getElementById("danger"),
banner=document.getElementById("banner");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;
 H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 C.width=W*DPR;
 C.height=H*DPR;
 C.style.width=W+"px";
 C.style.height=H+"px";
 X.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

const KEY="san_b_ahamd_5000_hard_v20";
const TOTAL=5000;

let level=+localStorage.getItem(KEY)||1;

if(level<1||level>TOTAL)level=1;

let playing=false,
paused=false,
won=false,
last=0,
cam=0,
shake=0,
flash=0,
parts=[],
LD;

const P={
 x:70,
 y:0,
 w:34,
 h:42,
 vx:0,
 vy:0,
 speed:280,
 jump:610,
 ground:false,
 coyote:0,
 dash:0,
 cd:0,
 inv:0,
 reverse:0,
 slow:0
};

const I={x:0};

const ideas=[
 "تۆپەکان دەتوانن شوێنت پێشبینی بکەن.",
 "هەورە تریشقەکە پێش لێدان warning دەدات.",
 "زەوی لەپڕ دەشکێت.",
 "دیوارەکە دەتوانێت لەپڕ بزوێت.",
 "لە ئێستاوە هیچ شتێک safe نییە.",
 "DASH بۆ ڕزگاربوون لە کاتێکی قورس.",
 "هەموو شتێک دەتوانێت لەگەڵ شتێکی تر کۆببێتەوە.",
 "لە Level 16 ـەوە قورسایی بەردەوام زیاد دەکات.",
 "1000 جۆری challenge هەن و دەتوانن تێکەڵ ببن.",
 "Level 5000 کۆتاییەکەیە. 😈"
];

const r=n=>{
 let x=Math.sin(n*12.9898)*43758.5453;
 return x-Math.floor(x);
};

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

const hit=(a,b)=>
 a.x<b.x+b.w &&
 a.x+a.w>b.x &&
 a.y<b.y+b.h &&
 a.y+a.h>b.y;

function difficulty(n){

 if(n<=15){

  let p=(n-1)/14;

  return{
   d:0,
   gap:145-p*25,
   width:180-p*20,
   rise:p*20,
   speed:250,
   jump:650,
   types:1,
   hard:false
  };

 }

 let p=(n-16)/4984;
 let d=Math.pow(p,.62);

 return{
  d,
  gap:cl(120-88*d,25,120),
  width:cl(155-115*d,38,155),
  rise:12+145*d,
  speed:270+50*d,
  jump:650-70*d,
  types:1000,
  hard:true
 };

}

/*
==========================================================
1000 UNIQUE CHALLENGE FAMILIES
==========================================================

ID 0 → 999

هەر ID ـێک seed و شێوازی جیاواز هەیە.
لەگەڵ زیادبوونی difficulty:
- قەبارە گۆڕانکاری دەکات
- خێرایی زیاد دەکات
- شوێن گۆڕانکاری دەکات
- timing جیاواز دەبێت
- چەند trap دەتوانن پێکەوە کۆببنەوە

لە ناوخۆدا 24 mechanic ـی سەرەکی هەیە
کە بە 1000 ID ـی جیاواز دەکرێنە challenge ـی جیاواز.
*/

function challenge(seed,id,d){

 let q={
  id,
  kind:id%24,
  x:0,
  y:0,
  w:18,
  h:18,
  s:1,
  a:0,
  b:0,
  c:0
 };

 q.kind=id%24;

 q.x=
  300+
  r(seed+id*3)*5000;

 q.y=
  80+
  r(seed+id*5)*
  Math.max(
   80,
   H-240
  );

 q.w=
  12+
  r(seed+id*7)*
  (35+d*70);

 q.h=
  12+
  r(seed+id*11)*
  (35+d*70);

 q.s=
  .5+
  r(seed+id*13)*
  (1+d*5);

 q.a=
  r(seed+id*17)*6.28;

 q.b=
  40+
  r(seed+id*19)*
  (80+d*260);

 q.c=
  40+
  r(seed+id*23)*
  (80+d*300);

 return q;
}

function makeLevel(n){

 let D=difficulty(n);

 let gY=
  H-
  Math.max(
   125,
   Math.min(
    165,
    H*.18
   )
  );

 let world=[];
 let haz=[];
 let balls=[];
 let stars=[];
 let special=[];
 let gates=[];

 let x=230;

 let seed=n*99991;

 world.push({
  x:-300,
  y:gY,
  w:500,
  h:80
 });

 let count=
  n<=15
  ?5
  :Math.floor(
    9+
    D.d*28
  );

 for(
  let i=0;
  i<count;
  i++
 ){

  let s=
   seed+
   i*7919;

  let gap=
   D.gap+
   r(s)*45;

  let w=
   Math.max(
    38,
    D.width+
    r(s+1)*45
   );

  let y=
   gY-
   r(s+2)*D.rise;

  x+=gap;

  world.push({
   x,
   y,
   w,
   h:18
  });

  if(i%2===0){

   stars.push({
    x:x+w/2,
    y:y-35,
    t:0
   });

  }

  let base=
   x+
   w+
   25+
   r(s+3)*80;

  /*
   SPIKES
  */

  if(
   n>7 &&
   r(s+4)<
   .18+
   D.d*.72
  ){

   haz.push({
    x:
     x+
     r(s+5)*
     Math.max(
      10,
      w-20
     ),

    y:y-22,
    w:22,
    h:22
   });

  }

  /*
   BALLS
  */

  if(
   n>9 &&
   r(s+6)<
   .2+
   D.d*.8
  ){

   balls.push({
    x:base,
    y:
     y-
     30-
     r(s+7)*100,

    r:
     15+
     D.d*7,

    min:x-60,

    max:
     x+
     w+
     240+
     D.d*300,

    v:
     (
      r(s+8)>.5
      ?1
      :-1
     )*
     (
      130+
      D.d*360
     )
   });

  }

  /*
   1000 CHALLENGE SYSTEM
  */

  if(n>15){

   let amount=
    1+
    Math.floor(
     r(s+9)*
     (
      1+
      D.d*3
     )
    );

   for(
    let k=0;
    k<amount;
    k++
   ){

    special.push(
     challenge(
      s,
      k+(i*37),
      D.d
     )
    );

   }

  }

  x+=w;

  /*
   EXTRA PLATFORM
  */

  if(
   r(s+10)<
   .35+
   D.d*.6
  ){

   world.push({
    x:x+20,
    y:
     gY-
     r(s+11)*D.rise,

    w:
     Math.max(
      40,
      D.width*.75
     ),

    h:18
   });

   x+=Math.max(
    40,
    D.width*.75
   );

  }

 }

 let finish=x+300;

 world.push({
  x:x+50,
  y:gY,
  w:500,
  h:80
 });

 /*
  FINAL GATES
 */

 for(
  let i=0;
  i<Math.floor(D.d*5);
  i++
 ){

  gates.push({

   x:
    x+
    100+
    i*65,

   y:gY-140,

   w:10,
   h:140,

   p:r(seed+700+i),

   t:
    1+
    r(seed+710+i)*1.2

  });

 }

 return{
  D,
  gY,
  world,
  haz,
  balls,
  stars,
  special,
  gates,
  finish,

  idea:
   ideas[
    n<=15
    ?n-1
    :Math.min(
      9,
      Math.floor(
       D.d*10
      )
    )
   ]
 };

}

function reset(){

 won=false;
 paused=false;

 LD=makeLevel(level);

 P.x=70;

 P.y=
  LD.gY-
  P.h;

 P.vx=0;
 P.vy=0;

 P.ground=true;
 P.coyote=0;

 P.dash=0;
 P.cd=0;
 P.inv=0;
 P.reverse=0;
 P.slow=0;

 cam=0;

 lvlEl.textContent=level;

 tierEl.textContent=
  " • "+
  (
   level<=15
   ?"فێرکاری"
   :"قورس"
  )+
  " "+
  level;

 ideaEl.textContent=
  `LEVEL ${level}: ${LD.idea}`;

 P.speed=LD.D.speed;
 P.jump=LD.D.jump;

 danger.classList.toggle(
  "on",
  level>15
 );

 localStorage.setItem(
  KEY,
  level
 );

}

function burst(x,y){

 for(
  let i=0;
  i<12;
  i++
 ){

  parts.push({

   x,
   y,

   vx:
    (
     r(
      performance.now()+i
     )-.5
    )*250,

   vy:
    (
     r(
      performance.now()+i*2
     )-.5
    )*250,

   l:
    .4+
    r(
     i+
     performance.now()
    )*.5

  });

 }

}

function die(){

 if(P.inv<=0)
  reset();

}

function jump(){

 if(
  P.ground||
  P.coyote>0
 ){

  P.vy=-P.jump;

  P.ground=false;
  P.coyote=0;

 }

}

function dash(){

 if(P.cd>0)
  return;

 let d=
  Math.abs(I.x)>.1
  ?I.x
  :1;

 P.vx=d*780;

 P.dash=.16;

 P.cd=
  Math.max(
   .28,
   .75-
   LD.D.d*.25
  );

 P.inv=.18;

 shake=6;

}

function update(dt){

 if(paused)
  return;

 let oldY=P.y;

 let oldB=
  oldY+
  P.h;

 P.cd=
  Math.max(
   0,
   P.cd-dt
  );

 P.dash=
  Math.max(
   0,
   P.dash-dt
  );

 P.inv=
  Math.max(
   0,
   P.inv-dt
  );

 P.reverse=
  Math.max(
   0,
   P.reverse-dt
  );

 P.slow=
  Math.max(
   0,
   P.slow-dt
  );

 /*
  CONTROL
 */

 let ctrl=
  P.reverse>0
  ?-I.x
  :I.x;

 P.vx+=
  (
   ctrl*
   P.speed-
   P.vx
  )*
  Math.min(
   1,
   dt*
   (
    P.slow>0
    ?5
    :12
   )
  );

 /*
  GRAVITY
 */

 P.vy+=
  1550*
  dt;

 P.x+=
  P.vx*
  dt;

 P.y+=
  P.vy*
  dt;

 P.ground=false;

 /*
  PLATFORMS
 */

 for(
  let q
  of LD.world
 ){

  if(
   P.x+P.w>q.x &&
   P.x<q.x+q.w &&
   P.vy>=0 &&
   oldB<=q.y+10 &&
   P.y+P.h>=q.y
  ){

   P.y=
    q.y-
    P.h;

   P.vy=0;
   P.ground=true;

  }

 }

 /*
  SPIKES
 */

 for(
  let q
  of LD.haz
 ){

  if(
   hit(P,q)
  ){

   return die();

  }

 }

 /*
  BALLS
 */

 for(
  let b
  of LD.balls
 ){

  b.x+=
   b.v*
   dt;

  if(
   b.x<b.min||
   b.x>b.max
  ){

   b.v*=-1;

   b.x=
    cl(
     b.x,
     b.min,
     b.max
    );

  }

  if(
   Math.hypot(
    P.x+
    P.w/2-
    b.x,

    P.y+
    P.h/2-
    b.y
   )<
   b.r+18
  ){

   return die();

  }

 }

 /*
  1000 CHALLENGE MECHANICS
 */

 let now=
  performance.now()/1000;

 for(
  let s
  of LD.special
 ){

  let t=
   now+
   s.a;

  let q={
   x:s.x,
   y:s.y,
   w:s.w,
   h:s.h
  };

  let cx=s.x;
  let cy=s.y;

  switch(
   s.kind
  ){

   /*
    0
    Moving circle
   */

   case 0:

    cx+=
     Math.sin(
      t*s.s
     )*
     s.b;

    cy+=
     Math.cos(
      t*s.s
     )*
     s.c;

   break;

   /*
    1
    Horizontal hunter
   */

   case 1:

    cx+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   /*
    2
    Vertical hunter
   */

   case 2:

    cy+=
     Math.sin(
      t*s.s
     )*
     s.c;

   break;

   /*
    3
    Moving wall
   */

   case 3:

    q.x+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   /*
    4
    Falling wall
   */

   case 4:

    q.y+=
     Math.cos(
      t*s.s
     )*
     s.c;

   break;

   /*
    5
    Expanding trap
   */

   case 5:

    q.w*=
     1+
     Math.abs(
      Math.sin(
       t*s.s
      )
     )*
     3;

   break;

   /*
    6
    Expanding vertical trap
   */

   case 6:

    q.h*=
     1+
     Math.abs(
      Math.cos(
       t*s.s
      )
     )*
     3;

   break;

   /*
    7
    Invisible/visible trap
   */

   case 7:

    if(
     Math.sin(
      t*s.s
     )<0
    ){

     q.x=-99999;

    }

   break;

   /*
    8
    Wind
   */

   case 8:

    P.vx+=
     Math.sin(
      t*s.s
     )*
     s.b*
     .015;

   break;

   /*
    9
    Bounce trap
   */

   case 9:

    if(
     hit(P,q)
    ){

     P.vy-=
      350*
      dt;

    }

   break;

   /*
    10
    Reverse controls
   */

   case 10:

    if(
     hit(P,q)
    ){

     P.reverse=1.5;

    }

   break;

   /*
    11
    Slow zone
   */

   case 11:

    if(
     hit(P,q)
    ){

     P.slow=.35;

    }

   break;

   /*
    12
    Orbiting danger
   */

   case 12:

    q.x+=
     Math.cos(
      t*s.s
     )*
     s.b;

    q.y+=
     Math.sin(
      t*s.s
     )*
     s.c;

   break;

   /*
    13
    Pulse wall
   */

   case 13:

    if(
     Math.sin(
      t*s.s
     )>.75
    ){

     q.h*=4;

    }

   break;

   /*
    14
    Falling spike
   */

   case 14:

    q.y+=
     Math.abs(
      Math.sin(
       t*s.s
      )
     )*
     s.c;

   break;

   /*
    15
    Sliding spike
   */

   case 15:

    q.x+=
     Math.abs(
      Math.sin(
       t*s.s
      )
     )*
     s.b;

   break;

   /*
    16
    Circle orbit
   */

   case 16:

    cx+=
     Math.cos(
      t*s.s
     )*
     s.b;

    cy+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   /*
    17
    Violent shaking
   */

   case 17:

    q.x+=
     Math.sin(
      t*s.s*2
     )*
     s.b;

    q.y+=
     Math.cos(
      t*s.s*2
     )*
     s.c;

   break;

   /*
    18
    Huge pulse
   */

   case 18:

    if(
     Math.sin(
      t*s.s
     )>.65
    ){

     q.w*=4;

    }

   break;

   /*
    19
    Random teleport movement
   */

   case 19:

    if(
     Math.sin(
      t*s.s
     )>.9
    ){

     q.x+=
      Math.sin(t*9)*
      100;

     q.y+=
      Math.cos(t*7)*
      80;

    }

   break;

   /*
    20
    Giant horizontal wall
   */

   case 20:

    if(
     Math.sin(
      t*s.s
     )>.72
    ){

     q.w*=5;

    }

   break;

   /*
    21
    LIGHTNING
   */

   case 21:

    if(
     Math.sin(
      t*s.s
     )>.82
    ){

     P.vy-=500*dt;
     flash=1;

    }

   break;

   /*
    22
    GROUND CRACK
   */

   case 22:

    if(
     Math.sin(
      t*s.s
     )>.9
    ){

     P.y+=35;
     P.vy+=220;

    }

   break;

   /*
    23
    Shock wave
   */

   case 23:

    if(
     Math.sin(
      t*s.s
     )>.86
    ){

     P.vx+=
      Math.sign(
       P.x-s.x
      )*
      350;

     shake=8;

    }

   break;

  }

  /*
   COLLISION
  */

  if(
   Math.hypot(
    P.x+
    P.w/2-
    cx,

    P.y+
    P.h/2-
    cy
   )<
   Math.max(
    s.w,
    s.h
   )/2+
   20
  ){

   return die();

  }

  if(
   hit(P,q)&&
   s.kind!==8&&
   s.kind!==9&&
   s.kind!==11
  ){

   return die();

  }

 }

 /*
  FINAL GATES
 */

 for(
  let g
  of LD.gates
 ){

  let active=
   (
    (
     now+
     g.p
    )%
    g.t
   )/
   g.t
   <
   .55;

  if(
   active&&
   hit(P,g)
  ){

   return die();

  }

 }

 /*
  STARS
 */

 for(
  let s
  of LD.stars
 ){

  if(s.t)
   continue;

  if(
   Math.hypot(
    P.x+
    P.w/2-
    s.x,

    P.y+
    P.h/2-
    s.y
   )<28
  ){

   s.t=1;

   burst(
    s.x,
    s.y
   );

  }

 }

 /*
  FALL
 */

 if(
  P.y>
  H+180
 ){

  return die();

 }

 /*
  FINISH
 */

 if(
  P.x+
  P.w>=
  LD.finish
 ){

  let blocked=
   LD.gates.some(
    g=>
     (
      (
       now+
       g.p
      )%
      g.t
     )/
     g.t
     <
     .55
     &&
     hit(P,g)
   );

  if(!blocked){

   winLevel();

  }

 }

 /*
  COYOTE
 */

 P.coyote=
  P.ground
  ?.12
  :Math.max(
   0,
   P.coyote-dt
  );

 /*
  CAMERA
 */

 cam+=
  (
   Math.max(
    0,
    P.x-
    W*.32
   )-
   cam
  )*
  Math.min(
   1,
   dt*7
  );

 shake=
  Math.max(
   0,
   shake-dt*18
  );

 flash=
  Math.max(
   0,
   flash-dt*5
  );

 /*
  PARTICLES
 */

 for(
  let i=parts.length-1;
  i>=0;
  i--
 ){

  let a=parts[i];

  a.x+=
   a.vx*
   dt;

  a.y+=
   a.vy*
   dt;

  a.vy+=
   400*
   dt;

  a.l-=dt;

  if(
   a.l<=0
  ){

   parts.splice(
    i,
    1
   );

  }

 }

}

function winLevel(){

 if(won)
  return;

 won=true;
 paused=true;

 localStorage.setItem(
  KEY,
  level
 );

 winText.textContent=
  `تۆ مەرحەلەی ${level} ـت بردەوە.`;

 win.style.display="grid";

 banner.classList.remove(
  "show"
 );

 void banner.offsetWidth;

 banner.classList.add(
  "show"
 );

}

function next(){

 level=
  level>=TOTAL
  ?1
  :level+1;

 reset();

}

/* =========================================================
   DRAW
========================================================= */

function draw(){

 let d=
  LD?.D.d||0;

 let gr=
  X.createLinearGradient(
   0,
   0,
   0,
   H
  );

 gr.addColorStop(
  0,
  d>.7
  ?"#20243a"
  :"#8fd3ff"
 );

 gr.addColorStop(
  1,
  d>.7
  ?"#171821"
  :"#e9d8a6"
 );

 X.fillStyle=gr;

 X.fillRect(
  0,
  0,
  W,
  H
 );

 if(!LD)
  return;

 X.save();

 X.translate(
  -cam+
  (Math.random()-.5)*
  shake,

  (Math.random()-.5)*
  shake
 );

 /*
  PLATFORMS
 */

 for(
  let q
  of LD.world
 ){

  X.fillStyle="#292b31";

  X.fillRect(
   q.x,
   q.y,
   q.w,
   q.h
  );

  X.fillStyle="#65d878";

  X.fillRect(
   q.x,
   q.y,
   q.w,
   7
  );

 }

 /*
  SPIKES
 */

 for(
  let q
  of LD.haz
 ){

  X.fillStyle="#ef476f";

  X.beginPath();

  X.moveTo(
   q.x,
   q.y+q.h
  );

  X.lineTo(
   q.x+q.w/2,
   q.y-10
  );

  X.lineTo(
   q.x+q.w,
   q.y+q.h
  );

  X.fill();

 }

 /*
  STARS
 */

 for(
  let s
  of LD.stars
 ){

  if(s.t)
   continue;

  X.fillStyle="#ffd166";

  X.beginPath();

  X.arc(
   s.x,
   s.y,
   9,
   0,
   7
  );

  X.fill();

 }

 /*
  BALLS
 */

 for(
  let b
  of LD.balls
 ){

  X.fillStyle="#ff6b35";

  X.beginPath();

  X.arc(
   b.x,
   b.y,
   b.r,
   0,
   7
  );

  X.fill();

  X.fillStyle="#222";

  X.beginPath();

  X.arc(
   b.x-5,
   b.y-3,
   3,
   0,
   7
  );

  X.arc(
   b.x+5,
   b.y-3,
   3,
   0,
   7
  );

  X.fill();

 }

 /*
  CHALLENGES
 */

 let now=
  performance.now()/1000;

 for(
  let s
  of LD.special
 ){

  let q={
   x:s.x,
   y:s.y,
   w:s.w,
   h:s.h
  };

  let xx=s.x;
  let yy=s.y;

  let t=
   now+
   s.a;

  switch(
   s.kind
  ){

   case 0:

    xx+=
     Math.sin(
      t*s.s
     )*
     s.b;

    yy+=
     Math.cos(
      t*s.s
     )*
     s.c;

   break;

   case 1:

    xx+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   case 2:

    yy+=
     Math.sin(
      t*s.s
     )*
     s.c;

   break;

   case 3:

    q.x+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   case 4:

    q.y+=
     Math.cos(
      t*s.s
     )*
     s.c;

   break;

   case 7:

    if(
     Math.sin(
      t*s.s
     )<0
    )
     continue;

   break;

   case 12:

    xx+=
     Math.cos(
      t*s.s
     )*
     s.b;

    yy+=
     Math.sin(
      t*s.s
     )*
     s.c;

   break;

   case 16:

    xx+=
     Math.cos(
      t*s.s
     )*
     s.b;

    yy+=
     Math.sin(
      t*s.s
     )*
     s.b;

   break;

   case 17:

    q.x+=
     Math.sin(
      t*s.s*2
     )*
     s.b;

    q.y+=
     Math.cos(
      t*s.s*2
     )*
     s.c;

   break;

   /*
    LIGHTNING VISUAL
   */

   case 21:

    if(
     Math.sin(
      t*s.s
     )>.72
    ){

     X.strokeStyle="#fff36b";
     X.lineWidth=6;

     X.beginPath();

     X.moveTo(
      s.x,
      s.y-180
     );

     X.lineTo(
      s.x-18,
      s.y-100
     );

     X.lineTo(
      s.x+12,
      s.y-60
     );

     X.lineTo(
      s.x,
      s.y
     );

     X.stroke();

    }

   break;

   /*
    GROUND CRACK VISUAL
   */

   case 22:

    X.strokeStyle="#ef476f";
    X.lineWidth=3;

    X.beginPath();

    X.moveTo(
     s.x-20,
     s.y
    );

    X.lineTo(
     s.x,
     s.y+12
    );

    X.lineTo(
     s.x+15,
     s.y-4
    );

    X.lineTo(
     s.x+30,
     s.y+12
    );

    X.stroke();

   break;

   case 23:

    q.x+=
     Math.sin(
      t*s.s
     )*
     s.b;

    q.y+=
     Math.cos(
      t*s.s
     )*
     s.c;

   break;

  }

  /*
   COLORS
  */

  X.fillStyle=
   s.id%3===0
   ?" #ff4d6d"
   :"#9b7cff";

  X.beginPath();

  X.arc(
   xx,
   yy,
   Math.max(
    7,
    s.w/2
   ),
   0,
   7
  );

  X.fill();

  /*
   WALL VISUAL
  */

  if(
   [
    3,
    4,
    5,
    6,
    13,
    18,
    19,
    20
   ].includes(
    s.kind
   )
  ){

   X.strokeStyle="#fff8";

   X.strokeRect(
    q.x,
    q.y,
    q.w,
    q.h
   );

  }

 }

 /*
  GATES
 */

 for(
  let g
  of LD.gates
 ){

  let active=
   (
    (
     now+
     g.p
    )%
    g.t
   )/
   g.t
   <
   .55;

  X.fillStyle=
   active
   ?" #ff3c58cc"
   :"#64ff9a77";

  X.fillRect(
   g.x,
   g.y,
   g.w,
   g.h
  );

 }

 /*
  FINISH FLAG
 */

 X.fillStyle="#222";

 X.fillRect(
  LD.finish,
  LD.gY-120,
  7,
  120
 );

 X.fillStyle="#ff4d6d";

 X.fillRect(
  LD.finish+7,
  LD.gY-120,
  65,
  28
 );

 /*
  PLAYER
 */

 X.fillStyle="#684cff";

 X.fillRect(
  P.x,
  P.y,
  P.w,
  P.h
 );

 /*
  EYES
 */

 X.fillStyle="#fff";

 X.beginPath();

 X.arc(
  P.x+10,
  P.y+12,
  5,
  0,
  7
 );

 X.arc(
  P.x+23,
  P.y+12,
  5,
  0,
  7
 );

 X.fill();

 X.fillStyle="#111";

 X.beginPath();

 X.arc(
  P.x+11,
  P.y+12,
  2,
  0,
  7
 );

 X.arc(
  P.x+24,
  P.y+12,
  2,
  0,
  7
 );

 X.fill();

 /*
  PARTICLES
 */

 for(
  let p
  of parts
 ){

  X.globalAlpha=
   cl(
    p.l,
    0,
    1
   );

  X.fillStyle="#ffd166";

  X.fillRect(
   p.x,
   p.y,
   4,
   4
  );

 }

 X.globalAlpha=1;

 X.restore();

 /*
  LIGHTNING FLASH
 */

 if(flash){

  X.fillStyle=
   `rgba(
     255,
     255,
     255,
     ${flash*.5}
   )`;

  X.fillRect(
   0,
   0,
   W,
   H
  );

 }

}

/* =========================================================
   LOOP
========================================================= */

function loop(t){

 if(!playing)
  return;

 let dt=
  cl(
   (t-last)/1000,
   .001,
   .033
  );

 last=t;

 update(dt);
 draw();

 requestAnimationFrame(
  loop
 );

}

/* =========================================================
   JOYSTICK
========================================================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

let jp=null;

function joySet(e){

 let z=
  joy.getBoundingClientRect();

 let dx=
  cl(
   e.clientX-
   (
    z.left+
    z.width/2
   ),
   -42,
   42
  );

 I.x=
  dx/42;

 stick.style.transform=
  `translateX(${dx}px)`;

}

function joyReset(){

 jp=null;

 I.x=0;

 stick.style.transform=
  "translateX(0)";

}

joy.onpointerdown=e=>{

 jp=e.pointerId;

 joy.setPointerCapture(
  jp
 );

 joySet(e);

};

joy.onpointermove=e=>{

 if(
  e.pointerId===jp
 )
  joySet(e);

};

joy.onpointerup=
 joyReset;

joy.onpointercancel=
 joyReset;

/* =========================================================
   BUTTONS
========================================================= */

document
 .getElementById("jump")
 .onpointerdown=e=>{

  e.preventDefault();
  jump();

 };

document
 .getElementById("dash")
 .onpointerdown=e=>{

  e.preventDefault();
  dash();

 };

document
 .getElementById("reset")
 .onpointerdown=e=>{

  e.preventDefault();
  reset();

 };

document
 .getElementById("next")
 .onpointerdown=e=>{

  e.preventDefault();

  if(won)
   next();

 };

document
 .getElementById("retry")
 .onclick=
 reset;

document
 .getElementById("nextBtn")
 .onclick=
 next;

/* =========================================================
   START
========================================================= */

document
 .getElementById("start")
 .onclick=()=>{

  intro.style.display="none";

  playing=true;

  reset();

  last=
   performance.now();

  requestAnimationFrame(
   loop
  );

 };

/* =========================================================
   KEYBOARD
========================================================= */

addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="ArrowLeft"||
   e.key.toLowerCase()==="a"
  ){

   I.x=-1;

  }

  if(
   e.key==="ArrowRight"||
   e.key.toLowerCase()==="d"
  ){

   I.x=1;

  }

  if(
   e.key===" "||
   e.key==="ArrowUp"
  ){

   e.preventDefault();
   jump();

  }

  if(
   e.key.toLowerCase()==="shift"
  ){

   dash();

  }

  if(
   e.key.toLowerCase()==="r"
  ){

   reset();

  }

 }
);

addEventListener(
 "keyup",
 e=>{

  if(
   [
    "ArrowLeft",
    "ArrowRight",
    "a",
    "d"
   ].includes(e.key)
  ){

   I.x=0;

  }

 }
);

document.addEventListener(
 "touchmove",
 e=>e.preventDefault(),
 {
  passive:false
 }
);

/* =========================================================
   INITIAL
========================================================= */

LD=
 makeLevel(level);

lvlEl.textContent=
 level;

tierEl.textContent=
 " • "+
 (
  level<=15
  ?"فێرکاری"
  :"قورس"
 )+
 " "+
 level;

draw();

</script>
